name: Release Completer

# Every step is a `just` target — see the header of ci.yml and build/ci.justfile.
# The two exceptions are the apt-get that provides curl and the `just`
# bootstrap it enables; both are marked below.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.0.4)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    container:
      # goreleaser-cross includes cross-compilation toolchains for CGO.
      # Pinned to v1.25 to match go.mod's `go 1.25.0` (and the devcontainer's
      # 1.25.x) so the release builds on the same major.minor as CI without an
      # implicit GOTOOLCHAIN download at release time.
      image: ghcr.io/goreleaser/goreleaser-cross:v1.25
    env:
      # This job has no docker-in-docker, so it must use the CONTAINER
      # justfile: the host justfile's same-named `proto`/`validate` recipes
      # delegate into `just dev-image`, which would try to build the
      # devcontainer image from inside goreleaser-cross.
      JUST_JUSTFILE: justfile.container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # On a tag push, github.ref is the tag. On manual dispatch, check out
          # the tag the user named (without this, dispatch built the default
          # branch and GoReleaser failed on a non-tagged commit).
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The one step that cannot be a `just` target: it is what makes curl
      # available for the `just` bootstrap on the next line. goreleaser-cross
      # is not the devcontainer image and ships none of this.
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y git curl upx unzip

      - uses: ./.github/actions/setup-just

      - name: Mark workspace as safe
        run: just ci-git-safe-directory

      # .devcontainer/tool-versions.env is the single source of truth for every
      # pinned tool version. This job runs in goreleaser-cross, not the
      # devcontainer image, so it can't inherit the toolchain and must install
      # its own copies — `release-install-tools` sources that same file rather
      # than hand-copying version numbers, which is what makes drift
      # impossible instead of merely checked for. internal/buildpins' drift
      # gate fails if this workflow stops routing through that recipe, or if
      # the recipe stops deriving from the file.
      - name: Install build tools (versionator, buf, protoc plugins)
        run: just release-install-tools

      # buf.gen.yaml uses `local:` plugins (not BSR `remote:` ones — see
      # buf.gen.yaml's comment), so protoc-gen-go/protoc-gen-go-grpc must be on
      # PATH at the SAME pinned versions CI generates against; the step above
      # installed them and put GOPATH/bin on PATH. Before the local-plugin
      # switch (commit b334605) codegen here ran on remote BSR plugins needing
      # no local install, and a release's codegen silently depending on
      # whatever happened to be on PATH is the failure internal/buildpins
      # exists to prevent.
      - name: Generate protobuf code
        run: just proto

      - name: Validate schemas
        run: just validate

      # .goreleaser.yml interpolates these into the published install
      # instructions, so they must be the hashes of the exact bytes released.
      - name: Compute install script hashes
        id: script_hashes
        run: just install-script-hashes

      - name: Run GoReleaser
        run: just release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with push access to ctxloom/homebrew-tap (cask publish).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          HASH_INSTALL_SH: ${{ env.HASH_INSTALL_SH }}
          HASH_INSTALL_PS1: ${{ env.HASH_INSTALL_PS1 }}

      - name: Upload install scripts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scripts/install.sh
            scripts/install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
