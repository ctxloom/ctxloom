[package]
name = "hook-listener"
version = "0.1.0"
description = "The run's hook listener: the standard Handle of the angzarr coordinator on a unix socket, behind ctxloom's admission gate, while an interactive run is live"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-coordinator = { workspace = true, features = ["commands"] }
angzarr-coordinator-grpc = { workspace = true, default-features = false, features = ["commands"] }
angzarr-diagnostic.workspace = true
angzarr-proto-transport-distributed.workspace = true
runs-application.workspace = true

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
angzarr-embedded-host.workspace = true
angzarr-test-dir.workspace = true
embedded-edge.workspace = true
file-system.workspace = true
hyper-util = { version = "0.1", features = ["tokio"] }
mutants.workspace = true
os = { workspace = true, features = ["test-support"] }
run-ports.workspace = true
runs.workspace = true
sessions.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
uuid.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
