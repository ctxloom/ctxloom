[package]
name = "sessions-application"
version = "0.1.0"
description = "The sessions use cases: list, search, show, keep, remove, bind and the transcripts, over the ports and angzarr-embedded's kernel"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
angzarr-embedded.workspace = true
# Go's session.yaml, read through the one reader (versioned, strict).
angzarr-yaml.workspace = true
# Each command run through the kernel, as every context runs one.
angzarr-embedded-runner.workspace = true
ports.workspace = true
# A session's pending messages, for `show` (D30).
pending-messages.workspace = true
runs.workspace = true
session-index.workspace = true
serde.workspace = true
# The destroy's commands to the children and the owner (M3).
session-policies.workspace = true
session-ports.workspace = true
sessions.workspace = true
# Go's instants are RFC 3339 text.
time.workspace = true
uuid.workspace = true

[dev-dependencies]
# The test support the fakes share: the kernel's (`angzarr_embedded::testing`:
# block_on_ready, angzarr-ports' FaultyStore) and the ports' (`ports::testing`:
# the clock and the delay).
angzarr-embedded = { workspace = true, features = ["test-support"] }
ports = { workspace = true, features = ["test-support"] }
mutants.workspace = true
# The transcript's lines, read back by the tests (ruling 87a).
serde_json.workspace = true


[features]
# `diagnostic_samples`, for other crates' catalog tests: their dev-dependency
# turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
