# The architecture lint's rules (templates/arch-gates.just runs it): which
# role may depend on which. A crate's role is its directory,
# crates/<ring>/<role>/<crate> giving <ring>/<role>. Copy to the repository's
# top level as arch-rules.toml and edit; the table is data, so another
# repository supplies its own.
#
# Each role lists what its crates may depend on, over every normal and build
# edge between workspace members: a role (`core/wire`), a glob over roles
# (`core/*`; `*` is any run of characters, `/` included) or `@class` (a crate
# whose name matches a pattern under [classes]). A role not listed is
# refused: a new tier gets its rule before it gets code. Edges to crates
# outside the workspace are not examined.
layout = "crates"

# The roles whose dev-dependency edges are examined, more leniently: the same
# table, but a finding is a warning (it fails only under --deny-warnings).
dev_checked = ["adapters/driven", "adapters/driving", "adapters/serving"]

[classes]
# The driving adapters' shared presentation crates: domain-free, and what the
# CLI and the server both write through.
presentation = ["presentation", "*-presentation"]
# Shared infrastructure crates every driven adapter may use, listed by name
# (step 10, G9: git-cli, the one git runner of remote-git and
# worktree-git).
support = ["git-cli"]
# The areas' API crates (owner ruling 2026-11-27): the backend's messages and
# their mapping, and the daemon API's shared vocabulary and client half
# (daemon-api-contract, daemon-api-client; never the server, daemon-api),
# which a frontend (a driving adapter) may see; every other
# application crate it uses is a listed exception below, with its reason.
api = ["library-api", "setup-api", "surface-api", "daemon-api-contract", "daemon-api-client"]

[roles."core/wire"]
allow = ["core/wire"]
rule = "the core depends on the core only"

[roles."core/domain"]
allow = ["core/domain", "core/wire"]
rule = "the core depends on the core only, and a domain never depends on a read model"

[roles."core/read-model"]
allow = ["core/read-model", "core/domain", "core/wire"]
rule = "the core depends on the core only, and a read model never depends on the application layer"

[roles."core/ports"]
allow = ["core/ports", "core/domain", "core/wire"]
rule = "the core depends on the core only"

[roles."core/application"]
allow = ["core/*"]
rule = "the core depends on the core only"

[roles."adapters/driven"]
allow = ["core/ports", "core/wire", "@support"]
rule = "a driven adapter sees only ports and wire types, never another adapter"

# ONE WRITER (owner ruling 2026-11-25): the store and the kernel host are roles
# of their own, so a rule can name who may depend on them. Only `root/daemon`
# (and the binary, the composition root of both programs) may; see the
# `root/lib` rule below.
[roles."adapters/store"]
allow = ["core/ports", "core/wire", "@support"]
rule = "the store adapter sees only ports and wire types; only the daemon's composition depends on it"

[roles."adapters/kernel"]
allow = ["core/ports", "core/wire", "@support"]
rule = "the kernel host adapter sees only ports and wire types; only the daemon's composition depends on it"

# A support crate is infrastructure shared by driven adapters: it knows no
# port, no use case and no other adapter.
[roles."adapters/support"]
allow = []
rule = "a support crate depends on no other workspace crate"

[roles."adapters/driving"]
# core/wire (owner M7, slice 2): the generated types are pure data, what an
# API edge (the daemon's gRPC service, its client's CLI) renders and takes;
# they hold no behaviour of the core.
allow = ["core/wire", "@api", "@presentation"]
rule = "a frontend sees the areas' API crates (@api), the wire types and the presentation crates, never another adapter and no other application crate but a listed exception"

# The backend's own servers (owner ruling 2026-11-27, plan
# backend-below-frontend step 0): what receives calls at the daemon (its gRPC
# service, its hook listener), as a driving adapter does, but a part of the
# BACKEND, so the daemon's composition may depend on them and no frontend rule
# applies to them. Never another adapter.
[roles."adapters/serving"]
allow = ["core/application", "core/wire", "core/ports", "core/domain", "@presentation"]
rule = "a serving adapter is the backend's own server: it sees the application layer, the ports, the domains it dispatches to and the wire types, never another adapter"

# The composition root (the binaries and their wiring library) may depend on
# anything; nothing else lists either, so nothing but the root depends on the
# root.
[roles."root/bin"]
allow = ["*"]

# ONE WRITER, G2 (owner ruling 2026-11-25; design note messages-only.design.md,
# P2): the daemon is the store's one writer, so the dependency shape says it.
# `root/daemon` (crates/root/daemon/ctxloom-daemon) is the daemon's
# composition: the store, the kernel host, the scheduler, the listener and the
# hosted runs. `root/lib` (ctxloom-wiring) is the CLI's composition, a CLIENT
# of the daemon: `adapters/store` and `adapters/kernel` are not in its list, so
# it cannot open the store or host a kernel. The binary (`root/bin`) hosts
# both programs in one executable, so the shape cannot keep a CLI PROCESS from
# the store; that is clippy's `disallowed-methods` (clippy.toml, "ONE WRITER")
# and `just lint-one-writer`.
[roles."root/daemon"]
allow = ["core/*", "adapters/store", "adapters/kernel", "adapters/driven", "adapters/serving", "adapters/support", "root/compose", "@presentation"]
rule = "the daemon's composition: with the binary, the only crate that depends on the store adapter and the kernel host; a backend never depends on a frontend, so neither a driving adapter (adapters/driving) nor the CLI's wiring (root/lib) is listed"

# What both halves compose from (plan backend-below-frontend, step 6, owner
# rulings 2026-11-27): the Wiring, its ports over their default adapters, the
# daemon's contract (DaemonEntry, the files, the client half's reach) and the
# shared fixtures. Below both `root/lib` and `root/daemon`, so it names no
# driving adapter (no CLI crate) and no store or kernel.
[roles."root/compose"]
allow = ["core/*", "adapters/driven", "adapters/serving", "adapters/support", "@presentation"]
rule = "the shared composition sits below both halves: no frontend (adapters/driving), no store adapter, no kernel host, and neither half's composition"

[roles."root/lib"]
allow = ["core/*", "adapters/driving", "adapters/serving", "adapters/driven", "adapters/support", "root/compose", "@presentation"]
rule = "the CLI's composition is a client of the daemon: no store adapter (adapters/store) and no kernel host (adapters/kernel), neither listed here"

# A known departure, kept as debt: from, to, optionally kind ("normal",
# "build" or "dev"), and why. One that matches no finding is stale and fails.
# [[exception]]
# from = "some-crate"
# to = "other-crate"
# kind = "dev"
# reason = "why this stands"

# Dev-dependency findings (warnings), kept by the owner's ruling as test-only
# exceptions: the tests of a driving adapter build a type only the port defines.

[[exception]]
from = "deps-cli"
to = "deps-ports"
kind = "dev"
reason = "test-only: builds a type only the port defines; re-exporting it just for tests would add public API for nobody"

[[exception]]
from = "surface-cli"
to = "surface-ports"
kind = "dev"
reason = "test-only: builds a type only the port defines; re-exporting it just for tests would add public API for nobody"

[[exception]]
from = "run-cli"
to = "runs"
kind = "dev"
reason = "test-only: builds the runs domain's refusals a RunError carries (ruling 73's aggregate), to hand on; re-exporting them just for tests would add public API for nobody"

# hook-listener's end-to-end test serves the real kernel on a real socket: it
# builds the application behind the edge (the kernel's registry of the two
# domains the hook reaches and its `embedded-edge` adapter) and the commands and
# facts the domains define, and asks the ports for the bearer and the socket
# path the run names. Test-only; none of it is in the crate's own build.

[[exception]]
from = "hook-listener"
to = "hook-tls"
kind = "dev"
reason = "test-only: mints the per-run certificate the listener is served with, by the same mint the run uses"

[[exception]]
from = "hook-sink-grpc"
to = "hook-tls"
kind = "dev"
reason = "test-only: mints the per-run certificates the fake TLS listener is served with, by the same mint the run uses"

[[exception]]
from = "daemon-client"
to = "hook-tls"
kind = "dev"
reason = "test-only: mints the certificate the fake daemon is served with, by the same mint the daemon uses"

[[exception]]
from = "hook-listener"
to = "embedded-edge"
kind = "dev"
reason = "test-only: the end-to-end test serves the real kernel through the edge adapter"

# session-cli depends on itself, as a dev-dependency, with `purge`
# (rulings 94b, 98, 99): the destroy compiles only under that feature, and the
# crate's own tests and mutants must see it with no feature rule; a plain build
# builds no dev-dependency, so the shipped binary stays without it
# (scripts/plain-destroy-check.sh).
[[exception]]
from = "session-cli"
to = "session-cli"
kind = "dev"
reason = "test-only: the crate's own tests compile the purge feature (ruling 99) through a self dev-dependency, so no feature rule is needed and the plain binary stays without the destroy"

# daemon-api-grpc depends on itself, as a dev-dependency, with
# `purge` (M5, owner 2026-11-12), for the same reason: the served
# DeleteSession and SweepSessions compile only under it.
[[exception]]
from = "daemon-api-grpc"
to = "daemon-api-grpc"
kind = "dev"
reason = "test-only: the crate's own tests compile the served destroy (M5) through a self dev-dependency, so no feature rule is needed and the plain daemon answers UNIMPLEMENTED"

# A frontend's dependencies on application crates other than the API crates:
# each a departure from "the CLI is request and render", kept as debt with what
# it is used for (moved here from the binary's workspace test, owner ruling
# 2026-11-27); one that matches no finding is stale and fails.
