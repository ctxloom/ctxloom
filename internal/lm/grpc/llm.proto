syntax = "proto3";

package ctxloom.lm.llm;

option go_package = "github.com/ctxloom/ctxloom/internal/lm/grpc";

// LLM is the gRPC service that all LLM backends must implement.
service LLM {
  // Info returns metadata about the LLM.
  rpc Info(Empty) returns (LLMInfo);

  // Run executes the LLM backend, bidirectionally: the frontend (terminal owner)
  // sends a RunStart first, then streams stdin keystrokes and SIGWINCH resizes;
  // the controller feeds those into the agent's pty and streams its output back.
  // The first RunInput MUST carry `start`; subsequent ones carry stdin/resize.
  rpc Run(stream RunInput) returns (stream RunResponse);

  // GetSession reassembles and translates one of the backend's transcripts into
  // the normalized session form. The locator is the agent-agnostic session id
  // under a work dir; the backend DERIVES the agent-specific transcript path
  // itself (claude from sessionID+workDir, gemini from its store) — ctxloom
  // never computes or passes a filesystem path. The backend is authoritative for
  // locating, reassembling, and translating its own native transcript format.
  rpc GetSession(GetSessionRequest) returns (SessionData);

  // WatchSession streams a session's transcript as structured turns as they
  // appear, so a frontend can render a native chat UI (messages, not raw pty
  // bytes). The server polls the same GetSession reassembly and diffs against a
  // high-water mark: each poll's new entries stream as `entry` events; when the
  // transcript stops growing for a settle interval, that stable index is a
  // stopping point and the server emits a `boundary` marking the just-completed
  // response `[from,to)`. `heartbeat` keeps the stream warm while idle. Purely
  // additive: no SessionHistory change, every backend gets it for free.
  rpc WatchSession(WatchSessionRequest) returns (stream WatchEvent);

  // Chat runs a structured, multi-turn conversation over the backend's NATIVE
  // programmatic protocol (e.g. claude-code's stream-json mode) — messages in,
  // normalized turn events out, no pty/TUI. It is OPTIONAL: the server checks
  // whether the backend implements the StructuredChat capability and returns
  // UNIMPLEMENTED if not. The first ChatInput MUST carry `start`; subsequent
  // ones carry `user_message`. The frontend half-closes the stream to end input.
  rpc Chat(stream ChatInput) returns (stream ChatEvent);

  // ListSessions returns metadata for the backend's transcripts (its raw store
  // view), used by ctxloom to adopt sessions its index has not bound.
  rpc ListSessions(ListSessionsRequest) returns (SessionList);

  // GetPlans returns the plan documents (*.plan.md) the agent wrote to a
  // session's ctxloom session directory, keyed by harp. The agent server is
  // co-located with the session files and is self-situated (it resolves its own
  // ctxloom home), so it serves these for distill / cross-agent handoff; ctxloom
  // passes only the location-independent harp.
  rpc GetPlans(GetPlansRequest) returns (PlansData);
}

// GetPlansRequest locates a session's plan files by harp (the ctxloom session
// id), not a path — the agent resolves its own session directory.
message GetPlansRequest {
  string harp = 1;
}

message PlansData {
  repeated PlanFile plans = 1;
}

// PlanFile mirrors agent.PlanFile: one plan document.
message PlanFile {
  string name = 1;    // descriptive base name (no .plan.md extension)
  string content = 2; // verbatim plan markdown
}

// GetSessionRequest locates a single transcript by its agent-agnostic session id.
// No work dir crosses the wire: the agent server is self-situated — it resolves
// its own workspace and derives the agent-specific transcript path itself. This
// keeps the contract valid for a remote agent, where a host filesystem path is
// meaningless.
message GetSessionRequest {
  string session_id = 1;
}

// SessionData is the normalized form of one transcript. Times are unix seconds
// (0 = unknown) since proto has no native timestamp here.
message SessionData {
  string id = 1;
  int64 start_unix = 2;
  int64 end_unix = 3;
  repeated SessionEntry entries = 4;
}

// SessionEntry mirrors agent.SessionEntry: one normalized turn.
message SessionEntry {
  string type = 1;          // user | assistant | tool_use | tool_result | system
  string content = 2;       // text for user/assistant/system
  string tool_name = 3;     // for tool_use/tool_result
  bytes tool_input = 4;     // raw JSON for tool_use
  string tool_output = 5;   // for tool_result
  bool is_error = 6;        // for tool_result
  int64 timestamp_unix = 7;
}

// WatchSessionRequest locates the session to tail by its agent-agnostic id (the
// same locator GetSession takes).
message WatchSessionRequest {
  string session_id = 1;
}

// WatchEvent is one message on the WatchSession stream: either a newly-appeared
// transcript entry, a stopping-point boundary marking a completed response, or a
// heartbeat keepalive while the session is idle.
message WatchEvent {
  oneof event {
    SessionEntry     entry     = 1; // a newly-appended normalized turn
    ResponseBoundary boundary  = 2; // the just-completed response: entries[from,to)
    Heartbeat        heartbeat = 3; // idle keepalive
  }
}

// ResponseBoundary marks a stopping point: entries[from_index, to_index) is the
// response that just completed (growth stalled past the settle interval).
message ResponseBoundary {
  int32 from_index = 1;
  int32 to_index = 2;
}

// Heartbeat is an empty keepalive emitted on a slow cadence while idle.
message Heartbeat {}

// ChatInput is one message on the Chat stream. The first MUST carry `start`;
// thereafter the frontend sends `user_message` turns (plus `permission_answer`
// / `cancel_turn` control messages) and half-closes to end input.
message ChatInput {
  oneof input {
    ChatStart            start             = 1; // first message only
    ChatUserMessage      user_message      = 2; // a structured user turn
    ChatPermissionAnswer permission_answer = 3; // answers a ChatPermissionRequest
    ChatCancelTurn       cancel_turn       = 4; // abandon the in-flight turn, keep the conversation
  }
}

// ChatStart configures a structured chat (mirrors the subset of RunStart a
// programmatic, non-pty conversation needs).
message ChatStart {
  string work_dir = 1;
  string model = 2;
  map<string, string> env = 3;
  bool auto_approve = 4;
  // Surface engine permission requests as ChatPermissionRequest events and
  // park until the ChatPermissionAnswer arrives, instead of auto-deciding
  // (auto_approve → allow, otherwise reject).
  bool forward_permissions = 5;
  // Caller-supplied MCP servers to attach to the conversation, in addition to
  // whatever native config the engine reads from its cwd.
  repeated ChatMCPServer mcp_servers = 6;
}

// ChatMCPServer is one caller-supplied stdio MCP server for a chat run.
message ChatMCPServer {
  string name = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
}

// ChatUserMessage is one inbound user turn (plain text in v1).
message ChatUserMessage {
  string text = 1;
}

// ChatPermissionAnswer resolves the ChatPermissionRequest with the same id:
// option_id names the chosen option; empty means dismissed/cancelled.
message ChatPermissionAnswer {
  string id = 1;
  string option_id = 2;
}

// ChatCancelTurn asks the backend to abandon the in-flight turn; the
// conversation stays alive and the turn completes with stop reason "cancelled".
message ChatCancelTurn {}

// ChatEvent is one normalized outbound event; exactly one is set. `entry` is
// conversation content (many per response), `complete` the response's
// completion + accounting (one per response), `session` one-time session info,
// `permission` a forwarded mid-turn engine permission request (only under
// ChatStart.forward_permissions; answered via ChatPermissionAnswer).
message ChatEvent {
  oneof event {
    SessionEntry          entry      = 1;
    TurnMeta              complete   = 2;
    ChatSessionInfo       session    = 3;
    ChatPermissionRequest permission = 4;
  }
}

// ChatPermissionRequest is a forwarded engine permission request: the engine
// wants to run tool_name and offers the given decision options. id correlates
// the eventual ChatPermissionAnswer.
message ChatPermissionRequest {
  string id = 1;
  string tool_name = 2;
  bytes  tool_input = 3; // raw JSON, may be empty
  repeated ChatPermissionOption options = 4;
}

// ChatPermissionOption is one decision the engine offers. kind is the ACP
// option-kind vocabulary: allow_once | allow_always | reject_once | reject_always.
message ChatPermissionOption {
  string id = 1;
  string kind = 2;
  string name = 3;
}

// TurnMeta is per-response completion metadata a client can surface (context
// gauge, cost, timing). Mirrors agent.TurnMeta.
message TurnMeta {
  int32  input_tokens          = 1;
  int32  output_tokens         = 2;
  int32  cache_read_tokens     = 3;
  int32  cache_creation_tokens = 4;
  int32  context_window        = 5;
  int32  max_output_tokens     = 6;
  double cost_usd              = 7;
  string model                 = 8;
  string stop_reason           = 9;
  int32  duration_ms           = 10;
  int32  num_turns             = 11;
}

// ChatSessionInfo is one-time session metadata emitted at chat start. Mirrors
// agent.ChatSessionInfo.
message ChatSessionInfo {
  string model           = 1;
  string permission_mode = 2;
  int32  context_window  = 3;
  repeated MCPStatus mcp_servers = 4;
}

// MCPStatus is the connection status of one MCP server at session start.
message MCPStatus {
  string name = 1;
  string status = 2;
}

// ListSessionsRequest is empty: the self-situated agent server lists its own
// workspace's transcripts. Kept as a named message for forward-compatible fields.
message ListSessionsRequest {
}

message SessionList {
  repeated SessionMeta sessions = 1;
}

// SessionMeta mirrors agent.SessionMeta: transcript metadata without content.
message SessionMeta {
  string id = 1;
  int64 start_unix = 2;
  int64 end_unix = 3;
  int32 entry_count = 4;
  string path = 5; // absolute path to the backend's raw transcript, when file-backed
}

message Empty {}

message LLMInfo {
  string name = 1;
  string version = 2;
  repeated ExecutionMode supported_modes = 3;
}

// RunInput is one message on the bidirectional Run stream. The first MUST be a
// `start`; thereafter the frontend sends `stdin` (keystrokes) and `resize`
// (SIGWINCH). Non-interactive/oneshot callers send only `start`.
message RunInput {
  reserved 4;                  // was user_message (pty-injection chat); see Chat RPC
  reserved "user_message";
  oneof input {
    RunStart    start  = 1; // first message only
    bytes       stdin  = 2; // terminal keystrokes for the agent's pty
    WindowSize  resize = 3; // terminal size change
  }
}

// WindowSize carries a terminal resize for the agent's pty.
message WindowSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// RunStart is the first Run message: everything needed to set up and launch the
// agent (formerly the unary RunRequest).
message RunStart {
  RunOptions options = 1;
  repeated Fragment fragments = 2;       // Context fragments with metadata
  Fragment prompt = 3;                   // The user prompt as a fragment
  ManagedConfig managed_config = 4;      // Host-assembled config/bundle setup payload (nil for skip_setup)
}

// ManagedConfig is the host-assembled setup payload that rides over Run so the
// backend plugin no longer self-loads ctxloom config/bundles. The host resolves
// config, profiles, and bundles, maps them to these wire-mirroring messages, and
// the plugin converts back and feeds them into Setup. Hooks here are the
// config+profile+bundle set WITHOUT context-injection — the agent appends its
// own context-injection hook from its plugin-side context hash.
message ManagedConfig {
  repeated CommandExport skills = 1;    // per-target-agent skill (slash-command) exports
  HooksConfig hooks = 2;                // config + default-profile + bundle hooks (no context-injection)
  MCPConfig mcp = 3;                    // merged config + default-profile MCP servers
  bool manage_statusline = 4;           // whether ctxloom manages the backend statusline
  map<string, MCPServer> bundle_mcp = 5; // MCP servers shipped by profile + builtin bundles (parallel to the bundle hooks)
}

// CommandExport mirrors agent.CommandExport: one skill's agent-agnostic
// slash-command export spec, with the target agent's enablement+metadata already
// resolved host-side.
message CommandExport {
  string name = 1;                  // Full name (bundle/item); path separators allowed
  string content = 2;               // The command body
  bool enabled = 3;                 // Resolved enablement for the target agent
  string description = 4;           // For /help display
  string argument_hint = 5;         // Autocomplete hint (unused by gemini)
  repeated string allowed_tools = 6;// Tool restrictions (unused by gemini)
  string model = 7;                 // Override model (unused by gemini)
}

// Hook mirrors wire.Hook.
message Hook {
  string matcher = 1;
  string command = 2;
  string type = 3;
  string prompt = 4;
  int32 timeout = 5;
  bool async = 6;
  string scm = 7;
}

// HookList wraps a repeated Hook so it can be a proto map value (proto forbids
// repeated fields directly as map values).
message HookList {
  repeated Hook hooks = 1;
}

// UnifiedHooks mirrors wire.UnifiedHooks.
message UnifiedHooks {
  repeated Hook pre_tool = 1;
  repeated Hook post_tool = 2;
  repeated Hook session_start = 3;
  repeated Hook session_end = 4;
  repeated Hook pre_shell = 5;
  repeated Hook post_file_edit = 6;
}

// BackendHooks mirrors wire.BackendHooks (event name -> hooks).
message BackendHooks {
  map<string, HookList> events = 1;
}

// HooksConfig mirrors wire.HooksConfig.
message HooksConfig {
  UnifiedHooks unified = 1;
  map<string, BackendHooks> plugins = 2;
}

// MCPServer mirrors wire.MCPServer.
message MCPServer {
  string command = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  string notes = 4;
  string installation = 5;
  string scm = 6;
}

// MCPServerMap wraps a server map so it can be a proto map value.
message MCPServerMap {
  map<string, MCPServer> servers = 1;
}

// MCPConfig mirrors wire.MCPConfig. auto_register_ctxloom is optional to
// preserve the unset/true/false tri-state of the *bool it mirrors.
message MCPConfig {
  optional bool auto_register_ctxloom = 1;
  map<string, MCPServer> servers = 2;
  map<string, MCPServerMap> plugins = 3;
}

// Fragment represents a context fragment or prompt with metadata.
// All fields except content are optional - they're omitted when empty/zero.
message Fragment {
  string name = 1;             // Optional: fragment name (e.g., "coding-standards", "testing/tdd")
  string version = 2;          // Optional: version string from the fragment
  repeated string tags = 3;    // Optional: tags for categorization
  string content = 4;          // The effective content (distilled or original)
  bool is_distilled = 5;       // Optional: true if content is the distilled version
  string distilled_by = 6;     // Optional: LLM that performed distillation (e.g., "claude-3-opus")
}

message RunOptions {
  string work_dir = 1;
  bool auto_approve = 2;
  ExecutionMode mode = 3;
  map<string, string> env = 4;
  bool dry_run = 5;       // Validate without executing
  uint32 verbosity = 6;   // 0=silent, 16=commands, 32=args, 48+=debug
  string model = 7;       // Model to use (e.g., "opus", "gpt-4", "claude-3-sonnet")
  float temperature = 8;  // Creativity level 0.0-1.0 (0=deterministic)
  uint32 max_tokens = 9;  // Maximum response tokens (0=default)
  bool skip_setup = 10;   // Skip context/hooks/skills setup (for distillation)
}

enum ExecutionMode {
  INTERACTIVE = 0;  // Full interactive session, continues after each response
  ONESHOT = 1;      // Single prompt/response, exit after completion
}

message RunResponse {
  oneof output {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
  }
  // Model info is populated at the end of the stream (with exit_code)
  ModelInfo model_info = 4;
}

// ModelInfo contains information about the model used for the response.
message ModelInfo {
  string model_name = 1;     // Model name (e.g., "claude-3-opus-20240229")
  string model_version = 2;  // Model version if available
  string provider = 3;       // Provider (e.g., "anthropic", "openai")
}
