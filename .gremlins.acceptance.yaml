# Gremlins mutation testing configuration — ACCEPTANCE-SCOPED PROFILE.
# https://gremlins.dev/0.5/usage/configuration/
#
# .gremlins.yaml (the default profile) never executes the acceptance/journey
# suite: its exclude-files is meant to drop tests/integration/*, unleash.
# integration is false ("use unit tests only for speed"), and tags is empty —
# but the acceptance suite needs `-tags "acceptance integration"` to even
# compile. So the published efficacy/mutant-coverage numbers describe UNIT
# tests only; the journeys (tests/acceptance/features/*.feature) have never
# once executed under mutation.
#
# This profile flips exactly those knobs so gremlins drives the SAME
# acceptance suite `just test-acceptance` runs, and nothing else:
#   - unleash.integration: true         (lets a DIFFERENT package's tests,
#     i.e. tests/acceptance, be the thing that kills a mutant in the target
#     package — see below on why this alone is not sufficient)
#   - unleash.tags: "acceptance integration"  (the suite does not compile
#     without them)
#   - GOFLAGS=-run=TestAcceptance is set by the `just test-mutation-acceptance`
#     recipe, NOT here (gremlins config has no test-name-filter key). This is
#     load-bearing, not cosmetic: `unleash.integration: true` makes gremlins
#     run `go test ./...` for BOTH the coverage gate and every per-mutant kill
#     check — which means, unrestricted, internal/operations' own extensive
#     unit tests (trust_test.go etc.) would run right alongside the journeys
#     and silently supply the kill, making this profile indistinguishable from
#     the unit-test one it exists to separate from. GOFLAGS=-run=TestAcceptance
#     restricts every `go test` gremlins runs (coverage gather AND per-mutant
#     retest) to ONLY the acceptance package's entrypoint test function, so a
#     KILLED verdict here means the JOURNEYS killed it — nothing else could
#     have. Verified empirically 2026-07-14: with this restriction,
#     `go test ./...` reports "[no tests to run]" for internal/operations
#     itself (its unit tests never execute) while tests/acceptance runs for
#     real and passes.
#
# CONFIG-STRUCTURE GOTCHA (found while building this file, applies equally to
# .gremlins.yaml — reported, not fixed here, out of this task's scope): every
# key gremlins reads for the unleash command is registered under the viper
# path "unleash.<key>" (see UnleashExcludeFiles = "unleash.exclude-files" in
# go-gremlins/gremlins's internal/configuration/configuration.go), which means
# exclude-files (and everything else) must be NESTED under an `unleash:` block
# in the YAML, not top-level. .gremlins.yaml has exclude-files at the TOP
# level — confirmed empirically that a top-level exclude-files list is
# silently ignored (a dry run still listed excluded-by-name files as
# candidates); nesting the identical list under unleash: made the exclusion
# take effect immediately. This means .gremlins.yaml's tests/integration/*
# exclusion, and its test/mock/generated-file exclusions, may never have been
# applied in the published unit-mutation numbers either — a separate,
# unplanned finding worth its own follow-up.
#
# KNOWN LIMITATION, confirmed empirically before this profile was built: the
# acceptance suite drives the CLI via a subprocess (tests/integration/testenv
# execs the built `ctxloom` binary — see environment.go's exec.Command), and
# Go's `go test -coverprofile` instrumentation cannot see across a subprocess
# boundary. A real run showed 16/16 acceptance scenarios covering trust.go's
# EffectiveTrust cascade PASS, yet every line of trust.go still showed 0 hits
# in the coverage profile. So a mutant inside a subprocess-only code path will
# report NOT COVERED here even when the journeys genuinely exercise it — that
# NOT COVERED does NOT mean "no journey executes this code," it means "this
# measurement methodology (coverage-gated mutation testing) cannot observe
# execution that crosses the CLI subprocess boundary." Read the acceptance
# mutation-coverage number with that caveat; it is a floor on what this tool
# can prove, not a ceiling on what the journeys do.
silent: false

unleash:
  # Run the SAME test package the journeys run under (`just test-acceptance`),
  # not just internal/operations' own in-package tests. Required so a mutant
  # in the target package can be killed by tests/acceptance rather than only
  # by tests physically inside the same package.
  integration: true
  dry-run: false
  # The acceptance suite does not compile without both tags.
  tags: "acceptance integration"
  output: ""
  workers: 0
  test-cpu: 0
  # See .gremlins.yaml's own comment on this key: a starved coefficient scores
  # mutants TIMED OUT (neither killed nor lived), which is a measurement
  # failure, not a result. Never lower this below the unit profile's value.
  # The acceptance suite's own baseline run is ~19-22s (vs ~3ms for the
  # triggers package that motivated raising this to 30), so a lower multiple
  # would already be generous in absolute terms — kept at parity with the
  # unit profile rather than tuned down.
  timeout-coefficient: 30

  # Quality gates. EFFICACY is the mutant KILL RATE (killed / killed+lived) and
  # is set to the project standard of 80%, decided 2026-08-06. It is expected to
  # FAIL until the tests earn it — that is the point. A gate set to the current
  # sorry state measures nothing and ratchets nothing; a gate set to the
  # standard names the gap every time it runs.
  #
  # Do NOT lower this to make a run green. Four separate times a threshold here
  # was chosen before a measurement and tuned until it passed, most memorably
  # efficacy:60 justified by an invented "~48% baseline" when the real figure
  # was 22.90%. Raising coverage is the way to green, not editing this number.
  #
  # MUTANT-COVERAGE stays 0 deliberately, and is NOT the same knob. It measures
  # how many mutants the coverage profile could even see, which is bounded by
  # instrumentation rather than by test quality — and for anything driven as a
  # subprocess it is structurally near-zero. Gating on it would fail for a
  # reason no test author can fix.
  threshold:
    efficacy: 80
    mutant-coverage: 0

  # Scope narrowing: this profile targets ONLY internal/operations/trust.go
  # (the EffectiveTrust decision cascade + Reason(), per the task that created
  # this file). Every other .go file in the internal/operations package is
  # excluded so gremlins doesn't spend hours mutating ~1,645 candidates
  # module-wide at ~19s/run. Widen this list (or drop it) for a broader sweep
  # once this narrow run's cost/value is known.
  #
  # NOTE on path form: gremlins walks the target package's directory via
  # os.DirFS(mod.Root + CallingDir) (internal/engine/engine.go), so the path
  # handed to the exclusion matcher is the BARE FILENAME relative to
  # internal/operations/ (e.g. "agents.go"), not "internal/operations/
  # agents.go". Anchor on the bare name, and nest this list under unleash: —
  # see the CONFIG-STRUCTURE GOTCHA note above.
  exclude-files:
    - ".*_test\\.go$"
    - ".*\\.pb\\.go$"
    - ".*/mock_.*\\.go$"
    - ".*/testdata/.*"
    - "^agents\\.go$"
    - "^bundle_distill\\.go$"
    - "^bundle_list_remote\\.go$"
    - "^bundle_move\\.go$"
    - "^bundle_reader\\.go$"
    - "^bundle_read\\.go$"
    - "^bundle_refs\\.go$"
    - "^bundles\\.go$"
    - "^bundle_transfer\\.go$"
    - "^constraint_resolve\\.go$"
    - "^context\\.go$"
    - "^countersign_records\\.go$"
    - "^delegate\\.go$"
    - "^depgraph\\.go$"
    - "^doc\\.go$"
    - "^ensemble\\.go$"
    - "^fragments\\.go$"
    - "^helpers\\.go$"
    - "^hooks\\.go$"
    - "^init\\.go$"
    - "^items\\.go$"
    - "^legacy_cleanup\\.go$"
    - "^llm\\.go$"
    - "^lockfile\\.go$"
    - "^lockfile_hold\\.go$"
    - "^manage\\.go$"
    - "^mcp_servers\\.go$"
    - "^oneshot\\.go$"
    - "^profile_materialize\\.go$"
    - "^profiles\\.go$"
    - "^profile_transfer\\.go$"
    - "^prompts\\.go$"
    - "^pull\\.go$"
    - "^remotes\\.go$"
    - "^resume\\.go$"
    - "^review\\.go$"
    - "^review_snapshots\\.go$"
    - "^schematargets\\.go$"
    - "^search\\.go$"
    - "^sessionfeed\\.go$"
    - "^sessions\\.go$"
    - "^setup_prompt\\.go$"
    - "^shortname\\.go$"
    - "^signer\\.go$"
    - "^sign\\.go$"
    - "^sync\\.go$"
    - "^task_triggers_cache\\.go$"
    - "^task_triggers\\.go$"
    - "^task_triggers_query\\.go$"
    - "^tooling\\.go$"
    - "^trust_gate\\.go$"
    - "^upgrade\\.go$"

# Same operator set as the unit profile, for like-for-like comparison.
mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-assignments:
    enabled: true
  invert-bitwise:
    enabled: false
  invert-bwassign:
    enabled: false
  invert-negatives:
    enabled: true
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: true
  remove-self-assignments:
    enabled: true
