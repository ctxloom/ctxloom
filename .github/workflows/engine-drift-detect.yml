name: Engine Drift Detect

# P0 (detect + alert) of the self-healing engine-format pipeline: polls each
# LLM-engine CLI's release feed and compares it against the tested-version
# lock in .github/engine-versions.env. A mismatch means a version ctxloom's
# importer (internal/transcript/importer/{codex,claude,antigravity,kiro})
# has never been validated against has shipped, so it opens/labels a
# tracking issue for a human. That is ALL this workflow does: no engine CLI
# is installed, no transcript is captured, no parser is touched, and no
# engine credential (ANTHROPIC_API_KEY / CODEX_API_KEY / KIRO_API_KEY /
# antigravity auth) is used or needed — those belong to later phases
# (capture+oracle, then self-heal) per the plan. This workflow only ever
# reads the engines' PUBLIC release feeds and writes a GitHub issue.
#
# Modeled on the repo's only other cron, mutation-weekly.yml: scheduled +
# workflow_dispatch, non-gating (nothing here blocks CI or merges). Unlike
# that workflow, this one does NOT run in the ctxloom-devcontainer image --
# "detect" doesn't build, test, or touch the Go toolchain at all, so a bare
# `ubuntu-latest` runner (which already ships Node/npm, curl, and `gh`) is
# both simpler and correct. The devcontainer only becomes necessary for the
# later capture/validate/self-heal stages, which run `just test-vendor-*`.
#
# GH Actions cron caveats (verified in the plan's research pass -- not
# assumed): 5-field UTC only, minimum 5-minute interval, schedules fire ONLY
# on the repo's default branch, and GitHub auto-disables scheduled workflows
# in PUBLIC repos after 60 days with no repo activity (no keepalive is set
# up here; if this repo goes quiet for 2 months, re-enable manually in the
# Actions tab or trigger via workflow_dispatch). Firing time is best-effort,
# not exact, under GitHub's load.
on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect:
    name: Detect (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: codex
            lock_key: CODEX_CLI_VERSION
          - engine: claude-code
            lock_key: CLAUDE_CODE_CLI_VERSION
          - engine: antigravity
            lock_key: ANTIGRAVITY_CLI_VERSION
          - engine: kiro
            lock_key: KIRO_CLI_VERSION

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve latest published version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(.github/scripts/detect-engine-version.sh "${{ matrix.engine }}")"
          if [ -z "$version" ]; then
            echo "::error::detect-engine-version.sh ${{ matrix.engine }} produced no output"
            exit 1
          fi
          echo "Resolved ${{ matrix.engine }} latest = $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read tested-version lock
        id: pinned
        run: |
          pinned="$(grep -E "^${{ matrix.lock_key }}=" .github/engine-versions.env | cut -d= -f2-)"
          if [ -z "$pinned" ]; then
            echo "::error::${{ matrix.lock_key }} not found in .github/engine-versions.env"
            exit 1
          fi
          echo "Pinned ${{ matrix.engine }} lock = $pinned"
          echo "version=$pinned" >> "$GITHUB_OUTPUT"

      - name: Alert on drift
        if: steps.latest.outputs.version != steps.pinned.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          engine="${{ matrix.engine }}"
          latest="${{ steps.latest.outputs.version }}"
          pinned="${{ steps.pinned.outputs.version }}"
          title="engine-drift: $engine $pinned -> $latest"

          # Idempotent per new version: ensure the two labels this issue
          # needs exist (no-op if they already do), then only open a new
          # issue if one with this EXACT title isn't already open -- a daily
          # cron would otherwise open a fresh duplicate every single run
          # until a human bumps the lock.
          gh label create "engine-drift" --color "B60205" \
            --description "A new engine CLI version was detected that ctxloom's importer has not been validated against" \
            --force
          gh label create "engine-drift:$engine" --color "5319E7" \
            --description "Drift alert for the $engine engine specifically" \
            --force

          existing="$(gh issue list --state open --label "engine-drift:$engine" --search "\"$title\" in:title" --json title --jq --arg t "$title" '.[] | select(.title == $t) | .title')"
          if [ -n "$existing" ]; then
            echo "An open issue already tracks $title; not creating a duplicate."
            exit 0
          fi

          body="$(cat <<EOF
          A new **$engine** CLI version was detected that is newer than the tested-version lock.

          | | |
          |---|---|
          | Pinned (\`.github/engine-versions.env\`) | \`$pinned\` |
          | Latest detected | \`$latest\` |
          | Detected by | \`.github/workflows/engine-drift-detect.yml\` (run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})) |

          This is an **alert-only** notification (P0 of the self-healing engine-format
          pipeline) -- nothing has been installed, captured, or changed. A human should:

          1. Confirm \`internal/transcript/importer/$engine\` (or the closest match --
             \`claude-code\` -> the \`claude\` importer package) still parses a transcript
             produced by \`$latest\`.
          2. If it does, bump \`$engine\`'s key in \`.github/engine-versions.env\` to
             \`$latest\` in a PR (internal/enginepins will fail CI if the bump isn't a
             valid semver or the workflow stops referencing the key by name).
          3. If it does not, file/track the parser fix separately -- this issue is only
             the drift signal, not the fix.

          (Later phases of the pipeline automate capture + the drift oracle + self-heal
          for the headless-capable engines; this repo does not yet run any of that.)
          EOF
          )"

          gh issue create --title "$title" --label "engine-drift" --label "engine-drift:$engine" --body "$body"
