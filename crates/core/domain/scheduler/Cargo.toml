[package]
name = "scheduler"
version = "0.1.0"
description = "The scheduler domain: one stream per target stream, holding its alarms; decided and folded on angzarr-embedded"
edition.workspace = true
rust-version.workspace = true
# Liftable into angzarr-embedded (scheduler.plan.md OD-13): its licence, not the workspace's.
license = "Apache-2.0 OR BSD-3-Clause"
publish.workspace = true

[dependencies]
angzarr-embedded.workspace = true
angzarr-diagnostic.workspace = true
angzarr-embedded-macros.workspace = true
prost.workspace = true
prost-types.workspace = true
scheduler-proto.workspace = true
# The alarm id's instant as RFC 3339 text: pure calendar arithmetic, no clock.
time.workspace = true
uuid.workspace = true

[build-dependencies]
angzarr-build.workspace = true

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
mutants.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
