syntax = "proto3";

// A tree is the shrunk aggregate of plan 3.2 (D5 Q4): founding and limits,
// ephemeral, and the current occupant. Routing, grants, credentials and
// spawn refusals are not here: they are the session's and the run's.
package ctxloom.runs.v1;

import "io/angzarr/v1/options.proto";

message TreeState {
  option (io.angzarr.v1.component) = {
    component_name: "tree"
    aggregate: {domain: "trees"}
  };

  string owner_session = 1;
}

message FoundTree {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.runs.v1.TreeState"
    emits: ["ctxloom.runs.v1.TreeFounded"]
    refuses: "ctxloom.runs.v1.AlreadyFounded"
  };

  string owner_session = 1;
  bool ephemeral = 2;
  // delegation.concurrency and delegation.depth, snapshotted at founding.
  uint32 concurrency = 3;
  uint32 depth = 4;
}

// Whoever holds the tree after `--session` (Q2).
message OccupyTree {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.runs.v1.TreeState"
    emits: ["ctxloom.runs.v1.TreeOccupied"]
    refuses: "ctxloom.runs.v1.NoTree"
  };

  string session = 1;
}

message TreeFounded {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.TreeState"};

  string owner_session = 1;
  bool ephemeral = 2;
  uint32 concurrency = 3;
  uint32 depth = 4;
}

message TreeOccupied {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.TreeState"};

  string session = 1;
}

// region refusals
//
// A command's refusals, one typed message each, listed in the `refuses` of
// the command that raises it. The status is the gRPC meaning of what is
// refused, declared here and nowhere else; the code and text a person reads
// are the domain's `TreeRejection` (`rejection.rs`), mapped from the
// refusal's TYPE, never its status.

// A founding on a stream that already holds a tree.
message AlreadyFounded {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_ALREADY_EXISTS;
}

// A command to a stream holding no tree.
message NoTree {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;
}

// endregion refusals
