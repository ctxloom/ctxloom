# Taskloom's own config for this repository. tag_permits is its closed tag
# vocabulary (tag-vocabulary.proposal.md, section 5, session
# inept-sixth-stick, as the rulings of 2026-10-27 adapted it): a write
# adding a tag it does not permit is refused, and only a person widens it,
# with `taskloom permit` (or narrows it with `taskloom revoke`). The core is
# copied here, not built in; the factual flags are bare keys of a closed
# triage: list. The targets the tag schema declares (triage:level, kind,
# effort, blocks-release, exposed, verdict, audited, blind-gate) need no
# permit. `taskloom permits` lists what is permitted.
schema_version: 1

tag_permits:
  namespaces:
    # Where in this project: one per task (lint says so).
    area: [domain, read-model, tasks, tags, projects, store, import, config,
           integration, cli, mcp, platform, build, docs]
    human: [decision, voice, authority, verify, prerequisite, action]
    # The sibling checkout a task edits.
    repo: [ctxloom, ctxloom-rs, annals, tagma, harp, angzarr-cli, angzarr-project]
    platform: [linux, macos, windows]
    ctxloom: [plan]
    # Facts, searchable, scored by nothing.
    triage: [security, data-loss, crashes, no-workaround, regression,
             silent-no-op, flaky]
    relates: open
    touches: open
    sig: open
    queue: open
    landed: open
  # No flat tags.
