[package]
name = "embedded-edge"
version = "0.1.0"
description = "run-ports' Edge over angzarr-embedded-host's App: the exposure seam (serve_in) and the core's own handle_in, in process"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded.workspace = true
angzarr-embedded-host.workspace = true
run-ports.workspace = true

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
mutants.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
# The tests define a tiny aggregate of their own, so no domain is linked.
angzarr-embedded-macros.workspace = true
prost.workspace = true

[lints]
workspace = true
