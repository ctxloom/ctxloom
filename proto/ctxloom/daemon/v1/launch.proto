syntax = "proto3";

// DRAFT for the owner's review (ruling 132, design-by-test). No build.rs
// lists this file, so nothing is generated from it yet.
//
// THE LAUNCH (T10): everything needed to start one engine process, computed
// by the daemon alone, as ONE message. Both consumers take this same type:
// the daemon, for the one-shots and children it hosts (T7), and the frontend
// (the `ctxloom run` on the user's terminal), for the interactive TUI it
// starts (T9). Nothing about a launch is computed on the frontend: it takes
// the lock the launch names, starts `program` with `args`, exactly `env`, in
// `cwd`, with the stdio the launch says, and reports the start and the exit.
//
// A launch CARRIES SECRETS (the run's hook bearer, an engine credential):
// it is never journaled, logged or written to a file, and the Debug of every
// type built from it withholds every environment value (run-ports'
// `RedactedEnv`). It crosses the wire only on the TLS stream of the client
// that asked for it.
package ctxloom.daemon.v1;

// One variable of the engine's environment.
message EnvVar {
  string name = 1;
  string value = 2;
}

// Which consumer starts it, and how.
enum LaunchKind {
  LAUNCH_KIND_UNSPECIFIED = 0;
  // The interactive TUI: started by the frontend on the user's terminal,
  // inherited stdio, in the frontend's process group (a Ctrl-C reaches it),
  // no deadline. The frontend waits for it (spec call S3).
  LAUNCH_KIND_TERMINAL = 1;
  // A long-lived child (D15, D23), hosted by the daemon: piped stdio in the
  // engine's own protocol (claude's stream-json, opencode's ACP), its own
  // process group, no deadline. Ended by its close (T6).
  LAUNCH_KIND_CHILD = 2;
  // A one-shot (T7): a hosted child that ends after its one turn, its reply
  // streamed back to the CLI that asked.
  LAUNCH_KIND_ONE_SHOT = 3;
  // `$EDITOR` on a file, for a command's editor round trip, started by the
  // frontend on the user's terminal as a TERMINAL launch is (spec call S9).
  LAUNCH_KIND_EDITOR = 4;
}

// The protocol on a hosted launch's stdin and stdout.
enum LaunchStdio {
  LAUNCH_STDIO_UNSPECIFIED = 0;
  // The user's terminal (TERMINAL, EDITOR).
  LAUNCH_STDIO_INHERIT = 1;
  // claude's stream-json lines (D15).
  LAUNCH_STDIO_STREAM_JSON = 2;
  // opencode's ACP over JSON-RPC lines (D21, D23).
  LAUNCH_STDIO_ACP = 3;
}

// How the launch's holder stops it (ruling 114), when asked to.
message StopPolicy {
  // The signal the engine is asked to stop with (SIGTERM, 15), sent to the
  // whole process group for a hosted launch, and for a TERMINAL launch the
  // direct child alone is killed (today's `run_terminal`).
  uint32 signal = 1;
  // The grace before it is killed (five seconds today).
  uint32 grace_ms = 2;
  // A hosted child is ended by closing its stdin first (claude exits on EOF;
  // opencode's `dispose` runs on it), then the signal after the grace.
  bool close_stdin_first = 3;
}

// Where the run it starts lives (T8): what the frontend sends back with
// every call it makes for this run, and what the daemon routes by.
message LaunchAt {
  string project_id = 1;
  // The session's stable id (its stream root, UUID text).
  string session = 2;
  string harp = 3;
  // The run's id, and the incarnation of the session it is.
  string run = 4;
  uint32 incarnation = 5;
}

message Launch {
  LaunchAt at = 1;
  LaunchKind kind = 2;
  // The engine's name (claude-code, opencode; under test-support, mock).
  string engine = 3;

  // The program, resolved by the daemon to an absolute path (the configured
  // `engines.<e>.command` looked up on the PATH the launch gives).
  string program = 4;
  // Its arguments, after the program.
  repeated string args = 5;
  // Its WHOLE environment, sorted by name: nothing is inherited from the
  // process that starts it. The daemon built it from the environment the
  // launching client sent (an interactive run's, a one-shot's) or a child's
  // hand-off file (T6), through the engine's allowlists, the engine block,
  // the permits (ruling 78) and what ctxloom sets (HOME, CTXLOOM_HOME, PATH,
  // the CTXLOOM_* hook variables naming the DAEMON's endpoint and the run's
  // own hook bearer).
  repeated EnvVar env = 6;
  // Where it runs (the project, or the session's worktree).
  string cwd = 7;
  // The session home, already written by the daemon (its settings, hooks,
  // context file, login links): the frontend writes nothing.
  string session_home = 8;

  // The session's lock (`<project>/.ctxloom/sessions/<harp>.lock`), which
  // the process that starts the engine TAKES before it starts it and holds
  // until the engine has exited and the exit is reported (rulings 85, 92):
  // the frontend for a TERMINAL launch, the daemon for a hosted one. An
  // EDITOR launch names none.
  string session_lock = 9;

  LaunchStdio stdio = 10;
  StopPolicy stop = 11;
}
