name: Weekly Mutation

# Whole-codebase mutation testing on a schedule. Per-PR/push CI runs the fast
# diff-only mutation (see ci.yml); this catches efficacy regressions across the
# entire tree that a diff can't see. It gates nothing — a failure surfaces in
# the Actions tab, and GitHub emails the repo admins when a scheduled run fails.
#
# Every step is a `just` target — see the header of ci.yml and build/ci.justfile.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  full-mutation:
    name: Full Mutation Testing
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      JUST_JUSTFILE: justfile.container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe
        run: just ci-git-safe-directory

      - name: Generate protobuf code
        run: just proto

      # `just test-mutation`, not a bare `gremlins unleash`. gremlins copies the
      # whole Go module into TMPDIR once per worker; on a tmpfs /tmp that
      # exhausts RAM and wedges the machine (it has emptied a 16G tmpfs on a dev
      # box). The recipe pins TMPDIR to disk and sweeps the copies afterwards.
      # This step called gremlins directly and had none of that — the exact
      # workflow-vs-recipe drift build/ci.justfile exists to end.
      - name: Run full mutation tests
        run: just test-mutation
