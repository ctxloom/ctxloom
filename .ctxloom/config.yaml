agents:
    coordinator:
        llm: claude-code
        permissions: bypass
        profiles:
            - coordinator
        runtime: host
    default:
        llm: claude-code
        profiles:
            - default
        runtime: host
    developer:
        llm: claude-code
        permissions: bypass
        profiles:
            - default
            - developer-escalation
        runtime: container
    developer-host:
        llm: claude-code
        permissions: bypass
        profiles:
            - default
            - developer-escalation
        runtime: host
    finder:
        llm: claude-fast
        permissions: plan
        profiles:
            - finder
        runtime: host
config:
    use_distilled: true
default_agent: coordinator
dirty_tree_handler: commit
llm:
    configs:
        claude-code:
            model: claude-opus-5
            type: claude-code
        claude-fast:
            model: claude-haiku-4-5-20251001
            type: claude-code
        claude-sonnet:
            model: claude-sonnet-5
            type: claude-code
    defaults:
        fast: claude-fast
        primary: claude-code
mcp:
    auto_register_ctxloom: true
version: 6
