syntax = "proto3";

// DRAFT for the owner's review (rulings 142, 132; design-by-test). No
// build.rs lists this file, so nothing is generated from it yet.
//
// TRUST: a person's verdict on a project (its project layer's project-only
// settings: `engines.<e>.command`, `engines.<e>.auth.file`,
// `engines.<e>.session_home: host`; and a project `ctxloom` bundle
// overriding the setup prompts, ruling 128) or on a remote's content. An
// angzarr aggregate, one stream per subject, in the one per-user store
// (T14); the daemon CHECKS it as policy: the plan gathers it as evidence and
// a launch whose project-only settings are not trusted is refused
// (`runs-untrusted-project-settings`).
//
// A trust covers the subject UNTIL IT IS REVOKED (owner, S23), not a digest:
// a later upstream change applies without asking again (accepted cost). The
// preview (`Ctxloom.GetTrust`) carries an etag of what it showed, and the
// grant names it, so what is applied is what was shown (API Q5).
//
// A trust is the user's consent to a project's settings, asked of the human
// (her terminal's confirmation); ctxloom gives agents no trust tool. The
// actor and the current etag are STAMPED by the daemon (S21); a client sets
// the subject and the etag it saw. The time is the
// event's own recorded instant.
//
// Through angzarr's coordinator: `HandleSync`, projector `trust-index`.
package ctxloom.trust.v1;

import "io/angzarr/v1/options.proto";

// What a trust is about. The stream root is UUIDv5(the user namespace,
// "ctxloom:trust:" + kind + ":" + key).
message Subject {
  oneof kind {
    // A project, by its id (a worktree shares its primary's).
    string project_id = 1;
    // A remote, by its canonical URL.
    string remote_url = 2;
  }
}

// Who acted: stamped, never read from a payload.
message Actor {
  // The user's login on this machine (the daemon's uid's name).
  string user = 1;
}

message TrustState {
  option (io.angzarr.v1.component) = {
    component_name: "trust"
    aggregate: {domain: "trust"}
  };

  Subject subject = 1;
  bool trusted = 2;
  Actor actor = 3;
}

// region commands

// Trust the subject until revoked. Refused `PlanStale` when what the
// preview showed has changed; trusting what is trusted records nothing.
message GrantTrust {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.trust.v1.TrustState"
    emits: ["ctxloom.trust.v1.TrustGranted"]
    refuses: "ctxloom.trust.v1.PlanStale"
  };

  Subject subject = 1;
  // The etag the preview showed.
  string etag = 2;
  // STAMPED: the etag of the subject now.
  string current_etag = 3;
  // STAMPED: absent when the caller is not the user.
  Actor actor = 4;
}

// Take trust back (`ctxloom trust --undo`). Revoking what is not trusted
// records nothing.
message RevokeTrust {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.trust.v1.TrustState"
    emits: ["ctxloom.trust.v1.TrustRevoked"]
  };

  Subject subject = 1;
  Actor actor = 2;
}

// endregion

// region events

message TrustGranted {
  option (io.angzarr.v1.event) = {component: "ctxloom.trust.v1.TrustState"};

  Subject subject = 1;
  Actor actor = 2;
}

message TrustRevoked {
  option (io.angzarr.v1.event) = {component: "ctxloom.trust.v1.TrustState"};

  Subject subject = 1;
  Actor actor = 2;
}

// endregion

// region refusals

// What the preview showed has changed: preview it again.
message PlanStale {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  string seen = 1;
  string now = 2;
}

// endregion
