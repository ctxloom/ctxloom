agents:
    coder:
        engine: claude-sonnet
        profiles:
            - default
            - developer-escalation
        runtime: container
        permissions: bypass
    coordinator:
        engine: claude-code
        profiles:
            - coordinator
        runtime: host
        permissions: bypass
        coordinator: true
    default:
        engine: claude-code
        profiles:
            - https://github.com/benjaminabbitt/ctxloom-personal@bundles/go-development#profiles/go-developer
        runtime: host
    developer:
        engine: claude-code
        profiles:
            - default
            - developer-escalation
        runtime: container
        permissions: bypass
    finder:
        engine: claude-fast
        profiles:
            - finder
        runtime: host
        permissions: plan
    haiku:
        engine: claude-fast
        profiles:
            - finder
        runtime: container
        permissions: bypass
    host-dev:
        engine: claude-code
        profiles:
            - default
            - developer-escalation
        runtime: host
        permissions: bypass
    triage:
        engine: claude-fast
        profiles:
            - coordinator
        coordinator: true
config:
    use_distilled: true
default_agent: coordinator
llm:
    configs:
        claude-code:
            type: claude-code
            model: claude-opus-4-8
        claude-fast:
            type: claude-code
            model: claude-haiku-4-5-20251001
        claude-sonnet:
            type: claude-code
            model: claude-sonnet-5
        gemini-code:
            type: antigravity
            model: gemini-2.5-pro
        gemini-fast:
            type: antigravity
            model: gemini-2.5-flash
    defaults:
        primary: claude-code
        fast: claude-fast
mcp:
    auto_register_ctxloom: true
version: 6
