  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a write's answers to the needs its preview asked are ctxloom's (S38, API Q2). --)
  repeated Answer answers = 93 [(google.api.field_behavior) = OPTIONAL];
}

// A run by its name.
message GetRunRequest {
  // The Run to read, by its resource name.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/Run"];
}

// `WatchRun`: a hosted run's events, from its first.
message WatchRunRequest {
  // The Run to watch, `projects/{project}/runs/{run}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// A one-shot's end. Stopped by `RequestStop`: exit 128 plus the signal's
// number, `run-application-stopped`. A run that answered ends with exit 0
// and no code. `args` are the diagnostic's, flattened as angzarr flattens a
// cause on its wire (a wrapped cause is its code under the arg's name, and
// each of its own args under `<name>.<arg>`), so a client renders the text
// itself; `text` is the end as a log line says it (its code and args,
// never English: decision 14.37).
message RunEnd {
  // The command's exit code.
  int32 exit = 1;
  // The diagnostic's code; empty for a run that answered.
  string code = 2;
  // The diagnostic's args, flattened.
  repeated NeedArg args = 3;
  // The end as a log line says it: its code and args.
  string text = 4;
  // An aggregate refusal's refusals, in check order (rulings 73b, 73i),
  // each said as the run's single refusal would be.
  repeated RunEnd refusals = 5;
}

// The daemon is stopping the run's engine (s4-Q2): a one-shot's, asked by
// `RequestStop` (its tree asked to stop, then killed after `grace_ms`); a
// TERMINAL run's frontend is told to stop its TUI (U5).
message RunStop {
  // Why it is stopped (the signal's name).
  string reason = 1;
  // The grace before it is killed, in milliseconds.
  uint32 grace_ms = 2;
}

// One event of a run, as `WatchRun` streams it.
message RunEvent {
  oneof event {
    // A notice the run said.
    Notice notice = 1;
    // The one-shot's reply.
    string reply = 2;
    // The run's end: the last event.
    RunEnd end = 3;
    // The daemon is stopping the run's engine.
    RunStop stop = 4;
  }
}

// (-- endregion --)

// (-- region approvals --)

// One choice an approval offers (approvals.v1.ApprovalOption, rendered).
message ApprovalOption {
  // The word `session approvals answer` takes: `allow-once`,
  // `allow-session`, `allow-always`, `deny`, `deny-always` (Q2).
  string id = 1;
  // `allow_once`, `allow_session`, `allow_always`, `reject_once`,
  // `reject_always`.
  string kind = 2;
  // What the human is shown: the ACP option's own `name`; empty for
  // claude's, which the CLI says itself (its catalog's words).
  string label = 3;
  // claude: the rule, `Bash(rm -rf build/)`.
  string rule = 4;
}

// A permission ask (approvals/v1/approvals.proto's state).
message Approval {
  option (google.api.resource) = {
    type: "ctxloom.dev/Approval"
    pattern: "projects/{project}/approvals/{approval}"
    singular: "approval"
    plural: "approvals"
  };

  // `projects/{project}/approvals/{approval}`, `{approval}` the ask's name,
  // `ask-<adjective>-<noun>`, under its ROOT's project (Q-A).
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The asking session's and its root's session resource names.
  string child = 2;
  // The root session of its tree.
  string root = 3;
  // The engine that asked.
  string engine = 4;
  // The tool the engine asks to run.
  string tool_name = 5;
  // The start of the tool's input, bounded by the daemon.
  string input_excerpt = 6;
  // When it was asked.
  google.protobuf.Timestamp ask_time = 7;
  // When it expires unanswered.
  google.protobuf.Timestamp expire_time = 8;
  // Field 9 was `decision` (never served): the state and the option replace it.
  reserved 9;
  reserved "decision";
  // Said to the engine with a deny.
  string message = 10;
  // The choices it offers.
  repeated ApprovalOption options = 11;
  // `waiting`, `answered`, `expired` or `withdrawn`.
  string state = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When answered: the option's id.
  string option = 13;
  // Its stream's root (a UUID), as a session's `uid`: what an answer is
  // sent to.
  string uid = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When answered: its option's kind (`allow_once`, ...).
  string option_kind = 15;
  // How long it waits, in seconds (its engine's `approval_timeout`; 0 is
  // `now`).
  uint32 timeout_seconds = 16;
  // The agent the asking session was planned for (what `allow-always`
  // writes into, `agents.<agent>.engines.<engine>.permissions`).
  string agent = 17;
}

// claude's ask, sent by `ctxloom mcp serve`.
message CreateApprovalRequest {
  // `projects/{project}`.
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).child_type = "ctxloom.dev/Approval"];
  // The asking session's stable id (the engine's `CTXLOOM_SESSION`); the
  // daemon finds its run, engine, root and approval_timeout from it.
  string session = 2 [(google.api.field_behavior) = REQUIRED];
  // claude's `tool_use_id`.
  string engine_request_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // The tool claude asks to run.
  string tool_name = 4 [(google.api.field_behavior) = OPTIONAL];
  // The tool's `input`, as the JSON text claude sent; the daemon bounds it.
  string input_json = 5 [(google.api.field_behavior) = OPTIONAL];
  // The client's id for this write (AIP-155), sent again unchanged on the one
  // retry (API Q13).
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
}

// An approval by its name.
message GetApprovalRequest {
  // The Approval to read, by its resource name.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/Approval"];
}

// `session approvals [--waiting]`.
message ListApprovalsRequest {
  // The parent whose Approval resources to list.
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).child_type = "ctxloom.dev/Approval"];
  // Only those under this root session's tree.
  string root = 2 [(google.api.field_behavior) = OPTIONAL];
  // Only those still waiting for an answer.
  bool waiting = 3 [(google.api.field_behavior) = OPTIONAL];
  // The most results to answer in one page (AIP-158); 0 is the server's
  // choice. Every page is the whole list today.
  int32 page_size = 80 [(google.api.field_behavior) = OPTIONAL];
  // A previous response's `next_page_token`, to answer the page after it;
  // empty, the first page.
  string page_token = 81 [(google.api.field_behavior) = OPTIONAL];
}

// The approvals found, oldest first.
message ListApprovalsResponse {
  // The Approval resources of this page.
  repeated Approval approvals = 1;
  // The token of the next page (AIP-158); empty on the last. Every page is
  // the whole list today, so it is always empty.
  string next_page_token = 80;
}

// `WaitApproval`: an approval, answered once it is settled.
message WaitApprovalRequest {
  // The Approval to wait for, `projects/{project}/approvals/{approval}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// (-- endregion --)

// (-- region trusts --)

// One thing trusting a project allows.
message TrustSetting {
  // The setting's config path, or `bundles/ctxloom` for a project `ctxloom`
  // bundle.
  string path = 1;
  // The value it holds.
  string value = 2;
}

// A project's trust, until revoked (S23).
message Trust {
  option (google.api.resource) = {
    type: "ctxloom.dev/Trust"
    pattern: "projects/{project}/trust"
    singular: "trust"
    plural: "trusts"
  };

  // `projects/{project}/trust`, `{project}` the project's harp.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The user trusts the project now.
  bool trusted = 2;
  // What it allows: the project-only settings, and a project `ctxloom`
  // bundle (path `bundles/ctxloom`).
  repeated TrustSetting settings = 3;
  // Who granted it (the client sets it: nothing stamps yet, D13).
  string actor = 4;
  // When it was granted.
  google.protobuf.Timestamp grant_time = 5;
  // What `GrantTrust` names (API Q5).
  string etag = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The preview of `trust`.
message GetTrustRequest {
  // `projects/{project}/trust`.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/Trust"];
}

// `trust list`: the projects the user trusts now.
message ListTrustsRequest {
  // The most results to answer in one page (AIP-158); 0 is the server's
  // choice. Every page is the whole list today.
  int32 page_size = 80 [(google.api.field_behavior) = OPTIONAL];
  // A previous response's `next_page_token`, to answer the page after it;
  // empty, the first page.
  string page_token = 81 [(google.api.field_behavior) = OPTIONAL];
}

// The trusted projects' trusts.
message ListTrustsResponse {
  // The Trust resources of this page.
  repeated Trust trusts = 1;
  // The token of the next page (AIP-158); empty on the last. Every page is
  // the whole list today, so it is always empty.
  string next_page_token = 80;
}

// (-- endregion --)

// (-- region refusals --)

// The etag no longer matches what the preview was planned against (API Q5).
// OQ-10 (owner, 2026-11-13) rules it ABORTED (AIP-154, 134, 135): angzarr
// core's `RefusalStatus` holds REFUSAL_STATUS_ABORTED since b1445adf
// (angzarr decision 14.111), and 10b's stale-etag refusal (U3) declares it,
// as library-tree's own `PlanStale` does.
message PlanStale {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_ABORTED;

  // The etag the apply named.
  string seen = 1;
  // The etag of what stands now.
  string now = 2;
}

// An apply whose etag is not a number, so no preview answered it (step 10b
// U3, protos.md §1.1: the etag is a resource's last sequence, a decimal).
// `daemon-api-etag-invalid`.
message EtagInvalid {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;

  // The etag as the apply sent it.
  string etag = 1;
}

// An apply that does not answer every need of its preview.
message NeedsUnanswered {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // Each need left unanswered.
  repeated string need_ids = 1;
}

// An edit that would change more than one file (T29: one file per call,
// several fields of it allowed).
message OneChangePerCall {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;

  // The paths the mask named.
  repeated string paths = 1;
}

// The directory is in no ctxloom project.
message ProjectUnknown {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;

  // The directory.
  string cwd = 1;
}

// A per-project store from before the one store (T17): refused, its fix
// naming the file to remove; nothing is imported.
message PerProjectStore {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The old store's file, to remove.
  string path = 1;
}

// A child whose hand-off is missing cannot be started again.
message HandOffMissing {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The child's harp.
  string harp = 1;
}

// A resource name that is not one (`projects/{p}` or
// `projects/{p}/sessions/{s}`, each segment a harp); `reason` is `shape`
// or the harp grammar's.
message NameInvalid {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;

  // The name as given.
  string name = 1;
  // `shape`, or the harp grammar's reason.
  string reason = 2;
}

// `GetTranscript` of a session whose hooks have delivered nothing yet (the
// CLI's `no captured transcript`).
message TranscriptEmpty {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;

  // The Transcript asked for.
  string name = 1;
}

// A session's resource name no session holds.
message SessionNotFound {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;

  // The Session's name as given.
  string name = 1;
}

// A session the daemon hosts no run of, asked for (step 8 U4:
// `CreateApproval` from a session it does not host: an ask comes only from
// a session the daemon runs, D6).
message SessionNotHosted {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The Session's name.
  string name = 1;
}

// A run's resource name the daemon hosts no run under (U4: `GetRun`,
// `WatchRun` of a one-shot it does not host, or no longer keeps).
message RunNotFound {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;

  // The Run's name as given.
  string name = 1;
}

// A project's resource name no project holds.
message ProjectNotFound {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;

  // The Project's name as given.
  string name = 1;
}

// A request whose client is not this daemon's version (owner, 2026-11-18):
// its `Caller.client.version` is not the daemon's own stamp, or it names none
// (no `Caller`). Every kind of client alike: one ctxloom version runs at a
// time (OD-61/OD-62), so the fix is `ctxloom daemon stop`, after which the
// client's own version starts.
message ClientVersionMismatch {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The client's stamp; empty when it named none.
  string client_version = 1;
  // The daemon's own stamp.
  string daemon_version = 2;
  // The kind of client.
  Client.Kind kind = 3;
}

// `StopDaemon` while it hosts live runs (S12), unless `even_if_live`: how
// many, and their sessions' harps.
message DaemonHosting {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // How many runs it hosts.
  uint64 runs = 1;
  // Their sessions' harps.
  repeated string harps = 2;
}

// Any call but `GetDaemon`, `StopDaemon` and the project's names to a
// daemon asked to drain (OD-54; a SIGTERM too): its stamp and the sessions
// of the runs it still hosts.
message DaemonDraining {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The draining daemon's stamp.
  string version = 1;
  // Field 2 was `successor`, the stamp it handed over to (OD-62).
  reserved 2;
  reserved "successor";
  // The sessions of the runs it still hosts.
  repeated string harps = 3;
}

// A call that would create files under the daemon's home (`CreateHandOff`,
// `CreateRun`) once that home's ctxloom directory is gone (owner,
// 2026-11-17: the daemon never makes a file in its home again once it has
// started; OD-60): nothing is created, and the daemon exits on its next
// round. `home` is the ctxloom directory that is gone.
message DaemonHomeGone {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  string home = 1;
}

// `DeleteSession` refused: nothing was removed. It carries the PLAN (owner,
// 2026-11-12): every file the removal would have destroyed, its class and
// bytes, the authored ones, and the worktrees, so a refused removal says
// what it did not do.
message RemovalRefusal {
  // Why a removal was refused.
  enum Reason {
    // Unset (proto3's zero value); never answered.
    REASON_UNSPECIFIED = 0;
    // Its lock does not prove it ended (held, or none), without
    // `even_if_live`; `detail` says which.
    NOT_PROVEN_DEAD = 1;
    // It is marked keep.
    KEPT = 2;
    // It ended within the transcript retention; `detail` says when.
    RETAINED = 3;
    // A scratch worktree of it is spared or skipped: a session is removed
    // whole or not at all.
    WORKTREES_KEEP = 4;
    // Its lock is held where a held lock keeps its directory from being
    // moved (D18, Windows), `even_if_live` or not; `detail` is the lock's
    // path.
    LOCK_HELD = 5;
  }

  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The Session's name.
  string name = 1;
  // Why it was refused.
  Reason reason = 2;
  // What the reason says of it: which lock state, or when it ended.
  string detail = 3;
  // What the removal would have destroyed.
  DeleteSessionResponse plan = 4;
  // A worktree refusal's counts.
  uint64 spared = 5;
  // Worktrees left because their owner was not proven ended.
  uint64 skipped = 6;
}

// A configured age (`session_purge_age`, `session_transcript_retention`)
// that is neither an age nor a date.
message AgeInvalid {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;

  // The config key.
  string key = 1;
  // Its value as written.
  string value = 2;
}

// A project's configuration, read from its registered root, that does not
// read.
message ConfigUnreadable {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The project's registered root.
  string root = 1;
  // Why it does not read.
  string detail = 2;
}

// A registration's recheck is refused with the projects aggregate's own
// typed refusals (`ctxloom.sessions.v1.ProjectIdentityMismatch`,
// `ProjectHarpMismatch`), answered as every refusal is (S11).

// (-- endregion --)
