[package]
name = "trust"
version = "0.1.0"
description = "The trust domain: the user's verdict on a project's own settings, granted until revoked, decided and folded on angzarr-embedded"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded.workspace = true
angzarr-diagnostic.workspace = true
angzarr-embedded-macros.workspace = true
prost.workspace = true
# A trust's resource name is under its project's (`projects/{harp}/trust`),
# its stream root the UUIDv5 of that name, as every ctxloom root is.
sessions.workspace = true
trust-proto.workspace = true

[build-dependencies]
angzarr-build.workspace = true

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
mutants.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
