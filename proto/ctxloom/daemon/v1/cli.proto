syntax = "proto3";

// DRAFT for the owner's review (ruling 132, design-by-test). No build.rs
// lists this file, so nothing is generated from it yet.
//
// A ctxloom COMMAND, as the user (T9, T11, T12). Every `ctxloom ...` a
// person (or a script) types is a client of the user's daemon: it finds the
// daemon (or starts one, T3), opens ONE `Invoke` stream presenting the USER
// bearer of the discovery file and pinning its certificate, and sends its
// command line. The daemon parses it, does all the work (planning, context
// assembly, policy, every read and write of the project's store, T1, T8),
// and streams back what to print and the exit code (spec call S1: the CLI is
// a remote terminal, as Bazel's client is). The client prints what it is
// told and exits as it is told. It does not read the project, its config or
// its store.
//
// Three things only the client can do, because they need the user's
// terminal: answer a confirmation, run `$EDITOR`, and start the interactive
// TUI. The daemon asks for each on the stream; the editor and the TUI are a
// `Launch` (T10).
package ctxloom.daemon.v1;

import "ctxloom/daemon/v1/launch.proto";

service Cli {
  // One command. The first client frame is its `Invocation`; the last
  // daemon frame is its `Exit` (or a `Terminal` hand-over, for `ctxloom
  // run`). A stream that breaks before either is the client's
  // `daemon-client-lost` (exit 1): a command is not resumed on another
  // daemon (spec call S8).
  rpc Invoke(stream ClientFrame) returns (stream DaemonFrame);
}

// What the client's terminal is.
message Tty {
  bool stdin = 1;
  bool stdout = 2;
  bool stderr = 3;
  // The terminal's width in columns, when stdout is one.
  uint32 columns = 4;
}

// The command line, and the process it was typed in.
message Invocation {
  // The words after `ctxloom`.
  repeated string argv = 1;
  // The client's working directory: the daemon finds the project from it
  // (the nearest `.ctxloom/`), as the process did before (spec call S6).
  string cwd = 2;
  // The client's WHOLE environment, sorted by name (spec call S7): what the
  // command reads of it (CTXLOOM_PERMIT_*, credentials by name for `auth
  // status`, EDITOR, the variables a one-shot's engine is given) is read
  // from here, never from the daemon's own. Held in the daemon's memory for
  // the command's life only; never journaled or logged.
  repeated EnvVar env = 3;
  Tty tty = 4;
}

// A signal the client heard while its command runs (ruling 114, T7): the
// daemon stops what the command started (a one-shot's engine: the launch's
// `StopPolicy`), records the run's end, and ends the stream with exit 128
// plus `signal` and the error `run-application-stopped`. A second signal is
// heard and changes nothing.
message Signal {
  uint32 signal = 1;
}

// What the client read from its own stdin, for a command that reads it.
message Stdin {
  bytes data = 1;
  bool eof = 2;
}

// The user's answer to a `Confirm`.
message Confirmed {
  bool yes = 1;
}

// A launch the client was asked to start has started (`pid`), or could not
// (`error`, the OS's text, verbatim as `ext_err_txt`).
message LaunchStarted {
  uint32 pid = 1;
  string error = 2;
}

// A launch the client started (an EDITOR) has exited.
message LaunchExited {
  int32 code = 1;
  // The signal that ended it, if one did.
  uint32 signal = 2;
}

message ClientFrame {
  oneof frame {
    Invocation invocation = 1;
    Signal signal = 2;
    Stdin stdin = 3;
    Confirmed confirmed = 4;
    LaunchStarted started = 5;
    LaunchExited exited = 6;
  }
}

// Bytes to print, on the stream they belong to (already rendered: json or
// the en-US text, as `--format` and the client's `Tty` decided).
message Output {
  enum Stream {
    STREAM_UNSPECIFIED = 0;
    STREAM_STDOUT = 1;
    STREAM_STDERR = 2;
  }
  Stream stream = 1;
  bytes data = 2;
}

// Ask the user to confirm what was previewed (a destroyer on a TTY). Off a
// TTY the daemon never asks: it previews and exits 4.
message Confirm {
  string prompt = 1;
}

// Start a launch on the user's terminal: `$EDITOR` on a file the daemon
// wrote (kind EDITOR), answered `LaunchStarted` then `LaunchExited`; the
// daemon then reads the file back.
message Run {
  Launch launch = 1;
}

// `ctxloom run` (interactive): the daemon has planned, enqueued and minted
// the run and written its session home; the client now owns the terminal
// session. It takes the launch's `session_lock`, starts the TUI, and from
// here on talks to the `Frontend` service with `runner_bearer`, the run's
// RUNNER credential (`<run-id>.<64 hex>`, returned this once, rulings 31-38),
// never the user bearer. The Invoke stream then ends: the run outlives it.
message Terminal {
  Launch launch = 1;
  string runner_bearer = 2;
  // Notices to print before the TUI takes the terminal (a permit ignored, a
  // weakened runtime), already rendered.
  repeated Output notices = 3;
}

// The command's end.
message Exit {
  int32 code = 1;
}

message DaemonFrame {
  oneof frame {
    Output output = 1;
    Confirm confirm = 2;
    Run run = 3;
    Terminal terminal = 4;
    Exit exit = 5;
  }
}
