[package]
name = "runs-application"
version = "0.1.0"
description = "The runs use cases: the agent's Facts and Feeds, admission by identity, and the enqueue that mints a run's credential"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-coordinator = { workspace = true, features = ["commands"] }
angzarr-diagnostic.workspace = true
angzarr-embedded.workspace = true
# A held fact's `held_at` (run-ports' HeldFact carries daemon-proto's Timestamp).
daemon-proto.workspace = true
prost.workspace = true
run-ports.workspace = true
runs.workspace = true
sessions.workspace = true
# The user may send a project's trust (step 8 U1): its commands are on
# the user allowlist.
trust.workspace = true
# The user may answer an ask and an engine withdraw one (step 8 U4).
approvals.workspace = true
# The user may send the library domain's operations and facts (step 10a U0).
library-tree.workspace = true
sha2.workspace = true
surface-ports.workspace = true
trees.workspace = true
uuid.workspace = true

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
run-ports = { workspace = true, features = ["test-support"] }
mutants.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
