# Built-in ctxloom taskloom bundle. Embedded into the ctxloom binary via
# resources/embed.go and surfaced through Config.ResolveBundleHooks
# unconditionally — no profile reference required, no remote pull, no
# manual install. The same YAML is mirrored at examples/bundles/taskloom.yaml
# for users who want to inspect or fork it.

version: 1.2.0
tags:
  - tasks
  - workflow
  - productivity
  - ctxloom-native
author: ctxloom

description: |
  Persistent task tracking via the standalone `taskloom` binary
  (built from github.com/ctxloom/ctxloom, cmd/taskloom). Tasks live in a per-project append-only log
  at ~/.ctxloom/tasks/<project-id>.jsonl keyed by harp IDs and are managed
  through the task MCP tools served by `taskloom mcp` (registered by this
  bundle) or the `taskloom` CLI. Also stamps the active session's harp name
  into plan files as they're edited.

notes: |
  This bundle ships two ctxloom hooks and one MCP server:

    1. SessionStart → ctxloom hook session-bind
       Records the backend session_id ↔ harp mapping in
       ~/.ctxloom/sessions/index.yaml so resume and `session distill`
       can find the session.

    2. PostFileEdit matcher=plan files → ctxloom hook stamp-plan
       Records the active session's harp name in the file's YAML
       frontmatter `sessions:` list. Plans and sessions cross-reference
       automatically.

    3. MCP server `taskloom` → `taskloom mcp`
       Serves task_list / task_add / task_set_status / task_edit over
       stdio from the standalone taskloom binary. Requires `taskloom` on
       PATH; a missing binary degrades to no task tools, never a blocked
       startup.

installation: |
  The ctxloom install script and `brew install ctxloom/tap/taskloom` ship the
  taskloom binary (fallback: go install github.com/ctxloom/ctxloom/cmd/taskloom@latest).
  Then run `ctxloom manage hooks install` (or restart your backend) so the
  hooks and MCP server are written into the backend's settings.json. The
  hooks are safe to install before session harp-naming is active (stamp-plan
  no-ops when CTXLOOM_SESSION_HARP is unset). Without ctxloom, the binary
  self-registers: `taskloom manage install`.

hooks:
  session_start:
    # Fires once per backend session with the session id and transcript
    # path in the JSON payload. ctxloom hook session-bind reads those,
    # looks up CTXLOOM_SESSION_HARP from env, and records the mapping in
    # ~/.ctxloom/sessions/index.yaml. This is the primary bind path —
    # `ctxloom session distill` and the resume picker rely on the
    # resulting index entry. The compactor's forward-bind at compact
    # time remains as defense in depth.
    #
    # pre_tool_fallback: the bind is first-bind-wins idempotent, so on
    # agents without a session-start event (Antigravity) it may fire on
    # PreToolUse instead — the session binds at the first tool call.
    - command: ctxloom hook session-bind
      type: command
      pre_tool_fallback: true
  post_file_edit:
    # Matcher intentionally omitted — defaults to Edit|Write per
    # internal/lm/backends/hooks.go::PostFileEdit translation. Plan-file
    # filtering happens inside stamp-plan via memory.IsPlanFile so the
    # hook is cheap to install on every Edit/Write call.
    - command: ctxloom hook stamp-plan
      type: command

mcp:
  taskloom:
    command: taskloom
    args:
      - mcp
    notes: |
      The standalone task-store MCP server (built from github.com/ctxloom/ctxloom,
      cmd/taskloom). The
      project and session resolve per call from CTXLOOM_PROJECT_ID /
      CTXLOOM_SESSION_HARP (exported by ctxloom run) or the working
      directory.
    installation: brew install ctxloom/tap/taskloom

fragments:
  taskloom:
    tags:
      - tasks
      - ctxloom
    content: |
      # taskloom

      Persistent task tracking. Tasks live in a per-project append-only log
      (~/.ctxloom/tasks/<project-id>.jsonl) and are keyed by harp IDs
      (e.g. `swift-amber-falcon`). Statuses: `In Progress`, `To Do`,
      `Deferred`, `Done`, `Archived`.

      ## MCP tools (served by `taskloom mcp`)

      - `task_list({statuses?, term?, include_completed?, include_summary?})`
        — list/filter tasks. Set `include_summary: true` to also get
        per-status counts plus the in-progress harp IDs.
      - `task_add({text, status?, trigger?})` — add a task with a fresh
        harp ID. Default status is `"To Do"`; `"Deferred"` requires a
        `trigger` (the condition that should revive it).
      - `task_set_status({harp_id, status, trigger?})` — move a task
        between statuses.
      - `task_edit({harp_id, text})` — replace a task's text in place.

      Tasks are created and updated only through these tools (or the
      `taskloom` CLI). The harp ID appears in `task_list` output so you can
      reference a specific task in later calls.

      ## Plan stamping

      When you edit a plan file (`CURRENT_PLAN.md`, `*-plan.md`,
      `docs/*-plan.md`), the active session's harp name is auto-stamped
      into the file's YAML frontmatter `sessions:` list. Plans and
      sessions cross-reference without a separate database.
