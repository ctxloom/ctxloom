name: Weekly Mutation

# Whole-codebase mutation testing on a schedule. Per-PR/push CI runs the fast
# diff-only mutation (see ci.yml); this catches efficacy regressions across the
# entire tree that a diff can't see. It gates nothing — a failure surfaces in
# the Actions tab, and GitHub emails the repo admins when a scheduled run fails.
#
# Every step is a `just` target — see the header of ci.yml and build/ci.justfile.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # The same sharded run as ci.yml's diff gate, over the whole tree
  # (.github/workflows/mutation.yml): a whole-tree run does not fit in one
  # job's 6h limit. No completed whole-tree run exists to size the shard
  # timeout from, so it is the hosted-runner maximum less a margin.
  full-mutation:
    name: Full Mutation Testing
    uses: ./.github/workflows/mutation.yml
    with:
      scope: tree
      image-tag: latest
      shard-timeout-minutes: 350
