  // The client's working context (needs.proto), as every request made on a
  // user's behalf carries it (owner, 2026-11-18).
  Caller caller = 98 [(google.api.field_behavior) = REQUIRED];
}

// One recorded change of a library tree, as a thin notice: the paths and
// how, never their content (10c, G7; G4 superseded).
message LibraryChange {
  // What made the change.
  enum Cause {
    // Not set.
    CAUSE_UNSPECIFIED = 0;
    // Made outside ctxloom (an editor, a commit, a checkout, a pull).
    EXTERNAL = 1;
    // A write of ctxloom's own (an applied step).
    INTENDED = 2;
  }
  // `projects/{p}/checkouts/{c}/library` or `users/me/library`.
  string tree = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // What made it.
  Cause cause = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The write's id; INTENDED only.
  string request_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The CLI's verb of the write; INTENDED only.
  string verb = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Each path changed, and how.
  repeated ChangeSummary changes = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the change was recorded.
  google.protobuf.Timestamp observed_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The event's sequence in the tree's stream: every path in `changes` now
  // has it as its etag (G4 superseded), so a watcher knows its preview is
  // stale without a read.
  uint64 sequence = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One path a `LibraryChange` names.
message ChangeSummary {
  // Relative to the library root.
  string path = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `added`, `modified`, `deleted`, `renamed`, `type_changed`.
  string status = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A rename's old path; empty otherwise.
  string from_path = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A session's transcript, folded from its capture events on each read.
message Transcript {
  option (google.api.resource) = {
    type: "ctxloom.dev/Transcript"
    pattern: "projects/{project}/sessions/{session}/transcript"
    singular: "transcript"
    plural: "transcripts"
  };

  // `projects/{project}/sessions/{session}/transcript`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  reserved 2;
  reserved "lines";

  // Its entries, in the order delivered (`seq`).
  repeated LogEntry entries = 3;
}

// The session to watch for messages that would wake it.
message WatchSessionRequest {
  // The Session to watch, `projects/{project}/sessions/{session}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// What would wake a session now (the terminal wake).
message SessionSignal {
  // The ids of its pending messages of urgency `wake`, in the order sent.
  repeated string wakes = 1;
  // Its outstanding wake's nonce; empty when none is.
  string outstanding_wake = 2;
}

// DRAFT (`ctxloom top`): the scope and filters of a watch. The scope is the
// whole list (`session` empty), one session (`session` set), or its subtree
// (`session` set and `subtree`); filters apply within it.
message WatchTopRequest {
  // `projects/{project}`, or `projects/-` for every project.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // The session scoped to, `projects/{project}/sessions/{session}`; empty,
  // every session of `parent`.
  string session = 2 [(google.api.field_behavior) = OPTIONAL];
  // With `session`: it and every descendant, not it alone.
  bool subtree = 3 [(google.api.field_behavior) = OPTIONAL];
  // Only sessions in these states; none, `LIVE` alone.
  repeated Session.State states = 4 [(google.api.field_behavior) = OPTIONAL];
  repeated string agents = 5 [(google.api.field_behavior) = OPTIONAL];
  repeated string profiles = 6 [(google.api.field_behavior) = OPTIONAL];
  repeated string tags = 7 [(google.api.field_behavior) = OPTIONAL];
  repeated string engines = 8 [(google.api.field_behavior) = OPTIONAL];
  // Only the direct children of these sessions (their harps).
  repeated string owners = 9 [(google.api.field_behavior) = OPTIONAL];
  // A session in scope whose log is carried (a one-session scope carries its
  // own log without this); none, no log.
  string log_session = 10 [(google.api.field_behavior) = OPTIONAL];
  // Carry the log of every session in view, not of one: a screen that moves
  // between sessions keeps one watch. Additive.
  bool all_logs = 11 [(google.api.field_behavior) = OPTIONAL];
}

// DRAFT: one line of `ctxloom top`'s stream, exactly one field set.
message TopEvent {
  oneof event {
    TopWaiting waiting = 1;
    TopSnapshot snapshot = 2;
    TopSessionChanged session_changed = 3;
    TopSessionRemoved session_removed = 4;
    TopApprovalAsked approval_asked = 5;
    TopApprovalSettled approval_settled = 6;
    TopLog log = 7;
  }
}

// Said by the client while no daemon is reached; the daemon never sends it.
message TopWaiting {
  string reason = 1;
}

// Every session in scope that matches, and every ask waiting under them.
message TopSnapshot {
  repeated Session sessions = 1;
  repeated Approval approvals = 2;
}

message TopSessionChanged {
  Session session = 1;
}

message TopSessionRemoved {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // It no longer matches the filter (it ended, say).
    LEFT_FILTER = 1;
    // The session was destroyed.
    DESTROYED = 2;
  }
  string name = 1;
  Reason reason = 2;
}

message TopApprovalAsked {
  Approval approval = 1;
}

// The approval with its `state` (`answered`, `expired`, `withdrawn`) and `option`.
message TopApprovalSettled {
  Approval approval = 1;
}

// One entry of a session's log: what `ctxloom top` shows beside the session's
// state and what `session transcript show` prints. ONE engine-neutral shape
// for what an engine's hooks observed (prompt, words, tool, turn end,
// compaction, clear, gap), what the daemon did to the session (lifecycle) and
// what asked of the user (ask), built by the read model from the session's
// events: nothing here is an engine's native shape, and none of the names that
// identify the session (its harp, id or engine) are in it: the log is one
// session's, already selected.
message LogEntry {
  // When the entry happened (its event's recorded instant).
  google.protobuf.Timestamp time = 1;
  // The entry's place in the list it came from, from 0: a transcript's
  // entries, or a session's whole log.
  uint64 seq = 2;
  oneof entry {
    LogPrompt prompt = 3;
    LogWords words = 4;
    LogTool tool = 5;
    LogTurnEnd turn_end = 6;
    LogCompaction compaction = 7;
    LogClear clear = 8;
    LogGap gap = 9;
    LogLifecycle lifecycle = 10;
    LogAsk ask = 11;
  }
  // The engine's own data for this entry that no common arm holds, as its
  // adapter attached it to the observation: keys namespaced by engine
  // (`<engine>.<name>`), values text. Empty for an engine that attached none
  // and for an entry the daemon made itself. Never read by a consumer that
  // does not know the key.
  map<string, string> extra = 15;
}

// The user submitted a prompt.
message LogPrompt {
  // The turn the prompt opens, as the engine named it; the key that places
  // the turn's words after it.
  string prompt_id = 1;
  string text = 2;
}

// One piece of the assistant's words. Pieces of one message are joined by
// `message_id` and `index` (one shared joiner, `session_index::conversation`).
message LogWords {
  string prompt_id = 1;
  string turn_id = 2;
  string message_id = 3;
  uint32 index = 4;
  // The message's last piece.
  bool is_final = 5;
  string text = 6;
}

// One tool call. Neither its input nor its result's body is recorded: the
// size and SHA-256 (lowercase hex) of each only, and the tool's name.
message LogTool {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    COMPLETED = 1;
    ERROR = 2;
  }
  string prompt_id = 1;
  string tool_use_id = 2;
  string name = 3;
  // The call's input is never in the entry (it can hold whole file contents):
  // its size and SHA-256 (lowercase hex) are, as the result's are.
  reserved 4;
  reserved "input";
  uint64 input_bytes = 8;
  string input_sha256 = 9;
  uint64 response_bytes = 5;
  string response_sha256 = 6;
  // How the call ended; absent when the engine does not say.
  optional Status status = 7;
}

// The assistant's turn ended. It carries no text: the words are LogWords.
message LogTurnEnd {
  string prompt_id = 1;
}

// The engine compacted its context. Of the summary, its size and SHA-256 only.
message LogCompaction {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    BEFORE = 1;
    AFTER = 2;
  }
  string prompt_id = 1;
  Phase phase = 2;
  // `manual` or `auto`; `unknown` when the engine named none.
  string trigger = 3;
  uint64 summary_bytes = 4;
  string summary_sha256 = 5;
}

// The engine started a new conversation within the session (`/clear`).
message LogClear {
  string native_session = 1;
  string trigger = 2;
}

// A fact the session's hook could not keep was dropped: one gap is one fact
// missing here.
message LogGap {
  // The dropped fact's key (its kind and the engine's ids, never its content).
  string dropped = 1;
  // `bound` (the hold was full) or `disk`.
  string why = 2;
  // The dropping hook's clock when it dropped the fact.
  google.protobuf.Timestamp dropped_at = 3;
}

// Something the daemon did to the session.
message LogLifecycle {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    STARTED = 1;
    REHOSTED = 2;
    RESTARTED = 3;
    RESUMED = 4;
    EXITED = 5;
    RESTART_OWED = 6;
    CLOSED = 7;
    REOPENED = 8;
    LAUNCH_FAILED = 9;
  }
  Kind kind = 1;
  // The run (incarnation) the entry is of; 0 where none (a close, a launch
  // that failed).
  uint32 run = 2;
  // Why: an exit's cause, a close's or reopening's cause, a failed launch's
  // reason. Empty for the rest.
  string cause = 3;
  // The engine a session started on (STARTED alone).
  string engine = 4;
}

// A permission ask of the session: asked, then settled.
message LogAsk {
  enum State {
    STATE_UNSPECIFIED = 0;
    ASKED = 1;
    ANSWERED = 2;
    EXPIRED = 3;
    WITHDRAWN = 4;
  }
  State state = 1;
  // The ask's name (`ask-<adjective>-<noun>`).
  string ask = 2;
  // ASKED: the tool asked about and an excerpt of its input.
  string tool = 3;
  string input_excerpt = 4;
  // ANSWERED: the option the user chose.
  string option = 5;
}

// One entry of the log of the session `session`, at `time`.
message TopLog {
  // The numbers and names of the fields this replaced (`kind`, `line`,
  // `event`, `text`: the transcript's JSON envelope as a string, and a
  // daemon entry's word and text) are never reused.
  reserved 3, 4, 5, 6;
  reserved "kind", "line", "event", "text";

  string session = 1;
  google.protobuf.Timestamp time = 2;
  LogEntry entry = 7;
}

// `session transcript watch <harp>`.
message WatchTranscriptRequest {
  // The Transcript to watch,
  // `projects/{project}/sessions/{session}/transcript`.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// One scratch checkout of a session, on its own branch for its agent.
message Worktree {
  option (google.api.resource) = {
    type: "ctxloom.dev/Worktree"
    pattern: "projects/{project}/sessions/{session}/worktrees/{worktree}"
    singular: "worktree"
    plural: "worktrees"
  };

  // `projects/{project}/sessions/{session}/worktrees/{worktree}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Its directory, under ctxloom's home.
  string path = 2;
  // Its branch, `ctxloom/<harp>/<agent>`.
  string branch = 3;
  // It holds work not committed.
  bool dirty = 4;
}

// `session worktrees <harp>`.
message ListWorktreesRequest {
  // The parent whose Worktree resources to list.
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).child_type = "ctxloom.dev/Worktree"];
  // The most results to answer in one page (AIP-158); 0 is the server's
  // choice. Every page is the whole list today.
  int32 page_size = 80 [(google.api.field_behavior) = OPTIONAL];
  // A previous response's `next_page_token`, to answer the page after it;
  // empty, the first page.
  string page_token = 81 [(google.api.field_behavior) = OPTIONAL];
}

// A session's scratch worktrees.
message ListWorktreesResponse {
  // The Worktree resources of this page.
  repeated Worktree worktrees = 1;
  // The token of the next page (AIP-158); empty on the last. Every page is
  // the whole list today, so it is always empty.
  string next_page_token = 80;
}

// A child's hand-off (`session launch`, the MCP server's `child_launch`),
// before its `LaunchChild`.
message CreateHandOffRequest {
  // `projects/{project}`.
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).child_type = "ctxloom.dev/HandOff"];
  // The child's stable id, minted by the client; `LaunchChild` names it.
  string hand_off_id = 2 [(google.api.field_behavior) = REQUIRED];
  // The owner session's harp in `parent`: a session nobody recorded is
  // refused (`sessions.SessionUnknown`), and nothing is written.
  string owner = 3 [(google.api.field_behavior) = REQUIRED];
  // The child's engine (empty: its agent's configured engine, which the
  // answer names).
  string engine = 4 [(google.api.field_behavior) = OPTIONAL];
  // The agent the child is planned for (empty: the project's default).
  string agent = 5 [(google.api.field_behavior) = OPTIONAL];
  // The project the child works in, `projects/{project}` (empty: `parent`,
  // the owner's; step 8, owner Q1). The CLI resolves `session launch
  // --project <dir>` through `ResolveProject` (cwd the directory) and names
  // the result; the MCP server resolves the `child_launch` tool's `project`,
  // a directory relative to the calling session's project root
  // (`CTXLOOM_ROOT`, Q-C), the same way. The child is planned on that
  // project's config (its agents, engines and project-only keys), runs in
  // its root, and is minted in it; its agent is looked up there. A project
  // the user has not trusted is refused (`sessions.UntrustedTarget`, D8),
  // and nothing is written.
  string project = 6 [(google.api.field_behavior) = OPTIONAL];
  // The client's id for this write (AIP-155), sent again unchanged on the one
  // retry (API Q13).
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
  // Moved into `caller` (owner, 2026-11-18).
  reserved 94;
  reserved "env";
  // The client's working context (needs.proto), as every request made on a
  // user's behalf carries it (owner, 2026-11-18).
  Caller caller = 98 [(google.api.field_behavior) = REQUIRED];
}

// A hand-off withdrawn, its `LaunchChild` refused.
message DeleteHandOffRequest {
  // `projects/{project}/handOffs/{child}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/HandOff"];
  // The client's id for this write (AIP-155), sent again unchanged on the one
  // retry (API Q13).
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
}

// The hand-off, by name only: its content never leaves the daemon.
message HandOff {
  option (google.api.resource) = {
    type: "ctxloom.dev/HandOff"
    pattern: "projects/{project}/handOffs/{hand_off}"
    singular: "handOff"
    plural: "handOffs"
  };

  // `projects/{project}/handOffs/{hand_off}`, `{hand_off}` the child's stable
  // id.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The engine the child is planned on: the one asked, else its agent's
  // configured engine (an agent naming none, the config's default engine).
  // What its `LaunchChild` names.
  string engine = 2;
  // The project the child works in, `projects/{project}`.
  string project = 3;
}

