version: "1.0.0"
description: "Local default coding profile scaffolded by `ctxloom init`: your project's primary heavy-implementer context. Inherits the ctxloom-default baseline (conduct + sequential-thinking) and developer practices. Edit it freely; the agents bound during setup (coordinator, containerized developer, cheap finder, ...) compose it — `ctxloom init prompt` re-enters that interview any time."
tags:
  - default
# A LOCAL profile (owned and editable in this project's .ctxloom), not a bare
# remote reference.
#
# The baseline-conduct parent was REMOVED with the `default` bundle it pointed
# at. Conduct is no longer SEEDED into every project as a fixed parent; it is
# offered by init's phase-3 survey as content carrying the `default` tag, which
# the user includes or declines like anything else. A tag is a recommendation
# the user answers; a seeded parent is a decision made on their behalf before
# they arrive.
parents:
  - ctxloom+git://github.com/ctxloom/ctxloom-default//bundles/ai-developer@branch:main#profiles/developer
