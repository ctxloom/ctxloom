syntax = "proto3";

// DRAFT for the owner's review (ruling 132, design-by-test), compiled by
// daemon-proto (its messages, each refusal's status, and the `Ctxloom`
// service's stubs). Served so far (slice 2 steps 5, 6): GetDaemon, StopDaemon,
// ResolveProject, GetProject, GetSession, ListSessions, SearchSessions, and
// in a `session-destroy` build DeleteSession and SweepSessions; every other
// method answers UNIMPLEMENTED.
//
// THE USER'S DAEMON'S API (T1-T30; the owner's API rulings Q1-Q13; rulings
// 146, 147). It MIRRORS THE COMMAND LINE (T22): the CLI's nouns are AIP
// resources (AIP-121, 122) and its verbs their standard methods (AIP-131
// Get, 132 List, 133 Create, 134 Update, 135 Delete) or custom methods
// (AIP-136). It is ONE service, `Ctxloom`, below.
//
// DOMAIN WRITES ARE NOT HERE (T16, S1 amended). A write to the store is a
// ctxloom command or fact proto sent through angzarr's own coordinator,
// `io.angzarr.transport.distributed.v1.CommandHandlerCoordinatorService`
// (`HandleSync` when the client renders the result, else `Handle`), never
// wrapped in a method here. Its id is the command id the client chose
// (`CommandPage.command_id`), so the one retry on a respawned daemon (S8)
// is a DUPLICATE. S21 and S41 (owner, reconciled): this service's messages
// carry the client's INTENT only, never evidence; a domain command sent
// through `Handle` keeps its evidence fields, which the daemon's gate
// STAMPS on admission, overwriting whatever the client put there.
//
//   the CLI verb                          the command               HandleSync waits for
//   session rename <harp> <title>         sessions.SetSessionTitle  session-index
//                                         (new with the rework: harps are
//                                         permanent, S42; RenameSession goes)
//   session keep <harp> [--undo]          sessions.SetKept          session-index
//   session send <harp> <urgency> <text>  sessions.SendMessage      pending-messages
//   session clear <harp>                  sessions.ClearChild       session-index
//   session close <harp>                  sessions.CloseSession     session-index
//   session stop <harp>                   sessions.StopSession      session-index
//   session launch <owner> ...            sessions.LaunchChild      session-index
//                                         (after CreateHandOff)
//   session approvals answer <ask> <d>    approvals.AnswerApproval  pending-approvals
//   trust [--remote <name>]               trust.GrantTrust          trust-index
//   trust --undo                          trust.RevokeTrust         trust-index
//   a one-shot's signal (API Q11)         runs.RequestStop          (Handle)
//   the frontend's TUI start and exit     runs.RunnerStarted,       (Handle, facts)
//                                         RunExited, LaunchFailed
//   a hook                                the capture facts         (Handle, facts)
//   the daemon, hosting a child's ask     approvals.RecordApprovalAsked (Handle, fact)
// A remove is a sequence the daemon runs (`DeleteSession` below: its
// worktrees, then its streams purged, then its directory and lock; T28's
// trash step is not built), as `bundle import --force` is to be (the old
// bundle to trash, then the new one in; S52). A
// `HandleSync` projection IS the resource message the matching `Get` returns
// (one renderer per resource).
//
// WHAT GOES WITH THEM (T16): the frontend follows its session with angzarr's
// `EventStreamService.Subscribe` and holds the session lock; liveness is
// `grpc.health.v1.Health`. There is no hold stream and no routing: one
// per-user store (T14), so a stream reference is its root alone.
//
// CREDENTIALS (T15, the separation model of slice 2). One principal, the
// user. One TCP+TLS listener, its certificate the discovery file's; every
// caller (the CLI, a hook, the MCP server) presents the USER bearer and pins
// the certificate. The bearer and the pinned certificate keep non-user
// callers off the socket (other users, web pages, containers, machines);
// nothing separates the user's own processes, which can all read the
// discovery file. A command addresses its target session once, as its
// Cover's root, and names its `requester` in a field of its own, set by the
// client and taken as sent (an address, never an identity). No run is sent,
// and the daemon checks no session against a run.
//
// THE AIP FIELDS, AT FIXED NUMBERS IN EVERY REQUEST (API Q13):
//   1        `name` (or `parent`)
//   2..79    the resource's own fields
//   80, 81   `page_size`, `page_token` (AIP-158; every List); 80
//            `next_page_token` in every List response
//   90       `request_id` (AIP-155; every write): the client's id, sent
//            again unchanged on the one retry; a retry that already
//            applied returns the first response
//   91       `etag` (AIP-154; every confirmed write): what the preview was
//            planned against; stale is `PlanStale`
//   92       `validate_only` (AIP-163; every write): the preview, returning
//            the `needs` (needs.proto) the apply then answers
//   93       `answers`
//   94       `env`: the caller's WHOLE environment, where the call needs it
//            (S7), held in memory for the call's life
//   95       `presentable`
//   96       `globals` (--degraded, --config-set, --no-companions)
// and in every write response: 90 `needs`, 91 `etag`, 92 `notices`.
//
// JSON (ruling 146): `--format json` prints the response message's proto3
// JSON, snake_case field names (`preserving_proto_field_names`).
//
// LINT (ruling 147; S36, S37 owner): googleapis' annotation and
// longrunning protos are vendored into `proto/third_party/google/...`
// (pinned, Apache-2.0) and api-linter gates these drafts, both at
// implementation.
// TODO(S36): until the vendored protos land, resource patterns are COMMENTS
// (`// <pattern>` beside each resource), not `google.api.resource`
// annotations, and fields carry no `google.api.field_behavior`; the only
// local copies are tool caches with no pinned upstream commit.
// Departures, each a commented exception at its site once the linter
// gates: write responses carry `needs` (AIP-163 returns the would-be
// response alone; needs are ctxloom's, API Q2, S38); `WatchTranscript` and
// `WatchRun` are daemon-folded streams (S44).
//
// NAMES (S42, owner): user-addressable things are HARPS, minted once and
// never changed. A project is `projects/{project}` by ITS harp; a session
// `projects/{project}/sessions/{session}`, six words. The project id and a
// session's stream root are fields (`uid`).
//
// EXIT CODES (rulings 149, 152, 153): 0 ok (an apply or a preview); 1 a
// preview that would change something, only with `--detailed-exitcode`; 10
// failed; 20 refused (usage errors included); 21 fatal findings; 128+n a
// signal.
//
// REFUSALS (S11): a refused method is answered with the gRPC status its
// refusal message's `(refusal_status)` declares, the message packed in
// `google.rpc.Status.details`.
package ctxloom.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/options.proto";
import "ctxloom/v1/launch.proto";
import "ctxloom/v1/library.proto";
import "ctxloom/v1/needs.proto";

service Ctxloom {
  // region daemon: `daemon` (a singleton, AIP-156). With none serving, the
  // client answers `daemon status|stop` itself (S14).
  rpc GetDaemon(GetDaemonRequest) returns (Daemon);
  // `daemon stop`: refused `DaemonHosting` while it hosts live runs, unless
  // `even_if_live`, which ends the hosted engines cleanly first (S12).
  rpc StopDaemon(StopDaemonRequest) returns (Daemon);
  // endregion

  // region projects: `projects/{project}` (the project's harp)
  // The project of a directory (S6): names only, never routing (T14).
  rpc ResolveProject(ResolveProjectRequest) returns (Project);
  rpc GetProject(GetProjectRequest) returns (Project);
  // `init` (API Q7): the preview's need asks `output.dir`; the apply returns
  // a continuation (the setup session's launch, then the restart offer's
  // request to preview when it ends).
  rpc InitProject(InitProjectRequest) returns (InitProjectResponse);
  // `context assemble`: the context a run would get (T30: each distilled
  // form's digest checked at this use).
  rpc AssembleContext(AssembleContextRequest) returns (AssembledContext);
  // endregion

  // region sessions: `projects/{project}/sessions/{session}` (both harps);
  // `projects/-/sessions` lists every project's (`--all`, AIP-159)
  rpc GetSession(GetSessionRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc SearchSessions(SearchSessionsRequest) returns (ListSessionsResponse);
  // `session remove`: its worktrees classified, the whole refused (with its
  // plan) if one is unsafe, else the worktrees removed, then the destroy.
  // Served only in a `session-destroy` build (M5).
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  // `session sweep`: each session by the fixed table, its purges through
  // the same removal as `DeleteSession`. A `session-destroy` build's (M5).
  rpc SweepSessions(SweepSessionsRequest) returns (SweepSessionsResponse);
  // `session transcript show`; `transcript list` is `ListSessions` with
  // `has_transcript`.
  rpc GetTranscript(GetTranscriptRequest) returns (Transcript);
  // `session transcript watch`: its lines as they are delivered.
  rpc WatchTranscript(WatchTranscriptRequest) returns (stream TranscriptLine);
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse);
  // A child's hand-off (T6, S10): `projects/{project}/handOffs/{child}`,
  // created before `LaunchChild`.
  rpc CreateHandOff(CreateHandOffRequest) returns (HandOff);
  // endregion

  // region runs: `projects/{project}/runs/{run}`
  // `run --dry-run` is `validate_only`; `run --one-shot` creates a hosted
  // run (then `WatchRun`); `run` creates a TERMINAL run, whose `Run` holds
  // the `Launch` the frontend starts.
  rpc CreateRun(CreateRunRequest) returns (Run);
  rpc GetRun(GetRunRequest) returns (Run);
  // A one-shot's notices, reply and end.
  rpc WatchRun(WatchRunRequest) returns (stream RunEvent);
  // endregion

  // region approvals: `projects/{project}/approvals/{approval}`
  rpc GetApproval(GetApprovalRequest) returns (Approval);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  // ctxloom's MCP approval tool waits here (S27): answered once settled.
  rpc WaitApproval(WaitApprovalRequest) returns (Approval);
  // endregion

  // region trusts: `trusts/{trust}` (`project-{project}`, `remote-{id}`)
  // The preview of `trust`: what it allows, and the etag `GrantTrust` names.
  rpc GetTrust(GetTrustRequest) returns (Trust);
  rpc ListTrusts(ListTrustsRequest) returns (ListTrustsResponse);
  // endregion

  // THE LIBRARY (OD-40; its messages are library.proto's, which documents
  // the resource tree, the ID grammar and the conventions). Every write
  // answers a response of its own (OQ-9).

  // region bundles: `projects/{project}/bundles/{bundle}` and the other
  // Bundle patterns (origin is in the name, OQ-4)
  rpc GetBundle(GetBundleRequest) returns (Bundle);
  rpc ListBundles(ListBundlesRequest) returns (ListBundlesResponse);
  rpc CreateBundle(CreateBundleRequest) returns (CreateBundleResponse);
  // `bundle edit`: ONE change per call (T29): `update_mask` names one path.
  rpc UpdateBundle(UpdateBundleRequest) returns (UpdateBundleResponse);
  rpc DeleteBundle(DeleteBundleRequest) returns (DeleteBundleResponse);
  rpc ExportBundle(ExportBundleRequest) returns (ExportBundleResponse);
  rpc ImportBundle(ImportBundleRequest) returns (ImportBundleResponse);
  rpc MoveBundle(MoveBundleRequest) returns (MoveBundleResponse);
  // endregion

  // region fragments and commands: a Bundle + `/fragments/{fragment}`,
  // `/commands/{command}`
  rpc GetFragment(GetFragmentRequest) returns (Fragment);
  rpc ListFragments(ListFragmentsRequest) returns (ListFragmentsResponse);
  rpc CreateFragment(CreateFragmentRequest) returns (CreateFragmentResponse);
  // `fragment edit`: writes the `.md` alone (T30); with no fields, the
  // preview's need is an `Edit` of the document.
  rpc UpdateFragment(UpdateFragmentRequest) returns (UpdateFragmentResponse);
  rpc DeleteFragment(DeleteFragmentRequest) returns (DeleteFragmentResponse);
  // `fragment distill`: the `.distilled.md` alone, recording the source's
  // digest (T30); `clear` removes it.
  rpc DistillFragment(DistillFragmentRequest) returns (DistillFragmentResponse);
  rpc DraftFragmentPremise(DraftFragmentPremiseRequest) returns (DraftFragmentPremiseResponse);
  // `fragment premises`: `projects/{project}/premiseIndex` (a singleton).
  rpc GetPremiseIndex(GetPremiseIndexRequest) returns (PremiseIndex);
  rpc GetCommand(GetCommandRequest) returns (Command);
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  rpc CreateCommand(CreateCommandRequest) returns (CreateCommandResponse);
  rpc UpdateCommand(UpdateCommandRequest) returns (UpdateCommandResponse);
  rpc DeleteCommand(DeleteCommandRequest) returns (DeleteCommandResponse);
  rpc DistillCommand(DistillCommandRequest) returns (DistillCommandResponse);
  // endregion

  // region skills: a Bundle + `/skills/{skill}`
  rpc GetSkill(GetSkillRequest) returns (Skill);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc CreateSkill(CreateSkillRequest) returns (CreateSkillResponse);
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse);
  rpc ExportSkill(ExportSkillRequest) returns (ExportSkillResponse);
  rpc ImportSkill(ImportSkillRequest) returns (ImportSkillResponse);
  // endregion

  // region MCP servers: a Bundle + `/mcpServers/{mcp_server}`
  rpc GetMcpServer(GetMcpServerRequest) returns (McpServer);
  rpc ListMcpServers(ListMcpServersRequest) returns (ListMcpServersResponse);
  // `mcp server set|edit` (`allow_missing`: create-on-update, AIP-134).
  rpc UpdateMcpServer(UpdateMcpServerRequest) returns (UpdateMcpServerResponse);
  // endregion

  // region profiles: a Bundle + `/profiles/{profile}`
  rpc GetProfile(GetProfileRequest) returns (Profile);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
  rpc ExportProfile(ExportProfileRequest) returns (ExportProfileResponse);
  rpc ImportProfile(ImportProfileRequest) returns (ImportProfileResponse);
  // endregion

  // region agents: `projects/{project}/agents/{agent}`, `users/me/agents/{agent}`
  rpc GetAgent(GetAgentRequest) returns (Agent);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  rpc SetDefaultAgent(SetDefaultAgentRequest) returns (SetDefaultAgentResponse);
  // endregion

  // region engines: `projects/{project}/engines/{engine}` (read-only)
  rpc GetEngine(GetEngineRequest) returns (Engine);
  rpc ListEngines(ListEnginesRequest) returns (ListEnginesResponse);
  // endregion

  // region companions: `projects/{project}/companions/{companion}`
  rpc ListCompanions(ListCompanionsRequest) returns (ListCompanionsResponse);
  rpc CreateCompanion(CreateCompanionRequest) returns (CreateCompanionResponse);
  rpc DeleteCompanion(DeleteCompanionRequest) returns (DeleteCompanionResponse);
  // endregion

  // region remotes: `projects/{project}/remotes/{remote}`
  rpc GetRemote(GetRemoteRequest) returns (Remote);
  rpc ListRemotes(ListRemotesRequest) returns (ListRemotesResponse);
  rpc CreateRemote(CreateRemoteRequest) returns (CreateRemoteResponse);
  rpc UpdateRemote(UpdateRemoteRequest) returns (UpdateRemoteResponse);
  rpc DeleteRemote(DeleteRemoteRequest) returns (DeleteRemoteResponse);
  rpc SetDefaultRemote(SetDefaultRemoteRequest) returns (SetDefaultRemoteResponse);
  // endregion

  // region dependencies: `projects/{project}/dependencies/{dependency}`
  rpc ListDependencies(ListDependenciesRequest) returns (ListDependenciesResponse);
  // AIP-136: a resource-based custom method answers the resource.
  rpc HoldDependency(HoldDependencyRequest) returns (Dependency);
  rpc ReleaseDependency(ReleaseDependencyRequest) returns (Dependency);
  // endregion

  // region config: `projects/{project}/config`, `users/me/config` (singletons)
  rpc GetConfig(GetConfigRequest) returns (Config);
  // `config set`: one key per call (T29).
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  // `config create` (AIP-156 forbids Create on a singleton).
  rpc ScaffoldConfig(ScaffoldConfigRequest) returns (ScaffoldConfigResponse);
  // endregion

  // `search`: `projects/{project}:searchLibrary` (AIP-136, stateless).
  rpc SearchLibrary(SearchLibraryRequest) returns (SearchLibraryResponse);

  // The rest of the CLI, drafted with the milestone that ports each, by
  // these rules (S33): hooks; remotes' BrowseRemote, DiscoverRemotes;
  // dependencies' PullDependencies, UpgradeDependencies, CheckDependencies,
  // ExplainDependency (B4's, their shapes on a ruling: library.proto's
  // closing note); companions' Enable, Disable (M4); PushBundle (T26
  // sequences; its response B4's); InstallManage, UninstallManage, CheckManage;
  // Materialize (T26, its record written first); Clean; RunDoctor;
  // GetAuthStatus; containers (Build and Prune as streaming custom
  // methods, Scaffold, Check); SearchLibrary; GetLoadout.
}

// region shared

// `EnvVars` (the caller's environment, S7) and `Globals` (the global flags)
// are needs.proto's, beside the other request plumbing, so library.proto
// can carry them without importing this file.

// endregion

// region daemon

message GetDaemonRequest {
  // `daemon`.
  string name = 1;
  EnvVars env = 94;
}

enum RunKind {
  RUN_KIND_UNSPECIFIED = 0;
  RUN_KIND_TERMINAL = 1;
  RUN_KIND_ONE_SHOT = 2;
  RUN_KIND_CHILD = 3;
}

message HostedRun {
  // `projects/{project}/sessions/{session}`.
  string session = 1;
  string harp = 2;
  // `projects/{project}/runs/{run}`.
  string run = 3;
  RunKind kind = 4;
}

// The daemon (a singleton). Never its bearer.
message Daemon {
  string name = 1;
  uint32 pid = 2;
  string endpoint = 3;
  google.protobuf.Timestamp start_time = 4;
  string version = 5;
  repeated HostedRun runs = 6;
  uint32 clients = 7;
  uint64 idle_seconds = 8;
  uint64 idle_limit_seconds = 9;
}

message StopDaemonRequest {
  string name = 1;
  bool even_if_live = 2;
  string request_id = 90;
  EnvVars env = 94;
}

// endregion

// region projects

// Register-or-recheck (owner, 2026-11-12, project registration): every
// daemon client calls it first, with what IT resolved of its working
// directory (S6): the project id (taskloom's project-registry identity, so a
// worktree is its primary checkout's project), the root, the repository's
// git common directory and its root commit (`git rev-list --max-parents=0
// HEAD`; of several, the lexically least). The first call names the project
// (its harp minted, S54) and records the rest in the `projects` aggregate;
// every later one recomputes and compares: a changed root commit is refused
// `ctxloom.sessions.v1.ProjectIdentityChanged`, a `name` that is not the
// registered project's `ProjectHarpMismatch`, each naming the registered
// project. Outside git the two VCS fields are empty (an empty identity).
message ResolveProjectRequest {
  // `projects/{project}` the client expects (its session's), or empty.
  string name = 1;
  string cwd = 2;
  string project_id = 3;
  string root = 4;
  string git_common_dir = 5;
  string root_commit = 6;
  EnvVars env = 94;
}

message Project {
  // `projects/{project}`, the project's permanent harp (S42).
  string name = 1;
  // The root it was first registered from.
  string root = 2;
  // The project id (the store's, and a session's claim namespace).
  string uid = 3;
  // Its registered VCS identity (empty outside git).
  string git_common_dir = 4;
  string root_commit = 5;
}

message GetProjectRequest {
  string name = 1;
}

message InitProjectRequest {
  string name = 1;
  string cwd = 2;
  string request_id = 90;
  string etag = 91;
  bool validate_only = 92;
  repeated Answer answers = 93;
  EnvVars env = 94;
  Presentable presentable = 95;
  Globals globals = 96;
}

// What a client does next, decided by the daemon (API Q7).
message Continuation {
  // Start this on the terminal (the setup session), and wait for it.
  Launch launch = 1;
  // Then preview this.
  InitProjectRequest next = 2;
}

message InitProjectResponse {
  repeated string written = 1;
  Continuation then = 2;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

message AssembleContextRequest {
  string name = 1;
  string agent = 2;
  repeated string profiles = 3;
  EnvVars env = 94;
  Globals globals = 96;
}

// One fragment as the assembly used it.
message AssembledFragment {
  // `projects/{project}/bundles/{bundle}/fragments/{fragment}`.
  string fragment = 1;
  // `distilled` (its digest matched) or `original`.
  string form = 2;
}

message AssembledContext {
  string context = 1;
  uint64 tokens = 2;
  repeated AssembledFragment fragments = 3;
  // `stale-distilled` for each distilled form whose digest did not match.
  repeated Notice notices = 92;
}

// endregion

// region sessions

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_LIVE = 1;
  SESSION_STATE_ENDED = 2;
  SESSION_STATE_UNKNOWN = 3;
}

message PendingMessage {
  string message_id = 1;
  string urgency = 2;
  string text = 3;
  // A sender session's resource name; absent, the user.
  string sender = 4;
}

// A session (the session index's record).
message Session {
  // `projects/{project}/sessions/{session}`.
  string name = 1;
  // The stream root (UUID text), what a command's cover names.
  string uid = 2;
  SessionState state = 3;
  string engine = 4;
  string summary = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
  bool kept = 8;
  // The owner session's resource name.
  string owner = 9;
  bool closed = 10;
  repeated string children = 11;
  repeated PendingMessage pending = 12;
  uint32 incarnation = 13;
  string etag = 14;
  // The free-text title `session rename` sets (S42); the harp never changes.
  string title = 15;
  // The engine's own session id, once bound.
  string native_session = 16;
  // The session's project directory.
  string project_root = 17;
  // Where its outputs go (`<project>/<output.dir>/<harp>`).
  string output_dir = 18;
  // Each engine session it was bound to before its native one (a /clear).
  repeated SessionRotation rotations = 19;
}

// A native session a session was bound to before (its binding rotated).
message SessionRotation {
  string native_id = 1;
  string transcript_path = 2;
  google.protobuf.Timestamp rotated_at = 3;
}

message GetSessionRequest {
  string name = 1;
  EnvVars env = 94;
}

message ListSessionsRequest {
  // `projects/{project}`, or `projects/-` for every project.
  string parent = 1;
  SessionState state = 2;
  bool has_transcript = 3;
  int32 page_size = 80;
  string page_token = 81;
  EnvVars env = 94;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 80;
}

message SearchSessionsRequest {
  string parent = 1;
  repeated string words = 2;
  SessionState state = 3;
  int32 page_size = 80;
  string page_token = 81;
  EnvVars env = 94;
}

message DeleteSessionRequest {
  // One session (`session remove <harp>`); the age form is `SweepSessions`.
  string name = 1;
  // Destroy a session whose lock does not prove it ended (`--even-if-live`):
  // the daemon judges by the session's lock. It reaches no worktree.
  bool even_if_live = 2;
  string request_id = 90;
  string etag = 91;
  // The preview (`session remove` without `--yes`): the plan, applied
  // nowhere.
  bool validate_only = 92;
  repeated Answer answers = 93;
  // The caller's environment (S7): git runs in it for the worktrees.
  EnvVars env = 94;
  Presentable presentable = 95;
}

// What a file of a session's directory is to a removal: both classes are
// destroyed, and the plan names which is which.
enum FileClass {
  FILE_CLASS_UNSPECIFIED = 0;
  // The machine-written conversation (`transcripts/`, `native/`).
  FILE_CLASS_MACHINE = 1;
  // Anything else: a person wrote it, and it goes with the session.
  FILE_CLASS_AUTHORED = 2;
}

// One file a removal destroys.
message RemovalFile {
  string path = 1;
  // Relative to the session's directory.
  string rel = 2;
  FileClass class = 3;
  uint64 bytes = 4;
}

// One scratch worktree a removal or a sweep reached (`session worktrees`'s
// row): its owner by the session's lock, and its verdict.
message ScratchWorktree {
  string harp = 1;
  string worktree = 2;
  string path = 3;
  // `alive`, `dead` or `indeterminate`.
  string owner_state = 4;
  // `reapable`, `reaped`, `spared` or `skipped`.
  string verdict = 5;
  string reason = 6;
}

// A session's scratch worktrees, classified, and with an apply removed.
message WorktreeReport {
  repeated ScratchWorktree worktrees = 1;
  uint64 reaped = 2;
  uint64 spared = 3;
  uint64 skipped = 4;
  bool applied = 5;
}

message DeleteSessionResponse {
  string name = 1;
  // The files a person wrote that the removal destroys (the notice).
  repeated string authored = 2;
  // The session's harp.
  string harp = 3;
  // Whether the session was destroyed (false: the plan, or refused).
  bool applied = 4;
  // Every file of the session's directory, destroyed with it.
  repeated RemovalFile files = 5;
  // The bytes freed: zero on a plan.
  uint64 bytes_freed = 6;
  // How many events of it and of its runs went from the store.
  uint64 events_destroyed = 7;
  // Its scratch worktrees, when it has any.
  WorktreeReport worktrees = 8;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

message SweepSessionsRequest {
  // `projects/{project}`, or `projects/-` for every project's sessions.
  string parent = 1;
  // `--purge-older-than`: an age (`90d`) or a date; none, the configured
  // `session_purge_age` of `project`.
  string older_than = 2;
  // The caller's project (`projects/{project}`): whose configuration (read
  // from its registered root) gives the purge age.
  string project = 3;
  string request_id = 90;
  string etag = 91;
  // The report alone (`session sweep` without `--yes`).
  bool validate_only = 92;
  repeated Answer answers = 93;
  EnvVars env = 94;
  Presentable presentable = 95;
}

// One row of a sweep: a session's fate, or one of its scratch worktrees'.
message SweepRow {
  string harp = 1;
  // `skip`, `keep`, `spare`, `purge` or `worktree`.
  string action = 2;
  // `done`, `planned`, `held`, `left`, `skipped` or `failed`.
  string verdict = 3;
  string reason = 4;
  // The command that does what the row could not, or will.
  string command = 5;
  uint64 bytes = 6;
  // The files a person wrote that the row's destroy takes.
  repeated string authored = 7;
}

// How many rows of each verdict.
message SweepCounts {
  uint64 done = 1;
  uint64 planned = 2;
  uint64 held = 3;
  uint64 left = 4;
  uint64 skipped = 5;
  uint64 failed = 6;
}

message SweepSessionsResponse {
  // Each removal the sweep planned or applied, its file plan whole.
  repeated DeleteSessionResponse sessions = 1;
  repeated SweepRow rows = 2;
  // When purging begins, as a date; empty when purges are held.
  string purge_cutoff = 3;
  SweepCounts counts = 4;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

message GetTranscriptRequest {
  // `projects/{project}/sessions/{session}/transcript`.
  string name = 1;
}

// One D27 line, as its JSON envelope.
message TranscriptLine {
  string json = 1;
}

message Transcript {
  string name = 1;
  repeated TranscriptLine lines = 2;
}

message WatchTranscriptRequest {
  string name = 1;
}

message Worktree {
  // `projects/{project}/sessions/{session}/worktrees/{worktree}`.
  string name = 1;
  string path = 2;
  string branch = 3;
  bool dirty = 4;
}

message ListWorktreesRequest {
  string parent = 1;
  int32 page_size = 80;
  string page_token = 81;
}

message ListWorktreesResponse {
  repeated Worktree worktrees = 1;
  string next_page_token = 80;
}

message CreateHandOffRequest {
  // `projects/{project}`.
  string parent = 1;
  // The child's stable id, minted by the client; `LaunchChild` names it.
  string hand_off_id = 2;
  string request_id = 90;
  // The child's environment (S7, S10).
  EnvVars env = 94;
}

// The hand-off, by name only: its content never leaves the daemon.
message HandOff {
  string name = 1;
}

// endregion

// region runs

enum RunMode {
  RUN_MODE_UNSPECIFIED = 0;
  RUN_MODE_ONE_SHOT = 1;
  RUN_MODE_TERMINAL = 2;
}

message Finding {
  string kind = 1;
  string text = 2;
  string remedy = 3;
  bool fatal = 4;
}

message Setting {
  string path = 1;
  string value = 2;
  string source = 3;
}

// A run: its plan, and once created its session and (TERMINAL) its launch.
message Run {
  // `projects/{project}/runs/{run}`.
  string name = 1;
  RunMode mode = 2;
  // `projects/{project}/sessions/{session}`.
  string session = 3;
  string agent = 4;
  string engine = 5;
  repeated string profiles = 6;
  string context = 7;
  uint64 tokens = 8;
  repeated Finding findings = 9;
  repeated Setting settings = 10;
  // TERMINAL only: what the frontend starts.
  Launch launch = 11;
  // The runner bearer (deleted, slice 2: one principal, the user).
  reserved 12;
  reserved "runner_bearer";
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

message CreateRunRequest {
  string parent = 1;
  RunMode mode = 2;
  string prompt = 3;
  string agent = 4;
  string engine = 5;
  repeated string profiles = 6;
  // `run --session <harp>`: resume.
  string session = 7;
  string request_id = 90;
  bool validate_only = 92;
  repeated Answer answers = 93;
  EnvVars env = 94;
  Presentable presentable = 95;
  Globals globals = 96;
}

message GetRunRequest {
  string name = 1;
}

message WatchRunRequest {
  string name = 1;
}

// A one-shot's end. Stopped by `RequestStop`: exit 128 plus the signal's
// number, `run-application-stopped`.
message RunEnd {
  int32 exit = 1;
  string code = 2;
  repeated NeedArg args = 3;
  string text = 4;
}

message RunEvent {
  oneof event {
    Notice notice = 1;
    string reply = 2;
    RunEnd end = 3;
  }
}

// endregion

// region approvals

// A child's permission ask (approvals/v1/approvals.proto's state).
message Approval {
  // `projects/{project}/approvals/{approval}`.
  string name = 1;
  // The asking child's and its root's session resource names.
  string child = 2;
  string root = 3;
  string engine = 4;
  string tool_name = 5;
  string input_excerpt = 6;
  google.protobuf.Timestamp ask_time = 7;
  google.protobuf.Timestamp expire_time = 8;
  // Empty while it waits; `allow`, `deny` or `expired`.
  string decision = 9;
  string message = 10;
}

message GetApprovalRequest {
  string name = 1;
}

message ListApprovalsRequest {
  string parent = 1;
  // Only those under this root session's tree.
  string root = 2;
  bool waiting = 3;
  int32 page_size = 80;
  string page_token = 81;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
  string next_page_token = 80;
}

message WaitApprovalRequest {
  string name = 1;
}

// endregion

// region trusts

message TrustSetting {
  string path = 1;
  string value = 2;
}

// A trust: a project's or a remote's, until revoked (S23).
message Trust {
  // `trusts/project-{project}` (the project's harp) or `trusts/remote-{id}`.
  string name = 1;
  bool trusted = 2;
  // What it allows (the project-only settings, a `ctxloom` bundle).
  repeated TrustSetting settings = 3;
  string actor = 4;
  google.protobuf.Timestamp grant_time = 5;
  // What `GrantTrust` names (API Q5).
  string etag = 6;
}

message GetTrustRequest {
  string name = 1;
}

message ListTrustsRequest {
  int32 page_size = 80;
  string page_token = 81;
}

message ListTrustsResponse {
  repeated Trust trusts = 1;
  string next_page_token = 80;
}

// endregion

// region refusals

// The etag no longer matches what the preview was planned against (API Q5).
// OQ-10 (owner, 2026-11-13) rules it ABORTED (AIP-154, 134, 135), but
// angzarr core's `RefusalStatus` (f6fed5e5's io/angzarr/v1/options.proto)
// has no ABORTED value to declare, so it stays FAILED_PRECONDITION until
// angzarr adds one (escalated; nothing serves it before T13).
message PlanStale {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  string seen = 1;
  string now = 2;
}

// An apply that does not answer every need of its preview.
message NeedsUnanswered {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  repeated string need_ids = 1;
}

// An edit that names more than one change (T29).
message OneChangePerCall {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;

  repeated string paths = 1;
}

// The directory is in no ctxloom project.
message ProjectUnknown {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;

  string cwd = 1;
}

// A per-project store from before the one store (T17): refused, its fix
// naming the file to remove; nothing is imported.
message PerProjectStore {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  string path = 1;
}

// A child whose hand-off is missing cannot be started again.
message HandOffMissing {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  string harp = 1;
}

// A resource name that is not one (`projects/{p}` or
// `projects/{p}/sessions/{s}`, each segment a harp); `reason` is `shape`
// or the harp grammar's.
message NameInvalid {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;

  string name = 1;
  string reason = 2;
}

// A session's resource name no session holds.
message SessionNotFound {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;

  string name = 1;
}

// A project's resource name no project holds.
message ProjectNotFound {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;

  string name = 1;
}

// `StopDaemon` while it hosts live runs (S12), unless `even_if_live`: how
// many, and their sessions' harps.
message DaemonHosting {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  uint64 runs = 1;
  repeated string harps = 2;
}

// Why a removal was refused.
enum RemovalRefusal {
  REMOVAL_REFUSAL_UNSPECIFIED = 0;
  // Its lock does not prove it ended (held, or none), without
  // `even_if_live`; `detail` says which.
  REMOVAL_REFUSAL_NOT_PROVEN_DEAD = 1;
  // It is marked keep.
  REMOVAL_REFUSAL_KEPT = 2;
  // It ended within the transcript retention; `detail` says when.
  REMOVAL_REFUSAL_RETAINED = 3;
  // A scratch worktree of it is spared or skipped: a session is removed
  // whole or not at all.
  REMOVAL_REFUSAL_WORKTREES_KEEP = 4;
}

// `DeleteSession` refused: nothing was removed. It carries the PLAN (owner,
// 2026-11-12): every file the removal would have destroyed, its class and
// bytes, the authored ones, and the worktrees, so a refused removal says
// what it did not do.
message RemovalRefused {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  string name = 1;
  RemovalRefusal reason = 2;
  string detail = 3;
  DeleteSessionResponse plan = 4;
  // A worktree refusal's counts.
  uint64 spared = 5;
  uint64 skipped = 6;
}

// A configured age (`session_purge_age`, `session_transcript_retention`)
// that is neither an age nor a date.
message AgeInvalid {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;

  string key = 1;
  string value = 2;
}

// A project's configuration, read from its registered root, that does not
// read.
message ConfigUnreadable {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  string root = 1;
  string detail = 2;
}

// A registration's recheck is refused with the projects aggregate's own
// typed refusals (`ctxloom.sessions.v1.ProjectIdentityChanged`,
// `ProjectHarpMismatch`), answered as every refusal is (S11).

// endregion
