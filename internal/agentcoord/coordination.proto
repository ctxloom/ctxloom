// coordination.proto — agentcoord.v1 (rev 12 — plane-2 Stage 2a)
//
// Changelog rev 11 -> rev 12 (pre-release; ONE SANCTIONED BREAK, see below):
//   - 4.B: mail `kind` becomes the MessageKind ENUM, carried by
//     PeerSendRequest.kind (7) and PeerMessage.kind (8). The
//     `structured["kind"]` free-string convention is RETIRED — that string was
//     the injection vector (a sender could name the coordinator-reserved
//     `approval_request` and have it interpolated into a delivered frame). An
//     enum validates at DECODE, renders as a name from a closed set, and is
//     attribute-eligible by construction. This BREAKS `agent_recv`'s output
//     shape: `kind` moves out of `structured` and onto the message. A
//     deliberate prerelease break, human-sanctioned, per the
//     no-backward-compat-shims rule.
//   - 4.C: presentation-only reminder messages (MailPendingReminder,
//     SteerPendingReminder, UnpulledReminder, QuestionPendingReminder,
//     PausedReminder, ResumedReminder). NEVER WIRE TRAFFIC: they exist to be
//     rendered into
//     injected `<ctxloom-reminder>` frames by their GENERATED `.XmlLike()`
//     encoders (annotations.proto's XmlRole). No RPC, oneof, or field
//     anywhere carries one.
//   - 4.E: ControlInitiatorKind — the closed HUMAN/AGENT privilege
//     discriminator for control verbs, journaled into durable facts.
//   - Comment-only: SteerResult.APPLIED_IMMEDIATE no longer claims "injected
//     into the current turn". It means IDLE TARGET, NEW
//     TURN NOW; no engine surface supports genuine mid-turn injection.
//
// Changelog rev 10 -> rev 11 (pre-release, additive):
//   - F1: ListRunsResult.RunInfo gains permission_mode
//     and mcp_servers so the roster — a real operator's ONLY black-box view
//     of a live delegation — can audit the central delegation security
//     claim ("a child only ever gets its own tools"), which until now was
//     provable solely by an in-process Go unit test. Both are resolved once
//     at enqueue (facts.go's runEnqueued.Permission/MCPServers) for the same
//     reason Ladder already is (rev 9's D1/D5 note below): a later config
//     edit must not retroactively change what a live run's privileges were.
//     mcp_servers is NAMES ONLY — never command/args/env, which can carry a
//     secret (mirrors cred_hash: this journal records identity, never the
//     credential). Additive; empty/absent on any run journaled before this
//     revision.
//
// Changelog rev 9 -> rev 10 (pre-release, additive):
//   - E1a: the deferred artifact-transfer surface (UploadArtifact/
//     DownloadArtifact + their messages) lands on a NEW, separate
//     ArtifactTransferService in artifacts.proto (same package) — see that
//     file's header for the reserved-slot reconciliation and the rev-5
//     sketch deviations. No field renumbering here; AgentRequest/
//     CoordinatorResponse slot 15 (artifact_lookup) and CoordinatorRequest/
//     AgentResponse slot 12 (state_snapshot) STAY reserved (Lookup/feedback/
//     gates and StateSnapshot/Delta remain shelved).
//   - E1c: Summary gains `publish_paths` (field 7) — the generic artifact-
//     publish case: cell-local file paths the agent names explicitly,
//     runner-read and uploaded via ArtifactTransferService alongside the
//     automatic *.plan.md manifest stamping (unchanged).
//
// Changelog rev 8 -> rev 9 (pre-release, additive):
//   - D1: new ConsumerService — WatchRuns (server-stream: a fold SNAPSHOT
//     followed by LIVE plane-1 AgentEvents, full payloads including delta
//     text, teed as they arrive on each run's RunChannel; the durable
//     journal stays counts-only for deltas — this is a SEPARATE, additive
//     consumer surface, not a change to the journal's own durability
//     contract) and ListRuns (the same roster projection, exposed as a
//     standalone unary RPC for external viewer processes that hold no
//     RunChannel of their own). A late-attaching consumer gets the snapshot
//     then live-from-now; there is no historical delta replay (session
//     transcripts serve history). Consumer credentials are a distinct,
//     read-only class — see coord/consumer.go.
//   - D1/D5: ListRunsResult.RunInfo gains parent_run_id so a roster consumer
//     can render the delegation tree (depth-2 children close manly-grant);
//     StartRun/RunStarted already carried parent_run_id (rev 5) — this only
//     exposes it on the read-side roster projection.
//
// Changelog rev 7 -> rev 8 (pre-release, additive; comment-only — no field
// changes):
//   - C0/A8: documented the HarnessSpec.config Struct-key convention that
//     carries the delegated child's session harp (CTXLOOM_SESSION_HARP):
//     key "ctxloom.session_harp". HarnessSpec gains no typed field for it —
//     the A3 boundary (only permission_mode is typed; MCP config/env and now
//     the harp stay in the Struct, harness-specific shapes) already covers
//     this; A8 just needed the convention written down.
//   - Documented on RunStarted/StartRunResult: harness_session_id is
//     journaled by the coordinator (run.harness fact) and feeds
//     HarnessSpec.resume_session_id on a later retry/resume of the same
//     harp — closing the loop the fields already implied.
//
// Changelog rev 6 -> rev 7 (pre-release, additive):
//   - D1: AgentRequest gains `stop_run` (CoordinatorResponse the matching
//     result). A PARENT requesting a child's termination is SpawnAgent's
//     dual and had no plane-2 home (CancelRun is coordinator->agent);
//     the coordinator ownership-checks the target run_id against the
//     requester's lineage.
//   - D2: AgentEvent slot 50 un-reserved — ArtifactProduced restored
//     (fields renumbered into declaration order while nothing shipped;
//     was reserved "until a consumer exists", and the plan-manifest
//     consumer now exists). Manifest-on-log only: the chunked transfer
//     RPCs stay deferred with the artifact family.
//   - D3: new annotations.proto in the package — custom FieldOptions/
//     MessageOptions carrying LLM-facing schema metadata (required,
//     example, doc-override) for the GENERATED MCP tool surface. protoc-
//     gen-go strips SourceCodeInfo from embedded descriptors, so comments
//     alone cannot drive generation; the options carry what comments
//     cannot express at all (proto3 has no required).
//   - Comment amendment: Hello.run_id may be EMPTY on a session-owner
//     (depth-0) credential — the channel then attaches to the owning
//     session itself rather than one spawned run (the parent harness
//     routes through its own runner like every agent).
//
// Changelog rev 5 -> rev 6:
//   - A1: RunnerHello.runner_id removed (remaining fields renumbered);
//     runner, agent, and run identity derive from the connection
//     credential, never from self-declared fields.
//   - A2: money is micro-USD — BudgetSpec.max_cost_usd_micros and
//     Usage.cost_usd_micros (were *_usd_cents).
//   - A3: HarnessSpec.permission_mode added as a typed, coordinator-
//     enforced field; it no longer rides inside `config`.
//   - A6: ListRunsRequest scopes by exact task_id + include_descendants;
//     task_id_prefix dropped (no prefix matching on opaque ids).
//   - A10: queued peer delivery documented as durable coordinator
//     mailbox state that survives coordinator restarts.
//   - Artifact/state split: the artifact family (produce, feedback,
//     lookup, chunked transfer) and the shared-state family (snapshot,
//     delta) are deferred until a consumer exists; their field numbers
//     are reserved in place, and the transfer RPCs will land on a future
//     ArtifactTransfer service in artifacts.proto. The rev-5 design file
//     is the source of record for the deferred shapes. ArtifactRef and
//     ArtifactKind stay here as shared vocabulary.
//
// TOPOLOGY
//
//   runtime (coordinator)
//     └─ spawns RUNNERS, talks to each over one RunnerChannel
//          └─ each runner drives agent harnesses DIRECTLY via their CLIs
//             (Claude Code via the claude-code-acp adapter, Codex app-server
//             JSON-RPC, Kiro via ACP) and adapts native protocols onto
//             this one; it opens one RunChannel per run it hosts.
//
// So there are two channel kinds, both dialed by the runner:
//   - RunnerChannel: runner lifecycle + process control (start/stop/kill
//     agent processes, drain, resource heartbeats, crash reports).
//   - RunChannel:    everything semantic about one run — status,
//     messages, results, artifacts, summaries up; steering, answers,
//     approvals, relayed peer traffic down.
//
// Coordinator->agent requests (steer, pause, cancel...) are *executed*
// by the runner using its direct CLI control of the harness: steering
// becomes an ACP session/prompt or a turn/start, pause/cancel
// become interrupts or turn/interrupt, resume becomes `--resume` /
// thread-resume with the recorded harness session id.
//
// The run-level protocol is organized as three planes multiplexed on
// the RunChannel stream:
//
//   1. EVENT PLANE (agent -> coordinator, durable, sequenced)
//      Append-only facts. The coordinator's view of a run is a pure fold
//      over AgentEvents. At-least-once + (run_id, seq) dedupe.
//
//   2. REQUEST/RESPONSE PLANE (symmetric, correlated, ephemeral)
//      gRPC gives RPC semantics in only one direction, so this layer
//      recreates them in both directions over the stream via request_id
//      correlation — the same move Codex app-server makes with
//      server-initiated JSON-RPC requests (approvals pause the turn until
//      the client answers). Agents can ask the coordinator for approvals,
//      user input, sub-agent spawns, sibling lookups; the coordinator can
//      ask agents questions, demand on-demand summaries, pause/resume,
//      steer. (Artifact fetches and state-snapshot pulls are deferred
//      with the artifact/state families — see the changelog above.)
//
//   3. NOTICE PLANE (fire-and-forget delivery)
//      Agent -> coordinator: Heartbeat. Coordinator -> agent: Ack
//      watermarks, cancellation, budget changes, relayed peer messages,
//      cancellation of outstanding requests. Notices are not part of the
//      run's event log — but peer messages are NOT ephemeral: queued
//      delivery is durable, role-addressed mailbox state at the
//      coordinator and survives coordinator process restarts.
//
// Durability boundary: requests/responses are control-plane and are NOT
// part of the agent's event log. Durable milestones they cause (e.g.
// "now waiting on approval", "approval resolved") are recorded by the
// agent as StatusChanged / InteractionResolved events, and the
// coordinator journals its own decisions on its side.
//
// Design lineage:
//   - Claude Agent SDK stream-json: system/assistant/result taxonomy,
//     parent_tool_use_id attribution, Result usage/cost/num_turns.
//   - Codex app-server: Thread/Turn/Item primitives; item lifecycle
//     started -> delta* -> completed; server-initiated requests that
//     pause the turn; accept/acceptForSession/decline/cancel decisions.
//   - AG-UI: lifecycle / text / tool-call / state event categories;
//     STATE_SNAPSHOT + STATE_DELTA (JSON Patch); RAW/CUSTOM hatches.
//   - Antigravity: typed artifact taxonomy (task list, implementation
//     plan, diff, walkthrough, screenshot, recording) with revisions;
//     artifacts as review gates; NON-BLOCKING anchored feedback on
//     artifacts that the agent incorporates without stopping execution.
//   - ACP (as implemented by Kiro CLI): initialize-time capability
//     negotiation, session update notifications, namespaced extensions.
//
// gRPC constraints honored:
//   - 4 MiB default max message: bulk bytes never ride the stream;
//     artifacts travel by reference (the chunked transfer RPCs are
//     deferred to a future ArtifactTransfer service).
//   - Ordering holds only within one stream: durable events carry a
//     per-run monotonic seq; resume is cursor-based on reconnect.
//   - HTTP/2 flow control is hop-level. An app-level Ack watermark plus a
//     credit window WOULD give end-to-end backpressure on the event plane;
//     neither is implemented today — the event plane runs on
//     HTTP/2 flow control alone. Hello.resume_from_seq / HelloAck.committed_seq
//     document the gap at the fields themselves.
//   - proto3 hygiene: *_UNSPECIFIED zero enums, oneof unions,
//     google.protobuf.Struct for open JSON, google.rpc.Status errors,
//     versioned package, reserved ranges.

syntax = "proto3";

package agentcoord.v1;

import "annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option go_package = "github.com/ctxloom/ctxloom/internal/agentcoord";

// =============================================================================
// Service
// =============================================================================

service CoordinatorService {
  // Runner-level control channel, exactly one per runner process,
  // dialed by the runner at startup (runners live behind NAT / in
  // containers, so the runtime never dials them). Carries process
  // control (StartRun/StopRun/KillRun/Drain), runner resource
  // heartbeats, and crash reports (RunExited).
  rpc RunnerChannel(stream RunnerFrame) returns (stream RuntimeFrame);

  // Run-level channel: opened by the runner's harness adapter for each
  // run it hosts (one long-lived bidi stream per run attempt). All
  // three run planes multiplex over it.
  //
  // On disconnect the agent reconnects, sends Hello with its resume
  // cursor, and re-emits unacked events. Outstanding requests in either
  // direction are the initiator's responsibility to reissue; responders
  // treat request_id as the idempotency key.
  //
  // Keepalive pings on; no overall deadline (per-request deadlines live
  // inside the request envelopes).
  rpc RunChannel(stream AgentFrame) returns (stream CoordinatorFrame);

  // Chunked artifact transfer (UploadArtifact / DownloadArtifact) is
  // deferred with the artifact family: it will land on a dedicated
  // ArtifactTransfer service in artifacts.proto when a consumer exists.
  // The rev-5 design file is the source of record for those shapes.

  // Unary at-least-once fallback for constrained agents (batch CI,
  // flaky networks) and for replaying a locally journaled event log.
  // Safe to retry: dedupe on (run_id, seq). Event plane only — no
  // request/response semantics here.
  rpc PublishEvents(PublishEventsRequest) returns (PublishEventsResponse);
}

// =============================================================================
// Runner control channel (runtime <-> runner)
// =============================================================================
//
// Process control is a runtime->runner concern and lives here;
// everything semantic about a run lives on RunChannel. The same
// request/response correlation contract as plane 2 applies.

message RunnerFrame {
  oneof kind {
    RunnerHello hello = 1;            // first frame on every (re)connect
    RunnerResponse response = 2;
    RunnerHeartbeat heartbeat = 3;    // fire-and-forget
    RunExited run_exited = 4;         // process-level fact, see below
  }
}

message RuntimeFrame {
  oneof kind {
    RunnerHelloAck hello_ack = 1;
    RunnerRequest request = 2;
  }
}

// First frame on every (re)connect. Runner identity is deliberately NOT
// carried here: it derives from the connection credential (gRPC
// metadata), never from a self-declared field. Hello carries only
// capabilities and active runs.
message RunnerHello {
  string version = 1;
  // Harness adapters this runner can drive: "claude-code",
  // "codex-app-server", "kiro-acp", ... Runtime MUST NOT StartRun a
  // harness the runner didn't advertise.
  repeated string harnesses = 2;
  uint32 max_concurrent_runs = 3;
  map<string, string> labels = 4;  // placement hints: region, gpu, repo...
  // Runs still alive from before a reconnect, so the runtime reconciles
  // instead of double-spawning.
  repeated string active_run_ids = 5;
}

message RunnerHelloAck {
  bool accepted = 1;
  google.rpc.Status reject_reason = 2;
}

message RunnerRequest {
  string request_id = 1;
  google.protobuf.Duration timeout = 2;
  oneof kind {
    StartRun start_run = 10;
    StopRun stop_run = 11;
    KillRun kill_run = 12;
    Drain drain = 13;
    CustomRequest custom = 90;
  }
}

message RunnerResponse {
  string request_id = 1;
  google.rpc.Status status = 2;  // RESOURCE_EXHAUSTED when at capacity
  oneof kind {
    StartRunResult start_run = 10;
    StopRunResult stop_run = 11;
    KillRunResult kill_run = 12;
    DrainResult drain = 13;
    google.protobuf.Struct custom = 90;
  }
}

// Spawn an agent process under a harness. run_id is runtime-assigned;
// the runner then opens RunChannel with it. This is also the back half
// of a parent agent's SpawnAgentRequest: parent asks on its RunChannel,
// runtime picks a runner and issues StartRun here.
message StartRun {
  string task_id = 1;
  string run_id = 2;
  HarnessSpec harness = 3;
  google.protobuf.Struct input = 4;  // initial prompt / task payload
  BudgetSpec budget = 5;
  string parent_run_id = 6;          // set for spawned sub-agents
  string role = 7;
}

message HarnessSpec {
  string harness = 1;    // must be in RunnerHello.harnesses
  string model = 2;
  string workspace = 3;  // working directory / checkout the runner prepares
  // 4 was extra_args (repeated string), REMOVED 2026-07-26: it
  // documented an allowlist enforcement point that never existed and no
  // runner ever read the field. Reintroducing per-run CLI arguments means
  // building the validation first, then giving it a new field number.
  reserved 4;
  // Tool policy, MCP config, env — harness-specific. Permission mode
  // does NOT ride here; it is the typed permission_mode field below.
  //
  // C0/A8 convention (documented, not typed — see the A3 boundary above):
  // the delegated child's session harp (CTXLOOM_SESSION_HARP) rides key
  // "ctxloom.session_harp" as a plain string value. Runners read it from
  // here rather than a typed field because it is ctxloom-specific ambient
  // identity, not a harness-native concept every consumer of this contract
  // would need to know about.
  google.protobuf.Struct config = 5;
  // Harness-native session to resume instead of starting fresh
  // (claude --resume <id>, codex thread/resume). Retry-with-context. Fed
  // from the coordinator's own journal: StartRunResult.harness_session_id
  // (below) is recorded as the run.harness fact when a run first reports
  // it, and a later respawn of the same harp reads it back into this
  // field.
  string resume_session_id = 6;
  // The security-relevant contract for delegated children: a headless
  // child must declare a headless-safe mode (it has no channel to
  // surface a prompt). Values are harness-mapped and
  // coordinator-enforced.
  string permission_mode = 7;
}

message StartRunResult {
  // Native session/thread id, for resume. The coordinator JOURNALS this
  // (run.harness fact, keyed on run_id) the moment it learns it — whether
  // reported here at spawn time or later on a RunExited frame — and feeds
  // it back as HarnessSpec.resume_session_id when the same harp's next run
  // attempt starts (a fresh run_id; the harp is what stays continuous).
  string harness_session_id = 1;
  int64 pid = 2;
}

// Stop a run. The runtime realizes this as an immediate kill: the engine
// process (or container) is terminated, the slot frees, and the run's
// terminal record is synthesized. There is NO grace escalation — see the
// removed `grace` field below.
message StopRun {
  option (message_schema) = {
    doc: "Stop a delegated child run: its engine (or container) is killed, its execution slot frees immediately (the spawn queue advances), its credential is revoked, and the stop is journaled. The session stays resumable — a later agent_send relaunches its harp as a fresh run primed with its recorded history."
  };

  string run_id = 1 [(field_schema) = {
    required: true,
    doc: "The child run to stop (from spawn's child_run_id, or the roster's current run_id — a resumed child runs under a FRESH run_id)"
  }];
  string reason = 2 [(field_schema) = {
    doc: "Why you are stopping this child. Recorded on the run's terminal record and in the coordinator audit log, and shown in the roster's cause — say something a later reader can act on (\"superseded by a narrower brief\", \"wrong base commit\")",
    example: "\"superseded by a narrower brief\""
  }];
  // 3 was grace (google.protobuf.Duration), REMOVED 2026-07-26:
  // no code path ever read it. The parent->coordinator stop is a hard kill
  // and the runner-control direction never implemented the SIGINT-then-
  // SIGTERM escalation the field implied, so advertising it to the model
  // promised an unwind window that does not exist.
  reserved 3;
}

message StopRunResult {
  // 1 was exited_within_grace (bool), REMOVED 2026-07-26: both
  // return paths hardcoded `true`, including the immediate-kill path — a
  // response field asserting an unmeasured fact. Nothing measures it now
  // that `grace` is gone.
  reserved 1;
}

// SIGKILL now. The run will surface as RunExited without a terminal
// event; the runtime synthesizes its own CANCELLED record.
message KillRun {
  string run_id = 1;
}

message KillRunResult {}

// Stop accepting StartRuns; finish or stop what's active by deadline.
message Drain {
  google.protobuf.Duration deadline = 1;
}

message DrainResult {
  repeated string remaining_run_ids = 1;
}

// Fire-and-forget liveness + capacity signal for placement decisions.
message RunnerHeartbeat {
  google.protobuf.Timestamp sent_at = 1;
  uint32 active_runs = 2;
  optional double cpu_load = 3;
  optional uint64 mem_bytes_used = 4;
}

// Process-level exit, distinct from the run-level RunCompleted event.
// If the harness died before emitting a terminal event (crash, OOM,
// kill), this is the only signal; the runtime decides retry policy,
// possibly a fresh run_id with HarnessSpec.resume_session_id set.
message RunExited {
  string run_id = 1;
  int32 exit_code = 2;
  string signal = 3;              // e.g. "SIGKILL", empty if clean exit
  bool terminal_event_seen = 4;   // RunCompleted was emitted before exit
  string harness_session_id = 5;  // resume handle, if the harness left one
}

// =============================================================================
// Run channel frames (stream envelopes)
// =============================================================================

message AgentFrame {
  oneof kind {
    Hello hello = 1;                    // first frame on every (re)connect
    AgentEvent event = 2;               // plane 1: durable, sequenced
    AgentRequest request = 3;           // plane 2: agent asks coordinator
    AgentResponse response = 4;         // plane 2: agent answers coordinator
    Heartbeat heartbeat = 5;            // plane 3

    // The spool doorbell, runner -> coordinator (an out/ create, or an
    // in/consumed rename). TOP-LEVEL, deliberately NOT an AgentEvent: events
    // carry a seq, buffer as unacked, and reissue until the durable Ack,
    // machinery that exists to make the WIRE the durable record. The
    // doorbell's durable record is the FILE, so wrapping it in ack/reissue
    // would rebuild the consumption-fact plumbing the spool deletes. Advisory
    // frame: no seq, no buffering, dropped when the stream is down — the
    // receiver's sweep is the at-least-once floor.
    SpoolChanged spool_changed = 6;
  }
}

message CoordinatorFrame {
  oneof kind {
    HelloAck hello_ack = 1;
    Ack ack = 2;                        // plane 3: event-plane watermark
    CoordinatorRequest request = 3;     // plane 2: coordinator asks agent
    CoordinatorResponse response = 4;   // plane 2: coordinator answers agent
    CoordinatorNotice notice = 5;       // plane 3: fire-and-forget
  }
}

message Hello {
  string task_id = 1;   // coordinator-assigned unit of work
  // UUID per attempt; retries get a fresh run_id. Ownership of the
  // run_id is validated against the connection credential it was issued
  // to — presenting someone else's run_id is a rejected Hello. MAY be
  // empty on a session-owner (depth-0) credential: the channel then
  // attaches to the OWNING SESSION itself (the parent harness routes
  // through its own runner like every agent), not to a spawned run.
  string run_id = 2;
  AgentIdentity agent = 3;

  // Highest seq the agent believes the coordinator has committed
  // (0 on first attach).
  //
  // NOT YET IMPLEMENTED. The intended contract is that HelloAck
  // returns the coordinator's own authoritative watermark and the agent
  // re-emits anything above it. The coordinator has no durable event log to
  // derive that watermark from, so it echoes this value straight back
  // (runchannel.go, "trivially resume where the runner stands"). Do NOT
  // build a client that trusts the ack as independent confirmation: today
  // it confirms only what you claimed.
  uint64 resume_from_seq = 4;

  uint32 protocol_version = 5;  // this file: 1

  // ACP-style capability strings ("approvals", "state_delta",
  // "peer_messaging", "on_demand_summary"). The coordinator MUST NOT
  // send request kinds the agent didn't advertise. Vendor extensions
  // namespaced: "x-acme/foo".
  repeated string capabilities = 6;
}

// agent_id and runner_id are coordinator-assigned and validated against
// the connection credential — never self-claimed by the agent process.
message AgentIdentity {
  string agent_id = 1;       // stable identity across runs
  string display_name = 2;
  string harness = 3;        // e.g. "claude-agent-sdk", "codex", "kiro-cli"
  string harness_version = 4;
  string model = 5;
  string role = 6;           // coordinator-assigned role, e.g. "reviewer"
  string runner_id = 7;      // which runner hosts this agent's process
}

message HelloAck {
  bool accepted = 1;
  google.rpc.Status reject_reason = 2;  // set iff !accepted
  // Resume cursor. NOT YET AUTHORITATIVE: the coordinator
  // echoes Hello.resume_from_seq back unchanged because it keeps no durable
  // event log to compare against. See Hello.resume_from_seq.
  uint64 committed_seq = 3;
  // 4 was event_window (uint32), REMOVED 2026-07-26: the
  // app-level credit window was never emitted, never read, and never
  // enforced, so the file's "end-to-end backpressure" claim rested on a
  // field that did not exist at runtime.
  reserved 4;
  // Coordinator's own capabilities, so agents know what they may request.
  repeated string capabilities = 5;
}

// Cumulative: all events with seq <= committed_seq are durable.
message Ack {
  uint64 committed_seq = 1;
}

// Ephemeral liveness + transient progress. Never journaled, never resent.
message Heartbeat {
  string run_id = 1;
  google.protobuf.Timestamp sent_at = 2;
  optional double progress = 3;              // 0.0..1.0 instantaneous
  optional uint64 context_tokens_used = 4;
}

// =============================================================================
// Plane 2 — symmetric request/response
// =============================================================================
//
// Correlation contract (both directions):
//   - request_id unique per sender per stream; echoed verbatim in the
//     response; also the responder-side idempotency key across reconnects.
//   - timeout is advisory wall-clock budget; on expiry the initiator may
//     emit a CancelRequest notice and proceed with its declared fallback
//     (e.g. approvals fall back to DECISION_CANCEL — nobody decided, so
//     nothing is reported as a decision; only a real answerer DECLINEs).
//   - Exactly one response per request. Errors travel in
//     response.status, not by dropping the response.

// ----- agent -> coordinator requests -----------------------------------------

message AgentRequest {
  string request_id = 1;
  google.protobuf.Duration timeout = 2;

  // 15 is held for artifact_lookup, deferred with the artifact family;
  // the rev-5 design file is the source of record.
  reserved 15;

  oneof kind {
    ApprovalRequest approval = 10;
    UserInputRequest user_input = 11;
    SpawnAgentRequest spawn_agent = 12;
    PeerSendRequest peer_send = 13;
    ListRunsRequest list_runs = 14;
    // D1: a parent asks the coordinator to terminate one of its children —
    // SpawnAgent's dual. The coordinator ownership-checks the target
    // run_id against the REQUESTER's lineage (only the run's parent may
    // stop it) and answers StopRunResult. In the B window the runtime
    // realizes it as a hard kill (grace is advisory); the child's slot
    // frees and its terminal record is synthesized as usual.
    StopRun stop_run = 16;
    // Open extension point, mirroring CustomEvent.
    CustomRequest custom = 90;
  }
}

message CoordinatorResponse {
  string request_id = 1;
  // OK, or why not: PERMISSION_DENIED, DEADLINE_EXCEEDED, UNAVAILABLE,
  // UNIMPLEMENTED (capability not offered), etc.
  google.rpc.Status status = 2;

  // 15 is held for artifact_lookup, deferred with the artifact family;
  // the rev-5 design file is the source of record.
  reserved 15;

  oneof kind {
    ApprovalDecision approval = 10;
    UserInputResult user_input = 11;
    SpawnAgentResult spawn_agent = 12;
    PeerSendResult peer_send = 13;
    ListRunsResult list_runs = 14;
    StopRunResult stop_run = 16;  // D1: answers AgentRequest.stop_run
    google.protobuf.Struct custom = 90;
  }
}

// Agent needs a decision before proceeding; it parks the affected item,
// emits StatusChanged{PHASE_WAITING_APPROVAL}, and blocks on this request
// (Codex server-initiated approval flow, generalized).
message ApprovalRequest {
  enum ApprovalKind {
    APPROVAL_KIND_UNSPECIFIED = 0;
    APPROVAL_KIND_COMMAND_EXECUTION = 1;
    APPROVAL_KIND_FILE_CHANGE = 2;
    APPROVAL_KIND_TOOL_USE = 3;
    APPROVAL_KIND_PERMISSION_ESCALATION = 4;
    // Antigravity-style plan gate: the agent published an artifact
    // (typically an ARTIFACT_KIND_IMPLEMENTATION_PLAN) and parks until
    // it's reviewed. Whether a given artifact kind gates at all is
    // coordinator policy ("always proceed" == auto-accept), not wire
    // protocol.
    APPROVAL_KIND_ARTIFACT_REVIEW = 5;
    APPROVAL_KIND_CUSTOM = 6;
  }
  ApprovalKind kind = 1;
  string title = 2;                    // one-line human summary
  google.protobuf.Struct payload = 3;  // argv, unified diff, scopes...
  string item_id = 4;                  // the parked step/tool_call
  // Set for APPROVAL_KIND_ARTIFACT_REVIEW: which artifact (at which
  // revision) gates.
  string artifact_id = 5;
  uint32 artifact_revision = 6;
}

// Decision vocabulary follows Codex app-server.
message ApprovalDecision {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    DECISION_ACCEPT = 1;
    DECISION_ACCEPT_FOR_SESSION = 2;  // pre-approves like-kind requests this run
    DECISION_DECLINE = 3;
    DECISION_CANCEL = 4;              // also cancels the parked parent item
  }
  Decision decision = 1;
  string note = 2;
  google.protobuf.Struct amendment = 3;  // amended params, if any
}

// A question that must ultimately reach a human (the coordinator may
// answer from policy/cache instead — the agent can't tell, by design).
message UserInputRequest {
  string prompt = 1;
  repeated string choices = 2;         // empty => free text
  google.protobuf.Struct schema = 3;   // optional JSON Schema for the answer
}

message UserInputResult {
  string text = 1;
  google.protobuf.Struct structured = 2;
}

// Delegation: agent asks the coordinator to spawn a sub-agent. The
// coordinator owns placement and lifecycle; the child gets its own run and
// RunChannel. Fan-in happens via peer messages (agent_send/agent_recv) and
// the child's reports (agent_report), which the parent reads from the
// roster. There is no budget carve-out and no result push — see the fields
// removed below.
message SpawnAgentRequest {
  option (message_schema) = {
    doc: "Launch a configured ctxloom agent as a delegated child session. Async spawn: returns at enqueue with the child's ids (child_agent_id is its harp — its address and continuation token); results, questions, and reports come back as mailbox messages (agent_recv). Follow-ups go down with agent_send. Children execute serially (a spawn past the cap queues) and never prompt: the agent must declare a headless-safe permission enum."
  };

  // e.g. "test-writer"
  string role = 1 [(field_schema) = {
    required: true,
    doc: "Configured ctxloom agent name to launch (its composed profiles, engine binding, runtime axis, and permission enum are honored; see `ctxloom agent list`)",
    example: "\"code-reviewer\""
  }];
  // child task input
  google.protobuf.Struct input = 2 [(field_schema) = {
    required: true,
    doc: "Child task input. `prompt` carries the child's briefing, delivered as its first turn. Optional `workspace` (\"none\"|\"worktree\"): \"none\" runs the child in the parent's live project checkout (it can stomp the parent's files, and sees the parent's uncommitted edits); \"worktree\" carves the child its own git worktree, checked out at HEAD (it will NOT see the parent's uncommitted edits). Empty defers to the project config if it sets one explicitly, otherwise defaults to worktree. This isolates the child's WORKING FILES only — it does not isolate the engine's own global config/credentials/session store from the parent's. Optional `dirty_tree_handler` (\"commit\"|\"copy\"|\"stale\"|\"fail\"), relevant only when this spawn resolves to a worktree and the parent tree has uncommitted changes (a worktree checkout only ever sees committed state): \"commit\" auto-commits the parent's dirty state first (requires a human dirty-tree-commit acknowledgement recorded via `ctxloom init` or `ctxloom manage dirty-tree-ack grant` (never a config key, never this per-call field — no per-call parameter can grant it); absent the ack, the spawn is refused, naming it); \"copy\" carves the worktree at HEAD then reproduces the changes inside it as uncommitted WIP, nothing committed; \"stale\" proceeds with the child seeing committed state only; \"fail\" refuses the spawn, naming the uncommitted paths. Empty defers to the project's dirty_tree_handler config default, then to the built-in default (\"commit\")",
    example: "{\"prompt\": \"Review the diff on branch X for correctness bugs\"}"
  }];
  // 3 was constraints (google.protobuf.Struct), 4 was budget (BudgetSpec),
  // 5 was notify_on (enum NotifyOn) — all three REMOVED 2026-07-26.
  // Every one was projected into agent_run's model-facing tool
  // schema and discarded by serveSpawnAgent: there is no budget carve-out,
  // no constraint enforcement, and no completion-notification machinery.
  // The child's binding (its configured agent) decides model/tools/sandbox;
  // the parent learns of completion from the roster or the child's own
  // agent_send. Reintroducing any of them means building the mechanism
  // first, under a new field number.
  reserved 3, 4, 5;
}

message BudgetSpec {
  optional uint64 max_cost_usd_micros = 1;
  optional uint32 max_turns = 2;
  optional google.protobuf.Duration max_wall_time = 3;
}

message SpawnAgentResult {
  // 1 was child_task_id (string), REMOVED 2026-07-26: never
  // populated, so the model received an always-empty id in every spawn
  // result. ctxloom keys delegation on (harp, run_id); there is no task-id
  // axis.
  reserved 1;
  string child_run_id = 2;
  string child_agent_id = 3;
}

// MessageKind is the CLOSED vocabulary of mailbox message kinds (4.B).
//
// It replaces the `structured["kind"]` free-string convention, which was
// sender-controlled over an OPEN vocabulary that included the
// coordinator-reserved `approval_request` — so a child could mint what read as
// an approval prompt. Three properties come from making it an enum rather than
// validating strings at each call site: an unrecognised value is a
// DECODE-time reject, not a string to sanitise; the value renders as a NAME
// from a closed set, which makes it attribute-eligible in a generated
// `<ctxloom-reminder>` frame by construction rather than by remembering to
// escape; and the vocabulary is discoverable to the agent through the
// generated MCP tool schemas, with no parallel documentation to drift.
//
// TWO CLASSES, one enum. The split is INGRESS POLICY, not two types:
// `agent_send` accepts only the sender-allowed values, and rejects the
// coordinator-reserved ones (and unrecognised numbers) naming the vocabulary.
// Only the coordinator itself may mint a reserved kind.
//
// MESSAGE_KIND_UNSPECIFIED is INVALID at every consumer. A message whose kind
// did not decode to a recognised value is refused, never defaulted — the
// zero value must not be a way to arrive unclassified and inherit whatever a
// switch's default branch happens to do.
enum MessageKind {
  // Invalid. Never queue, send, or accept a message with this kind.
  MESSAGE_KIND_UNSPECIFIED = 0;

  // Ordinary prose from one session to another (sender-allowed). Also the
  // kind the coordinator uses for text the HUMAN injects into a session
  // (`Coordinator.Inject`, viewer/terminal): it is a message, and the
  // human's identity rides from_agent_id ("user"), not the kind. Injection
  // used to queue mail with NO kind at all — the one producer the enum had
  // no representation for; see the Stage 2a report.
  MESSAGE_KIND_MESSAGE = 1;

  // A finding/verdict/deliverable (sender-allowed). Also what the automatic
  // turn-boundary bridge reports to a parent when a child's turn ends
  // without the child having sent anything itself.
  MESSAGE_KIND_RESULT = 2;

  // A failure the recipient must act on (sender-allowed). The coordinator
  // also mints it for launch failures, resume failures, and a terminal whose
  // run actually FAILED (as against merely ended).
  MESSAGE_KIND_ERROR = 3;

  // A question awaiting the recipient's answer (sender-allowed).
  MESSAGE_KIND_QUESTION = 4;

  // COORDINATOR-RESERVED: a relayed escalation-ladder ApprovalRequest,
  // waiting on the recipient's decision. `agent_send` MUST refuse this from
  // a sender — minting it is exactly the forgery the enum closes.
  MESSAGE_KIND_APPROVAL_REQUEST = 10;

  // COORDINATOR-RESERVED: the mirror notice a human injection always sends to
  // the target's PARENT, so a coordinator's picture of its child never
  // diverges without a trace.
  MESSAGE_KIND_USER_INJECTED = 11;

  // COORDINATOR-RESERVED: a control action taken against the recipient
  // (pause/resume/...) reported as mail. No producer yet — the control verbs
  // land in a later stage; the value exists so that stage adds no schema.
  MESSAGE_KIND_USER_CONTROL = 12;

  // COORDINATOR-RESERVED: the synthesized terminal notice queued to a parent
  // when a child run ends. The parent ALWAYS learns of a child's death.
  MESSAGE_KIND_EXITED = 13;

  // COORDINATOR-RESERVED: a steer instruction's body, queued as durable mail
  // so it survives the target's run succession. No producer yet (later
  // stage); declared here so that stage adds no schema.
  MESSAGE_KIND_STEER = 14;
}

// Peer messaging is hub-and-spoke: sender asks the coordinator to relay;
// the coordinator applies policy (may deny, redact, or queue) and
// delivers to the target as a CoordinatorNotice.PeerMessage. No agent
// mesh, one policy chokepoint, and offline targets get queued delivery.
message PeerSendRequest {
  option (message_schema) = {
    doc: "Send a message to another agent session. Coordinators address their children by harp (to_agent_id) — delivery completes a waiting agent_recv, starts a new turn on an idle child, queues mid-turn for the next boundary, or resumes an ended session. Delegated children may only address to_role: \"parent\"; peer messaging routes via the coordinator. Queued delivery is durable (at-least-once): a message to an offline session survives coordinator restarts. `kind` is REQUIRED and its vocabulary is CLOSED: you may send MESSAGE_KIND_MESSAGE, MESSAGE_KIND_RESULT, MESSAGE_KIND_ERROR, or MESSAGE_KIND_QUESTION, and any other value — a coordinator-reserved one, or one this build does not know — is REFUSED rather than accepted-and-ignored."
  };

  // or...
  string to_agent_id = 1 [(field_schema) = {
    doc: "Recipient agent id — a child session harp (from spawn's child_agent_id or the roster). Exactly one of to_agent_id / to_role is set",
    example: "\"swift-amber-falcon\""
  }];
  // ...broadcast to all agents with role
  string to_role = 2 [(field_schema) = {
    doc: "Role address. Delegated children may ONLY send to_role: \"parent\"; peer traffic routes via the coordinator",
    example: "\"parent\""
  }];
  string text = 3 [(field_schema) = {
    required: true,
    doc: "Message body (compact: findings, questions, verdicts — bulk detail stays in the session transcript)"
  }];
  google.protobuf.Struct structured = 4 [(field_schema) = {
    doc: "Optional structured companion. ANSWERING A RELAYED MESSAGE_KIND_APPROVAL_REQUEST is its main use — set in_reply_to to that message's message_id and this field IS the ApprovalDecision itself: {\"decision\": \"DECISION_ACCEPT\" | \"DECISION_ACCEPT_FOR_SESSION\" | \"DECISION_DECLINE\" | \"DECISION_CANCEL\", \"note\": \"...\"}. Any OTHER key on an approval reply is rejected, and the send fails naming the accepted shape; answering with anything else — including a bare courtesy ack — is refused without consuming the approval, so the decision can simply be re-sent. A `kind` key here is NO LONGER the message kind: name the kind in the `kind` field.",
    example: "{\"decision\": \"DECISION_ACCEPT\"}"
  }];
  // The message's kind, from the closed MessageKind vocabulary. Only the
  // sender-allowed values are accepted here; a coordinator-reserved value (or
  // an unrecognised number) is refused at ingress naming the vocabulary.
  //
  // 4.B: this REPLACES the retired `structured["kind"]` convention. `kind` in
  // `structured` is now just an ordinary payload key with no special meaning.
  MessageKind kind = 7 [(field_schema) = {
    doc: "REQUIRED. The message's kind, from a CLOSED vocabulary of exactly four values you may send: MESSAGE_KIND_MESSAGE (plain prose, claiming no special authority), MESSAGE_KIND_RESULT (your findings/verdict/deliverable), MESSAGE_KIND_ERROR (a failure the recipient must act on), MESSAGE_KIND_QUESTION (you expect an answer back). Every OTHER value is the coordinator's own and is REJECTED from a sender, not quietly downgraded — a reserved kind asks the recipient to trust the coordinator's authorship (MESSAGE_KIND_APPROVAL_REQUEST is relayed to a human as a trust decision), so a sender able to set one could borrow that authority. An unrecognised value is likewise REJECTED rather than passed through, and so is leaving this unset: the send fails, naming the four legal values. Nothing you write here is ever interpolated into text the recipient reads — the kind renders only as a name from this closed set.",
    example: "\"MESSAGE_KIND_RESULT\""
  }];
  // 5 was artifact_ids (repeated string), REMOVED 2026-07-26:
  // servePeerSend never read it and PeerMessage.artifacts was never
  // populated, so an agent that attached artifact ids to a message sent
  // nothing and the recipient's advertised `artifacts` array was always
  // absent. The supported artifact path is agent_report (which stamps a
  // content-addressed manifest) plus agent_fetch_artifact; name the id in
  // `text` or `structured` to point a peer at one.
  reserved 5;
  string in_reply_to = 6 [(field_schema) = {
    doc: "Correlates this reply to an earlier inbound PeerMessage.message_id. It is the ONLY correlation key. Set it to a relayed approval_request's message_id to answer that approval, and put the ApprovalDecision in `structured`; a resolved approval reports delivery: DELIVERY_DELIVERED, so DELIVERY_QUEUED on an approval reply means it was NOT honoured.",
    example: "\"m-7f856e302456956b4f91ee01\""
  }];
}

message PeerSendResult {
  string message_id = 1;  // coordinator-assigned
  enum Delivery {
    DELIVERY_UNSPECIFIED = 0;
    DELIVERY_DELIVERED = 1;   // target connected, frame written
    // Target offline; queued delivery is durable, role-addressed
    // mailbox state at the coordinator — it survives coordinator
    // process restarts and is delivered when the target reattaches.
    DELIVERY_QUEUED = 2;
    DELIVERY_DENIED = 3;      // policy refused (also reflected in status)
  }
  Delivery delivery = 2;
}

// Sibling discovery/observability, so a parent can watch its children
// (or peers watch each other) without private channels.
message ListRunsRequest {
  option (message_schema) = {
    doc: "List this session's delegated children (the roster): each entry's harp (agent_id), current run_id, state, latest report summary, and last activity. Terminal (ended) children are included only with include_terminal."
  };

  // 1 was task_id (string), 4 was include_descendants (bool) — both
  // REMOVED 2026-07-26. serveListRuns read neither. There is no
  // task-id axis to scope by, and the roster is ALREADY the whole
  // delegation tree: descendants (D5 grandchildren) are always included and
  // carry parent_run_id, so `include_descendants: true` could only ever
  // return the identical list.
  reserved 1, 4;
  string role = 2;             // filter
  bool include_terminal = 3;
}

message ListRunsResult {
  message RunInfo {
    string task_id = 1;
    string run_id = 2;
    AgentIdentity agent = 3;
    // The run's current state, one of exactly: "queued" | "executing" |
    // "parked" | "idle" | "ended". These five strings are the whole
    // vocabulary; "ended" is the only terminal one, and entries in it appear
    // only when include_terminal is set. Produced from the roster fold's
    // state (coord/folds.go), which a test pins this list against
    // (the documented vocabulary used to name an enum nothing
    // constructs, so a consumer matching it never matched a single run).
    string phase = 4;
    string latest_summary = 5;     // most recent Summary.text, truncated
    google.protobuf.Timestamp last_event_at = 6;
    // Empty for a depth-1 (top-level) child; set for a depth-2+ grandchild
    // (D5) — the SPAWNING run's run_id, so a roster consumer can render the
    // delegation tree without re-deriving it from the event log.
    string parent_run_id = 7;
    // permission_mode is the child's resolved permission mode's kind name
    // (agent.PermissionMode.String(): "bypass"|"plan"|"default"|
    // "acceptEdits"), fixed at enqueue (F1). Empty for a run journaled
    // before F1.
    string permission_mode = 8;
    // mcp_servers are the child's resolved MCP server NAMES ONLY (F1) —
    // never command, args, or env, which can carry a secret. Composed
    // strictly from the child's OWN resolved profile set
    // (prodSpawner.childMCPServers), so this is the privilege-scoping audit
    // trail: a real operator can confirm a run received exactly these
    // servers, never a sibling's or the parent's. Empty for a run journaled
    // before F1.
    repeated string mcp_servers = 9;
  }
  repeated RunInfo runs = 1;
}

// =============================================================================
// Consumer watch API (D1, Wave D): read-only observation for viewers — the
// TUI (run_terminal_ui/sessionfeed/roster), ACP frontends (D3's Tier A
// push), and a parent watching a child live. A NEW, additive service: no
// change to CoordinatorService or its messages. Steer/inject is NOT here —
// it mutates a run, so it rides the session's own authenticated surface
// (D2); ConsumerService is observation only.
// =============================================================================

service ConsumerService {
  // WatchRuns opens a live observation stream. The FIRST frame is always a
  // RosterSnapshot (the fold's current picture: roster + run states +
  // latest summaries); every frame after that is a live AgentEvent, teed
  // FULL (including delta text) as it arrives on the matching run's
  // RunChannel — no historical delta replay. filter.run_ids scopes to
  // specific runs; empty means every run visible to this credential.
  rpc WatchRuns(WatchRunsRequest) returns (stream WatchEvent);

  // ListRuns is a one-shot poll alternative to keeping a stream open — the
  // same roster projection AgentRequest's plane-2 ListRunsRequest reuses.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResult);
}

message WatchRunsRequest {
  repeated string run_ids = 1;  // empty = every run visible to this credential
}

message WatchEvent {
  oneof kind {
    RosterSnapshot snapshot = 1;  // exactly one, always first
    AgentEvent event = 2;         // live, full payload (incl. delta text)
  }
}

message RosterSnapshot {
  repeated ListRunsResult.RunInfo runs = 1;
}

// Shared artifact vocabulary, retained through the rev-6 artifact split:
// PeerMessage.artifacts carries these by reference, and Result /
// ToolCallCompleted carry artifact-id strings. The rest of the artifact
// family (production, feedback, lookup, transfer) is deferred — see the
// header changelog.
message ArtifactRef {
  string artifact_id = 1;
  string run_id = 2;
  string name = 3;
  string media_type = 4;
  uint64 size_bytes = 5;
  bytes sha256 = 6;
  string external_uri = 7;  // set when directly fetchable
  ArtifactKind kind = 8;
  uint32 revision = 9;      // latest, unless a specific one was requested
}

message CustomRequest {
  string name = 1;  // namespaced "vendor/name"
  google.protobuf.Struct value = 2;
}

// ----- coordinator -> agent requests ------------------------------------------

message CoordinatorRequest {
  string request_id = 1;
  google.protobuf.Duration timeout = 2;

  // What this request NEEDS the receiving run to be able to do, declared by
  // the sender in the SAME vocabulary Hello.capabilities advertises.
  //
  // It exists for ONE consumer: the coordinator's own DRAIN SEAM. A request
  // outlives the channel it was queued on — it is reissued with its original
  // request_id when the role next attaches — and the run that attaches may not
  // be the run that was addressed (a crash without a terminal, or a resume,
  // brings up a run whose Hello can advertise differently). Re-checking this
  // declared set against the FRESHLY advertised one before the request is
  // handed over is what keeps a request enqueued under run N from being
  // delivered to a run N+1 that cannot execute it.
  //
  // It is DECLARED, not derived, so the seam stays TAXONOMY-AGNOSTIC: the check
  // is a set containment (declared ⊆ advertised) with no kind→capability table
  // to keep in sync with the `kind` oneof below.
  //
  // IT IS NOT A SECURITY BOUNDARY, and nothing may treat it as one. The
  // receiver's own backstop keys on the ACTUAL oneof arm, never on this field,
  // so a request that declares less than it carries is still refused by the
  // runner on the kind it really is. Under-declaring buys nothing; this field
  // is only ever a reason to STOP delivery early, never a reason to allow it.
  repeated string required_capabilities = 3;

  // 12 is held for state_snapshot, deferred with the shared-state
  // family; the rev-5 design file is the source of record.
  reserved 12;

  oneof kind {
    SteerRequest steer = 10;
    QuestionRequest question = 11;
    SummarizeRequest summarize = 13;
    PauseRequest pause = 14;
    ResumeRequest resume = 15;
    CustomRequest custom = 90;
  }
}

message AgentResponse {
  string request_id = 1;
  google.rpc.Status status = 2;  // UNIMPLEMENTED if capability absent

  // 12 is held for state_snapshot, deferred with the shared-state
  // family; the rev-5 design file is the source of record.
  reserved 12;

  oneof kind {
    SteerResult steer = 10;
    QuestionResult question = 11;
    SummarizeResult summarize = 13;
    PauseResult pause = 14;
    ResumeResult resume = 15;
    google.protobuf.Struct custom = 90;
  }
}

// Mid-run instruction injection (Codex turn steering / Claude SDK
// streaming-input analog). Request/response so the coordinator knows
// whether it landed before or after a decision point.
message SteerRequest {
  string text = 1;
  google.protobuf.Struct metadata = 2;
}

message SteerResult {
  enum Applied {
    APPLIED_UNSPECIFIED = 0;
    // The target was IDLE, so the steer starts a NEW TURN NOW. It is NOT
    // injected into a turn already running: no engine surface ctxloom drives
    // supports genuine mid-turn injection, and the earlier comment here
    // ("injected into the current turn") claimed a capability that does not
    // exist. "Immediate" is about LATENCY — the instruction is acted on
    // without waiting for a boundary — never about interrupting a turn.
    APPLIED_IMMEDIATE = 1;
    APPLIED_NEXT_TURN = 2;       // queued for the next turn boundary
    APPLIED_REJECTED = 3;        // agent declined (also see status)
  }
  Applied applied = 1;
}

// Coordinator (or a human behind it) asks the agent something without
// disturbing its main loop: "why did you pick sqlx over diesel?"
message QuestionRequest {
  string text = 1;
}

message QuestionResult {
  string text = 1;
  google.protobuf.Struct structured = 2;
}

// On-demand summary at a given scope; the agent SHOULD also emit the
// produced Summary as a durable event (covers_through_seq set), so
// the pull leaves a record in the log.
message SummarizeRequest {
  Summary.Scope scope = 1;
  string focus = 2;  // optional: "just the schema decisions"
}

message SummarizeResult {
  Summary summary = 1;
}

message PauseRequest {
  string reason = 1;
}
message PauseResult {
  uint64 paused_at_seq = 1;  // no further events until Resume (except
                             // heartbeats and this response)
}

message ResumeRequest {}
message ResumeResult {}

// ControlInitiatorKind names WHO initiated a control action (4.E) — the
// privilege discriminator the coordinator's control guard reads to decide
// whether the caller may control a given run.
//
// It is a closed enum rather than a bool because a bool made four states
// representable where two are valid, and because this value is journaled into
// DURABLE facts (audit, InteractionRecorded) — and this project's durable facts
// are proto. It also has to be an ENUM, not a string, to be eligible to render
// as an attribute in a generated `<ctxloom-reminder>` frame: "the human paused
// you" and "your parent paused you" are a distinction an agent genuinely
// needs, and XmlRole refuses free text as an attribute.
//
// It is NEVER a request payload field. The coordinator DERIVES it — from the
// authenticated caller identity on the agent path, from the in-process call on
// the human path. An initiator that arrived in a payload would be
// self-asserted, and therefore forgeable.
//
// HUMAN and AGENT only. A system/watchdog initiator is plausible but has no
// producer, and adding an enum value later is additive — precisely the
// property the enum buys.
enum ControlInitiatorKind {
  // INVALID. Every control verb MUST refuse this, so an unrecognised
  // initiator fails closed instead of inheriting the narrower branch's
  // privileges by default.
  CONTROL_INITIATOR_KIND_UNSPECIFIED = 0;
  // The human, at the viewer or the terminal.
  CONTROL_INITIATOR_KIND_HUMAN = 1;
  // A coordinating agent — specifically the target's own parent.
  CONTROL_INITIATOR_KIND_AGENT = 2;
}

// ----- injected reminder frames (PRESENTATION ONLY, never wire traffic) -------
//
// 4.C. These messages are the source of the DATA STRUCTURE for the tiny
// `<ctxloom-reminder>` notices ctxloom injects into a session's turn stream.
// They are rendered to text by their GENERATED `.XmlLike()` encoders
// (annotations.proto's XmlRole) and are NEVER SENT: no RPC takes one, no oneof
// arm carries one, nothing marshals one onto a channel. If you find one on the
// wire, that is a bug.
//
// Why they are protos at all: generation can FAIL THE BUILD. Declaring the
// frame shape in field options means an un-annotated field, or free text
// smuggled into an attribute, is a compile error rather than a runtime
// warning — and because no hand-written frame construction exists anywhere, a
// sender-supplied string can never be interpolated into a frame. Escaping is a
// property of the encoder, not a convention someone has to remember.
//
// Every frame is DELIBERATELY tiny and content-free: the mailbox stays
// authoritative and the agent PULLS the payload with agent_recv. Sender
// identity and correlation ids have NO frame representation on purpose — they
// are structured data on the pulled message, and as proto `string`s they are
// attribute-INELIGIBLE anyway.

// Mail is waiting. `<ctxloom-reminder kind="mail-pending" count="2">call
// agent_recv</ctxloom-reminder>`
message MailPendingReminder {
  option (message_schema) = {
    xml_like: true,
    xml_text: "call agent_recv"
  };

  // How many messages are pending. A count is a number, so it is
  // attribute-eligible; it is also the only sender-influenced quantity in any
  // frame, and it cannot carry sender BYTES.
  uint32 count = 1 [(xml_role) = XML_ATTRIBUTE];
}

// A steer instruction is waiting in the mailbox.
message SteerPendingReminder {
  option (message_schema) = {
    xml_like: true,
    xml_text: "call agent_recv"
  };
}

// A parked control body was announced and the turn that carried the
// announcement ENDED without the agent pulling it. This is the frame the engine
// host's turn-boundary re-announcer emits; the announcement frames above
// (SteerPendingReminder and friends) are emitted once, at enqueue, and say
// nothing about a body that has been sitting unread since.
//
// It exists as a SEPARATE message because the announcement frames are
// field-less: they render to a byte-identical string every time, and a notice
// repeated verbatim across turns is a notice a model learns to skip. The two
// attributes here are the anti-habituation channel, and they are deliberately
// different KINDS of signal:
//
//   - age_seconds is CONTINUOUS and monotone. It answers "how long has this
//     been waiting", which is the question a model needs to weigh the notice
//     against whatever it is doing;
//   - urgency is a CLOSED, three-step escalation that changes on every
//     re-announcement even when two turn boundaries fall in the same second, so
//     a fast engine still sees the notice change rather than repeat.
//
// Both are attribute-eligible by construction (a number and an enum), so this
// frame carries no sender bytes, exactly like every other one.
message UnpulledReminder {
  option (message_schema) = {
    xml_like: true,
    xml_text: "call agent_recv"
  };

  // Urgency is how many re-announcements have gone unanswered, not a severity
  // anyone configures. FINAL is a PROMISE: it is the last frame this body will
  // ever get, and when it too goes unanswered the runner gives up
  // OBSERVABLY — see the control_unpulled custom event.
  enum Urgency {
    URGENCY_UNSPECIFIED = 0;
    // First re-announcement: the announcement turn ended unpulled.
    URGENCY_REPEAT = 1;
    // The body has now survived more than one turn boundary unread.
    URGENCY_URGENT = 2;
    // The last frame this body gets. Nothing further will be injected for it.
    URGENCY_FINAL = 3;
  }

  // How long the OLDEST unpulled body has been parked, whole seconds. Derived
  // from the runner's own clock at park time — it is not sender-influenced and
  // cannot carry sender bytes.
  uint32 age_seconds = 1 [(xml_role) = XML_ATTRIBUTE];

  // Which rung of the escalation this frame is.
  Urgency urgency = 2 [(xml_role) = XML_ATTRIBUTE];
}

// A question is waiting in the mailbox and is expected to be answered in this
// turn.
message QuestionPendingReminder {
  option (message_schema) = {
    xml_like: true,
    xml_text: "call agent_recv"
  };
}

// This session has been paused; no further work until it resumes.
message PausedReminder {
  option (message_schema) = {
    xml_like: true,
    xml_text: "this session is paused"
  };
}

// This session has been resumed.
message ResumedReminder {
  option (message_schema) = {
    xml_like: true,
    xml_text: "this session has resumed"
  };
}

// ----- coordinator -> agent notices (fire-and-forget) -------------------------

message CoordinatorNotice {
  // 5 is held for artifact_feedback, deferred with the artifact family;
  // the rev-5 design file is the source of record.
  reserved 5;

  oneof kind {
    CancelRun cancel = 1;
    BudgetUpdate budget_update = 2;
    PeerMessage peer_message = 3;
    CancelRequest cancel_request = 4;

    // The spool doorbell, coordinator -> runner (an in/ create, or an
    // out/consumed / in/withdrawn rename). Rides the notice arm because a
    // doorbell IS a fire-and-forget notice: no response, no correlation, and
    // a saturated send pump DROPS it with no rollback bookkeeping at all
    // (contrast the PeerMessage push's reservation rollback — that exists
    // because the wire was the only carrier; here the file is the truth and
    // the sweep redelivers).
    SpoolChanged spool_changed = 6;
  }
}

message CancelRun {
  string reason = 1;
  // Grace before hard-stop; agent is expected to emit a final
  // RunCompleted{status: RUN_STATUS_CANCELLED} within it.
  google.protobuf.Duration grace = 2;
}

message BudgetUpdate {
  BudgetSpec budget = 1;  // absolute new limits, not deltas
}

// Inbound relayed message from a sibling (or the coordinator itself,
// from_agent_id == ""). Reply via PeerSendRequest.in_reply_to.
// Until delivered, a queued PeerMessage is durable, role-addressed
// mailbox state at the coordinator: it survives coordinator process
// restarts and is delivered when the target reattaches.
message PeerMessage {
  string message_id = 1;
  string from_agent_id = 2;
  string from_run_id = 3;
  string text = 4;
  google.protobuf.Struct structured = 5 [(field_schema) = {
    doc: "Structured companion the sender attached, when there is one. A message whose `kind` is MESSAGE_KIND_APPROVAL_REQUEST carries the escalation ladder's ApprovalRequest projection here and is WAITING on you: answer it with agent_send(in_reply_to: this message_id, structured: {\"decision\": \"DECISION_ACCEPT\" | \"DECISION_ACCEPT_FOR_SESSION\" | \"DECISION_DECLINE\" | \"DECISION_CANCEL\", \"note\": \"...\"}). Until that lands the requesting child is blocked, and it is auto-DECLINED if the rung's timeout elapses first. This object no longer carries the message kind — read the `kind` field."
  }];
  // 6 was artifacts (repeated ArtifactRef), REMOVED 2026-07-26:
  // no producer ever set it, so agent_recv advertised an artifacts array
  // that could never appear. See PeerSendRequest's reserved 5.
  reserved 6;
  string in_reply_to = 7;
  // The message's kind, from the closed MessageKind vocabulary — including the
  // coordinator-reserved values, which only ever appear INBOUND like this.
  //
  // 4.B: this REPLACES the retired `structured["kind"]` convention, and is the
  // user-visible half of that break: `kind` moved out of `structured` and onto
  // the message. A recognised value here is guaranteed by decode; an
  // unrecognised one is refused rather than delivered unclassified.
  MessageKind kind = 8 [(field_schema) = {
    doc: "The message's kind, from a CLOSED vocabulary — guaranteed to be one of these names, because an unrecognised value is refused at ingress rather than delivered unclassified. A SENDER could only have set one of MESSAGE_KIND_MESSAGE, MESSAGE_KIND_RESULT, MESSAGE_KIND_ERROR, MESSAGE_KIND_QUESTION; the rest are minted by the coordinator itself and are therefore trustworthy as to provenance. MESSAGE_KIND_APPROVAL_REQUEST is an escalation WAITING on your decision (see `structured`); MESSAGE_KIND_USER_INJECTED means a human injected text into a session you supervise; MESSAGE_KIND_EXITED means a child of yours ended; MESSAGE_KIND_USER_CONTROL and MESSAGE_KIND_STEER are control-plane notices."
  }];
}

// Withdraw an outstanding CoordinatorRequest (agent equivalent: agents
// simply stop waiting and treat their own timeout fallback).
message CancelRequest {
  string request_id = 1;
}

// ----- the spool doorbell (both directions) ----------------------------------

// SpoolChanged is the doorbell: "a file now exists at this logical spool
// coordinate; look". It travels BOTH ways — on CoordinatorNotice toward a
// runner and as a top-level AgentFrame arm toward the coordinator.
//
// It carries a REFERENCE AND NOTHING ELSE. No body, no kind, no correlation
// id: the spool file's own YAML frontmatter is the control plane, and a
// doorbell that carried payload would recreate the two-carrier desync the
// spool exists to kill. The file is the durable truth; this frame only bounds
// latency, so losing one costs latency and never a message (the receiver's
// startup / turn-boundary / reconnect / 30s sweeps re-derive the whole
// picture from readdir).
//
// It is STRUCTURED rather than a path or a "spool://harp/in/name" URI for two
// reasons. First, a raw path is a SENDER-VIEW ARTIFACT: the same file is
// ~/.ctxloom/sessions/<harp>/persist/spool/in/<name> on the host and
// <containerHome>/.ctxloom/sessions/<harp>/persist/spool/in/<name> inside a
// container, so a host path baked into a doorbell resolves to nothing (or to
// something unintended) on the other side. What travels is the logical
// coordinate and each receiver renders its own view through its own
// spool.PathMapper. Second, a closed enum for the directory fails loudly on an
// unknown value at decode instead of reaching a path join as a string.
//
// ONE MESSAGE SHAPE COVERS EVERY TRANSITION — create, consume, withdraw —
// because the consume-rename IS the delivery acknowledgement: a doorbell for
// in/consumed is what tells the coordinator its mail landed, with no separate
// ack vocabulary. Handling is therefore uniformly "resolve, read-or-sweep,
// act", idempotent and stateless: a doorbell naming a file the sweep already
// consumed resolves to ENOENT and is ignored, never an error.
//
// SECURITY: every field arrives from a less-trusted peer and is validated at
// the receive chokepoint (spool.Ref.Validate — harp grammar, closed dir,
// bare-filename grammar), rejected and never sanitised. `harp` in particular
// is ADVISORY on the coordinator side: refs arriving on a child's channel are
// resolved against THAT child's spool, never against a harp the child names,
// or a child could aim the coordinator's reader at a sibling's spool.
message SpoolChanged {
  // Whose spool the file lives in. Advisory on receipt — see SECURITY above.
  string harp = 1;
  // Which subdirectory of that spool, from the closed set below.
  SpoolDir dir = 2;
  // The bare filename, e.g. "00001754919000123456789.00000042.coord.md".
  // A single path segment: no separators, no "..", no leading dot.
  string name = 3;
}

// SpoolDir is the closed set of spool subdirectories a doorbell may name,
// mirroring spool.Dir's five values exactly. The consumed/ and withdrawn/
// values exist because RENAMES RING THE DOORBELL TOO (the consume-rename is
// the ack).
//
// SPOOL_DIR_UNSPECIFIED is INVALID at every consumer: a ref that did not
// decode to a recognised directory is refused, never defaulted. The zero value
// must not be a way for a doorbell to arrive unclassified and inherit whatever
// a switch's default branch happens to do.
enum SpoolDir {
  // Invalid. Never send, and refuse on receipt.
  SPOOL_DIR_UNSPECIFIED = 0;

  // in/ — messages TO the agent whose spool this is. Single writer: the
  // coordinator.
  SPOOL_DIR_IN = 1;

  // out/ — messages FROM that agent. Single writer: its runner.
  SPOOL_DIR_OUT = 2;

  // in/consumed/ — an in/ message the runner accepted. This doorbell is the
  // DELIVERY CONFIRMATION.
  SPOOL_DIR_IN_CONSUMED = 3;

  // out/consumed/ — an out/ message the coordinator processed.
  SPOOL_DIR_OUT_CONSUMED = 4;

  // in/withdrawn/ — an in/ message its WRITER retracted before it was
  // consumed. Rename-won means retracted; ENOENT means the reader won.
  SPOOL_DIR_IN_WITHDRAWN = 5;
}

// =============================================================================
// Plane 1 — the event log (agent -> coordinator, durable)
// =============================================================================

// One durable fact. The coordinator's view of a run is a pure fold over
// these; nothing on the request/response plane is load-bearing for state.
message AgentEvent {
  string task_id = 1;
  string run_id = 2;

  // Per-run monotonic, starts at 1, no gaps. (run_id, seq) is the
  // idempotency key everywhere.
  uint64 seq = 3;

  google.protobuf.Timestamp occurred_at = 4;

  // Optional grouping: one user-input -> agent-quiescent cycle
  // (Codex Turn / Claude num_turns unit).
  string turn_id = 5;

  // Attribution to a parent item, e.g. events emitted on behalf of a
  // tool call or subagent (Claude parent_tool_use_id).
  string parent_item_id = 6;

  // W3C trace context for cross-system correlation.
  string traceparent = 7;

  // 60/61 are held for state_snapshot/state_delta (shared-state family),
  // deferred; the rev-5 design file is the source of record. 50 was
  // un-reserved in rev 7 (D2): ArtifactProduced returned with the
  // plan-manifest consumer.
  reserved 60, 61;

  oneof payload {
    // --- lifecycle ---
    RunStarted run_started = 10;
    StepStarted step_started = 11;
    StepCompleted step_completed = 12;
    StatusChanged status_changed = 13;
    RunCompleted run_completed = 14;  // terminal; exactly one per run

    // --- messages (item lifecycle: started -> delta* -> completed) ---
    MessageStarted message_started = 20;
    MessageDelta message_delta = 21;
    MessageCompleted message_completed = 22;

    // --- tool calls ---
    ToolCallStarted tool_call_started = 30;
    ToolCallArgsDelta tool_call_args_delta = 31;
    ToolCallCompleted tool_call_completed = 32;

    // --- control-plane echoes: durable record of plane-2 interactions ---
    InteractionRecorded interaction = 40;

    // --- artifacts (manifest-on-log; transfer RPCs stay deferred) ---
    ArtifactProduced artifact_produced = 50;

    // --- summaries ---
    Summary summary = 70;

    // --- escape hatches (AG-UI RAW / CUSTOM analogs) ---
    RawEvent raw = 90;
    CustomEvent custom = 91;
  }

  reserved 100 to 199;  // future first-party payloads
}

// --- lifecycle ----------------------------------------------------------------

// config echoes the StartRun HarnessSpec the coordinator issued — including,
// per the resume_session_id doc above, whether this attempt started fresh or
// resumed a prior harness_session_id, so the log alone shows resume lineage
// without cross-referencing the StartRun request that is not itself durable
// (requests/responses are control-plane, never part of the event log).
message RunStarted {
  google.protobuf.Struct input = 1;   // task input as given to the agent
  AgentIdentity agent = 2;            // repeated here so the log is
                                      // self-contained without Hello
  google.protobuf.Struct config = 3;  // model, tool policy, sandbox, etc.
  string parent_run_id = 4;           // set for spawned sub-agents
}

// Steps are coarse plan units ("analyze repo", "write migration") —
// AG-UI STEP_* analogs. step_id is agent-chosen and stable.
message StepStarted {
  string step_id = 1;
  string title = 2;
  uint32 ordinal = 3;
}

message StepCompleted {
  string step_id = 1;
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_SUCCEEDED = 1;
    OUTCOME_FAILED = 2;
    OUTCOME_SKIPPED = 3;
  }
  Outcome outcome = 2;
  string detail = 3;
}

// Durable phase transitions. Transient % progress goes in Heartbeat.
message StatusChanged {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_INITIALIZING = 1;
    PHASE_PLANNING = 2;
    PHASE_EXECUTING = 3;
    PHASE_WAITING_APPROVAL = 4;  // an ApprovalRequest is outstanding
    PHASE_WAITING_INPUT = 5;     // a UserInputRequest is outstanding
    PHASE_WAITING_PEER = 6;      // blocked on a sibling (peer msg / spawn result)
    PHASE_PAUSED = 7;
    PHASE_FINALIZING = 8;
  }
  Phase phase = 1;
  string detail = 2;  // human-readable, one line
}

// Durable record that a plane-2 interaction happened and how it resolved,
// so the event log alone can replay/explain the run. The agent emits one
// per resolved request it initiated (and MAY emit them for coordinator-
// initiated requests it served).
message InteractionRecorded {
  string request_id = 1;
  string kind = 2;        // "approval", "user_input", "spawn_agent", ...
  enum Resolution {
    RESOLUTION_UNSPECIFIED = 0;
    RESOLUTION_GRANTED = 1;    // accepted / answered / spawned / delivered
    RESOLUTION_DENIED = 2;
    RESOLUTION_TIMED_OUT = 3;  // fallback path taken
    RESOLUTION_CANCELLED = 4;
  }
  Resolution resolution = 3;
  google.protobuf.Struct detail = 4;  // e.g. decision, child_run_id
}

// Terminal event. Nothing may follow it for this run_id.
message RunCompleted {
  Result result = 1;
}

message Result {
  enum RunStatus {
    RUN_STATUS_UNSPECIFIED = 0;
    RUN_STATUS_SUCCEEDED = 1;
    RUN_STATUS_FAILED = 2;
    RUN_STATUS_CANCELLED = 3;
    RUN_STATUS_BUDGET_EXCEEDED = 4;
    RUN_STATUS_TIMED_OUT = 5;
  }
  RunStatus status = 1;

  // Human-readable outcome (Claude ResultMessage.result analog).
  string text = 2;

  // Schema-validated structured output when the task requested one
  // (Claude --json-schema / structured_output analog). Schema is
  // referenced, not embedded.
  google.protobuf.Struct structured_output = 3;
  string output_schema_id = 4;

  // Populated iff status != RUN_STATUS_SUCCEEDED. Machine-actionable;
  // mirrors Codex codexErrorInfo intent (retryability, upstream status).
  google.rpc.Status error = 5;
  bool retryable = 6;

  Usage usage = 7;
  google.protobuf.Duration wall_time = 8;
  uint32 num_turns = 9;

  // Convenience pointers; the authoritative artifact facts are the
  // artifact-production events, deferred with the artifact family
  // (AgentEvent's reserved 50).
  repeated string artifact_ids = 10;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_input_tokens = 3;
  uint64 cache_creation_input_tokens = 4;
  // Micro-USD (1e-6 USD) as uint64; never float for money, and costs
  // are non-negative by construction. Conversion happens once, at
  // ingestion: whatever the harness reports (Claude's float
  // total_cost_usd, token pricing math, etc.) is converted to micro-USD
  // there with round-half-even, and only integer micros exist on the
  // wire and in the log. Rationale: single agent turns are routinely
  // sub-cent, and cents would round them to zero, breaking per-item
  // budget accounting; micros keep them nonzero.
  uint64 cost_usd_micros = 5;
  map<string, Usage> per_model = 6;  // keyed by model id; leaves have
                                     // empty per_model
}

// --- messages -------------------------------------------------------------

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_ASSISTANT = 1;
  MESSAGE_ROLE_TOOL = 2;
  MESSAGE_ROLE_SYSTEM = 3;
}

// Destination routing: reasoning separated from user-facing output
// (Codex reasoning deltas / AG-UI REASONING events).
enum MessageChannel {
  MESSAGE_CHANNEL_UNSPECIFIED = 0;
  MESSAGE_CHANNEL_FINAL = 1;      // user/coordinator-facing narrative
  MESSAGE_CHANNEL_REASONING = 2;  // chain-of-thought / working notes
  MESSAGE_CHANNEL_LOG = 3;        // operational chatter, command output
}

message MessageStarted {
  string message_id = 1;
  MessageRole role = 2;
  MessageChannel channel = 3;
}

message MessageDelta {
  string message_id = 1;
  string text = 2;  // UTF-8 append; concatenate in seq order
}

message MessageCompleted {
  string message_id = 1;
  // Optional full text for cheap projection / integrity check; omit when
  // large. Deltas are authoritative either way.
  string full_text = 2;
}

// --- tool calls -------------------------------------------------------------

message ToolCallStarted {
  string tool_call_id = 1;
  string tool_name = 2;
}

// Streaming argument construction (Claude input_json_delta analog).
message ToolCallArgsDelta {
  string tool_call_id = 1;
  string args_json_fragment = 2;
}

message ToolCallCompleted {
  string tool_call_id = 1;
  google.protobuf.Struct args = 2;  // final parsed arguments
  bool is_error = 3;
  // Truncated/inline result; large results become artifacts.
  string result_text = 4;
  repeated string artifact_ids = 5;
  google.protobuf.Duration elapsed = 6;
}

// --- artifacts ---------------------------------------------------------------

// Semantic artifact types, adopted from Antigravity's taxonomy (task
// list, implementation plan, diff, walkthrough, screenshot, browser
// recording) and generalized. `labels` stays available for anything
// finer-grained. Retained vocabulary: referenced by ArtifactRef and
// ApprovalRequest while the rest of the artifact family is deferred.
// A durable artifact fact: the agent produced (a revision of) an artifact.
// Restored in rev 7 (D2) for the plan-manifest consumer, fields RENUMBERED
// into declaration order (rev-5's jumble, A5) while nothing had shipped.
// Manifest-on-log discipline: bulk bytes stay in the producing session's
// directory (or an external store); the log carries the manifest — name,
// kind, size, sha256, location. The chunked transfer RPCs remain deferred
// with the artifact family.
message ArtifactProduced {
  string artifact_id = 1;  // agent-chosen, unique within run; stable across revisions
  uint32 revision = 2;     // starts at 1, monotonic per artifact_id (the
                           // runtime MAY assign it at journal time when the
                           // producer sends 0)
  ArtifactKind kind = 3;
  string name = 4;         // e.g. "coverage/report.html"
  string media_type = 5;   // RFC 6838
  uint64 size_bytes = 6;
  bytes sha256 = 7;        // content address; required for all dispositions

  oneof content {
    bytes inline = 8;        // <= 128 KiB by convention
    string external_uri = 9; // coordinator-fetchable (object store, file path...)
    string upload_id = 10;   // receipt from UploadArtifact (deferred with the
                             // transfer family)
  }

  string produced_by_item_id = 11; // step/tool_call/message attribution
  map<string, string> labels = 12; // e.g. lang=rust, path=/abs/plan.md

  // Which feedback_ids this revision claims to address (ArtifactFeedback,
  // deferred with the artifact family), closing the loop durably on the log.
  repeated string addresses_feedback_ids = 13;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_TASK_LIST = 1;            // structured plan; steps mirror
                                          // StepStarted/StepCompleted events,
                                          // checked off as they land
  ARTIFACT_KIND_IMPLEMENTATION_PLAN = 2;  // the canonical review-gate artifact
  ARTIFACT_KIND_CODE_DIFF = 3;
  ARTIFACT_KIND_WALKTHROUGH = 4;          // post-completion "what I did & how
                                          // to verify"
  ARTIFACT_KIND_SCREENSHOT = 5;
  ARTIFACT_KIND_RECORDING = 6;            // e.g. browser verification video
  ARTIFACT_KIND_REPORT = 7;               // test/coverage/analysis output
  ARTIFACT_KIND_DATASET = 8;
  ARTIFACT_KIND_DOCUMENT = 9;             // generic prose deliverable
  ARTIFACT_KIND_OTHER = 10;
}

// --- summaries ---------------------------------------------------------------

message Summary {
  option (message_schema) = {
    doc: "File a structured report as a durable, journaled fact: PROGRESS (rolling status), CHECKPOINT (resumable synthesis of everything so far — supersedes prior checkpoints), or FINAL (the deliverable summary; file one before finishing). Reports feed the coordinator's roster and seed projections. Session-dir plan files (*.plan.md) are stamped as artifact manifests automatically on every report."
  };

  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    SCOPE_PROGRESS = 1;    // rolling "what I'm doing / what's left"
    SCOPE_STEP = 2;        // wrap-up of one step_id
    SCOPE_CHECKPOINT = 3;  // resumable synthesis; supersedes prior checkpoints
    SCOPE_FINAL = 4;       // the human-readable deliverable summary
  }
  Scope scope = 1 [(field_schema) = {
    required: true,
    doc: "Report scope: SCOPE_PROGRESS (rolling status), SCOPE_STEP (one step's wrap-up), SCOPE_CHECKPOINT (resumable synthesis; supersedes prior checkpoints), SCOPE_FINAL (the deliverable summary)",
    example: "\"SCOPE_FINAL\""
  }];
  string step_id = 2;  // set when scope == SCOPE_STEP
  // markdown
  string text = 3 [(field_schema) = {
    required: true,
    doc: "The report body, markdown"
  }];

  // Structured companion (decisions, open questions, metrics).
  google.protobuf.Struct structured = 4;

  // Event-log compression hint: faithfully covers all events with
  // seq <= covers_through_seq, so late joiners may start from the
  // latest SCOPE_CHECKPOINT instead of replaying everything.
  uint64 covers_through_seq = 5;

  repeated string artifact_ids = 6;

  // E1c generic publish case: cell-local file paths (relative to the
  // working directory) to publish as artifacts alongside this report —
  // runner-read and uploaded via ArtifactTransferService, size-capped
  // sanely (coord/artifacts.go). Automatic *.plan.md stamping happens
  // regardless of this field; use it for other files you want retrievable
  // after this session ends (e.g. from a container that will not survive).
  repeated string publish_paths = 7 [(field_schema) = {
    doc: "Cell-local file paths (relative to the working directory) to publish as artifacts alongside this report, in addition to the automatic *.plan.md manifest stamping. Runner-read and uploaded; size-capped",
    example: "[\"findings/coverage.json\"]"
  }];
}

// --- escape hatches ----------------------------------------------------------

// Verbatim upstream harness event (raw Claude API stream event, Codex
// app-server notification...) for lossless forwarding/debugging.
message RawEvent {
  string source = 1;  // e.g. "claude-agent-sdk/stream_event"
  google.protobuf.Struct event = 2;
}

// Application-defined extension; names namespaced "vendor/name".
message CustomEvent {
  string name = 1;
  google.protobuf.Struct value = 2;
}

// =============================================================================
// Unary fallback (event plane only)
// =============================================================================

message PublishEventsRequest {
  repeated AgentEvent events = 1;  // may span gaps being backfilled
}

message PublishEventsResponse {
  // Highest contiguous committed seq per run present in the request.
  map<string, uint64> committed_seq_by_run = 1;
  repeated RejectedEvent rejected = 2;  // malformed, post-terminal, etc.
}

