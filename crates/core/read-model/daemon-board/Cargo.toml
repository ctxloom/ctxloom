[package]
name = "daemon-board"
version = "0.1.0"
description = "The user daemon's board of one project: every session and every run, folded from their streams as their aggregates fold them, held in memory"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded.workspace = true
runs.workspace = true
sessions.workspace = true
uuid.workspace = true
# Its view (S32): the session's state, as the wire message; its fold on the
# projector port.
sessions-proto.workspace = true
held-projection.workspace = true

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
mutants.workspace = true
prost.workspace = true

[lints]
workspace = true
