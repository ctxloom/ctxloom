// region engines: ctxloom.dev/Engine (read-only, ruling 43)

// Where an engine's credential comes from: a word (`none`, `login`,
// `token`), or a source of variables and a file. A name or a path, never a
// value. was: AuthSetting.value.
message AuthValue {
  string word = 1;
  repeated string env = 2;
  string file = 3;
}

// was: AuthSetting.
message EngineAuth {
  enum State {
    STATE_UNSPECIFIED = 0;
    PRESENT = 1;
    MISSING = 2;
    NOT_NEEDED = 3;
  }

  AuthValue value = 1;
  string source = 2;
  State state = 3;
  // The variable's name or the file's path that authenticates.
  string via = 4;
}

// One agent of an engine (bound to it, or with a block for it, ruling 57)
// and what it resolves to there. Its settings are flat (design §3.8's
// recommendation, for path stability: `agents[...].model.value`). was:
// EngineAgent (`name` -> `agent`, AIP-122).
message EngineAgent {
  // The Agent's name.
  string agent = 1;
  SourcedText model = 2;
  SourcedText effort = 3;
  SourcedDocument permissions = 4;
  RuntimeSetting runtime = 5;
  EnvSetting env = 6;
  SourcedText session_home = 7;
}

message Engine {
  // IDENTIFIER: `projects/{project}/engines/{engine}`,
  // `users/me/engines/{engine}`. Everything else is OUTPUT_ONLY: derived
  // from the layered config.
  string name = 1;
  SourcedText command = 2;
  SourcedText session_home = 3;
  SourcedText runtime = 4;
  SourcedList env = 5;
  EngineAuth auth = 6;
  repeated EngineAgent agents = 7;
}

message GetEngineRequest {
  string name = 1;
}

message ListEnginesRequest {
  string parent = 1;
  int32 page_size = 80;
  string page_token = 81;
}

message ListEnginesResponse {
