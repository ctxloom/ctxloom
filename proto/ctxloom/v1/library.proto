message SearchLibraryRequest {
  string parent = 1;
  string query = 2;
  repeated string tags = 3;
  ItemKind kind = 4;
  bool local = 5;
  bool remote = 6;
  int32 page_size = 80;
  string page_token = 81;
  Globals globals = 96;
}

message SearchLibraryResponse {
  string query = 1;
  repeated SearchHit local = 2;
  repeated RemoteFound remote = 3;
  uint32 count = 4;
  uint32 hidden_local = 5;
  string next_page_token = 80;
}

