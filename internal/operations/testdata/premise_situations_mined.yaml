version: 1.0.0
description: 'Situations MINED from 3,404 real tool-intent statements across 86 session transcripts of
  this repository, then clustered by six independent agents and merged.


  `observed` is recomputed DETERMINISTICALLY by matching the real extracted lines; the miners'' own frequency
  figures were discarded after three of six reported cluster totals that exceeded or undershot the number
  of lines they were given, which proves they were estimates rather than counts.Ground truth written after
  the premises exist grades each premise against itself.


  MINING CANNOT PRODUCE A CANARY. A transcript only records moments where the agent acted, so a moment
  where nothing applies is structurally absent from this input and must be authored by hand.


  NO NEGATIVE LIST, DELIBERATELY. Ground truth names only what SHOULD be selected. Anything else selected
  is a false positive whether or not anyone anticipated it. Enumerating the tempting-but-wrong fragments
  would close an open seam: it measures the model against the labeller''s imagination of failure, and
  the failure worth finding is the one nobody imagined. Over-selection is caught instead by precision
  and by NOTHING-APPLIES situations, where any selection at all counts against the run.


  UNTIL LABELLING IS DONE every row has an empty `expect`, so the false-fire metric is meaningless: it
  cannot distinguish a genuine nothing-applies situation from one nobody has labelled yet. Score only
  after labelling.


  C-ROWS ARE AUTHORED CANARY CANDIDATES, NOT MINED. A transcript records only moments where the agent
  acted, so a moment where nothing applies is structurally absent from mined input and has to be written
  by hand. They are marked CANDIDATE and left unlabelled on purpose: they were written by someone who
  had read the authored premises, so asserting expect:[] here would be constructing rows that dodge those
  premises. The blind labeller confirms or refutes each one. If a fragment genuinely applies to a C-row,
  it was never a canary, and that is a finding rather than an error.


  LABELLED BLIND 2026-08-27: expect lists were written against the fragment BODIES by a pass that had
  not read the authored premises. All six authored canary candidates were CONFIRMED (nothing applies),
  and 10 rows in total carry an empty expect, which is what gives the false-fire metric something to measure.


  KNOWN BLIND SPOT: 10 premised fragments are expected by NO situation -- context-engineering, coordination-tools,
  design-review-checkpoints, general, planning-and-brainstorming, prototype, pushback, sequential-thinking-usage,
  strings, worktree-isolation. Their premises can therefore only ever be scored as false positives, and
  a badly wrong premise for any of them would go unnoticed here. The cause is structural: these situations
  were mined from TOOL-CALL descriptions, which record actions taken on the repository and not deliberative
  moments (weighing two designs, deciding whether to object, choosing where new code belongs). Covering
  them needs a second mining pass over a different signal, not more rows from this one.


  D-ROWS: a SECOND mining pass, over a different signal. The S-rows came from tool-call descriptions,
  which record actions on the repository; that signal structurally cannot contain a deliberative moment,
  which is why ten premised fragments had no coverage. The D-rows were mined from 1,558 unique passages
  of assistant reasoning and human direction across the same 86 transcripts, clustered by four independent
  agents and merged, with `observed` recomputed deterministically. The miners were NOT told which fragments
  lacked coverage: situations reverse-engineered to hit a named target would grade those premises against
  themselves.


  D-rows are UNLABELLED and need their own blind pass.


  ROUND 2 LABELLED BLIND: the deliberative pass closed 7 of the 10 coverage gaps (design-review-checkpoints,
  general, planning-and-brainstorming, prototype, pushback, sequential-thinking-usage, worktree-isolation).
  Still uncovered after BOTH signals: context-engineering, coordination-tools, strings. Two passes over
  86 transcripts found no moment expecting them, which is evidence about the fragments rather than about
  the fixture: either the moment does not arise in this repository''s work, or the guidance is aimed at
  something that does not happen here. Neither was manufactured a row to hide it.'
