// region companions: ctxloom.dev/Companion

// A companion is registered by NAME alone (OD-10, owner 2026-11-13): its
// program is found where the agent runs, so no path or command is held.
message Companion {
  // Whether a registered companion contributes (OD-9:
  // `companions.<n>.state`, a word in the config).
  enum State {
    STATE_UNSPECIFIED = 0;
    // It is asked for its loadout, and what it gives is used: the default.
    ENABLED = 1;
    // It stays registered and listed, and contributes nothing.
    DISABLED = 2;
  }

  // IDENTIFIER.
  string name = 1;
  // OUTPUT_ONLY: the program its name stands for: a shipped companion's own
  // name (ltk, taskloom, reprise), any other `ctxloom-companion-<name>`.
  string bin = 2;
  // The command a registration held (schema 9 before OD-10): gone with it,
  // a hard migrate.
  reserved 3;
  reserved "command";
  // OUTPUT_ONLY: its program resolves on the PATH where it is asked,
  // printed true or false. was: exists.
  optional bool resolves = 4;
  State state = 5;
}

message ListCompanionsRequest {
  string parent = 1;
  int32 page_size = 80;
  string page_token = 81;
