name: Auto Release

# On a successful CI run for a push to the active release line, tag the version
# in the VERSION file and push that tag, which triggers release-completer.yml.
#
# This does NOT bump the version — the version is set deliberately via
# versionator, and ci.yml's version-guard ensures a change to it is fresh. It
# runs after EVERY green push, so on all but the push that set VERSION the tag
# already exists: release-tag skips a tag this commit contains and refuses one
# it does not.
#
# The tag is pushed with RELEASE_TAG_TOKEN (a PAT with contents:write on this
# repo), NOT the default GITHUB_TOKEN: tags pushed by GITHUB_TOKEN do not start
# other workflows, so release-completer would never fire.
#
# Every step is a `just` target — see the header of ci.yml and build/ci.justfile.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    # The ACTIVE release line, pinned rather than matched. `main` is not the
    # branch being released, so auto-release keyed on it never fired for the
    # line that is; and `release/*` would CUT A RELEASE from any historical
    # line that received a push. Bump this when a new line opens.
    branches: [release/0.7]

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag VERSION and trigger release
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      # Check out the SAME commit CI just went green on, not a branch name.
      # This said `ref: main` — so even with the trigger fixed, the tag would
      # have been cut from the dead branch's tree rather than the one that
      # passed. Using the triggering SHA also closes the race where another
      # push lands between CI finishing and this job checking out.
      - name: Checkout the commit CI validated
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - uses: ./.github/actions/setup-just

      - name: Configure git
        run: just ci-git-config-bot

      - name: Tag VERSION (unless this line already released it)
        run: just release-tag
