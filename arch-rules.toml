# The architecture lint's rules (templates/arch-gates.just runs it): which
# role may depend on which. A crate's role is its directory,
# crates/<ring>/<role>/<crate> giving <ring>/<role>. Copy to the repository's
# top level as arch-rules.toml and edit; the table is data, so another
# repository supplies its own.
#
# Each role lists what its crates may depend on, over every normal and build
# edge between workspace members: a role (`core/wire`), a glob over roles
# (`core/*`; `*` is any run of characters, `/` included) or `@class` (a crate
# whose name matches a pattern under [classes]). A role not listed is
# refused: a new tier gets its rule before it gets code. Edges to crates
# outside the workspace are not examined.
layout = "crates"

# The roles whose dev-dependency edges are examined, more leniently: the same
# table, but a finding is a warning (it fails only under --deny-warnings).
dev_checked = ["adapters/driven", "adapters/driving"]

[classes]
# The driving adapters' shared presentation crates: domain-free, and what the
# CLI and the server both write through.
presentation = ["presentation", "*-presentation"]
# Shared infrastructure crates every driven adapter may use, listed by name.
support = []

[roles."core/wire"]
allow = ["core/wire"]
rule = "the core depends on the core only"

[roles."core/domain"]
allow = ["core/domain", "core/wire"]
rule = "the core depends on the core only, and a domain never depends on a read model"

[roles."core/read-model"]
allow = ["core/read-model", "core/domain", "core/wire"]
rule = "the core depends on the core only, and a read model never depends on the application layer"

[roles."core/ports"]
allow = ["core/ports", "core/domain", "core/wire"]
rule = "the core depends on the core only"

[roles."core/application"]
allow = ["core/*"]
rule = "the core depends on the core only"

[roles."adapters/driven"]
allow = ["core/ports", "core/wire", "@support"]
rule = "a driven adapter sees only ports and wire types, never another adapter"

[roles."adapters/driving"]
# core/wire (owner M7, slice 2): the generated types are pure data, what an
# API edge (the daemon's gRPC service, its client's CLI) renders and takes;
# they hold no behaviour of the core.
allow = ["core/application", "core/wire", "@presentation"]
rule = "a driving adapter sees only the application layer, the wire types and the presentation crates, never another adapter"

# The composition root (the binaries and their wiring library) may depend on
# anything; nothing else lists either, so nothing but the root depends on the
# root.
[roles."root/bin"]
allow = ["*"]

[roles."root/lib"]
allow = ["*"]

# A known departure, kept as debt: from, to, optionally kind ("normal",
# "build" or "dev"), and why. One that matches no finding is stale and fails.
# [[exception]]
# from = "some-crate"
# to = "other-crate"
# kind = "dev"
# reason = "why this stands"

# Dev-dependency findings (warnings), kept by the owner's ruling as test-only
# exceptions: the tests of a driving adapter build a type only the port defines.

[[exception]]
from = "deps-cli"
to = "deps-ports"
kind = "dev"
reason = "test-only: builds a type only the port defines; re-exporting it just for tests would add public API for nobody"

[[exception]]
from = "surface-cli"
to = "surface-ports"
kind = "dev"
reason = "test-only: builds a type only the port defines; re-exporting it just for tests would add public API for nobody"

[[exception]]
from = "run-cli"
to = "runs"
kind = "dev"
reason = "test-only: builds the runs domain's refusals a RunError carries (ruling 73's aggregate), to hand on; re-exporting them just for tests would add public API for nobody"

# hook-listener's end-to-end test serves the real kernel on a real socket: it
# builds the application behind the edge (the kernel's registry of the two
# domains the hook reaches and its `embedded-edge` adapter) and the commands and
# facts the domains define, and asks the ports for the bearer and the socket
# path the run names. Test-only; none of it is in the crate's own build.

[[exception]]
from = "hook-listener"
to = "hook-tls"
kind = "dev"
reason = "test-only: mints the per-run certificate the listener is served with, by the same mint the run uses"

[[exception]]
from = "hook-sink-grpc"
to = "hook-tls"
kind = "dev"
reason = "test-only: mints the per-run certificates the fake TLS listener is served with, by the same mint the run uses"

[[exception]]
from = "daemon-client"
to = "hook-tls"
kind = "dev"
reason = "test-only: mints the certificate the fake daemon is served with, by the same mint the daemon uses"

[[exception]]
from = "daemon-api-grpc"
to = "run-ports"
kind = "dev"
reason = "test-only: builds the user bearer the gate is made from, as the daemon mints it"

[[exception]]
from = "hook-listener"
to = "embedded-edge"
kind = "dev"
reason = "test-only: the end-to-end test serves the real kernel through the edge adapter"

[[exception]]
from = "hook-listener"
to = "run-ports"
kind = "dev"
reason = "test-only: builds the bearer, the token source and the socket path the run's ports define"

[[exception]]
from = "hook-listener"
to = "runs"
kind = "dev"
reason = "test-only: registers the runs aggregate and builds the facts its domain defines"

[[exception]]
from = "hook-listener"
to = "sessions"
kind = "dev"
reason = "test-only: registers the sessions aggregate and builds the facts and commands its domain defines"

# session-cli depends on itself, as a dev-dependency, with `session-destroy`
# (rulings 94b, 98, 99): the destroy compiles only under that feature, and the
# crate's own tests and mutants must see it with no feature rule; a plain build
# builds no dev-dependency, so the shipped binary stays without it
# (scripts/plain-destroy-check.sh).
[[exception]]
from = "session-cli"
to = "session-cli"
kind = "dev"
reason = "test-only: the crate's own tests compile the session-destroy feature (ruling 99) through a self dev-dependency, so no feature rule is needed and the plain binary stays without the destroy"

# daemon-api-grpc depends on itself, as a dev-dependency, with
# `session-destroy` (M5, owner 2026-11-12), for the same reason: the served
# DeleteSession and SweepSessions compile only under it.
[[exception]]
from = "daemon-api-grpc"
to = "daemon-api-grpc"
kind = "dev"
reason = "test-only: the crate's own tests compile the served destroy (M5) through a self dev-dependency, so no feature rule is needed and the plain daemon answers UNIMPLEMENTED"
