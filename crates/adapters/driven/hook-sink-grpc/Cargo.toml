[package]
name = "hook-sink-grpc"
version = "0.1.0"
description = "run-ports' FactSink over gRPC: a hook process delivers a fact book to the run process's CommandHandlerCoordinatorService.Handle over TCP, the bearer in the authorization metadata"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded.workspace = true
angzarr-proto-transport-distributed.workspace = true
run-ports.workspace = true
prost.workspace = true
prost-types.workspace = true
# The client channel, TLS on ring (never aws-lc): the endpoint is https and the run's
# certificate is the channel's sole root.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring"] }
# The standard grpc.health.v1 client (liveness, T16), at the version the lock
# already holds for angzarr's server: nothing new is linked.
tonic-health = { version = "0.14.9", default-features = false }
# One current-thread runtime for the call: time for the deadline, net for the connection.
tokio = { workspace = true, features = ["rt", "time", "net"] }

[dev-dependencies]
hook-tls.workspace = true
mutants.workspace = true
# The fake server of the tests: the generated service trait, served on a loopback TCP port.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "router", "server", "tls-ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio = { workspace = true, features = ["rt", "time", "net", "sync"] }

[lints]
workspace = true
