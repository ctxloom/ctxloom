name: CI

on:
  push:
    branches: [main, initial-prototyping]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-devcontainer

jobs:
  # Release gate: every change to main must carry a fresh, untagged VERSION.
  # Fails the PR/push if VERSION already has a git tag, forcing a deliberate
  # `versionator set` bump (no auto-increment). On merge, auto-release.yml tags
  # this VERSION and triggers the release.
  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if VERSION is already tagged
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$V" ]; then
            echo "::error::VERSION file is empty"; exit 1
          fi
          TAG="v${V#v}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error file=VERSION::VERSION $V is already tagged ($TAG). Bump it (versionator set <next>) before merging."
            exit 1
          fi
          echo "VERSION $V ($TAG) is not yet tagged — OK to merge and release."

  build-container:
    name: Build Dev Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build-container]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate protobuf code
        run: buf generate

      - name: Generate JSON Schemas
        run: just -f justfile.container gen-schemas

      - name: Run tests
        run: just -f justfile.container test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [build-container]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate protobuf code
        run: buf generate

      - name: Run golangci-lint
        run: just -f justfile.container lint

      - name: Enforce cyclomatic complexity (CCN ≤ 10)
        run: just -f justfile.container complexity-check

      - name: Generate JSON Schemas (verify the generator runs clean)
        run: just -f justfile.container gen-schemas

      # Drift gate for the generated CLI reference: regenerate from the cobra
      # command tree and fail if the checked-in website pages are stale. The
      # safe.directory mark is needed because the recipe runs `git diff` inside
      # the devcontainer image.
      - name: Check generated CLI docs are current
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just -f justfile.container gen-docs-check

      # Drift gate for the proto-canonical MCP tool schemas: regenerate from
      # the buf-built descriptor set and fail if the checked-in goldens are
      # stale.
      - name: Check generated MCP tool schemas are current
        run: just -f justfile.container gen-mcp-schemas-check

  build-and-integration:
    name: Build & Integration Tests
    runs-on: ubuntu-latest
    needs: [build-container, test]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: just -f justfile.container build

      - name: Add binaries to PATH
        run: |
          echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Run integration tests
        run: just -f justfile.container test-integration

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctxloom-linux-amd64
          path: |
            ctxloom
          retention-days: 7

  acceptance:
    name: Acceptance Tests (hermetic)
    runs-on: ubuntu-latest
    needs: [build-container, test]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The godog suite execs the real ctxloom binary as a subprocess; it resolves
      # it from PATH (or CTXLOOM_BINARY). `build` writes ./ctxloom into the
      # workspace, so add the workspace to PATH before running.
      - name: Add binaries to PATH
        run: echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH

      # Hermetic only (~@live && ~@network): real CLI subprocesses + a real MCP
      # server + the mock LLM backend. No network, no real agent, no secrets.
      - name: Run acceptance suite
        run: just -f justfile.container test-acceptance

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: [build-container, test]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate protobuf code
        run: buf generate

      # Diff-only mutation on both PR and push, so a green PR runs the same
      # check that gates the release on main. The whole-codebase run is too slow
      # for every PR; it runs weekly instead (mutation-weekly.yml).
      - name: Run mutation tests (diff)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against — skipping mutation testing."; exit 0
          fi
          # gremlins fails an empty changeset (0 mutants => 0% efficacy => exit
          # 10); skip when the diff has no mutable Go (mirrors .gremlins.yaml
          # exclude-files) so docs/workflow/test-only changes aren't blocked.
          mutable="$(git diff --name-only "$base"...HEAD -- '*.go' \
            | grep -vE '(_test\.go$|\.pb\.go$|/mock_[^/]*\.go$|(^|/)testdata/|(^|/)tests/integration/)' || true)"
          if [ -z "$mutable" ]; then
            echo "No mutable Go files changed vs $base — skipping mutation testing."; exit 0
          fi
          echo "Mutable Go files in diff:"; printf '  %s\n' $mutable
          gremlins unleash --diff "$base"
