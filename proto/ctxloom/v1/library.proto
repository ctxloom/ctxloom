  SourcedText session_home = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An agent: a binding of an engine to the profiles its context is composed
// from (`agents.<n>` of the config).
message Agent {
  option (google.api.resource) = {
    type: "ctxloom.dev/Agent"
    pattern: "projects/{project}/agents/{agent}"
    pattern: "users/me/agents/{agent}"
    singular: "agent"
    plural: "agents"
  };

  // How much of an agent to answer (AIP-157).
  enum View {
    // Unset: BASIC for a List, FULL for a Get.
    VIEW_UNSPECIFIED = 0;
    // A list row (`agent list`): the binding as written.
    BASIC = 1;
    // `agent show`: the binding and what it resolves to.
    FULL = 2;
  }

  // IDENTIFIER: `projects/{project}/agents/{agent}`, `users/me/agents/{agent}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The Engine's name.
  string engine = 2 [(google.api.field_behavior) = OPTIONAL];
  // Profile names.
  repeated string profiles = 3 [(google.api.field_behavior) = OPTIONAL];
  // The runtime axis as the binding says it (`host`, `container-rootless`,
  // `container-rootful`); empty, the project's default.
  string runtime = 4 [(google.api.field_behavior) = OPTIONAL];
  // How the agent is driven, as the binding says it: `conversational` or
  // `oneshot`.
  string driving = 5 [(google.api.field_behavior) = OPTIONAL];
  // The bare variable names the binding passes through to the engine
  // (`--env`), added to its engine block's.
  repeated string env = 6 [(google.api.field_behavior) = OPTIONAL];
  // Keyed by engine ID, so `engines.<e>.model` keeps its path.
  map<string, AgentEngine> engines = 7 [(google.api.field_behavior) = OPTIONAL];
  // OUTPUT_ONLY: the default agent, printed true or false (OQ-7).
  optional bool default = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `session` | `host`, as the agent's binding says it; unset, its engine
  // block's (owner ruling of 2026-11-13).
  string session_home = 9 [(google.api.field_behavior) = OPTIONAL];
  // A write's model (`--model`), written to the block of the engine the
  // agent runs on: the write's `engine`, else the agent's, else the default
  // engine's (ruling 68); read back in `engines`. Empty, under the mask, the
  // engine's default again. Additive proto extension, owner ruling
  // 2026-11-18.
  string model = 10 [(google.api.field_behavior) = INPUT_ONLY];
  // A write's effort level (`--effort`), written as `model` is. Additive
  // proto extension, owner ruling 2026-11-18.
  string effort = 11 [(google.api.field_behavior) = INPUT_ONLY];
  // A write's surface delivery preferences (`--surface kind=approach`),
  // replacing the binding's; empty, under the mask, cleared. Not yet
  // answered by a read. Additive proto extension, owner ruling 2026-11-18.
  map<string, string> surfaces = 12 [(google.api.field_behavior) = INPUT_ONLY];
  // A write's roots per surface kind (`--root kind=root`), replacing the
  // binding's; empty, under the mask, cleared. Not yet answered by a read.
  // Additive proto extension, owner ruling 2026-11-18.
  map<string, string> roots = 13 [(google.api.field_behavior) = INPUT_ONLY];
  // OUTPUT_ONLY, FULL.
  ResolvedAgent resolved = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // FULL: why the agent did not resolve; empty when it did.
