version: 1.0.0
description: 'Situations for MEASURING premise selection against the premise_spike corpus.

  This is DATA AND GROUND TRUTH, deliberately not a test. Selection is performed by a model, and wiring
  a model''s reasoned output into the suite would make a gate that reddens on temperature rather than
  on a defect. Run it as a measurement, read the numbers, and decide; never assert them.

  Each situation is written as the agent''s own statement of what it is about to do -- the form a premise
  is actually judged against.NO NEGATIVE LIST, DELIBERATELY. Ground truth names only what SHOULD be selected.
  Anything else selected is a false positive whether or not anyone anticipated it. Enumerating the tempting-but-wrong
  fragments would close an open seam: it measures the model against the labeller''s imagination of failure,
  and the failure worth finding is the one nobody imagined. Over-selection is caught instead by precision
  and by NOTHING-APPLIES situations, where any selection at all counts against the run.'
metrics:
  precision: selected AND expected, over selected
  recall: selected AND expected, over expected
  silent_drop: 'expected but NOT selected, over expected -- the expensive error: the agent never learns
    the fragment existed'
  over_selection: mean count selected per situation; the number that dies if premises are widened without
    limit
situations:
- id: S1
  intent: I ran `go test ./internal/mcp` and the tool refused it, telling me to use the project's task
    runner instead. I have to decide how to rerun it.
  expect:
  - ltk
  - just
  - golang
  discriminator: true
- id: S2
  intent: I'm writing the pull request description that summarises what changed in this branch and why.
  expect:
  - banned-phrases
  note: A PR description recording what changed is legitimate; the provenance rule governs code comments
    and docs, not a PR body.
- id: S3
  intent: This change is ready to start. I'll cut a worktree for it off release/0.7, and remove the worktree
    and delete the branch once it merges.
  expect:
  - worktree-lifecycle
- id: S4
  intent: My new test passes. Before I call it done I want to know whether it actually proves anything.
  expect:
  - mutation-as-test-validator
- id: S5
  intent: I'm dispatching a sub-agent to do this refactor and need to write the brief it will work from.
  expect:
  - prompt-authoring
- id: S6
  intent: "We're shipping v0.8.0 \u2014 bump the version, tag it, and publish the release artifacts."
  expect:
  - github-release-master
- id: S7
  intent: I'm adding a comment above this function noting that we replaced the old approach last month
    after it broke in production.
  expect:
  - no-provenance-comments
- id: S8
  intent: Every call of the form `foo(ctx, nil)` needs to become `foo(ctx)` across about two hundred files,
    matched structurally rather than by text.
  expect:
  - ast-grep
- id: S9
  intent: "The duplicate-code gate fired on my change \u2014 it found three near-identical blocks and\
    \ wants me to look at them."
  expect:
  - reprise
- id: S10
  intent: Writing a small Python script to parse the log file and emit a CSV summary.
  expect:
  - python
  note: 'Language cross-talk probe: sibling language fragments share a premise shape and are the likeliest
    false positives.'
- id: S11
  intent: This repository has submodules and I need to bump one of them to a newer commit.
  expect:
  - git-submodule
- id: S12
  intent: Refactoring a React component's prop types, tightening the TypeScript interfaces.
  expect:
  - typescript
- id: S14
  intent: Adding a new error variant to this crate and threading it through the Result types the callers
    match on.
  expect:
  - rust
- id: S13
  intent: The user asked which time zone the server logs are stamped in. I'll read one log line and answer
    them.
  expect: []
  canary: true
