# Build against local sibling checkouts while changing one of them and this
# workspace together:
#
#     cp .cargo/local-deps.toml .cargo/config.toml     # on
#     rm .cargo/config.toml                            # off
#
# Cargo reads only .cargo/config.toml, which .gitignore keeps out of every
# commit, so CI, a fresh clone and the pre-commit gates build the pinned git
# revisions in Cargo.toml. Add a [patch."<git url>"] table per sibling, with
# paths relative to the checkout's root. Restore Cargo.lock
# (`git checkout Cargo.lock`) before committing, and once the sibling's change
# is pushed, bump the rev in Cargo.toml instead.

# ctxloom-lib (cli-support), the shared substrate: uncomment to build against
# the sibling checkout (../ctxloom-lib from this checkout's parent).
# [patch."https://github.com/ctxloom/ctxloom-lib"]
# cli-support = { path = "../ctxloom-lib/crates/adapters/driving/cli-support" }
