[package]
name = "ctxloom-lib"
version = "0.1.0"
description = "ctxloom's wiring: the core's ports over their default adapters, shared by the binary and the tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
angzarr-embedded.workspace = true
angzarr-presentation.workspace = true
clap.workspace = true
config-files.workspace = true
content-fs.workspace = true
editor-process.workspace = true
companion-probe.workspace = true
ctxloom-cli.workspace = true
ctxloom-ports.workspace = true
library-application.workspace = true
deps.workspace = true
deps-application.workspace = true
deps-cli.workspace = true
deps-files.workspace = true
forge-github.workspace = true
deps-ports.workspace = true
remote-git.workspace = true
library-cli.workspace = true
ctxloom-store-sqlite.workspace = true
file-lock.workspace = true
file-system.workspace = true
liveness.workspace = true
project-registry.workspace = true
session-files.workspace = true
sessions-application.workspace = true
system.workspace = true
# taskloom's harp ids and the Names port they implement, by commit.
harp-names.workspace = true
os.workspace = true
ports.workspace = true
tokio.workspace = true
uuid.workspace = true
# Only the seed mints sessions: the real mint is the run slice's.
sessions = { workspace = true, optional = true }
session-ports = { workspace = true, optional = true }

[dev-dependencies]
harp-core.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests, and the seed the
# acceptance tests plant sessions with (`ctxloom test seed-session`).
test-support = [
    "ctxloom-store-sqlite/test-support",
    "ctxloom-cli/test-support",
    "dep:sessions",
    "dep:session-ports",
]

[lints]
workspace = true
