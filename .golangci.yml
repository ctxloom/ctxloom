# golangci-lint v2 configuration.
#
# v2 removed the default exclusion presets that v1 enabled out of the box. This
# codebase was written against those defaults — in particular it intentionally
# does not check errors from fmt.Fprint*/Print* to CLI output and from Close().
# Restore the standard exclusions so errcheck stops flagging those as failures.
version: "2"

# Build tags golangci-lint type-checks in addition to the default build.
#
# Without `mutation` here, every `//go:build mutation` file — the whole of
# tests/mutation/ — is invisible to `just lint`: golangci-lint loads only the
# default build, and the vet step ahead of it runs `-tags integration`. The
# gate exited 0 having never looked at them, which is this repo's recurring
# vacuous-green shape. Measured both ways with a deliberate `unused` violation
# planted in tests/mutation/targets_test.go: 0 issues without this block, 1
# issue with it.
#
# Only tags whose files NOTHING else type-checks belong here. `integration`
# does not: the vet-integration recipe already covers it, and adding it would
# double-report. Every entry costs a second type-check pass over the packages
# it opens up, so this list stays short by intent rather than by accident.
#
# `arch`, `conformance` and `docker_integration` are ADDITIVE: no file carries
# a negated constraint for any of them, so enabling them only opens files up
# and cannot close any. Their first pass found a docker_integration test that
# no longer compiled against the signature it called.
#
# `docsgen` and `schemagen` are deliberately ABSENT, and appending them here is
# the wrong fix. Each has files on BOTH sides of its constraint —
# cmd/{ltk,taskloom}/docs_off.go and cmd/gen-schemas/stub.go are `!docsgen` /
# `!schemagen`. Enabling the tag SWAPS which file builds rather than opening
# another, so this list would trade away coverage of the files it currently
# lints. Covering those two needs a second invocation under the tag, not an
# entry here.
run:
  build-tags:
    - mutation
    - arch
    - conformance
    - docker_integration
    # The acceptance suite is 80 tag-gated files. Without these two it was never
    # linted at all, and the untagged fixtures its tagged steps consume (
    # capability_probe_fixture.go, probe_p6_steer_echo.go) read as dead code
    # because only their definitions were visible. Neither tag has a `!tag`
    # counterpart, so unlike docsgen/schemagen above, adding them opens files
    # rather than swapping which one builds.
    - acceptance
    - integration

# Report EVERY instance, not a sample of each.
#
# The defaults cap a linter at 50 findings and any one message at 3, so a
# repo-wide drift is reported three files at a time. The count is then a
# floor wearing the clothes of a total: nine unformatted files reported as
# "3 issues", and fixing those three revealed the next three. A gate whose
# number cannot be trusted is worse than a loud one.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - forbidigo
  settings:
    forbidigo:
      # Type-aware matching, so an aliased import (yamlv3.Marshal) is matched
      # by its package path rather than slipping past a text pattern.
      analyze-types: true
      forbid:
        - pattern: 'os\.Setenv'
          msg: 'use t.Setenv (auto-restores) or testsupport.Isolate/ProjectDir'
        - pattern: 'os\.Chdir'
          msg: 'use testsupport.ProjectDir'
        - pattern: '\.ResetConnectBackoff$'
          msg: 'grpc iterates the conn''s subconn map outside its lock here, racing the balancer; dial a fresh conn per attempt instead (runner.Home.runChannelAttempt)'
        # One encoder for everything: yamlx.Marshal is the only YAML serializer,
        # so an ordinary save and the --write-upgrades write-back (upgrade.Encode,
        # which delegates to it) produce the same bytes. Tests included: a test
        # that renders YAML another way pins a format nothing writes.
        - pattern: '^yaml\.(Marshal|NewEncoder)$'
          pkg: '^gopkg\.in/yaml\.v3$'
          msg: 'serialize YAML with yamlx.Marshal (internal/shared/yamlx), the one encoder every writer and the upgrade write-back share'
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path-except: '_test\.go'
        linters:
          - forbidigo
        text: 'os\.(Setenv|Chdir)'
      # yamlx is the encoder itself.
      - path: 'internal/shared/yamlx/'
        linters:
          - forbidigo
        text: 'yamlx\.Marshal'
      # pkg/clifmt renders --format yaml command OUTPUT, not a file ctxloom
      # saves, and it is the module's standalone leaf library (stdlib, toml and
      # yaml.v3 only; docs/architecture/companions/clifmt.md). Routing it through
      # internal/shared/yamlx would tie it to ctxloom's internals and change the
      # --format yaml output of every command, which the one-encoder ruling did
      # not ask for.
      - path: 'pkg/clifmt/marshal\.go'
        linters:
          - forbidigo
        text: 'yamlx\.Marshal'

# v2 moved formatting checks out of `linters:` into this separate top-level
# section. Without it, `just lint` never gates Go source formatting at all —
# gofmt drift accumulates silently and CI stays green regardless. Plain gofmt
# is deliberately the only formatter enabled: gofumpt/goimports are stricter
# and would reformat far more of the repo than the drift this gate exists to
# catch, turning a gate fix into an unrelated repo-wide churn commit.
formatters:
  enable:
    - gofmt
