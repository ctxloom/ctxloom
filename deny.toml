# cargo-deny: what may enter the dependency graph. `just lint-deps` runs it.

[advisories]
version = 2
# RustSec advisories. An ignore needs the advisory id and why it does not
# apply here.
ignore = [
  # RUSTSEC-2026-0459: the bundled SQLite (libsqlite3-sys 0.30.1, reached through
  # sqlx 0.8's bundled sqlite feature in angzarr's `angzarr-store-sqlite`) can
  # return uninitialized page-cache memory when a process opens a database beside a
  # `-wal` file of a different page size. Exposed only to a database and -wal that a
  # less trusted party could have written; ours live in the user's own ~/.ctxloom.
  # sqlx-sqlite 0.8.6 requires libsqlite3-sys ^0.30.1, and sqlx 0.9.0 requires
  # <0.38, so no released sqlx admits the fixed 0.39: a lock-only fix is impossible.
  # Revisit when a sqlx release admits libsqlite3-sys >= 0.39.0 (or the store pins
  # sqlx's main by rev); delete this entry then.
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite via angzarr's store; databases are the user's own; upstream bump pending" },
  # RUSTSEC-2026-0542: humantime 2.4.0 is flagged unmaintained because chrono is
  # (informational; no vulnerability, no safe upgrade exists). It is reached only
  # through cucumber 0.21.1, a dev-dependency of the ctxloom test harness, so it is
  # not in any shipped binary. Revisit when cucumber drops humantime or moves off
  # chrono; delete this entry then.
  { id = "RUSTSEC-2026-0542", reason = "unmaintained, informational; dev-only via cucumber; no upgrade available" },
]

[licenses]
version = 2
# ctxloom is Apache-2.0 OR BSD-3-Clause; every license here may be combined with it.
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  # ring (`Apache-2.0 AND ISC`), untrusted and rustls-webpki, the crypto
  # provider of the callback's TLS (owner, 2026-11-09, ruling 35); ISC is a
  # permissive licence, as MIT and BSD are.
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

# angzarr's crates carry AGPL-3.0-only plus an additional permission (the
# runtime exception, or the gRPC API permission, in its LICENSE files); the
# SPDX expression with the additional term is not in `allow`, so each crate is
# allowed by name.
[[licenses.exceptions]]
crate = "angzarr-bus"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-runtime-exception"]

[[licenses.exceptions]]
crate = "angzarr-diagnostic"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-runtime-exception"]

[[licenses.exceptions]]
crate = "angzarr-embedded"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-runtime-exception"]

[[licenses.exceptions]]
crate = "angzarr-embedded-host"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-runtime-exception"]

[[licenses.exceptions]]
crate = "angzarr-embedded-runner"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-runtime-exception"]

[[licenses.exceptions]]
crate = "angzarr-ports"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-runtime-exception"]

[[licenses.exceptions]]
crate = "angzarr-presentation"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-runtime-exception"]

[[licenses.exceptions]]
crate = "angzarr-yaml"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-runtime-exception"]

[[licenses.exceptions]]
crate = "angzarr-coordinator"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-grpc-api-permission"]

[[licenses.exceptions]]
crate = "angzarr-coordinator-base"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-grpc-api-permission"]

[[licenses.exceptions]]
crate = "angzarr-coordinator-grpc"
allow = ["AGPL-3.0-only WITH AdditionRef-angzarr-grpc-api-permission"]

[licenses.private]
# Not ignored: the git dependencies (angzarr-proto) are `publish = false`
# too, and their licenses are exactly what must be checked.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency has no version; allowed for unpublished crates only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # angzarr: one workspace (core, the platform crates os, file-system and
  # file-lock, angzarr-build and angzarr-codegen, angzarr-embedded and the
  # router it runs handlers through).
  "https://github.com/angzarr-io/angzarr",
  # taskloom, by commit: harp-names and its ports.
  "https://github.com/ctxloom/taskloom",
  # rust-support, by commit: the shared driving-edge shims (cli-support), the
  # environment snapshot (process-env) and the rest of the shared substrate.
  "https://github.com/benjaminabbitt/rust-support",
  # harp-core: the word lists ids are minted from.
  "https://github.com/benjaminabbitt/harp",
]
