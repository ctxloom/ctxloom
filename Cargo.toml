[workspace]
resolver = "2"
members = ["crates/*/*/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# prost must be the version angzarr-proto generates for, so ctxloom's
# messages and angzarr's are built by one prost.
prost = "0.14"
prost-types = "0.14"
angzarr-proto = { version = "0.1", git = "https://github.com/angzarr-io/angzarr-project", rev = "672ed768aa1c8a8e05818c457c757cd406105e55" }

# Local checkouts while annals and the generator change together; each
# becomes a git dependency pinned by commit once pushed.
annals = { path = "../../annals/crates/annals" }
annals-diagnostic = { path = "../../annals/crates/annals-diagnostic" }
angzarr-build = { path = "../../angzarr/angzarr-cli/main/crates/angzarr-build" }
tasks-proto = { path = "crates/core/wire/tasks-proto" }
annals-store-sql = { path = "../../annals/crates/annals-store-sql", features = ["sqlite"] }
tasks = { path = "crates/core/domain/tasks" }
task-lists = { path = "crates/core/read-model/task-lists" }
task-priority = { path = "crates/core/read-model/task-priority" }
ports = { path = "crates/core/ports/ports" }
tasks-application = { path = "crates/core/application/tasks-application" }
project-application = { path = "crates/core/application/project-application" }
registration-application = { path = "crates/core/application/registration-application" }
project-registry = { path = "crates/adapters/driven/project-registry" }
harp-names = { path = "crates/adapters/driven/harp-names" }
task-store-sqlite = { path = "crates/adapters/driven/task-store-sqlite" }
go-task-log = { path = "crates/adapters/driven/go-task-log" }
tasks-config = { path = "crates/adapters/driven/tasks-config" }
agent-configs = { path = "crates/adapters/driven/agent-configs" }
file-lock = { path = "crates/adapters/driven/file-lock" }
system = { path = "crates/adapters/driven/system" }
tasks-cli = { path = "crates/adapters/driving/tasks-cli" }
presentation = { path = "crates/adapters/driving/presentation" }
tasks-presentation = { path = "crates/adapters/driving/tasks-presentation" }
tasks-mcp = { path = "crates/adapters/driving/tasks-mcp" }
tasks-watch = { path = "crates/adapters/driving/tasks-watch" }
tasks-run = { path = "crates/adapters/driving/tasks-run" }
project-cli = { path = "crates/adapters/driving/project-cli" }
registration-cli = { path = "crates/adapters/driving/registration-cli" }

# tagma: the tag grammar and query engine (tagma-core) and its Tag message
# (tagma-proto). Local checkouts while tagma and this workspace change
# together; each becomes a git dependency pinned by commit once pushed.
tagma-core = { path = "../../kvtag/crates/tagma-core" }
tagma-proto = { path = "../../kvtag/crates/tagma-proto" }

# Task and project ids: harp's word lists, as Go's harp ports them.
harp-core = { git = "https://github.com/benjaminabbitt/harp", rev = "21648c9712ab60a84b609e1321201f158203a4bc" }

# Third-party, for the adapters and the composition root.
clap = { version = "4.5", features = ["derive"] }
# The edge's message catalogs: Fluent's standard runtime and its language ids.
fluent-bundle = "0.15"
fluent-syntax = "0.11"
fs4 = "1.1"
# `#[mutants::skip]`, for a mutant judged equivalent. The core takes it as a
# dev-dependency, behind `cfg_attr(test, ...)`, so it links nothing new.
mutants = "0.0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml's maintained fork: serde_yaml's libyaml is unmaintained (RustSec).
serde_norway = "0.9"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt", "time"] }
unic-langid = "0.9"
# The MCP server's protocol and stdio transport: the official Rust MCP SDK.
# Pinned exactly, at 3.5.1 (2026-10-05): the newest release at least two
# weeks old when it was chosen (2026-10-21). Only the server and its
# stdio transport; no macros, so no schema is derived from Rust types (the
# tools' schemas are Go's, copied verbatim).
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
# Priority's formula evaluator: expr-lang's Rust port, so the formulas Go's
# expr-lang evaluates mean the same here. Pinned exactly, at 2.1.0
# (2026-08-21). No default features: the formulas are arithmetic, and the
# rest (time zones, JSON, regex) would link crates they never use.
expr-lang = { version = "=2.1.0", default-features = false }
# Display-width columns in text output.
unicode-width = "0.2"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.clippy]
invisible_characters = "deny"
unicode_not_nfc = "deny"
non_ascii_literal = "deny"
# Complexity, at clippy's defaults except nesting, whose threshold is in
# clippy.toml (and crates/core/clippy.toml, which shadows it there).
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
