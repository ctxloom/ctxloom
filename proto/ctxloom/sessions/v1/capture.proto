// RETIRED (owner 2026-11-15): never emitted; folded to nothing and rendered
// nothing, kept only so the streams that hold one still read (angzarr refuses
// an unknown stored type). Its fact, RecordSessionEnded, is gone: a session's
// end is its run's end (`IncarnationEnded`) and its lock's verdict.
message SessionEnded {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.SessionState"};

  string native_session = 1;
  string reason = 2;
}

message Compacted {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.SessionState"};

  string prompt_id = 1;
  CompactionPhase phase = 2;
  string trigger = 3;
  uint64 summary_bytes = 4;
  string summary_sha256 = 5;
  // Data of the engine's own that the common fields do not hold, attached by
  // its adapter: keys are namespaced by engine (`<engine>.<name>`), values are
  // text (structured data as compact JSON). Optional and additive: a stream
  // recorded before it reads as none. Carried to the log entry's `extra`,
  // never into a common field.
  map<string, string> extra = 6;
}

// The engine started a new conversation within the session: claude's /clear
// (SessionStart `source: clear`; a streaming child's
// `conversation_reset{trigger: clear}`). It carries no content. The
// conversation the clear left is the session's lineage already: the bind
// that follows displaces it (`EngineSessionBound.displaced`). external_id
// `hook:clear:<session>:<native_session>`, the NEW conversation's id, so the
// hook and the driver reporting one clear are one fact.
message RecordConversationCleared {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.sessions.v1.SessionState"
    emits: ["ctxloom.sessions.v1.ConversationCleared"]
  };

  // The engine's conversation after the clear.
  string native_session = 1;
  // What the engine named as its cause (`clear`); empty when it named none.
  string trigger = 2;
  // Data of the engine's own that the common fields do not hold, attached by
  // its adapter: keys are namespaced by engine (`<engine>.<name>`), values are
  // text (structured data as compact JSON). Optional and additive: a stream
  // recorded before it reads as none. Carried to the log entry's `extra`,
  // never into a common field.
  map<string, string> extra = 3;
}

// 10c (U13, G6/G7): the re-assembled context a live session's engine was
// handed, at the hook that carried it. Size and SHA-256 only (ruling B),
// never the text. external_id `reinject:<session>:<H(the observation's
// cause)>`, so a second hook of the same change records nothing, and the
// delivery is once. Like every fact it carries no sequence (G4
// superseded). Additive.
message RecordContextRedelivered {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.sessions.v1.SessionState"
    emits: ["ctxloom.sessions.v1.ContextRedelivered"]
  };

  // The bundles (and `config`) whose change caused it, sorted.
  repeated string bundles = 1;
  // The tree observation's cause it answers.
  string cause = 2;
  uint64 size = 3;
  string sha256 = 4;
  // The engine's hook it rode (`UserPromptSubmit`, `PostToolUse`).
  string carried_by = 5;
  // 10c (U13 rework): the tree stream positions the delivery covers, read
  // from the session's owed changes before it was re-assembled; a change
  // recorded past them stays owed. Additive.
  repeated TreePosition covered = 6;
}

message ContextRedelivered {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.SessionState"};

  repeated string bundles = 1;
  string cause = 2;
  uint64 size = 3;
  string sha256 = 4;
  string carried_by = 5;
  repeated TreePosition covered = 6;
}

// 10c (U13 rework): a library tree stream's position, its name
// (`projects/{p}/checkouts/{c}/library`, `users/me/library`) and a sequence
// of it. Additive.
message TreePosition {
  string tree = 1;
  uint64 sequence = 2;
}

// 10c (U13 rework, owner 2026-11-18): a library change a live session's
// loadout draws on, recorded on that session by the daemon's OwedContexts
// projector as it handles the change's event: the tree, the event's
// sequence, and the bundles (and `config`) of the loadout it touched,
// sorted. external_id `owed:<session>:<tree>@<sequence>` (or, at a
// loadout, `owed-at-load:<session>:<tree>@<sequence>`), so a book handed
// again is a DUPLICATE. Never refused: a stream with no live session
// records nothing. The session's next hook collects every change owed
// past its covered positions in one delivery. Additive.
message RecordContextOwed {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.sessions.v1.SessionState"
    emits: ["ctxloom.sessions.v1.ContextOwed"]
  };

  string tree = 1;
  uint64 sequence = 2;
  repeated string bundles = 3;
  // The paths (relative to the tree) of the change that the loadout draws
  // on, sorted: what a delivery over the hook's budget gives whole (its
  // changed fragments). Additive.
  repeated string paths = 4;
}

message ContextOwed {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.SessionState"};

  string tree = 1;
  uint64 sequence = 2;
  repeated string bundles = 3;
  repeated string paths = 4;
}

message ConversationCleared {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.SessionState"};

  string native_session = 1;
  string trigger = 2;
  // Data of the engine's own that the common fields do not hold, attached by
  // its adapter: keys are namespaced by engine (`<engine>.<name>`), values are
  // text (structured data as compact JSON). Optional and additive: a stream
  // recorded before it reads as none. Carried to the log entry's `extra`,
  // never into a common field.
  map<string, string> extra = 3;
}

message CaptureGapped {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.SessionState"};

  string dropped = 1;
  string why = 2;
  google.protobuf.Timestamp dropped_at = 3;
  string stamp = 4;
}
