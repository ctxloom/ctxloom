// A session (the session index's record).
message Session {
  option (google.api.resource) = {
    type: "ctxloom.dev/Session"
    pattern: "projects/{project}/sessions/{session}"
    singular: "session"
    plural: "sessions"
  };

  // A session's state: its lock's verdict, never its end stamp.
  enum State {
    // Unset; in a request's filter, any state.
    STATE_UNSPECIFIED = 0;
    // Its lock is held: a run of it is live.
    LIVE = 1;
    // Its lock proves it ended.
    ENDED = 2;
    // Its lock proves neither.
    UNKNOWN = 3;
  }

  // `projects/{project}/sessions/{session}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The stream root (UUID text), what a command's cover names.
  string uid = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Live, ended or unknown, by its lock.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The engine it runs on.
  string engine = 4;
  // The first prompt of its transcript, as its title would be without one
  // set.
  string summary = 5;
  // When it was minted.
  google.protobuf.Timestamp start_time = 6;
  // When its last run ended; unset while it is live.
  google.protobuf.Timestamp end_time = 7;
  // It is marked keep (`session keep`): no sweep or removal takes it.
  bool kept = 8;
  // The owner session's resource name.
  string owner = 9;
  // A child that was closed (`session close`).
  bool closed = 10;
  // Its children's resource names.
  repeated string children = 11;
  // `GetSession` only: the messages sent to it and not yet delivered.
  repeated PendingMessage pending = 12;
  // Its current incarnation: how many runs it has had.
  uint32 incarnation = 13;
  // The session's etag (AIP-154); not filled yet.
  string etag = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The free-text title `session rename` sets (S42); the harp never changes.
  string title = 15;
  // The engine's own session id, once bound.
  string native_session = 16;
  // The session's project directory.
  string project_root = 17;
  // Where its outputs go (`<project>/<output.dir>/<harp>`).
  string output_dir = 18;
  // Each engine session it was bound to before its native one (a /clear).
  repeated SessionRotation rotations = 19;
  // `GetSession` only: what its latest run was launched with, as that run's
  // enqueue journaled it (step 9, owner ruling 2026-11-17); unset for a run
  // that journaled none. A later edit of its agent changes only the next
  // run's.
  SessionGrant grant = 20;
  // `GetSession` only: how its latest run's last turn failed, or how the run
  // failed to start (step 9, owner ruling 2026-11-17); unset when neither
  // did. Nothing tries such a turn again: `session send <harp> wake` does.
  SessionFailure last_failure = 21;
  // `GetSession` only: its ctxloom MCP server watches it (`WatchSession`),
  // so a wake reaches it (the terminal wake); a primary session takes a
  // wake only while it does.
  bool wakeable = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
  // `GetSession` only: its terminal wake, `outstanding` (posted, its turn
  // not yet started), `not answered` (disarmed unanswered), or empty.
  string wake = 23 [(google.api.field_behavior) = OUTPUT_ONLY];
  // DRAFT (`ctxloom top`): the agent the session was planned on, from its
  // recorded loadout; empty for a session with none (the default agent, or
  // one whose loadout is not recorded).
  string agent = 24 [(google.api.field_behavior) = OUTPUT_ONLY];
  // DRAFT: the profile names its loadout composed.
  repeated string profiles = 25 [(google.api.field_behavior) = OUTPUT_ONLY];
  // DRAFT: `tags`, as the owner rules: the names of the bundles its
  // profiles' loadout loaded (neither `--tag`s nor select_tags).
  repeated string tags = 26 [(google.api.field_behavior) = OUTPUT_ONLY];
  // DRAFT (`ctxloom top`): when the session's status last changed, the time
  // of its latest lifecycle entry (started, exited, re-hosted, restarted,
  // closed, reopened) or ask entry (asked, settled) in its timeline, else
  // its end time when it has ended, else its start time. Only the top watch
  // fills it.
  google.protobuf.Timestamp state_change_time = 27 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Whether its events hold a transcript; filled where a listing asks
  // (`ListSessionsRequest.transcripts`), `session transcript list`.
  bool transcript_captured = 28 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The size of that transcript as `session transcript show` prints it.
  uint64 transcript_bytes = 29 [(google.api.field_behavior) = OUTPUT_ONLY];
}

