[hooks]
[[hooks.PostToolUse]]
matcher = 'Edit|Write'

[[hooks.PostToolUse.hooks]]
command = 'ctxloom hook stamp-plan'
type = 'command'

[[hooks.PreToolUse]]
matcher = 'Bash|PowerShell|Edit|Write|MultiEdit|NotebookEdit'

[[hooks.PreToolUse.hooks]]
command = 'ltk evaluate'
type = 'command'

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
command = 'ctxloom hook session-bind'
type = 'command'

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
command = "'/home/babbitt/go/bin/ctxloom' hook inject-context --project '/home/babbitt/workspace/ctxloom/ctxloom/main' --part 1 --of 4 6c4f653a03af0bd7"
timeout = 60
type = 'command'

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
command = "'/home/babbitt/go/bin/ctxloom' hook inject-context --project '/home/babbitt/workspace/ctxloom/ctxloom/main' --part 2 --of 4 6c4f653a03af0bd7"
timeout = 60
type = 'command'

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
command = "'/home/babbitt/go/bin/ctxloom' hook inject-context --project '/home/babbitt/workspace/ctxloom/ctxloom/main' --part 3 --of 4 6c4f653a03af0bd7"
timeout = 60
type = 'command'

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
command = "'/home/babbitt/go/bin/ctxloom' hook inject-context --project '/home/babbitt/workspace/ctxloom/ctxloom/main' --part 4 --of 4 6c4f653a03af0bd7"
timeout = 60
type = 'command'

[mcp_servers]
[mcp_servers.ctxloom]
args = ['mcp']
command = '/home/babbitt/go/bin/ctxloom'

[mcp_servers.sequential-thinking]
args = ['-y', '@modelcontextprotocol/server-sequential-thinking']
command = 'npx'

[mcp_servers.taskloom]
args = ['mcp']
command = 'taskloom'
