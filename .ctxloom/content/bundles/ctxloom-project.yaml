version: 1.0.0
description: 'How this project itself is configured: the config precedence chain, the two override channels,
  and why a command''s own flags are not one of them.'
fragments:
  config-hierarchy:
    tags:
    - ctxloom
    - config
    content: "# Configuration precedence\n\nEvery binary in the ctxloom family (ctxloom, taskloom, ltk)\
      \ resolves\nconfiguration through one shared chain, owned by\n`internal/shared/confload`:\n\n  \
      \  home config file  <  project config file  <  ENV VARS  <  --config-set FLAGS\n\nLater layers\
      \ win. `confload` reads and deep-merges the file layers and\nresolves both override channels against\
      \ the merged result, so there is\nexactly one place this ordering is implemented — do not re-derive\
      \ it in\na command.\n\n## The two override channels\n\n**Environment** — a dedicated namespace under\
      \ the product's env prefix\n(`CTXLOOM_CONFIG_`), e.g. `CTXLOOM_CONFIG_LLM_DEFAULTS_PRIMARY=big`.\n\
      \n**`--config-set`** — a repeatable root flag taking `<dotted.path>=<value>`,\ne.g. `--config-set\
      \ agents.MyCoder.runtime=container`.\n\n## A command's own flags are NOT a config source\n\n`--config-set`\
      \ is the ONLY flag channel. `confload` deliberately does not\ntreat a changed flag's NAME as a config\
      \ path, and this is load-bearing\nrather than stylistic — an earlier revision did exactly that,\
      \ and it\nsilently coupled every current and future flag name to the config schema.\nTwo failures\
      \ were confirmed in production:\n\n- `ctxloom agent set coder --runtime container` clobbered the\
      \ project's\n  top-level `runtime` key, because `--runtime` resolved as a config path.\n- `--format\
      \ json` on a structured-output command printed a warning line\n  into what a script expected to\
      \ be pure JSON, because `--format`\n  resolved as \"unrecognized config key, setting it anyway\"\
      .\n\nSo when you add a flag, it configures THAT invocation. If the value\nbelongs in config, give\
      \ it a schema path and let the chain resolve it;\nnever bridge a flag name to a config key by convention.\n\
      \n## Case handling diverges between the two channels, deliberately\n\nA shell destroys an env var\
      \ name's case before Go sees it\n(`CTXLOOM_CONFIG_AGENTS_MYCODER_RUNTIME` cannot say whether the\
      \ author\nwrote `MyCoder`, `mycoder`, or `MYCODER`). A `--config-set` value never\npasses through\
      \ those rules, so it preserves exactly what was typed.\n\nBoth resolve identically when the target\
      \ already exists or is a fixed,\ncanonically-cased schema field: case-insensitive match, adopting\
      \ the\nexisting casing. They diverge only at a dynamic level that nothing\nexisting covers — an\
      \ agent label, an LLM config label. There, env falls\nback to whatever the shell handed over, while\
      \ `--config-set` preserves\nthe typed case. That is why `--config-set` can mint a brand-new\ncase-sensitive\
      \ key (`agents.MyCoder.runtime=container`,\n`llm.configs.big.env.GEMINI_API_KEY=...`) and env fundamentally\
      \ cannot."
    no_distill: true
    premise: You are adding or changing a flag, an environment variable, or a config key; working out
      which layer won when a setting resolved unexpectedly; or reading configuration to decide how something
      is declared. For anyone touching how this family of binaries is configured, however the moment is
      worded.
  fail-loud-launch:
    tags:
    - ctxloom
    - workflow
    - trust
    content: "# Refuse when something is amiss; `--degraded` is the way through\n\n**The default posture\
      \ is REFUSE, not proceed.** When ctxloom finds something\nwrong at startup — broken config, an unresolvable\
      \ profile or bundle, a failed\nhook apply, an invalid document — it ABORTS the launch and says what\
      \ is wrong\nand how to fix it. It does not quietly launch something lesser.\n\nThis is a deliberate\
      \ pivot away from always-launch. Always-launch produced\nCONFIDENT WRONG WORK: a bad or missing\
      \ agent name silently degraded to\n`host`+`none`, discarding the runtime and permissions that were\
      \ asked for, with\nonly a stderr warning nobody read. The agent then ran unisolated while everyone\n\
      believed otherwise. A launch that succeeds without doing the thing is worse\nthan one that refuses,\
      \ because nothing downstream can tell the difference.\n\n## `--degraded` always reaches a working\
      \ LLM\n\n`--degraded` (and `CTXLOOM_DEGRADED=1`; the flag wins) lowers every finding\nfrom an error\
      \ to a WARNING and continues. That is a promise, not a\nbest-effort: **degraded mode always gets\
      \ the user into a working LLM.** If a\ndegraded run can still refuse to launch for an ordinary finding,\
      \ degraded mode\nis broken.\n\nSo the two modes divide cleanly:\n\n    default      refuse, and\
      \ explain the remedy\n    --degraded   warn, and launch anyway\n\n## The one exception: launching\
      \ is itself the danger\n\nSecurity findings where starting the LLM is the harm do NOT yield to\n\
      `--degraded`. A breached trust or isolation boundary — credentials reachable\nthat should not be,\
      \ an ownership mismatch on the runtime axis, unverifiable\ncontent admitted to an execution surface\
      \ — stays fatal in both modes.\n\nThe test is not \"is this serious?\" but **\"does launching cause\
      \ the harm?\"** A\nprofile that fails to parse is serious and still degradable: the user gets a\n\
      working LLM with less context. A container runtime that cannot provide the\nisolation it claimed\
      \ is not degradable, because the launch IS the exposure.\n`--degraded` falls back to the HOST, never\
      \ to a different ownership mode.\n\n## How to write one of these, mechanically\n\nReport the finding;\
      \ let `strictness` decide its fatality:\n\n    strictness.FailOnce(strictness.ClassConfig, \"<the\
      \ remedy>\", ...)\n\n`internal/profiles/profiles.go` already does exactly this for the\nempty-profile\
      \ cases. `strictness` owns the fatal-vs-warn decision centrally and\n`SetDegraded` flips it process-wide,\
      \ which is what makes the guarantee above\nhold everywhere at once.\n\nTherefore, at the site of\
      \ a check:\n\n- **Do NOT branch on degraded state.** No `if strictness.Degraded()`, no\n  `strict\
      \ bool` parameter, no per-call fatality argument. A check that decides\n  its own fatality is a\
      \ second policy that will disagree with the first.\n- **Do state the REMEDY, not just the complaint.**\
      \ The refusal is the entire\n  user interface for the failure. \"invalid profile\" is a dead end;\
      \ \"give the\n  profile something to select (parents, bundles, fragments, select_tags) or\n  delete\
      \ it\" is error correction. Write the sentence that ends the problem.\n- **Do make sure the remedy\
      \ is followable.** A message advising an action the\n  caller cannot take — telling them to drop\
      \ a flag they never passed — is\n  proof the check is firing outside its own design premise. Fix\
      \ the premise,\n  not the wording.\n- **Report every problem, not the first.** `FailOnce` records\
      \ and the startup\n  gate decides; a user fixing four things one launch at a time is paying for\n\
      \  our convenience.\n\n## Testing it\n\nPin BOTH arms, and mutate each. The same bad input must\
      \ REFUSE by default\n(nonzero exit, nothing launched) and WARN-then-launch under `--degraded`. A\n\
      test covering only the refusal lets degraded mode silently start refusing too,\nwhich breaks the\
      \ guarantee for every existing user; a test covering only the\ndegraded arm lets the refusal rot\
      \ into a no-op. Assert the EFFECT — exit status\nand whether an engine actually started — never\
      \ the message text alone.\n"
    premise: You are writing a check that can find something wrong; deciding what a command should do
      when its input is broken, missing, or untrusted; or choosing between refusing and carrying on with
      less. For anyone deciding how loudly a failure should surface.
  green-is-not-passing:
    tags:
    - ctxloom
    - testing
    content: "# A test does not pass until a mutation dies\n\nA test is not passing because it is green.\
      \ It is passing when it is\ngreen AND a mutation to the production code it names makes it FAIL.\n\
      Green alone means the test ran. It does not mean the test looked.\n\nApply it in both directions:\n\
      \n- **Writing a test**: after it goes green, break the behaviour it\n  names — in `internal/` or\
      \ `cmd/`, not in the test — and confirm it\n  goes red. Revert. If nothing you can break makes it\
      \ fail, you have\n  written a tautology, and it is worse than no test because it\n  reports coverage\
      \ you do not have.\n- **Trusting a test**: a suite's green tells you nothing about a\n  specific\
      \ claim until someone has killed a mutation against it.\n  \"It passes\" is not evidence. \"It failed\
      \ when I broke X\" is.\n\n## Why this is a rule here and not a preference\n\nAn audit of this project's\
      \ acceptance suite on 2026-08-04 read 380\nscenarios, ran 41 mutations, and found 25 assertions\
      \ that passed\nwhile proving nothing. Not edge cases — one asserted that the output\nmatched the\
      \ regex `.` (any one character). Others asserted an\nargument the command had echoed back, or a\
      \ MIME type that is a\nstatic field on the envelope, or the ABSENCE of something the\nfixture never\
      \ created. Several were satisfied by the subject never\nrunning at all: a scenario titled \"the\
      \ same engines proceed\" passed\nwhen the engine never launched, and one titled \"a per-item\nacceptance\
      \ and a rejection ARE RECORDED\" passed with the record\nstore neutered to write nothing.\n\nEvery\
      \ one of those had been green for as long as it had existed.\n\n## The shapes that produce a false\
      \ green\n\n- asserting exit 0 without asserting the EFFECT (this project's\n  characteristic silent\
      \ no-op: exit 0, a success message, zero bytes)\n- asserting a name, a header, or an argument the\
      \ command echoes\n- asserting a file exists without asserting its content or mode\n- asserting the\
      \ tool's REPORT of what it did instead of the state it\n  changed\n- absence-satisfies-absence:\
      \ asserting something is missing in a\n  fixture where it was never present\n- a substring so generic\
      \ it survives gutting the thing under test\n\n## Where the bar is already met, and worth copying\n\
      \n`tests/acceptance/steps_skill.go` compares bytes with an explicit\nzero-length guard — \"comparing\
      \ two empty reads is trivially\nidentical\" — which is the line that stops a byte comparison from\n\
      being vacuous. `j002600` asserts an exact file COUNT rather than\nexistence. `run.feature`'s recorded-input\
      \ assertion reads what the\nengine actually received rather than what the CLI said it sent.\n\n\
      ## Test against a FRESH BUILD, never the installed binary\n\nAny manual or agent-driven verification\
      \ runs against a binary built\nfrom the tree under test — `just build`, then `./ctxloom` — never\n\
      `ctxloom` from `$PATH`.\n\nThe installed binary is a different program. On 2026-08-05 a check\n\
      of whether a newly added fragment was delivered came back \"missing\";\nthe installed `ctxloom`\
      \ was `v0.7.0-cefeb77-20260728T201548-dirty`,\neight days and ~150 commits behind the tree, and\
      \ dirty on top. Built\nfrom source, the same check passed. The measurement was wrong, not\nthe code\
      \ — and a wrong measurement that agrees with your fear is the\nexpensive kind.\n\n`just test-acceptance`\
      \ already does this correctly: it depends on\n`build` and drives the binary it just produced. The\
      \ exposure is\nhand-run commands and agent verification, which reach for `$PATH`\nby default.\n\n\
      The `$PATH` binary's currency may NOT be assumed in either direction. It\nmay be current, stale,\
      \ or dirty, and you cannot tell by looking -- which is\nexactly why verification drives the binary\
      \ `just build` just produced rather\nthan reasoning about which program answered. A stale binary\
      \ plus an\nexit-code check agrees with anything.\n"
    no_distill: true
    premise: You have just written or changed a test; you are reading a gate result and deciding what
      it proves; or you are about to describe something as verified, working, or done. For anyone about
      to treat a green result as evidence, however that moment arises. More than one fragment may apply
      here; this one is about whether the evidence is real.
  tool-intent-and-finding:
    tags:
    - ctxloom
    - workflow
    content: "# Say what you are looking for, and what you found\n\nTwo short statements per tool call.\
      \ They are not narration — they are the only\npart of a tool interaction that survives distillation.\n\
      \n- BEFORE a tool call: what you are trying to learn or change.\n- AFTER the result: what you actually\
      \ learned — including \"nothing\" and \"not\n  what I expected\", which are results.\n\n## Why this\
      \ is a rule and not a style preference\n\nA session transcript is distilled into an essence that\
      \ a later session resumes\nfrom, and tool RESULTS do not survive that. They are reduced to their\
      \ shape —\n`[2,431 bytes, 47 lines]` — because a truncated fragment of a grep is neither\nthe information\
      \ nor a summary of it, and the content is re-derivable by asking\nagain.\n\nWhat is NOT re-derivable\
      \ is what you were trying to find out, and what the\nanswer changed. Omit it and the essence records\
      \ that a command ran and how many\nlines it printed, with the reasoning gone.\n\nMeasured on this\
      \ project's own transcripts: tool traffic is 50-69% of a\nsession. Bash already enforces the first\
      \ half — `description` is a required\nfield, at 100% coverage across 1,286 calls. The second half\
      \ is stated after\n12% of tool results. That gap is the entire cost.\n\n## What this looks like\n\
      \nWeak: \"Let me check the config.\"\nStrong: \"Checking whether the byte cap applies per-argument\
      \ or to the whole\nobject — it decides whether eliding one key buys anything.\"\n\nWeak: \"Done.\"\
      \ (the result's shape already said that)\nStrong: \"It caps the whole object, so eliding the payload\
      \ should free budget\nfor the path — but 210 of 210 paths were already visible, so it does not.\"\
      \n\nA finding that overturns what you expected is the most valuable thing you can\nwrite. Say it\
      \ plainly and carry on."
  turn-gates:
    tags:
    - ctxloom
    - testing
    - workflow
    content: "# Which gate is real in this repo, and how to read one\n\nCompanion to green-is-not-passing,\
      \ which says a test is not passing until a\nmutation dies. This says which command actually proves\
      \ that here, and how to\nread what it tells you.\n\n## The gates, and what each one is worth\n\n\
      \    just build                    ~4s\n    just lint                    ~19s\n    just test-arch\
      \               ~20s   the architectural class gates, -tags arch\n    just test-integration    \
      \    ~30s\n    just test-acceptance        ~510s   THE REAL GATE\n    just test-acceptance-focus\
      \ features/<f>.feature   ~10-17s, one feature\n\n`just test` only COMPILES the integration suite.\
      \ It is not the gate, and a green\none proves far less than it looks like it does.\n\nIterate on\
      \ the narrow target; run `test-acceptance` before claiming anything is\ndone. When you need a single\
      \ acceptance scenario — hand-mutating one, say —\n`test-acceptance-focus` runs a whole feature in\
      \ seconds, so acceptance mutation\nis cheap and there is no excuse for skipping it.\n\n## Read the\
      \ EXIT CODE — and know where that is not enough\n\nGate on the exit status, never on grepping output\
      \ for \"PASS\" or \"ok\". Then know\nthe three inversions, each of which reports success while telling\
      \ you otherwise:\n\n- `gofmt -l` LISTS unformatted files and exits 0. Check whether the OUTPUT is\n\
      \  empty, not the status.\n- `go test -run <pattern>` whose pattern matches NOTHING exits 0 having\
      \ run no\n  test. Confirm it actually ran.\n- a pipeline reports the LAST command's status, so `cmd\
      \ | tail; echo $?` gives\n  tail's exit. Redirect to a file and check directly, or use PIPESTATUS.\n\
      \nThe shape to watch for throughout: exit 0, a success message, and zero bytes\nwritten.\n\n## Which\
      \ mutation method reaches which code\n\ngremlins is COVERAGE-GATED: it mutates source and runs `go\
      \ test`. The acceptance\nsuite and the testenv integration tests exec a PRE-BUILT binary, and Go\
      \ coverage\ndoes not cross an exec boundary — so those mutants report NOT COVERED and are\nnever\
      \ attempted. There, HAND mutation is the only real method, not a poor\nsubstitute.\n\n    unit-testable\
      \ code      just test-mutation-diff <BASE>\n    anything via the CLI    hand mutation\n\nHAND MUTATION\
      \ MUST REBUILD. Those suites exec a previously built binary and\n`just test-pkg` does not rebuild.\
      \ Edit production code, run `just build`, THEN\nthe gate. Skip the build and the mutation survives\
      \ against the old binary — you\nwill call a good test vacuous, or a vacuous one fine.\n\nWhen a\
      \ mutation SURVIVES, suspect you aimed at the wrong layer before concluding\nthe test is vacuous.\
      \ The tell is that the mutated code is demonstrably live\nelsewhere: if breaking it reddens some\
      \ other package's tests, the code is\nreachable, just not from the path under test. Find the reachable\
      \ gate and kill\nthat instead.\n\n## A fresh worktree cannot commit until it is built\n\n`just build`\
      \ first, and make sure `bin/archlint` exists there. Without a built\ntree the pre-commit hook fails\
      \ with an `archvocabulary: failed prerequisites`\ncascade that looks like a broken analyzer and\
      \ is not.\n\n`test-pkg` takes a package PATTERN — `./internal/cli`, with the leading `./`.\nWithout\
      \ it you get a misleading \"is not in std\" error.\n"
    premise: You are choosing which build, test, lint, or mutation command to run; interpreting an exit
      code or a suite's output; or deciding whether the gate you ran actually covers the claim you are
      making. For anyone deciding which command proves a change is done. This is about WHICH gate and
      how to read it, not about whether a passing test means anything.
name: ctxloom-project
