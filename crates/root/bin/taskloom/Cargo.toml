[package]
name = "taskloom"
version = "0.1.0"
description = "The taskloom binary: the composition root that wires the tasks core to its adapters"
edition.workspace = true
# rmcp's, through tasks-mcp.
rust-version = "1.88"
license.workspace = true
publish.workspace = true

[dependencies]
agent-configs.workspace = true
annals.workspace = true
annals-store-sql.workspace = true
clap.workspace = true
file-lock.workspace = true
go-task-log.workspace = true
harp-names.workspace = true
presentation.workspace = true
project-application.workspace = true
project-cli.workspace = true
project-registry.workspace = true
registration-application.workspace = true
registration-cli.workspace = true
system.workspace = true
task-store-sqlite.workspace = true
tasks-application.workspace = true
tasks-cli.workspace = true
tasks-config.workspace = true
tasks-mcp.workspace = true
tasks-run.workspace = true
tasks-watch.workspace = true
# `signal`: watch stops on SIGINT or SIGTERM, as Go's does.
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
annals-diagnostic.workspace = true
fs4.workspace = true
ports.workspace = true
serde.workspace = true
serde_json.workspace = true
tagma-core.workspace = true
task-priority.workspace = true
tasks.workspace = true
tempfile.workspace = true
time.workspace = true

[lints]
workspace = true
