syntax = "proto3";

package ctxloom.lm.llm;

option go_package = "github.com/ctxloom/ctxloom/internal/lm/grpc";

// LLM is the gRPC service that all LLM backends must implement.
service LLM {
  // Info returns metadata about the LLM.
  rpc Info(Empty) returns (LLMInfo);

  // Run executes the LLM backend, bidirectionally: the frontend (terminal owner)
  // sends a RunStart first, then streams stdin keystrokes and SIGWINCH resizes;
  // the controller feeds those into the agent's pty and streams its output back.
  // The first RunInput MUST carry `start`; subsequent ones carry stdin/resize.
  rpc Run(stream RunInput) returns (stream RunResponse);

  // GetSession reassembles and translates one of the backend's transcripts into
  // the normalized session form. The locator is the agent-agnostic session id
  // under a work dir; the backend DERIVES the agent-specific transcript path
  // itself (claude from sessionID+workDir, gemini from its store) — ctxloom
  // never computes or passes a filesystem path. The backend is authoritative for
  // locating, reassembling, and translating its own native transcript format.
  rpc GetSession(GetSessionRequest) returns (SessionData);

  // WatchSession streams a session's transcript as structured turns as they
  // appear, so a frontend can render a native chat UI (messages, not raw pty
  // bytes). The server polls the same GetSession reassembly and diffs against a
  // high-water mark: each poll's new entries stream as `entry` events; when the
  // transcript stops growing for a settle interval, that stable index is a
  // stopping point and the server emits a `boundary` marking the just-completed
  // response `[from,to)`. `heartbeat` keeps the stream warm while idle. Purely
  // additive: no SessionHistory change, every backend gets it for free.
  rpc WatchSession(WatchSessionRequest) returns (stream WatchEvent);

  // Chat runs a structured, multi-turn conversation over the backend's NATIVE
  // programmatic protocol (claude-code rides the claude-code-acp adapter) — messages in,
  // normalized turn events out, no pty/TUI. It is OPTIONAL: the server checks
  // whether the backend implements the StructuredChat capability and returns
  // UNIMPLEMENTED if not. The first ChatInput MUST carry `start`; subsequent
  // ones carry `user_message`. The frontend half-closes the stream to end input.
  rpc Chat(stream ChatInput) returns (stream ChatEvent);

  // ListSessions returns metadata for the backend's transcripts (its raw store
  // view), used by ctxloom to adopt sessions its index has not bound.
  rpc ListSessions(ListSessionsRequest) returns (SessionList);

  // GetPlans returns the plan documents (*.plan.md) the agent wrote to a
  // session's ctxloom session directory, keyed by harp. The agent server is
  // co-located with the session files and is self-situated (it resolves its own
  // ctxloom home), so it serves these for distill / cross-agent handoff; ctxloom
  // passes only the location-independent harp.
  rpc GetPlans(GetPlansRequest) returns (PlansData);
}

// GetPlansRequest locates a session's plan files by harp (the ctxloom session
// id), not a path — the agent resolves its own session directory.
message GetPlansRequest {
  string harp = 1;
}

message PlansData {
  repeated PlanFile plans = 1;
}

// PlanFile mirrors agent.PlanFile: one plan document.
message PlanFile {
  string name = 1;    // descriptive base name (no .plan.md extension)
  string content = 2; // verbatim plan markdown
}

// GetSessionRequest locates a single transcript by its agent-agnostic session id.
// No work dir crosses the wire: the agent server is self-situated — it resolves
// its own workspace and derives the agent-specific transcript path itself. This
// keeps the contract valid for a remote agent, where a host filesystem path is
// meaningless.
message GetSessionRequest {
  string session_id = 1;
}

// SessionData is the normalized form of one transcript. Times are unix seconds
// (0 = unknown) since proto has no native timestamp here.
message SessionData {
  string id = 1;
  int64 start_unix = 2;
  int64 end_unix = 3;
  repeated SessionEntry entries = 4;
}

// SessionEntry mirrors agent.SessionEntry: one normalized turn.
message SessionEntry {
  string type = 1;          // user | assistant | thinking | tool_use | tool_result | system
  string content = 2;       // text for user/assistant/thinking/system
  string tool_name = 3;     // for tool_use/tool_result
  bytes tool_input = 4;     // raw JSON for tool_use
  string tool_output = 5;   // for tool_result
  bool is_error = 6;        // for tool_result
  int64 timestamp_unix = 7;
  bool sidechain = 8;       // entry belongs to an engine-side subagent, not the main thread

  // --- IR2 (2026-07, ACP conformance audit gap G9): additive richness.
  // Every field below is OPTIONAL — absent/zero mirrors agent.SessionEntry's
  // own zero value exactly, so an old plugin/host pair that never sets them
  // keeps decoding identically to before these fields existed.
  string tool_call_id = 9;               // engine-native tool-call id, when known
  string tool_kind = 10;                 // ACP tool-call kind classification
  repeated ToolLocation tool_locations = 11;    // files/lines a tool call touches
  repeated ToolContentBlock tool_content = 12;  // structured tool result content
  repeated ContentBlock content_blocks = 13;    // structured content for this entry
  string system_kind = 14;               // "" (notice) | "plan" — see agent.SessionSystemKind
  repeated PlanEntry plan = 15;           // structured plan entries when system_kind == "plan"
}

// ToolLocation mirrors agent.ToolLocation.
message ToolLocation {
  string path = 1;
  int32 line = 2; // 0 means unset
}

// ContentBlock mirrors agent.ContentBlock: a structured ACP content block,
// carried mostly opaquely (raw) with a text/kind convenience projection.
message ContentBlock {
  string kind = 1; // "text" | "image" | "audio" | "resource_link" | "resource"
  string text = 2; // populated only when kind == "text"
  bytes raw = 3;   // the block's own JSON, verbatim
}

// ToolContentBlock mirrors agent.ToolContentBlock: one element of a tool
// call's structured content collection (content block | diff | terminal).
message ToolContentBlock {
  string kind = 1; // "content" | "diff" | "terminal"
  string text = 2; // flattened text, when kind == "content"
  string diff_path = 3;
  string diff_old_text = 4;
  string diff_new_text = 5;
  string terminal_id = 6;
  bytes raw = 7;
}

// PlanEntry mirrors agent.PlanEntry: one task in an agent's execution plan.
message PlanEntry {
  string content = 1;
  string priority = 2; // high | medium | low
  string status = 3;   // pending | in_progress | completed
}

// WatchSessionRequest locates the session to tail by its agent-agnostic id (the
// same locator GetSession takes).
message WatchSessionRequest {
  string session_id = 1;
}

// WatchEvent is one message on the WatchSession stream: either a newly-appeared
// transcript entry, a stopping-point boundary marking a completed response, or a
// heartbeat keepalive while the session is idle.
message WatchEvent {
  oneof event {
    SessionEntry     entry     = 1; // a newly-appended normalized turn
    ResponseBoundary boundary  = 2; // the just-completed response: entries[from,to)
    Heartbeat        heartbeat = 3; // idle keepalive
  }
}

// ResponseBoundary marks a stopping point: entries[from_index, to_index) is the
// response that just completed (growth stalled past the settle interval).
message ResponseBoundary {
  int32 from_index = 1;
  int32 to_index = 2;
}

// Heartbeat is an empty keepalive emitted on a slow cadence while idle.
message Heartbeat {}

// ChatInput is one message on the Chat stream. The first MUST carry `start`;
// thereafter the frontend sends `user_message` turns (plus `permission_answer`
// / `cancel_turn` control messages) and half-closes to end input.
message ChatInput {
  oneof input {
    ChatStart            start             = 1; // first message only
    ChatUserMessage      user_message      = 2; // a structured user turn
    ChatPermissionAnswer permission_answer = 3; // answers a ChatPermissionRequest
    ChatCancelTurn       cancel_turn       = 4; // abandon the in-flight turn, keep the conversation
    ChatTerminalAnswer   terminal_answer   = 5; // answers a ChatTerminalRequest (B1, gap G6)
  }
}

// ChatStart configures a structured chat (mirrors the subset of RunStart a
// programmatic, non-pty conversation needs).
message ChatStart {
  string work_dir = 1;
  string model = 2;
  map<string, string> env = 3;
  // Launch-time permission posture (default|acceptEdits|plan|bypass). For the
  // per-request decision it collapses to allow-without-prompt only under bypass.
  // Field 4 was the retired bool auto_approve; the wire-type change
  // (varint→string) is safe because host and plugin are version-locked (always
  // built and launched together) and ChatStart is never persisted.
  string permission_mode = 4;
  // Surface engine permission requests as ChatPermissionRequest events and
  // park until the ChatPermissionAnswer arrives, instead of auto-deciding
  // (bypass → allow, otherwise reject).
  bool forward_permissions = 5;
  // Caller-supplied MCP servers to attach to the conversation, in addition to
  // whatever native config the engine reads from its cwd.
  repeated ChatMCPServer mcp_servers = 6;
  // transcript_raw_policy names the transcript.raw capture policy the
  // canonical-transcript Recorder should honor for this chat (off |
  // lossy-only | all — see internal/transcript/recorder.go's RawPolicy).
  // Empty means "use the default" (lossy-only). Mirrors
  // agent.ChatRequest.TranscriptRawPolicy; see that field's doc comment —
  // nothing populates this from user config yet (deferred), every current
  // caller leaves it empty.
  string transcript_raw_policy = 7;
  // Surface engine terminal/* requests as ChatTerminalRequest events and
  // park until the ChatTerminalAnswer arrives (B1, gap G6) — mirrors
  // forward_permissions exactly, applied to terminal/create/output/
  // wait_for_exit/kill/release instead of session/request_permission. Only
  // honest when the caller actually has a live upstream editor that
  // advertised the terminal capability; see agent.ChatRequest.ForwardTerminal.
  bool forward_terminal = 8;
  // runtime carries the agent binding's resolved runtime axis (ISO1) into a
  // structured chat: "container-rootless" or "container-rootful" asks the
  // backend to run its engine SUBPROCESS inside a container under that
  // ownership mode, empty (or "host") means host. There is deliberately no
  // undifferentiated "container" value — rootless and rootful differ in UID
  // mapping. The host side parses this exactly once, via
  // agent.ParseRuntimeAxis (internal/lm/grpc/chat.go's chatStartFromProto),
  // refusing any other spelling rather than silently landing on host. Mirrors
  // agent.ChatRequest.Runtime, which had NO proto field at all — so a
  // container-bound `ctxloom acp` session ran on the HOST while ctxloom
  // announced container isolation. Only a backend whose structured-chat
  // transport implements container isolation (internal/acp) consults it.
  string runtime = 9;
  // resume_session_id asks the backend to resume a prior NATIVE session
  // instead of starting fresh (claude --resume, codex thread/resume, ACP
  // session/load). Mirrors agent.ChatRequest.ResumeSessionID, which had no
  // proto field: a delegated child's resume silently started a fresh session
  // under the old id's name. A backend that cannot resume fails loudly.
  string resume_session_id = 10;
}

// ChatMCPServer is one caller-supplied MCP server for a chat run: a stdio
// command (transport empty, command/args/env meaningful) or a remote
// http/sse server (transport set, url/headers meaningful) — mirrors
// agent.ChatMCPServer/MCPTransport (B3, gap G11). Fields 5-7 are additive:
// every pre-B3 sender leaves them unset, which decodes as stdio (the
// pre-existing behavior), so this is wire-compatible with older builds.
message ChatMCPServer {
  string name = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  // transport is "" (stdio, default) | "http" | "sse". Mirrors
  // agent.MCPTransport's string values byte-for-byte.
  string transport = 5;
  // url is the remote endpoint for an http/sse transport. Empty for stdio.
  string url = 6;
  // headers are HTTP headers sent when connecting an http/sse transport
  // (e.g. Authorization). Empty for stdio.
  map<string, string> headers = 7;
}

// ChatUserMessage is one inbound user turn (plain text in v1).
message ChatUserMessage {
  string text = 1;
  // content_blocks mirrors agent.ChatMessage.ContentBlocks: structured
  // content for a richer turn than plain text. Additive; nothing consumes
  // non-text blocks yet (multimodal intake is a later slice, B2).
  repeated ContentBlock content_blocks = 2;
}

// ChatPermissionAnswer resolves the ChatPermissionRequest with the same id:
// option_id names the chosen option; empty means dismissed/cancelled.
message ChatPermissionAnswer {
  string id = 1;
  string option_id = 2;
}

// ChatCancelTurn asks the backend to abandon the in-flight turn; the
// conversation stays alive and the turn completes with stop reason "cancelled".
message ChatCancelTurn {}

// ChatEvent is one normalized outbound event; exactly one is set. `entry` is
// conversation content (many per response), `complete` the response's
// completion + accounting (one per response), `session` one-time session info,
// `permission` a forwarded mid-turn engine permission request (only under
// ChatStart.forward_permissions; answered via ChatPermissionAnswer),
// `terminal` a forwarded mid-turn engine terminal/* request (only under
// ChatStart.forward_terminal, B1 gap G6; answered via ChatTerminalAnswer).
message ChatEvent {
  oneof event {
    SessionEntry          entry      = 1;
    TurnMeta              complete   = 2;
    ChatSessionInfo       session    = 3;
    ChatPermissionRequest permission = 4;
    ChatTerminalRequest   terminal   = 6;
  }
  // raw mirrors agent.ChatEvent.Raw: IR3's side channel for the curated
  // allowlist (available_commands_update, current_mode_update, any variant's
  // `_meta`) that has no field of its own above. May be set ALONGSIDE entry
  // (a `_meta` supplement) or ALONE (event unset — a pure passthrough frame).
  // PERMISSIONS NEVER RIDE HERE — see agent.ChatEvent.Raw's doc comment; this
  // is a plain sibling field, not part of the oneof, precisely so it can
  // never be confused with permission above.
  bytes raw = 5;
}

// ChatPermissionRequest is a forwarded engine permission request: the engine
// wants to run tool_name and offers the given decision options. id correlates
// the eventual ChatPermissionAnswer.
message ChatPermissionRequest {
  string id = 1;
  string tool_name = 2;
  bytes  tool_input = 3; // raw JSON, may be empty
  repeated ChatPermissionOption options = 4;
  // tool_call_id mirrors agent.PermissionRequest.ToolCallID: the engine-
  // native tool-call id this request refers to, when known.
  string tool_call_id = 5;
  // kind mirrors agent.PermissionRequest.Kind: the connector-classified tool
  // category (ACP ToolCallKind — execute | edit | delete | move | read |
  // search | fetch | think | other), empty when the backend cannot classify.
  // It had no proto field, so every forwarded permission reached the host
  // unclassified and any policy that buckets by category (the agentcoord
  // escalation ladder) saw only "".
  string kind = 6;
}

// ChatPermissionOption is one decision the engine offers. kind is the ACP
// option-kind vocabulary: allow_once | allow_always | reject_once | reject_always.
message ChatPermissionOption {
  string id = 1;
  string kind = 2;
  string name = 3;
}

// ChatTerminalRequest is a forwarded engine terminal/* request (B1, gap G6):
// the engine wants ctxloom to broker one terminal operation to the connected
// editor. Mirrors agent.TerminalRequest. id correlates the eventual
// ChatTerminalAnswer. op is one of create|output|wait_for_exit|kill|release.
// params carries that op's ACP request body verbatim as JSON, with the
// engine-side session id already stripped (see agent.TerminalRequest's doc
// comment) — the agent-role broker substitutes its own editor-facing session
// id before relaying.
message ChatTerminalRequest {
  string id = 1;
  string op = 2;
  bytes  params = 3;
}

// ChatTerminalAnswer resolves the ChatTerminalRequest with the same id.
// Mirrors agent.TerminalResponse: result carries the op's ACP response body
// verbatim as JSON on success; error carries a human-readable reason on
// failure. Exactly one is meaningful.
message ChatTerminalAnswer {
  string id = 1;
  bytes  result = 2;
  string error = 3;
}

// TurnMeta is per-response completion metadata a client can surface (context
// gauge, cost, timing). Mirrors agent.TurnMeta.
message TurnMeta {
  int32  input_tokens          = 1;
  int32  output_tokens         = 2;
  int32  cache_read_tokens     = 3;
  int32  cache_creation_tokens = 4;
  int32  context_window        = 5;
  int32  max_output_tokens     = 6;
  double cost_usd              = 7;
  string model                 = 8;
  string stop_reason           = 9;
  int32  duration_ms           = 10;
  int32  num_turns             = 11;
}

// ChatSessionInfo is one-time session metadata emitted at chat start. Mirrors
// agent.ChatSessionInfo.
message ChatSessionInfo {
  string model           = 1;
  string permission_mode = 2;
  int32  context_window  = 3;
  repeated MCPStatus mcp_servers = 4;
  // session_id is the harness-NATIVE session id this conversation runs under —
  // the resume handle a coordinator journals so a later spawn can continue the
  // same session via ChatStart.resume_session_id. It had no proto field, which
  // made resume_session_id unusable over this transport in BOTH directions:
  // the id a plugin learned never reached the host that would journal it.
  string session_id = 5;
  // resumable reports that the connected adapter's own handshake advertised
  // the loadSession capability (the LIVE half of the one-shot resume gate).
  // Mirrors agent.ChatSessionInfo.Resumable; it had no proto field, so a host
  // could not tell "engine advertises resume" from "engine does not" and had
  // to guess from the static per-backend table alone.
  bool resumable = 6;
}

// MCPStatus is the connection status of one MCP server at session start.
message MCPStatus {
  string name = 1;
  string status = 2;
}

// ListSessionsRequest is empty: the self-situated agent server lists its own
// workspace's transcripts. Kept as a named message for forward-compatible fields.
message ListSessionsRequest {
}

message SessionList {
  repeated SessionMeta sessions = 1;
}

// SessionMeta mirrors agent.SessionMeta: transcript metadata without content.
message SessionMeta {
  string id = 1;
  int64 start_unix = 2;
  int64 end_unix = 3;
  int32 entry_count = 4;
  string path = 5; // absolute path to the backend's raw transcript, when file-backed
}

message Empty {}

message LLMInfo {
  string name = 1;
  string version = 2; // the BACKEND ENGINE's own version (e.g. claude's), not ctxloom's
  repeated ExecutionMode supported_modes = 3;
  // ctxloom_version is the SERVING PROCESS's own ctxloom build stamp
  // (internal/version.Version), distinct from `version` above. A client
  // compares this against its own build stamp right after connecting
  // (runnerFromConn's version handshake) and refuses a mismatched daemon
  // rather than silently running turns against stale compiled-in behavior —
  // see exposable-rental unit 1.
  string ctxloom_version = 4;
}

// RunInput is one message on the bidirectional Run stream. The first MUST be a
// `start`; thereafter the frontend sends `stdin` (keystrokes) and `resize`
// (SIGWINCH). Non-interactive/oneshot callers send only `start`.
message RunInput {
  reserved 4;                  // was user_message (pty-injection chat); see Chat RPC
  reserved "user_message";
  oneof input {
    RunStart    start  = 1; // first message only
    bytes       stdin  = 2; // terminal keystrokes for the agent's pty
    WindowSize  resize = 3; // terminal size change
  }
}

// WindowSize carries a terminal resize for the agent's pty.
message WindowSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// RunStart is the first Run message: everything needed to set up and launch the
// agent (formerly the unary RunRequest).
message RunStart {
  RunOptions options = 1;
  repeated Fragment fragments = 2;       // Context fragments with metadata
  Fragment prompt = 3;                   // The user prompt as a fragment
  ManagedConfig managed_config = 4;      // Host-assembled config/bundle setup payload (nil for skip_setup)
}

// ManagedConfig is the host-assembled setup payload that rides over Run so the
// backend plugin no longer self-loads ctxloom config/bundles. The host resolves
// config, profiles, and bundles, maps them to these wire-mirroring messages, and
// the plugin converts back and feeds them into Setup. Hooks here are the
// config+profile+bundle set WITHOUT context-injection — the agent appends its
// own context-injection hook from its plugin-side context hash.
message ManagedConfig {
  repeated CommandExport commands = 1;  // per-target-agent command (slash-command) exports
  HooksConfig hooks = 2;                // config + default-profile + bundle hooks (no context-injection)
  bool manage_statusline = 4;           // whether ctxloom manages the backend statusline
  map<string, MCPServer> bundle_mcp = 5; // MCP servers shipped by profile + builtin bundles (parallel to the bundle hooks)
  // skills mirrors agent.ManagedConfig.Skills: the per-target-agent Agent Skill
  // package exports (SurfaceSkills), the CommandExport sibling for whole trees.
  // It had no proto field, so a resolved skill package never reached a backend
  // over the launch path — the host wrote it into the payload and the wire
  // dropped it.
  repeated SkillExport skills = 6;
  // deny_tools mirrors agent.ManagedConfig.DenyTools: the config +
  // default-profile deny_tools union (the deny-tools.md root-cause fix) — the
  // per-engine tool identifiers the resolved profile set denies at launch
  // (e.g. Claude Code's built-in "Task"). It had no proto field, so a
  // configured deny entry NEVER reached a backend and the hole it was written
  // to close stayed open. Never trust-gated: a deny entry only narrows a
  // launch, it never executes anything.
  repeated string deny_tools = 7;
  // surfaces mirrors agent.ManagedConfig.Surfaces: the AGENT BINDING's declared
  // delivery preference, one approach per surface kind, resolved host-side
  // against the engine's own SupportedApproaches. Keys and values are the
  // stable lowercase labels agent.SurfaceKind.String / agent.Approach.String
  // render ("context" -> "system-prompt"), parsed back with the matching
  // Parse* functions — names rather than enum numbers so the wire stays
  // readable and an unknown label fails loudly instead of resolving to iota 0.
  //
  // Empty means "take the engine's default", which is every agent that has not
  // asked for anything.
  map<string, string> surfaces = 8;
}

// SkillExport mirrors agent.SkillExport: one Agent Skill package's
// agent-agnostic export spec. Unlike CommandExport (a single rendered file) a
// skill is a whole TREE — SKILL.md plus whatever sibling files (scripts/,
// assets/, references/) its package carries — so it carries files rather than
// one content string.
message SkillExport {
  string name = 1;         // package/directory name, == the SKILL.md frontmatter name
  string description = 2;  // SKILL.md frontmatter description, for engines that register it out-of-package
  bool enabled = 3;        // resolved enablement for the target agent
  repeated PackageFile files = 4; // every file the package materializes, SKILL.md included
}

// PackageFile mirrors agent.PackageFile: one file within a rendered package.
// mode is the POSIX file mode — the exec bit on scripts/ entries is
// load-bearing and must survive to the materialized file — and 0 means "use
// the writer's 0644 default".
message PackageFile {
  string rel_path = 1; // path relative to the skill's OWN directory
  bytes content = 2;
  uint32 mode = 3;
}

// CommandExport mirrors agent.CommandExport: one command's agent-agnostic
// slash-command export spec, with the target agent's enablement+metadata already
// resolved host-side.
message CommandExport {
  string name = 1;                  // Full name (bundle/item); path separators allowed
  string content = 2;               // The command body
  bool enabled = 3;                 // Resolved enablement for the target agent
  string description = 4;           // For /help display
  string argument_hint = 5;         // Autocomplete hint (unused by gemini)
  repeated string allowed_tools = 6;// Tool restrictions (unused by gemini)
  string model = 7;                 // Override model (unused by gemini)
}

// Hook mirrors wire.Hook.
message Hook {
  string matcher = 1;
  string command = 2;
  string type = 3;
  string prompt = 4;
  int32 timeout = 5;
  bool async = 6;
  string scm = 7;
  // pre_tool_fallback mirrors wire.Hook.PreToolFallback: this session_start
  // hook is safe to fire on PreToolUse instead, on an engine whose harness has
  // no session-start event. It had no proto field, so the flag —
  // documented on the website and in the config schema — arrived false at every
  // backend and the fallback was dead. SIGNING: the hook exec preimage
  // (bundles.BundleHook.ContentPayload, `ctxloom-exec/1`) already includes
  // pre_tool_fallback and is built HOST-side (internal/lm/backends/managed.go's
  // hookExecPayload) from the wire.Hook that always carried the true flag — so
  // the trust gate never saw a wrong value, and carrying the flag here changes
  // NO hash, grant, or countersignature. What it fixes is the other half: the
  // hook DELIVERED to the engine no longer differs from the hook the grant
  // covered. No preimage-contract bump is needed or wanted.
  bool pre_tool_fallback = 8;
}

// HookList wraps a repeated Hook so it can be a proto map value (proto forbids
// repeated fields directly as map values).
message HookList {
  repeated Hook hooks = 1;
}

// UnifiedHooks mirrors wire.UnifiedHooks.
message UnifiedHooks {
  repeated Hook pre_tool = 1;
  repeated Hook post_tool = 2;
  repeated Hook session_start = 3;
  repeated Hook session_end = 4;
  repeated Hook pre_shell = 5;
  repeated Hook post_file_edit = 6;
  repeated Hook turn_end = 7;
}

// BackendHooks mirrors wire.BackendHooks (event name -> hooks).
message BackendHooks {
  map<string, HookList> events = 1;
}

// HooksConfig mirrors wire.HooksConfig.
message HooksConfig {
  UnifiedHooks unified = 1;
  map<string, BackendHooks> plugins = 2;
}

// MCPServer mirrors wire.MCPServer.
message MCPServer {
  string command = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  string notes = 4;
  string installation = 5;
  string scm = 6;
}

// Fragment represents a context fragment or prompt with metadata.
// All fields except content are optional - they're omitted when empty/zero.
message Fragment {
  string name = 1;             // Optional: fragment name (e.g., "coding-standards", "testing/tdd")
  string version = 2;          // Optional: version string from the fragment
  repeated string tags = 3;    // Optional: tags for categorization
  string content = 4;          // The effective content (distilled or original)
  bool is_distilled = 5;       // Optional: true if content is the distilled version
  string distilled_by = 6;     // Optional: LLM that performed distillation (e.g., "claude-3-opus")
}

message RunOptions {
  string work_dir = 1;
  // Launch-time permission posture (default|acceptEdits|plan|bypass); each
  // backend maps it to its own mechanism. Empty decodes to default (prompt) at
  // the server (agent.WireMode) — the CLI-side host-bypass default is resolved
  // before this is set, not on the server. Field 2 was the retired bool
  // auto_approve; the wire-type change (varint→string) is safe because host and
  // plugin are always built and launched together and RunOptions is never
  // persisted across versions.
  string permission_mode = 2;
  ExecutionMode mode = 3;
  map<string, string> env = 4;
  bool dry_run = 5;       // Validate without executing
  uint32 verbosity = 6;   // 0=silent, 16=commands, 32=args, 48+=debug
  string model = 7;       // Model to use (e.g., "opus", "gpt-4", "claude-3-sonnet")
  float temperature = 8;  // Creativity level 0.0-1.0 (0=deterministic)
  uint32 max_tokens = 9;  // Maximum response tokens (0=default)
  bool skip_setup = 10;   // Skip context/hooks/commands setup (for distillation)
  // Resolved isolation CELL for this run, decided host-side by isolation.Prepare
  // and carried to the plugin so Setup/buildArgs know which cell they run in
  // (the host resolves it; the plugin can't infer it from WorkDir alone). Shared
  // is the user's live cwd; DirectoryIsolated a per-agent worktree;
  // ProcessIsolated a container. Unspecified decodes to Shared at the server.
  CellKind cell_kind = 11;
}

// CellKind is the resolved isolation cell for a run, mapped host-side from the
// isolation.Policy (None→Shared, Worktree→DirectoryIsolated, Container in both
// its base tiers→ProcessIsolated) and mirrored by agent.CellKind on the plugin
// side.
enum CellKind {
  CELL_KIND_UNSPECIFIED = 0;
  CELL_KIND_SHARED = 1;              // the user's live cwd (shared directory)
  CELL_KIND_DIRECTORY_ISOLATED = 2;  // a per-agent git worktree
  CELL_KIND_PROCESS_ISOLATED = 3;    // a container
}

enum ExecutionMode {
  INTERACTIVE = 0;  // Full interactive session, continues after each response
  ONESHOT = 1;      // Single prompt/response, exit after completion
}

message RunResponse {
  oneof output {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
  }
  // Model info is populated at the end of the stream (with exit_code)
  ModelInfo model_info = 4;
}

// ModelInfo contains information about the model used for the response.
message ModelInfo {
  string model_name = 1;     // Model name (e.g., "claude-3-opus-20240229")
  string model_version = 2;  // Model version if available
  string provider = 3;       // Provider (e.g., "anthropic", "openai")
}
