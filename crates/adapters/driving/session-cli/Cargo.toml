[package]
name = "session-cli"
version = "0.1.0"
description = "The `session` commands: list, search, show, edit, keep, remove and the transcripts, translated to the sessions application and rendered as json or text"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
angzarr-presentation.workspace = true
cli-support.workspace = true
clap.workspace = true
isolation-application.workspace = true
serde.workspace = true
serde_json.workspace = true
reclaim-application.workspace = true
sessions-application.workspace = true
# The runtime a command blocks on (the kernel's backoff waits on its timer).
tokio.workspace = true

[dev-dependencies]
mutants.workspace = true
# The crate's own tests (and its lint, `--all-targets`) hold `session remove`,
# the destroy (owner rulings 94b, 98), which only `session-destroy` compiles: the
# crate depends on itself with it, for its tests alone. A plain build builds no
# dev-dependency, so the shipped binary stays without it
# (scripts/plain-destroy-check.sh).
session-cli = { path = ".", features = ["session-destroy"] }
sessions-application = { workspace = true, features = ["test-support"] }


[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []
# `session remove` and `session sweep`: `remove` DESTROYS a session (owner
# rulings 94, 94b, 98): its stream, its runs' streams, its directory and lock.
# Off in a plain build, where both verbs are unknown and nothing deletes a
# session (scripts/plain-destroy-check.sh, in `just build`).
session-destroy = []

[lints]
workspace = true
