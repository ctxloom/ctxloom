syntax = "proto3";

// THE LIBRARY AS AIP RESOURCES (OD-40; the design is
// library-aip-resources.md, ruled by the owner 2026-11-13, OQ-1 to OQ-21).
// Every library verb's `--format json` is the proto3 JSON of its API
// message, generated (OQ-21), converted from library-application's views at
// the CLI's edge (design §6: views unchanged; at T13 the same mapping moves
// into the daemon). The `Ctxloom` service's methods over these messages are
// in daemon.proto; this file holds the messages alone (S1 amended: one
// service, one package, AIP-215).
//
// THE RESOURCE TREE (AIP-121, 122, 123; type domain `ctxloom.dev`). Each
// pattern's order is fixed once published (AIP-123):
//
//   ctxloom.dev/Project     projects/{project}                  (daemon.proto)
//   ctxloom.dev/User        users/me                            the home layer,
//                                                               outside a project (OQ-3)
//   ctxloom.dev/Bundle      1 projects/{project}/bundles/{bundle}
//                           2 projects/{project}/remotes/{remote}/bundles/{bundle}
//                           3 projects/{project}/companions/{companion}/bundles/{bundle}
//                           4 users/me/bundles/{bundle}
//   ctxloom.dev/Fragment    each Bundle pattern + /fragments/{fragment}
//   ctxloom.dev/Command     each Bundle pattern + /commands/{command}
//   ctxloom.dev/Skill       each Bundle pattern + /skills/{skill}
//   ctxloom.dev/McpServer   each Bundle pattern + /mcpServers/{mcp_server}
//   ctxloom.dev/Profile     each Bundle pattern + /profiles/{profile}
//   ctxloom.dev/Agent       projects/{project}/agents/{agent}, users/me/agents/{agent}
//   ctxloom.dev/Engine      projects/{project}/engines/{engine}, users/me/engines/{engine}
//   ctxloom.dev/Companion   projects/{project}/companions/{companion},
//                           users/me/companions/{companion}
//   ctxloom.dev/Remote      projects/{project}/remotes/{remote}
//   ctxloom.dev/Dependency  projects/{project}/dependencies/{dependency}
//   ctxloom.dev/Config      projects/{project}/config, users/me/config (singletons, AIP-156)
//   ctxloom.dev/PremiseIndex projects/{project}/premiseIndex (a singleton)
//   ctxloom.dev/Loadout     projects/{project}/loadout, users/me/loadout (singletons)
//
// ORIGIN IS IN THE NAME (OQ-4): a project's bundle and the built-in one are
// `projects/{p}/bundles/{b}` (a project bundle named `ctxloom` overrides the
// built-in whole: one name whose `origin` flips, ruling 128); an installed
// remote bundle is `projects/{p}/remotes/{r}/bundles/{b}`; a companion's
// loadout `projects/{p}/companions/{c}/bundles/loadout`. Outside a project
// the root is `users/me` (OQ-3), so the built-in bundle is
// `users/me/bundles/ctxloom`. Two bundles never share a name.
//
// IDS (AIP-122: an ID's format must be documented). The owner ruled a
// STRICTER grammar for items (OQ-6, a hard migrate of content names; one in
// another person's remote bundle that breaks it is refused, with a fix), and
// a nested local bundle name (`team/rules`) refused (OQ-5):
//
//   item-id = letter [ *61( letter / digit / "-" ) ( letter / digit ) ]
//   letter  = %x61-7A          ; a to z: lowercase ASCII only
//   digit   = %x30-39          ; 0 to 9
//
// that is, as a regular expression, `^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$`:
// one to 63 characters, lowercase ASCII letters, digits and hyphens, starting
// with a letter and not ending with a hyphen (RFC 1034's label, AIP-122's
// recommendation). No uppercase, underscore, dot, space, `/` or `\`. It is
// the ID of a Bundle, Fragment, Command, Skill, McpServer and Profile (the
// file or directory name on disk, which must therefore be one).
//
//   - An Engine's ID is the fixed engine name (`claude-code`, `opencode`;
//     `mock*` only under test-support), which the grammar holds.
//   - An Agent's, a Companion's and a Remote's ID is its config key,
//     verbatim: one name segment (no `/`), as the config's own decode
//     admits it.
//   - A Project's is its harp (S42), and so is a session's (daemon.proto).
//   - A Dependency's ID is the first 16 lowercase hexadecimal digits of the
//     SHA-256 of its lock identity (OQ-15; `reference` holds the identity):
//     `^[0-9a-f]{16}$`.
//   - `uid`, where a resource has one, is a field and never part of a name.
//
// CONVENTIONS (design §2):
//   - Field numbers: 1 `name` (or `parent`); 2..69 the resource's own; 70
//     `etag` on a resource; 80, 81 paging; 90+ the request and the response
//     fields (90 `needs`, 91 `etag`, 92 `notices`).
//   - Field behaviours (AIP-203) are `google.api.field_behavior`
//     annotations (daemon.proto's LINT): IDENTIFIER on `name`; OUTPUT_ONLY
//     on everything derived; REQUIRED on a request's `name`, `parent` and
//     resource; OPTIONAL on `update_mask`.
//   - `name` is reserved for the resource's name (AIP-122): a sub-row that
//     said `name` says what it is (`agent`, `variable`, `resource`).
//   - A reference is a resource name; one that resolves to nothing keeps its
//     configured text and is said in a notice (OQ-16).
//   - A field readable from the name is not repeated (`bundle`, `remote`,
//     `bundle_label`, `is_remote`, `display_name` are gone).
//   - DEFAULTS ARE LEFT OUT (OQ-7, proto3 JSON): false, 0, "" and [] are not
//     printed. The yes/no facts a reader must see as `false` have presence
//     (`optional`): `applied`, `held`, `default`, `resolves`, `no_distill`.
//   - ENUMS follow AIP-216 and AIP-126 (owner ruling 2026-11-13, OQ-B1),
//     across the package: a state is `State`, nested in the message it
//     describes, `STATE_UNSPECIFIED` its zero; any other enum's zero is
//     `<NAME>_UNSPECIFIED` and its other values are unprefixed, nested in
//     the one message that owns it. An enum several messages share stays
//     top-level (`DistilledState`, `ItemView`, `ItemKind`), its values
//     unprefixed but its zero: proto3 scopes a top-level enum's values to
//     the package, so no two top-level enums may share a value name.
//     JSON prints the bare value (`"origin": "PROJECT"`).
//   - Counts and token estimates are `uint32` (JSON numbers), byte sizes
//     `uint64` (JSON strings) (OQ-12).
//   - A free-form document (an engine's permissions, the config) is a
//     `google.protobuf.Value` (OQ-11, owner ruling 2026-11-13, superseding
//     Struct): printed as the JSON value itself, an object, a list, a word,
//     a number, a yes/no or null, so whatever was written round-trips and an
//     object's paths keep their shape; schema-less, so nothing of claude's
//     or opencode's configuration is encoded here (the owner's condition); a
//     client switches on the value's kind (the accepted cost); its numbers
//     are doubles for display only, and the engine still receives the
//     document verbatim from the config, never from this message.
//   - Every write method answers a response of ITS OWN (OQ-9:
//     `CreateBundleResponse`, `UpdateBundleResponse`, ..., not a per-noun
//     wrapper), each carrying the resource, `path`, `applied`, `detail`,
//     `apply_command` (OQ-8: the exact command that applies a preview),
//     `needs` (90), `etag` (91) and `notices` (92). Nothing in process
//     computes needs or an etag before T13.
//   - A stale etag is ABORTED (OQ-10, AIP-154): daemon.proto's `PlanStale`.
//   - Every List is AIP-132's from the start: `page_size` 80, `page_token`
//     81, `next_page_token` 80; in process every page is the whole list.
//   - Views (AIP-157): BASIC is a list row, FULL is `show`, CONTENT (a
//     bundle) is `view`; UNSPECIFIED is BASIC for a List and FULL for a Get.
package ctxloom.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "ctxloom/v1/needs.proto";
import "io/angzarr/v1/options.proto";

// (-- region shared --)

// A value and the config place that said it (ruling 72): `agent`, `engine`,
// `project` or `default`. was: SourcedValue.
message SourcedText {
  // The value in effect; empty when no layer set it (the engine's own
  // default).
  string value = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The layer that said it: `agent`, `engine`, `project` or `default`.
  string source = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A list and the config place that said it (ruling 72): `agent`, `engine`,
// `project` or `default`.
message SourcedList {
  // The list in effect, as written.
  repeated string value = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The layer that said it: `agent`, `engine`, `project` or `default`.
  string source = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An engine's own document (rulings 133-139), as written; none is unset.
message SourcedDocument {
  // The document as the config holds it; unset when no layer gave one.
  google.protobuf.Value value = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The layer that said it: `agent`, `engine`, `project` or `default`.
  string source = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The runtime an agent runs in, and what its own replaced (never silent):
// `overrides` the value that would have stood, `overrides_source` its
// layer, `change` how they differ (`weakens`, `strengthens`,
// `ownership-swap`). was: RuntimeSetting.
message RuntimeSetting {
  // The runtime the agent runs in (`host`, `container-rootless`,
  // `container-rootful`).
  string value = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The layer that said it: `agent`, `engine`, `project` or `default`.
  string source = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The runtime that would have stood had this layer said nothing; empty when
  // nothing was replaced.
  string overrides = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The layer `overrides` came from.
  string overrides_source = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How the value differs from `overrides`: `weakens`, `strengthens` or
  // `ownership-swap`; empty when nothing was replaced.
  string change = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One name of an agent's env and the layer that said it. was: EnvKey
// (`name` -> `variable`, AIP-122).
message EnvKey {
  // The variable's name (a name only, never its value).
  string variable = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The layer that added it: the engine block's, or the agent's own.
  string source = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The names a launch passes through (ruling 66). was: EnvSetting.
message EnvSetting {
  // Every variable name the launch passes through, the engine block's then
  // the agent's own added (ruling 66).
  repeated string value = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The highest layer that said any of the list.
  string source = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Each name of `value` with the layer that added it.
  repeated EnvKey keys = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// What an agent resolves to on an engine. was: AgentSettings.
message AgentSettings {
  // The model passed to the engine (`--model`); no value, the engine's own
  // default.
  SourcedText model = 1;
  // The effort level passed to the engine (claude's `--effort`); no value,
  // the engine's own default.
  SourcedText effort = 2;
  // The engine's own permissions document, passed to it verbatim and never
  // checked (rulings 133-139); none, the engine's default document.
  SourcedDocument permissions = 3;
  // The runtime the agent runs in, and what it replaced.
  RuntimeSetting runtime = 4;
  // The variable names the launch passes through, each with its layer (ruling
  // 66).
  EnvSetting env = 5;
  // Whose home the engine runs on (`session` | `host`): the agent's own,
  // else its engine block's, else `session` (owner ruling of 2026-11-13,
  // superseding 44(b) for this key).
  SourcedText session_home = 6;
  // How long an ask of the engine waits for an answer, as written (a span,
  // or `now`, every ask denied at once): the engine block's
  // `approval_timeout`, else `5m` (OD-41, D16).
  SourcedText approval_timeout = 7;
}

// An engine surface an agent's selection cannot reach. was: NotCarried.
message NotCarried {
  // The engine that cannot carry it (`claude-code`, `opencode`).
  string engine = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The surface kind lost: `hooks` today (only hooks are judged).
  string surface = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The unified hook event the engine has no form for (`session_end`,
  // `permission_ask`, ...).
  string event = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Why the engine cannot carry it, in the engine adapter's words.
  string reason = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// (-- What a write answers (OQ-8, OQ-9): the fields every per-method response
// repeats, at the same numbers. This message is not used itself; it
// documents the shape.
//   2 path            the one atomic operation's target (T25)
//   3 applied         printed false on a preview (OQ-7)
//   4 detail          what the preview would change. was: Preview.detail
//   5 apply_command   the exact command that applies. was: apply
//   6 changes         an edit's changes; empty, nothing changed
//   90 needs, 91 etag, 92 notices --)

// (-- endregion --)

// (-- region bundles: ctxloom.dev/Bundle --)

// A bundle: a directory of fragments, commands, skills, MCP servers, profiles
// and hooks with its `bundle.yaml`, from one origin.
message Bundle {
  option (google.api.resource) = {
    type: "ctxloom.dev/Bundle"
    pattern: "projects/{project}/bundles/{bundle}"
    pattern: "projects/{project}/remotes/{remote}/bundles/{bundle}"
    pattern: "projects/{project}/companions/{companion}/bundles/{bundle}"
    pattern: "users/me/bundles/{bundle}"
    singular: "bundle"
    plural: "bundles"
  };

  // How much of a bundle to answer (AIP-157).
  enum View {
    // Unset: BASIC for a List, FULL for a Get.
    VIEW_UNSPECIFIED = 0;
    // `bundle list`.
    BASIC = 1;
    // `bundle show`.
    FULL = 2;
    // `bundle view <bundle>`.
    CONTENT = 3;
  }

  // Where a bundle comes from.
  enum Origin {
    // Unset (proto3's zero value); never answered.
    ORIGIN_UNSPECIFIED = 0;
    // The project's own (`.ctxloom/content/bundles/...`).
    PROJECT = 1;
    // ctxloom's built-in bundle (`ctxloom/builtin`, ruling 127).
    BUILTIN = 2;
    // An installed remote bundle.
    REMOTE = 3;
    // A companion's loadout.
    COMPANION = 4;
    // users/me's own bundles, if any exist (OQ-3).
    HOME = 5;
  }

  // IDENTIFIER: one of the four Bundle patterns.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // OUTPUT_ONLY. was: origin.
  Origin origin = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY. was: ref (`ctxloom+local:demo`, `<url>@bundles/x`).
  string reference = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, a remote bundle's commit. was: RemoteOrigin.sha.
  string commit = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY: its bundle.yaml.
  string path = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The bundle's version, as its `bundle.yaml` says it (`bundle edit
  // --version`).
  string version = 6 [(google.api.field_behavior) = OPTIONAL];
  // FULL.
  string author = 7 [(google.api.field_behavior) = OPTIONAL];
  // The bundle's description (`bundle create|edit --description`).
  string description = 8 [(google.api.field_behavior) = OPTIONAL];
  // The bundle's own tags, which its fragments and commands inherit.
  repeated string tags = 9 [(google.api.field_behavior) = OPTIONAL];
  // FULL.
  string notes = 10 [(google.api.field_behavior) = OPTIONAL];
  // FULL.
  string installation = 11 [(google.api.field_behavior) = OPTIONAL];
  // OUTPUT_ONLY counts.
  uint32 fragment_count = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How many commands it holds.
  uint32 command_count = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // was: mcp_count.
  uint32 mcp_server_count = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How many profiles it holds.
  uint32 profile_count = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // FULL: how many skills it holds.
  uint32 skill_count = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, a remote bundle's: always printed when known.
  optional bool held = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, FULL: each child summarised by its name (OQ-14).
  repeated BundleItem fragments = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, FULL: each command, summarised by its name.
  repeated BundleItem commands = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, FULL: each skill, summarised by its name.
  repeated BundleItem skills = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, FULL: each MCP server, summarised by its name.
  repeated BundleItem mcp_servers = 23 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, FULL: Profile names.
  repeated string profiles = 24 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, FULL: hook labels.
  repeated string hooks = 25 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, CONTENT: each file of `bundle view`.
  repeated BundleFile files = 26 [(google.api.field_behavior) = OUTPUT_ONLY];
  // OUTPUT_ONLY, CONTENT: the distilled forms were asked.
  optional bool distilled = 27 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The resource's etag (AIP-154), what a confirmed write of it names: a
  // stale one is refused `PlanStale`.
  string etag = 70 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One child as `bundle show` summarises it (AIP-122: the referenced
// resource is not embedded). was: ShownFragment, ShownCommand, ShownSkill,
// ShownMcp.
message BundleItem {
  // The child's resource name.
  string item = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The child's own tags.
  repeated string tags = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Commands.
  string description = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Fragments, commands: the first line.
  string preview = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Fragments, commands: the distilled form against its source (T30).
  DistilledState distilled = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Printed true or false (OQ-7).
  optional bool no_distill = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Fragments.
  string premise = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // MCP servers.
  string command = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // MCP servers: the command's arguments.
  repeated string args = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // MCP servers: values included, as shown today (OQ-17).
  map<string, string> env = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Skills, MCP servers: the child's notes, for a human reader.
  string notes = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // MCP servers: the setup the server asks of a human.
  string installation = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Skills.
  string path = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One file of `bundle view <bundle>`.
message BundleFile {
  // The file's path in the bundle's tree.
  string path = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The file's text.
  string content = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// `bundle show <bundle>` (FULL) and `bundle view <bundle>` (CONTENT).
message GetBundleRequest {
  // The Bundle to read, by its resource name.
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "ctxloom.dev/Bundle"];
  // The view to answer (AIP-157); unspecified is BASIC for a List and FULL
  // for a Get.
  Bundle.View view = 2 [(google.api.field_behavior) = OPTIONAL];
  // `--distilled`: a distilled form where one is fresh.
  bool prefer_distilled = 3 [(google.api.field_behavior) = OPTIONAL];
  // Moved into `caller` (owner, 2026-11-18).
  reserved 94, 96, 97;
  reserved "env", "globals", "cwd";
  // The client's working context (needs.proto), as every request made on a
  // user's behalf carries it (owner, 2026-11-18).
  Caller caller = 98 [(google.api.field_behavior) = REQUIRED];
}

// `bundle list`.
message ListBundlesRequest {
  // `projects/{project}` answers the whole catalog, every origin (a lint
  // exception to AIP-132's "parent identifies the type", design §1.2);
  // `projects/{project}/remotes/-` every remote bundle alone (AIP-159).
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).child_type = "ctxloom.dev/Bundle"];
  // The view to answer (AIP-157); unspecified is BASIC for a List and FULL
  // for a Get.
  Bundle.View view = 2 [(google.api.field_behavior) = OPTIONAL];
  // The most results to answer in one page (AIP-158); 0 is the server's
  // choice. Every page is the whole list today.
  int32 page_size = 80 [(google.api.field_behavior) = OPTIONAL];
  // A previous response's `next_page_token`, to answer the page after it;
  // empty, the first page.
  string page_token = 81 [(google.api.field_behavior) = OPTIONAL];
  // Moved into `caller` (owner, 2026-11-18).
  reserved 94, 96, 97;
  reserved "env", "globals", "cwd";
  // The client's working context (needs.proto), as every request made on a
  // user's behalf carries it (owner, 2026-11-18).
  Caller caller = 98 [(google.api.field_behavior) = REQUIRED];
}

// The bundles of the catalog, every origin.
message ListBundlesResponse {
  // The Bundle resources of this page.
  repeated Bundle bundles = 1;
  // The token of the next page (AIP-158); empty on the last. Every page is
  // the whole list today, so it is always empty.
  string next_page_token = 80;
}

// `bundle create <name> [--description]`: a new local bundle.
message CreateBundleRequest {
  // The parent to create the Bundle under.
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).child_type = "ctxloom.dev/Bundle"];
  // The new Bundle's ID, the last segment of its name: the item-id grammar,
  // `^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$`.
  string bundle_id = 2 [(google.api.field_behavior) = REQUIRED];
  // The Bundle to create, as its own fields say it.
  Bundle bundle = 3 [(google.api.field_behavior) = REQUIRED];
  // The client's id for this write (AIP-155), sent again unchanged on the one
  // retry (API Q13).
  string request_id = 90 [(google.api.field_behavior) = OPTIONAL];
  // The preview (AIP-163): what the write would do and the needs a person
  // must answer first, applying nothing.
  bool validate_only = 92 [(google.api.field_behavior) = OPTIONAL];
  // One answer to each need the preview asked (needs.proto); an apply that
  // leaves one unanswered is refused `NeedsUnanswered`.
  // (-- api-linter: core::0133::request-unknown-fields=disabled
  //     aip.dev/not-precedent: a write's answers to the needs its preview asked are ctxloom's (S38, API Q2). --)
  repeated Answer answers = 93 [(google.api.field_behavior) = OPTIONAL];
  // Moved into `caller` (owner, 2026-11-18).
  reserved 94, 95, 96, 97;
  reserved "env", "presentable", "globals", "cwd";
  // The client's working context (needs.proto), as every request made on a
  // user's behalf carries it (owner, 2026-11-18).
  Caller caller = 98 [(google.api.field_behavior) = REQUIRED];
}

// What `bundle create` did.
message CreateBundleResponse {
  // The Bundle created (on a preview, as it would be).
  Bundle bundle = 1;
  // The file or directory the write's one atomic operation targets (T25).
  string path = 2;
  // Whether the write was applied: false on a preview, and printed either way
  // (OQ-7).
  optional bool applied = 3;
  // What the preview would change, one line each.
  repeated string detail = 4;
  // The exact command that applies this preview (OQ-8); empty once applied.
  string apply_command = 5;
  // On a preview, the needs a person must answer before the apply
  // (needs.proto); empty once applied.
  repeated Need needs = 90;
  // On a preview, the etag of what it was planned against, for the apply to
  // send back (AIP-154).
  string etag = 91;
  // What is said beside the result, each notice its code, args and text.
  repeated Notice notices = 92;
}

// `bundle edit <bundle>`: one FILE changed per call (T29 counts files, not
// flags): its `bundle.yaml`'s own fields, or one item added or removed.
message UpdateBundleRequest {
  // The Bundle to change, named by its `name`: only the fields `update_mask`
  // names are written.
