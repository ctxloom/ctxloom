[package]
name = "run-launcher"
version = "0.1.0"
description = "The runner's launch: a CatchUp over the runs still owed a runner drives one turn through the engine and the launcher and records it as facts; a second writes the session's directory from the events"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coded-diagnostic.workspace = true
angzarr-embedded.workspace = true
isolation-ports.workspace = true
pending-launches.workspace = true
ports.workspace = true
run-ports.workspace = true
runs.workspace = true
runs-application.workspace = true
sessions.workspace = true
# The test edge (`fakes`, test-support only) registers the trust aggregate
# too, so a daemon's start-up catch-up of the trust index is tested over it:
# no production code of the launcher reads trust.
trust = { workspace = true, optional = true }
# And the library aggregate (step 10a U0), for the catch-up of the library
# checkouts; no production code of the launcher reads a library tree.
library-tree = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
trust.workspace = true
library-tree.workspace = true
surface-ports.workspace = true
angzarr-embedded = { workspace = true, features = ["test-support"] }
run-ports = { workspace = true, features = ["test-support"] }
mutants.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests, and `fakes`: the
# doubles over the kernel's in-memory store.
test-support = ["angzarr-embedded/test-support", "dep:trust", "dep:library-tree"]

[lints]
workspace = true
