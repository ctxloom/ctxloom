  // from the layered config.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The program it runs (`engines.<e>.command`, home layer only), default its
  // own name.
  SourcedText command = 2;
  // Whose home it runs on (`session` | `host`).
  SourcedText session_home = 3;
  // The runtime its agents run in by default.
  SourcedText runtime = 4;
  // The variable names its block passes through.
  SourcedList env = 5;
  // Where its credential comes from, and whether it is there.
  EngineAuth auth = 6;
  // Each agent bound to it or with a block for it, and what it resolves to
