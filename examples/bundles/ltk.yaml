# Built-in ctxloom ltk bundle. Embedded into the ctxloom binary via
# resources/embed.go and surfaced through Config.ResolveBundleHooks
# unconditionally — the hook only applies when the `ltk` binary is on PATH
# (builtin-bundle entries for missing companions are skipped with a warning).
# The same YAML is mirrored at examples/bundles/ltk.yaml.

version: 1.0.0
tags:
  - tooling
  - guardrails
  - ctxloom-native
author: ctxloom

description: |
  Command guidance via the standalone `ltk` binary
  (github.com/ctxloom/llm-tool-killer): a pre-tool hook that inspects each
  shell command or file edit before it executes and redirects it when a rule
  in the project's .ltk/config.yaml matches (e.g. `go test` → "use the task
  runner" → the agent retries `just test`). Where ctxloom shapes the context
  the agent sees, ltk guides the commands it runs.

notes: |
  This bundle ships one pre-tool hook:

    PreTool matcher=shell+edit tools → ltk evaluate
      ltk parses the real command (resolving variables, unwrapping trivial
      wrappers) and matches it against .ltk/config.yaml. The first matching
      deny returns a message/suggestion telling the agent what to run
      instead. Without a project config, ltk falls back to a built-in
      allow-all — the hook is a cheap no-op until rules are added.

  ltk is fully standalone: outside ctxloom, `ltk manage install` registers
  the same hook directly (and scaffolds a starter config). ctxloom users get
  registration from this bundle; rule authoring stays with ltk
  (`ltk manage install --config .ltk/config.yaml` scaffolds defaults).

installation: |
  The ctxloom install script and `brew install ctxloom/tap/ltk` ship the ltk
  binary (fallback: go install github.com/ctxloom/ctxloom/cmd/ltk@latest).
  A missing binary degrades to no hook, never a blocked startup. To activate
  rules for a project, scaffold .ltk/config.yaml with
  `ltk manage install --config .ltk/config.yaml --print` or write
  one by hand; without it the hook allows everything.

hooks:
  pre_tool:
    # Matches ltk's own claude-code installer: the shell-bound tools (command
    # rules) plus the file-editing tools (path rules). ltk decodes the hook
    # payload itself; deny → JSON decision on stdout, allow → pass-through.
    - command: ltk evaluate
      matcher: Bash|PowerShell|Edit|Write|MultiEdit|NotebookEdit
      type: command

fragments:
  ltk:
    tags:
      - tooling
      - guardrails
    content: |
      # llm-tool-killer (ltk)

      This project may run **ltk**, a pre-tool hook that inspects each shell
      command before it executes and redirects it when a rule matches. Where
      ctxloom shapes the context you see, ltk guides the commands you run.

      ## What it does

      ltk parses the real command (resolving variables, unwrapping trivial
      wrappers and sub-shells) and matches it against the project's rules in
      `.ltk/config.yaml`. The first matching `deny` wins and returns a
      `message`/`suggest` telling you what to run instead. Example:

          go test ./...   ->   blocked: "Run tests through the task runner."
                          ->   retry with `just test`

      ## How to work with it

      - Treat a redirect as guidance, not a failure: read the suggestion and
        retry the command the way the rule asks.
      - Prefer the project's task runner (e.g. `just <target>`) over invoking
        build/test/lint tools directly.
      - **Agents do not cut releases.** ltk blocks `git tag` and release
        commands. Prepare the version bump and PR; a human (or CI) cuts the tag.

      ## What it is not

      ltk is a cooperative redirect, not a sandbox. If explicitly instructed
      to work around a rule the agent can, so it makes the easy, accidental
      path the right one rather than enforcing hard isolation. For strict
      "never" boundaries, run the agent in a container.
