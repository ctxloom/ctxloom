# Base config.yaml written by `ctxloom init`. It carries the static defaults a
# fresh project starts with; init loads this into memory, sets the chosen LLM
# backend (and optional model) on the in-memory config, and writes the result
# before launching the engine. The `llm` block is intentionally absent here —
# init fills it from the user's selection.
version: 4

# Behavioral settings.
config:
  use_distilled: true

# Default profiles loaded for context assembly. init scaffolds a LOCAL profile
# named `default` (.ctxloom/profiles/default.yaml) that inherits ctxloom-default's
# baseline conduct/practice + developer profiles — so the seeded default is a
# real, editable local coding profile, not a bare remote reference. Edit it,
# add language/stack profiles via discovery, or split it into tighter per-role
# profiles bound to engines with `ctxloom subagent setup`.
profiles:
  defaults:
    - default

# MCP server configuration.
mcp:
  auto_register_ctxloom: true
