agents:
    developer:
        llm: claude-code
        permissions: bypass
        profiles:
            - default
        runtime: container-rootless
    distiller:
        llm: claude-fast
        profiles:
            - distiller
        runtime: container-rootless
    finder:
        llm: claude-fast
        permissions: bypass
        profiles:
            - finder
        runtime: container-rootless
    orchestrator:
        llm: claude-code
        permissions: bypass
        profiles:
            - orchestrator
        runtime: host
    triage:
        llm: claude-fast
        profiles:
            - triage
        runtime: container-rootless
config:
    use_distilled: true
default_agent: orchestrator
dirty_tree_handler: commit
llm:
    configs:
        claude-code:
            model: claude-opus-5-5
            type: claude-code
        claude-fable:
            model: claude-fable-5-1
            type: claude-code
        claude-fast:
            model: claude-haiku-4-5-20251001
            type: claude-code
        claude-sonnet:
            model: claude-sonnet-5
            type: claude-code
    defaults:
        fast: claude-fast
        primary: claude-code
version: 6
