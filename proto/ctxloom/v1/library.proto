  // The effort level on this engine, with the layer that said it.
  SourcedText effort = 3;
  // The engine's own permissions document, with the layer that said it;
  // passed verbatim, never checked.
  SourcedDocument permissions = 4;
  // The runtime, and what it replaced.
  RuntimeSetting runtime = 5;
  // The variable names passed through, each with its layer.
  EnvSetting env = 6;
  // Whose home the engine runs on (`session` | `host`), with the layer that
  // said it.
  SourcedText session_home = 7;
}

// An engine ctxloom drives (`claude-code`, `opencode`), with its effective
// settings: read-only, its block written with `config edit`.
message Engine {
  option (google.api.resource) = {
    type: "ctxloom.dev/Engine"
    pattern: "projects/{project}/engines/{engine}"
    pattern: "users/me/engines/{engine}"
    singular: "engine"
    plural: "engines"
  };

  // IDENTIFIER: `projects/{project}/engines/{engine}`,
