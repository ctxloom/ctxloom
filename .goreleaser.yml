# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ctxloom

before:
  hooks:
    # `go mod download` (not `go mod tidy`): tidy is module-scoped and would drop
    # the deliberately-retained pre-split genproto monolith pin (see go.mod),
    # rewriting go.mod/go.sum mid-release. download only hydrates the cache.
    - go mod download
    - go run ./scripts/gendocs --man man/man1

# EVERY BUILD BELOW carries `flags: [-trimpath]` and a `hooks.post` chain, and
# both are rules rather than per-build choices:
#
#   -trimpath matches build/common.justfile's _go-build, which every local and
#   CI build goes through. A release that omitted it would ship a binary that
#   differs from the one everybody actually tests.
#
#   hooks.post signs the built binary through build/signing.justfile — the same
#   recipes the host `install` path uses, so a released binary and a locally
#   installed one are signed under one definition rather than two that can
#   drift. ctxloom REFUSES to execute a companion whose detached `<binary>.sig`
#   does not verify, so an unsigned artifact is an unusable one. The signature
#   is staged under the BUILD ID rather than the binary name because several
#   builds emit the same binary name for the same target, and each archive
#   below picks up its own by that id.
#
#   The `-upx` builds compress in that same chain, BEFORE signing. goreleaser's
#   own `upx:` pipe runs after all build hooks, so signing in a hook would cover
#   the uncompressed bytes while the archive shipped the compressed ones — a
#   signature that cannot verify against the binary the user runs.
builds:
  # Standard build - no CGO required. Recommended for most users.
  - id: ctxloom
    flags:
      - -trimpath
    hooks:
      post:
        - just release-sign-binary "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" ctxloom
    main: ./cmd/ctxloom
    binary: ctxloom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ctxloom/ctxloom/internal/version.Version={{.Version}}

  # Full build - adds tree-sitter (31MB)
  # Requires CGO and cross-compilers. Statically linked on linux/windows (see
  # ldflags below); netgo/osusergo force the pure-Go resolver and user lookups
  # so static glibc linking doesn't break DNS or os/user.
  - id: ctxloom-full
    flags:
      - -trimpath
    hooks:
      post:
        - just release-sign-binary "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" ctxloom-full
    main: ./cmd/ctxloom
    binary: ctxloom
    tags:
      - treesitter
      - netgo
      - osusergo
    env:
      - CGO_ENABLED=1
      # Cross-compiler environment variables (provided by goreleaser-cross image)
      - >-
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CC=x86_64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm64" }}CC=aarch64-linux-gnu-gcc{{- end }}
        {{- end }}
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64" }}CC=o64-clang{{- end }}
          {{- if eq .Arch "arm64" }}CC=oa64-clang{{- end }}
        {{- end }}
        {{- if eq .Os "windows" }}
          {{- if eq .Arch "amd64" }}CC=x86_64-w64-mingw32-gcc{{- end }}
          {{- if eq .Arch "arm64" }}CC=/llvm-mingw/bin/aarch64-w64-mingw32-gcc{{- end }}
        {{- end }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64 # /llvm-mingw aarch64 cross-compiler unavailable in build image
    ldflags:
      - -s -w -X github.com/ctxloom/ctxloom/internal/version.Version={{.Version}}
      # Static linking for linux/windows; macOS cannot fully static-link system
      # libraries, so leave darwin dynamic.
      - '{{ if ne .Os "darwin" }}-extldflags "-static"{{ end }}'

  # UPX-compressed twin of `ctxloom`. Compression is a post hook rather than
  # goreleaser's `upx:` pipe, which runs AFTER build hooks and so would sign
  # the uncompressed bytes while the archive shipped the compressed ones.
  # Linux/windows only — UPX doesn't support macOS binaries well (breaks code
  # signing), which is why darwin is absent from this build's goos.
  - id: ctxloom-upx
    flags:
      - -trimpath
    hooks:
      post:
        - just release-compress-binary "{{ .Path }}"
        - just release-sign-binary "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" ctxloom-upx
    main: ./cmd/ctxloom
    binary: ctxloom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ctxloom/ctxloom/internal/version.Version={{.Version}}

  # UPX-compressed twin of `ctxloom-full`. Compression is a post hook rather
  # than goreleaser's `upx:` pipe, which runs AFTER build hooks and so would
  # sign the uncompressed bytes while the archive shipped the compressed
  # ones. Linux/windows only — UPX doesn't support macOS binaries well
  # (breaks code signing), which is why darwin is absent from this build's
  # goos.
  - id: ctxloom-full-upx
    flags:
      - -trimpath
    hooks:
      post:
        - just release-compress-binary "{{ .Path }}"
        - just release-sign-binary "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" ctxloom-full-upx
    main: ./cmd/ctxloom
    binary: ctxloom
    tags:
      - treesitter
      - netgo
      - osusergo
    env:
      - CGO_ENABLED=1
      # Cross-compiler environment variables (provided by goreleaser-cross image)
      - >-
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CC=x86_64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm64" }}CC=aarch64-linux-gnu-gcc{{- end }}
        {{- end }}
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64" }}CC=o64-clang{{- end }}
          {{- if eq .Arch "arm64" }}CC=oa64-clang{{- end }}
        {{- end }}
        {{- if eq .Os "windows" }}
          {{- if eq .Arch "amd64" }}CC=x86_64-w64-mingw32-gcc{{- end }}
          {{- if eq .Arch "arm64" }}CC=/llvm-mingw/bin/aarch64-w64-mingw32-gcc{{- end }}
        {{- end }}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64 # /llvm-mingw aarch64 cross-compiler unavailable in build image
    ldflags:
      - -s -w -X github.com/ctxloom/ctxloom/internal/version.Version={{.Version}}
      # Static linking for linux/windows; macOS cannot fully static-link system
      # libraries, so leave darwin dynamic.
      - '{{ if ne .Os "darwin" }}-extldflags "-static"{{ end }}'

  # ltk companion (llm-tool-killer): pre-tool command/edit guardrail hook.
  # Pure-Go (CGO off) → statically linked on every target. Folded into this
  # repo, so it now ships from the one ctxloom release/tag.
  - id: ltk
    hooks:
      post:
        - just release-sign-binary "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" ltk
    main: ./cmd/ltk
    binary: ltk
    env:
      - CGO_ENABLED=0 # no libc linkage at all → static on every target
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64 # not a release target
    # Pure-Go resolvers (no libc) so linux/windows binaries are unambiguously
    # static even if CGO ever gets re-enabled.
    tags:
      - netgo
      - osusergo
    flags:
      - -trimpath
    # Stamp main.Version with the release version, matching `ltk version`.
    ldflags:
      - -s -w -extldflags=-static -X main.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

  # taskloom companion: per-project task store CLI + MCP server. Pure-Go,
  # statically linked. Folded into this repo; ships from the one ctxloom release.
  - id: taskloom
    hooks:
      post:
        - just release-sign-binary "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" taskloom
    main: ./cmd/taskloom
    binary: taskloom
    env:
      - CGO_ENABLED=0 # no libc linkage at all → static on every target
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64 # not a release target
    tags:
      - netgo
      - osusergo
    flags:
      - -trimpath
    # Stamp main.version (lowercase) with the release version, matching
    # `taskloom version`.
    ldflags:
      - -s -w -extldflags=-static -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

  # harp: standalone harp-ID generator, extracted from the removed
  # `ctxloom harp` subcommand (plan WS-7). Pure-Go, statically linked. Its
  # own distributable target — folded into this repo/module but NOT one of
  # the "three binaries" the install script/`just install` puts on a host
  # PATH by default; ships from the same ctxloom release/tag as an
  # independent archive.
  - id: harp
    hooks:
      post:
        - just release-sign-binary "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" harp
    main: ./cmd/harp
    binary: harp
    env:
      - CGO_ENABLED=0 # no libc linkage at all → static on every target
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64 # not a release target
    tags:
      - netgo
      - osusergo
    flags:
      - -trimpath
    # Stamp main.Version with the release version, matching `harp version`.
    ldflags:
      - -s -w -extldflags=-static -X main.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  # Light build archives (default, recommended)
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    ids:
      - ctxloom
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      # The sig is named for the BINARY AS INSTALLED, not for the build id.
      # ctxloom looks for `<resolved binary path>.sig` (config's
      # resolveCompanionPath + companionSigSuffix), and on Windows that path
      # carries .exe — so a flat `ctxloom.sig` there is a signature nothing ever
      # opens, and the binary reads as unsigned and is refused. The install
      # scripts cannot paper over this for someone who just unzips the archive
      # by hand, which the release notes invite them to do.
      - src: dist/sigs/{{ .Os }}_{{ .Arch }}/ctxloom.sig
        dst: ctxloom{{ if eq .Os "windows" }}.exe{{ end }}.sig
      - LICENSE*
      - README.md
      - man/man1/*.1

  # Full build archives (with tree-sitter)
  - id: full
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    ids:
      - ctxloom-full
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}_full
    files:
      - src: dist/sigs/{{ .Os }}_{{ .Arch }}/ctxloom-full.sig
        dst: ctxloom{{ if eq .Os "windows" }}.exe{{ end }}.sig
      - LICENSE*
      - README.md
      - man/man1/*.1

  # UPX-compressed twin of `default`: smaller download, ~1.5s slower startup
  # (UPX LZMA decompression). Linux/windows only.
  - id: default-upx
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    ids:
      - ctxloom-upx
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}_upx
    files:
      - src: dist/sigs/{{ .Os }}_{{ .Arch }}/ctxloom-upx.sig
        dst: ctxloom{{ if eq .Os "windows" }}.exe{{ end }}.sig
      - LICENSE*
      - README.md
      - man/man1/*.1

  # UPX-compressed twin of `full`: smaller download, ~1.5s slower startup
  # (UPX LZMA decompression). Linux/windows only.
  - id: full-upx
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    ids:
      - ctxloom-full-upx
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}_full_upx
    files:
      - src: dist/sigs/{{ .Os }}_{{ .Arch }}/ctxloom-full-upx.sig
        dst: ctxloom{{ if eq .Os "windows" }}.exe{{ end }}.sig
      - LICENSE*
      - README.md
      - man/man1/*.1

  # ltk companion archives (ltk_<version>_<os>_<arch>) — the name install.sh
  # fetches from this unified release. Literal "ltk_" prefix because
  # .ProjectName is "ctxloom" here.
  - id: ltk
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    ids:
      - ltk
    name_template: >-
      ltk_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: dist/sigs/{{ .Os }}_{{ .Arch }}/ltk.sig
        dst: ltk{{ if eq .Os "windows" }}.exe{{ end }}.sig
      - LICENSE*
      - README.md

  # taskloom companion archives (taskloom_<version>_<os>_<arch>).
  - id: taskloom
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    ids:
      - taskloom
    name_template: >-
      taskloom_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: dist/sigs/{{ .Os }}_{{ .Arch }}/taskloom.sig
        dst: taskloom{{ if eq .Os "windows" }}.exe{{ end }}.sig
      - LICENSE*
      - README.md

  # harp archives (harp_<version>_<os>_<arch>). Ships its own README
  # (cmd/harp/README.md) rather than the root one — it documents the
  # standalone binary's flags/usage directly, which is what someone who
  # downloaded ONLY the harp archive actually wants.
  - id: harp
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    ids:
      - harp
    name_template: >-
      harp_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: dist/sigs/{{ .Os }}_{{ .Arch }}/harp.sig
        dst: harp{{ if eq .Os "windows" }}.exe{{ end }}.sig
      - LICENSE*
      - src: cmd/harp/README.md
        dst: README.md

# Homebrew casks published to ctxloom/homebrew-tap. Two casks mirror the two
# builds; they install the same `ctxloom` binary, so each declares a conflict
# with the other. Casks are macOS-only — Linux users install via scripts/install.sh.
#
# Requires the HOMEBREW_TAP_GITHUB_TOKEN secret (a PAT with push access to the
# tap repo) — the per-repo GITHUB_TOKEN cannot push to another repository.
#
# The post-install hook strips the macOS quarantine attribute so the unsigned
# binary launches without a Gatekeeper prompt. That is Apple code signing, and
# it is unrelated to the companion signatures below.
#
# No cask handles `<binary>.sig` explicitly, and none needs to: a cask stages
# the WHOLE archive and links the binary into the prefix, so the signature the
# archive already carries stays a sibling of the staged binary. Admission
# resolves symlinks before appending the suffix (internal/config's
# resolveCompanionPath and companionSigSuffix), so it looks beside the staged
# copy rather than beside the link.
homebrew_casks:
  # Standard build (recommended): no CGO deps.
  #   brew install ctxloom/tap/ctxloom
  - name: ctxloom
    ids:
      - default
    repository:
      owner: ctxloom
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ctxloom/ctxloom"
    description: "Context Loom - Weave context for AI coding agents"
    license: "BSD-3-Clause"
    conflicts:
      - cask: ctxloom-full
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ctxloom"]
          end

  # Full build: adds tree-sitter AST code compression (CGO).
  #   brew install ctxloom/tap/ctxloom-full
  - name: ctxloom-full
    ids:
      - full
    repository:
      owner: ctxloom
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ctxloom/ctxloom"
    description: "Context Loom (full build with tree-sitter AST code compression)"
    license: "BSD-3-Clause"
    conflicts:
      - cask: ctxloom
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ctxloom"]
          end

  # ltk companion cask: brew install ctxloom/tap/ltk
  - name: ltk
    ids:
      - ltk
    repository:
      owner: ctxloom
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ctxloom/ctxloom"
    description: "Pre-tool hook that redirects an LLM agent's shell commands to the project's preferred command"
    license: "BSD-3-Clause"
    # Don't push a cask for prereleases (e.g. v0.0.1-rc.1) or snapshots.
    skip_upload: auto
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ltk"]
          end

  # taskloom companion cask: brew install ctxloom/tap/taskloom
  - name: taskloom
    ids:
      - taskloom
    repository:
      owner: ctxloom
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ctxloom/ctxloom"
    description: "Per-project task store for AI coding agents: append-only log, CLI, and MCP server"
    license: "BSD-3-Clause"
    # Don't push a cask for prereleases (e.g. v0.0.1-rc.1) or snapshots.
    skip_upload: auto
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/taskloom"]
          end

  # harp cask: brew install ctxloom/tap/harp
  - name: harp
    ids:
      - harp
    repository:
      owner: ctxloom
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ctxloom/ctxloom"
    description: "Standalone generator for harp IDs (human-appropriate random phraselets), e.g. swift-amber-falcon"
    license: "BSD-3-Clause"
    # Don't push a cask for prereleases (e.g. v0.0.1-rc.1) or snapshots.
    skip_upload: auto
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/harp"]
          end

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# DISABLED for 0.7 (owner, 2026-08-20). MEASURED: 5,821 commits between v0.6.4
# and this release. `use: github` renders commit SUBJECTS, so the body would be
# thousands of lines with the 24 breaking changes unfindable inside it — a wall
# in front of the release.header, which is where the upgrade warning and the
# link to every breaking change live. The full history stays in git.
#
# RE-ENABLE for a normal release: delete `disable` and restore the filters
# below, which are kept rather than deleted so re-enabling is one edit.
changelog:
  disable: true
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: ctxloom
    name: ctxloom
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## ctxloom v{{.Version}}

    Context Loom - Weave context for AI coding agents.

    ### Upgrading from 0.6.x — read this first

    This release carries 24 breaking changes, and **one of them fails silently**:
    published bundle content moved to a canonical `ctxloom+git://` reference
    grammar that no ctxloom before 0.7 can parse. A 0.6 client reading migrated
    content resolves FEWER bundles with an identical exit code and an identical
    "Pulled N items" line — measured at 9 bundles before the migration against 2
    after. Pins never move on their own, so it begins at `deps upgrade`, not at
    install. **Upgrade the client first.**

    Every breaking change, and what to do about each:
    https://github.com/ctxloom/ctxloom/blob/v{{.Version}}/docs/behaviour-changes-0.7.0.md

    ### Quick Install

    **macOS / Linux:**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/ctxloom/ctxloom/main/scripts/install.sh | bash
    ```

    **Windows (PowerShell):**
    ```powershell
    irm https://raw.githubusercontent.com/ctxloom/ctxloom/main/scripts/install.ps1 | iex
    ```

    Both scripts also install the companion tools `taskloom` (task tracking) and
    `ltk` (command guardrails). All three now ship from this single ctxloom
    release — no separate downloads.

    **macOS (Homebrew), everything:**
    ```bash
    brew install ctxloom/tap/{ctxloom,taskloom,ltk}
    ```

    ### Security

    On non-Linux hosts (macOS and Windows, running under Docker Desktop),
    ctxloom's host-to-container LLM transport is plain gRPC with no per-run token
    and no mTLS — its only handshake value is a static, compiled-in magic cookie
    that guards against mis-execution, not a credential. The host-side port is
    published to `127.0.0.1` only, so it is not reachable from off the host. But
    the in-container listener binds all interfaces (`0.0.0.0`), and ctxloom does
    not place agent containers on an isolated network — so another container on
    the same Docker bridge can reach the plugin directly at the container's IP,
    which the `127.0.0.1` host publish does not prevent (it constrains only
    host-side access, never container-to-container traffic). On a shared or
    multi-tenant container host, treat this as a trust boundary and isolate
    untrusted workloads on separate Docker networks. On Linux the transport is a
    bind-mounted unix socket instead and is not exposed over TCP.

    ### Which Build?

    | Build | Size | Features |
    |-------|------|----------|
    | **Standard** (`ctxloom_*`) | ~10MB | Everything except tree-sitter |
    | **Full** (`ctxloom_*_full`) | ~12MB | + Tree-sitter AST code compression |

    Tree-sitter is the only feature difference, and it is the reason the full
    build requires CGO. Every other capability is present in both.

    Each build ships in two forms:

    - **Default** (no suffix, all platforms): uncompressed, fastest startup.
    - **`_upx`** (linux/windows only): UPX-compressed, smaller download, but
      ~1.5s slower per invocation due to LZMA decompression at startup.

    Use the default unless the smaller download size matters more than
    startup latency.

    ### Manual Installation

    **Go Install:**
    ```bash
    go install github.com/ctxloom/ctxloom/cmd/ctxloom@v{{.Version}}
    ```

    **Manual Download:**
    Download the appropriate archive for your platform below. `harp` (the
    standalone harp-ID generator, `swift-amber-falcon`-style) ships as its
    own archive here too — `brew install ctxloom/tap/harp`, or grab
    `harp_*` below — independent of the main ctxloom install.

