[package]
name = "daemon-application"
version = "0.1.0"
description = "The daemon's one launcher (T18): the orphan sweep at its start, then the policy plan, the hosted children's lifecycle and their facts, over the engine registry and ports"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
angzarr-embedded.workspace = true
daemon-board.workspace = true
library-application.workspace = true
pending-launches.workspace = true
pending-messages.workspace = true
run-application.workspace = true
run-launcher.workspace = true
run-ports.workspace = true
runs.workspace = true
runs-application.workspace = true
session-index.workspace = true
session-policies.workspace = true
sessions.workspace = true
uuid.workspace = true

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
run-launcher = { workspace = true, features = ["test-support"] }
run-ports = { workspace = true, features = ["test-support"] }
mutants.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
