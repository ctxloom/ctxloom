[package]
name = "engine-opencode"
version = "0.1.0"
description = "opencode's two halves: the drive (`opencode run --format json` per child turn, the TUI for the human's session) and the hook wire of the per-session plugin that forwards opencode's bus events to `ctxloom hook opencode execute`"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol.workspace = true
futures.workspace = true
# The child's listener password (D24).
getrandom.workspace = true
run-ports.workspace = true
run-within.workspace = true
# The ACP methods of opencode's own (`session/set_model`) and ctxloom's.
serde.workspace = true
surface-ports.workspace = true

[dev-dependencies]
fixture-program.workspace = true
file-system = { workspace = true, features = ["test-support"] }
mutants.workspace = true
os = { workspace = true, features = ["test-support"] }
run-within = { workspace = true, features = ["test-support"] }
# The spike's lines, read into the ACP schema's types.
serde_json.workspace = true

[lints]
workspace = true
