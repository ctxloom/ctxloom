# ctxloom Configuration
# See https://github.com/ctxloom/ctxloom for documentation
schema_version: 8

# Large language model configuration.
#
# `llm.configs` is a registry of arbitrarily-labeled, fully-specified backend
# configs. A label is an arbitrary string with zero semantics — the backend is
# determined ONLY by each entry's `type` field. `llm.defaults` maps a role to
# the label that plays it.
#
# Out of the box ctxloom ships a built-in primary (claude-code) and a fast
# compression config (claude-code on haiku), so you do not need this block at
# all unless you want to change a model, point at a custom binary, or pair
# different configs per role. claude-code models are the claude CLI's aliases
# (opus, sonnet, haiku), which it resolves to the current model; a full model id
# pins one.
#
# llm:
#   configs:
#     big:   { type: claude-code, model: opus }   # label is arbitrary...
#     quick: { type: claude-code, model: haiku }  # ...two claude-code backends
#   defaults:
#     primary: big     # coding/interactive role → label
#     fast:    quick    # fallback for distill/triage when no `distiller`/`triage` agent is configured

# Behavioral settings.
# config:
#   use_distilled: true       # prefer .distilled.md versions (default true)

# The default agent: a bare `ctxloom run` binds it (its profiles become the
# context, its engine/runtime/permissions the transport). default_agent names an
# entry under agents:. This replaces the retired profiles.defaults.
# default_agent: default
# agents:
#   default:
#     engine: big          # LLM config label; overrides the profiles' llm
#     runtime: host        # host | container-rootless | container-rootful
#     engine_home: host    # host | session: which home the engine runs against
#     profiles:
#       - ctxloom-default/go-developer
#       - ctxloom-default/python-developer

# Profiles: custom named definitions (compose them via an agent's profiles list).
# profiles:
#   definitions:
#     my-profile:
#       description: "My custom profile"
#       parents:
#         - ctxloom-default/go-developer
#       bundles:
#         - my-custom-bundle

# Uncomment to configure your preferred editor:
# editor:
#   command: vim
#   args: []

# Available profiles from ctxloom-default:
#   - ctxloom-default/go-developer             (Go backend development)
#   - ctxloom-default/go-code-reviewer         (Go code review)
#   - ctxloom-default/python-developer         (Python development)
#   - ctxloom-default/python-code-reviewer     (Python code review)
#   - ctxloom-default/rust-developer           (Rust systems development)
#   - ctxloom-default/rust-code-reviewer       (Rust code review)
#   - ctxloom-default/typescript-web-developer (TypeScript/React web development)
