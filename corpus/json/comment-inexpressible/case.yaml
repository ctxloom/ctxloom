name: json/comment-inexpressible
seams: [e2e]
kind: error
format: json
error: HEW020
error_seam: applier
error_path: /server
patch_line: 6
message_contains: ["inexpressible", "comment"]
ops: [OP-30]
why: |
  JSON has no comments. A `+` comment line against a `json` target fails with a
  named error rather than being silently dropped — the applier must refuse a
  qualifier it cannot honour (§9.3).
spec: "§8.1, §9.3, §11 OP-30"
