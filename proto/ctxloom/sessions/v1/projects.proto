syntax = "proto3";

// A project's harp (owner S54, accepted): a session's resource name is
// `projects/{project-harp}/sessions/{session-harp}` (S42), so each project
// has a harp of its own, minted ONCE and never changed, as a session's is.
// Two aggregates in the one store (T14):
//
// - `projects`: one stream per project, its root the project's namespace
//   (`project_namespace(project_id)`, owner-approved and fixed), holding the
//   harp it was named with;
// - `project-names`: one claim stream per harp text, its root UUIDv5 of the
//   harp in the user's project-names namespace, so a project harp is unique
//   for the user because a stream is.
//
// A project is named by claiming a harp for it first (`ClaimProjectName`),
// then `NameProject`; a project already named records nothing, whatever
// harp is asked, and keeps the one it has.
package ctxloom.sessions.v1;

import "io/angzarr/v1/options.proto";

message ProjectState {
  option (io.angzarr.v1.component) = {
    component_name: "project"
    aggregate: {domain: "projects"}
  };

  string project_id = 1;
  // The project's harp; empty until it is named.
  string harp = 2;
  // Its registration (owner, 2026-11-12, project registration), empty until
  // a daemon client first registers it: the root path the client resolved,
  // its git common directory (a worktree's is its primary checkout's, so
  // a worktree is its primary's project) and the repository's root commit.
  // Outside git the two are empty (an empty VCS identity).
  string root = 3;
  string git_common_dir = 4;
  string root_commit = 5;
}

// Name the project `harp`, once. A project already named records nothing
// (its harp is permanent); its stream says the harp it has.
message NameProject {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.sessions.v1.ProjectState"
    emits: ["ctxloom.sessions.v1.ProjectNamed"]
    refuses: "ctxloom.sessions.v1.HarpInvalid"
  };

  string project_id = 1;
  string harp = 2;
}

message ProjectNamed {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.ProjectState"};

  string project_id = 1;
  string harp = 2;
}

// Register the project's root and its VCS identity on first sight, or
// recheck them on every later access (owner, 2026-11-12, project
// registration): a project registered records nothing again, and is
// refused when its root commit is not the one registered (another
// repository at its place) or when the client expected another harp. The
// project must be named first (S54): its harp is what a refusal names.
message RegisterProject {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.sessions.v1.ProjectState"
    emits: ["ctxloom.sessions.v1.ProjectRegistered"]
    refuses: "ctxloom.sessions.v1.UnnamedProject"
    refuses: "ctxloom.sessions.v1.ProjectIdentityChanged"
    refuses: "ctxloom.sessions.v1.ProjectHarpMismatch"
  };

  string project_id = 1;
  string root = 2;
  string git_common_dir = 3;
  string root_commit = 4;
  // The project harp the client expects (the one its session names); empty
  // when it expects none.
  string expected_harp = 5;
}

message ProjectRegistered {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.ProjectState"};

  string project_id = 1;
  string root = 2;
  string git_common_dir = 3;
  string root_commit = 4;
}

message ProjectNameState {
  option (io.angzarr.v1.component) = {
    component_name: "project-name"
    aggregate: {domain: "project-names"}
  };

  string harp = 1;
  // The project that holds the harp; empty while it is free.
  string project_id = 2;
}

// Take the harp for `project_id`. Refused `sessions-project-name-taken`
// while another project holds it; the holder asking again records nothing.
message ClaimProjectName {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.sessions.v1.ProjectNameState"
    emits: ["ctxloom.sessions.v1.ProjectNameClaimed"]
    refuses: "ctxloom.sessions.v1.ProjectNameTaken"
  };

  string harp = 1;
  string project_id = 2;
}

message ProjectNameClaimed {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.ProjectNameState"};

  string harp = 1;
  string project_id = 2;
}

// region refusals

// A claim on a project harp another project holds.
message ProjectNameTaken {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_ALREADY_EXISTS;

  string harp = 1;
}

// A registration of a project that has no harp yet.
message UnnamedProject {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  string project_id = 1;
}

// A recheck whose repository is not the one registered: its root commit
// changed (another repository at the project's place). Names the
// registered project.
message ProjectIdentityChanged {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // `projects/{project}`, the registered project.
  string project = 1;
  string root = 2;
  string registered_commit = 3;
  string found_commit = 4;
}

// A recheck that expected another project harp than the registered one.
message ProjectHarpMismatch {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // `projects/{project}`, the registered project.
  string project = 1;
  string expected = 2;
}

// endregion refusals
