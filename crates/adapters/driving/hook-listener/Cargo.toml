[package]
name = "hook-listener"
version = "0.1.0"
description = "The run's hook listener: the standard Handle of the angzarr coordinator on TCP, behind ctxloom's admission gate, while an interactive run is live"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-coordinator = { workspace = true, features = ["commands"] }
# TLS (`tls`: tonic's `tls-ring`, never aws-lc): the listener is TLS only (rulings 35-37).
angzarr-coordinator-grpc = { workspace = true, default-features = false, features = ["commands", "tls"] }
angzarr-diagnostic.workspace = true
angzarr-proto-transport-distributed.workspace = true
runs-application.workspace = true
tokio = { workspace = true, features = ["time"] }
# The server's identity and TLS config; `tls-ring` is the one provider.
tonic = { version = "0.14", default-features = false, features = ["codegen", "server", "tls-ring"] }

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
angzarr-embedded-host.workspace = true
embedded-edge.workspace = true
hook-tls.workspace = true
mutants.workspace = true
prost.workspace = true
run-ports.workspace = true
runs.workspace = true
sessions.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring"] }
uuid.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
