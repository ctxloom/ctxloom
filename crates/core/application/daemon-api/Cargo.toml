[package]
name = "daemon-api"
version = "0.1.0"
description = "The daemon's API (slice 2 step 5): the Ctxloom service's use cases the daemon serves from its warm read models, the projects' register-or-recheck, the refusals they answer, and the client's version-skew rule (M3) over the daemon-ports API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coded-diagnostic.workspace = true
angzarr-embedded.workspace = true
# The board a destroy tells the stream is gone.
daemon-application.workspace = true
daemon-board.workspace = true
daemon-ports.workspace = true
daemon-proto.workspace = true
exit-code.workspace = true
# The scratch worktrees a removal classifies and removes (slice 2 step 6).
isolation-application.workspace = true
# A library read's observation first (step 10a U2): the reconcile, the
# checkouts it reconciles against, and the library domain's refusals.
init-application.workspace = true
library-api.workspace = true
# The premise index's words, rendered at a driving edge from the data an
# assembly answers (E2).
library.workspace = true
# The library's use cases a read is answered by (step 10a U2).
library-application.workspace = true
# The remotes' and the lock's use cases the deps reads are answered by.
deps-application.workspace = true
library-checkout.workspace = true
library-tree.workspace = true
pending-messages.workspace = true
prost.workspace = true
# `session remove`'s one safe order, and the sweep's table, run here.
reclaim-application.workspace = true
run-application.workspace = true
# The framing of a live session's re-assembled context (step 10c U13).
run-launcher.workspace = true
run-ports.workspace = true
# A hook's messages and its one budget, composed where they are joined
# (`compose_context`, the lean hook RPC).
setup-application.workspace = true
# A destroy's run streams, UUIDv5(session, n).
runs.workspace = true
session-index.workspace = true
# A re-assembled context's digest, recorded in place of its text (U13).
sha2.workspace = true
hex.workspace = true
# The destroy's commands to the children and the owner (M3).
session-policies.workspace = true
session-ports.workspace = true
# A project's trust (step 8 U1): its commands, its name and root, and the
# warm index `GetTrust` and `ListTrusts` read.
trust.workspace = true
trust-index.workspace = true
# The permission asks (step 8 U4): their commands, facts, names and roots,
# and the warm read model the approvals calls read.
approvals.workspace = true
pending-approvals.workspace = true
session-timeline.workspace = true
sessions.workspace = true
sessions-application.workspace = true
sessions-proto.workspace = true
uuid.workspace = true
# A write's atomic operations (step 10b U8).
ctxloom-ports.workspace = true

[dev-dependencies]
# A config that does not parse, as a refusal's cause (E5's tests).
angzarr-yaml.workspace = true
library-application = { workspace = true, features = ["test-support"] }
deps-application = { workspace = true, features = ["test-support"] }
# `purge`: the tests purge a stream, as a session's destroy does; only a test
# build has the Purge API.
angzarr-embedded = { workspace = true, features = ["test-support", "purge"] }
sessions-application = { workspace = true, features = ["purge"] }
mutants.workspace = true
run-ports = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
prost-types.workspace = true
# The trust commands' wire form, which a test decodes a sent book's into.
trust-proto.workspace = true
# The approvals commands' and facts' wire form, decoded from a sent book.
approvals-proto.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
