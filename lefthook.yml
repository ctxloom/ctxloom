# Git hooks, managed by lefthook (`lefthook install` wires .git/hooks).
# A failing hook is a finding: read its output and fix the cause, then retry
# the commit — never bypass with --no-verify / LEFTHOOK=0 unless the human
# driving explicitly says so.
pre-commit:
  commands:
    reprise:
      # Duplicate-detection gate: findings involving units changed since HEAD
      # fail unless baselined (the baseline is a git ref reprise maintains
      # itself, not a tracked file) and unworsened. On an inconsistent-update
      # finding, apply the change to
      # every copy of the group (or extract the shared helper); on a new
      # duplicate, call the existing unit instead. Refresh the baseline only
      # for deliberate, reviewed adoptions — never to make a failing check
      # pass.
      #
      # `env -u GIT_INDEX_FILE` (jaded-fade): git exports GIT_INDEX_FILE into
      # every hook's environment, pointing at THIS worktree's real index.
      # On a base-state cache miss, reprise shells out `git worktree add`
      # to check out the --base ref for comparison; that subprocess inherits
      # GIT_INDEX_FILE unless scrubbed, so its checkout silently overwrites
      # our real index with the base tree instead of populating its own new
      # worktree's index — the running `git commit` then builds an empty
      # tree from the clobbered index with no error anywhere. Reproduced and
      # root-caused in a synthetic repo+worktree; see scripts/repro-jaded-fade.sh.
      # The upstream fix HAS landed (reprise 574b5a3, merged 06cf012 on
      # 2026-07-10: "scrub hook-injected git env from all spawned git
      # children" — GIT_INDEX_FILE, GIT_DIR and GIT_WORK_TREE, in check.rs
      # and baseline.rs). This scrub is KEPT as defense in depth, not because
      # the bug is open: the hook runs whatever reprise binary is installed on
      # the host, which may predate that commit, and the failure mode is a
      # SILENT empty commit — no error anywhere. Cheap insurance against an
      # expensive, invisible loss (only-viper).
      run: env -u GIT_INDEX_FILE reprise check --base HEAD .

    archlint:
      # Architectural gate: ctxloom's structural rules (internal/archlint) run
      # as go/analysis analyzers over the whole module. An import that crosses
      # a layer, a path segment spelled outside internal/paths, a raw
      # filesystem write, an unlocked read-modify-write, a hand-built
      # <ctxloom-reminder> frame — each fails here with the rule and the fix.
      #
      # PREBUILT, never `go run`. Compiling an analyzer suite on every commit
      # is slow, and a slow hook is one people learn to bypass — which this
      # file's own rule forbids. bin/archlint is built by `just build-archlint`
      # (and by `just lint-arch`, which is the same gate for interactive use).
      #
      # A MISSING OR STALE BINARY FAILS LOUDLY. Skipping the check because the
      # artifact is absent would be a gate that reports success having run
      # nothing, which is the exact failure the rules themselves exist to
      # catch. The staleness test is a file comparison, not a rebuild, so it
      # costs nothing on the common path.
      #
      # TWO PASSES, matching `just lint-arch`. Tags reach the package loader
      # through GOFLAGS — the driver's own -tags flag is accepted and then
      # ignored. The first pass carries every tag whose files nothing else
      # type-checks; the second runs the default build to reach the files
      # those tags hide (`!schemagen`, `!docsgen`), with allowlist liveness
      # off, because an exemption naming a file a pass cannot see is not stale.
      #
      # NOT scoped to changed packages, deliberately. The import-closure rule
      # needs the whole graph (a change deep in it alters what an untouched
      # binary reaches), and every allowlist-liveness check must inspect
      # exempted packages precisely when nobody touched them — that is what
      # makes an exemption go stale.
      run: |
        set -euo pipefail
        if [ ! -x bin/archlint ]; then
          echo "bin/archlint is missing — run 'just build-archlint'." >&2
          echo "The architectural gate cannot pass by not running." >&2
          exit 1
        fi
        if [ -n "$(find internal/archlint cmd/archlint -name '*.go' -newer bin/archlint -print -quit)" ]; then
          echo "bin/archlint is older than the rules in internal/archlint — run 'just build-archlint'." >&2
          echo "A stale linter enforces the rules it was built with, not the ones on disk." >&2
          exit 1
        fi
        GOFLAGS=-tags=mutation,arch,conformance,docker_integration,acceptance,integration,schemagen,docsgen \
          ./bin/archlint ./...
        ARCHLINT_CHECK_ALLOWLISTS=0 ./bin/archlint ./...

pre-push:
  commands:
    cache-report:
      # Bound the Go build cache. ~/.cache/go-build has no native size cap: Go
      # trims entries unused for ~5 days, which bounds it at five days of churn
      # and nothing more. A heavy multi-agent day here produces ~100 GB, and
      # worktrees multiply it because `go test` compiles without -trimpath, so
      # identical source in N worktrees is N entries (obtuse-equinox).
      #
      # This is not hypothetical maintenance. On 2026-08-07 the cache reached
      # 145 GB, /home hit 100%, and the linker started failing with "no space
      # left on device" — while `just build` and `just test-acceptance` kept
      # passing, because their link footprints differ. It read as a flaky test
      # and cost a 35-run investigation before anyone looked at df
      # (scruffy-attractor). `just cache-report` already existed and enforced
      # the 40 GB limit correctly; nothing ran it. This runs it.
      #
      # PRE-PUSH, not pre-commit: pushes are frequent enough here to bound
      # growth and rare enough not to tax iteration, and the check costs ~2s
      # against a healthy cache. Eviction is age-based and a missing entry is a
      # plain cache miss, never a wrong build, so this can never corrupt a
      # result — worst case it costs a recompile.
      #
      # Local only by design: CI runners get ephemeral disks, so this protects
      # the developer boxes that actually fill up.
      run: just cache-report
