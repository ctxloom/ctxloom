name: CI

# EVERY STEP BELOW IS A `just` TARGET. The shell that used to live in these
# `run:` blocks lives in build/ci.justfile, imported by both root justfiles.
# Two consequences worth keeping:
#
#   - any CI step can be reproduced locally by typing its target;
#   - a step and the recipe doing the same job can no longer drift apart,
#     which is how CI came to run a bare `gremlins unleash` while the recipe
#     next to it pinned TMPDIR to stop gremlins emptying a tmpfs.
#
# The only exception is the `just` bootstrap itself (./.github/actions/setup-just)
# on jobs that do not run in the devcontainer image. Please keep it that way:
# new logic goes in build/ci.justfile and is invoked from here by name.
#
# Containerized jobs set JUST_JUSTFILE=justfile.container at the JOB level, so
# steps read `just <target>` with no `-f`. Without it a bare `just` finds the
# host justfile, whose same-named recipes delegate into docker.

on:
  # 'release/*' covers integration lines (release/0.7 today, release/0.8 next,
  # ...) so a new release line is covered automatically instead of needing
  # another hardcoded entry here each time. 'v*' is retained for the older
  # version-named branches that predate the branch-naming standard.
  #
  # Work lands directly on the integration line with no PR, so the push
  # trigger is what actually matters for it; the pull_request entry is added
  # too in case a PR against one ever happens. Deliberately NOT a wildcard
  # over all branches: agent worktrees push disposable branches constantly,
  # and none of those start with 'release/' or 'v', so this stays scoped to
  # main plus long-lived integration lines.
  push:
    branches: [main, initial-prototyping, 'release/*', 'v*']
  pull_request:
    branches: [main, 'release/*', 'v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-devcontainer

jobs:
  # Release gate: every change to main must carry a fresh, untagged VERSION.
  # Fails the PR/push if VERSION already has a git tag, forcing a deliberate
  # `versionator set` bump (no auto-increment). On merge, auto-release.yml tags
  # this VERSION and triggers the release.
  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-just

      - name: Fail if VERSION is already tagged
        run: just version-untagged-check

  build-container:
    name: Build Dev Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-just

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # .devcontainer/tool-versions.env is the single source of truth for
      # every pinned tool version the Dockerfile installs; its ARGs are
      # deliberately default-less (see the Dockerfile's guard RUN), so this
      # step is what makes a plain build-push-action build resolve them —
      # this mirrors what `just dev-image` does for a local build. The recipe
      # emits the file's KEY=VALUE pairs as this step's `args` output, in the
      # newline-delimited format the build-args input takes.
      - name: Load tool versions for build-args
        id: tool_versions
        run: just tool-version-args

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.tool_versions.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build-container]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      JUST_JUSTFILE: justfile.container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: just ci-git-safe-directory

      - name: Generate protobuf code
        run: just proto

      - name: Generate JSON Schemas
        run: just gen-schemas

      # The suite is split into two steps that partition it — NOTHING runs
      # twice. The TestArch_ gates carry `//go:build arch`, so only the step
      # below with `-tags arch` compiles them, and "Run tests (default suite)"
      # no longer contains them.
      #
      # The point is attribution. A violated architectural invariant used to
      # surface as one red test inside a 217-package run, indistinguishable
      # from an ordinary break; now it turns THIS step red, under a name that
      # says what class of thing broke. The recipe refuses to pass having
      # selected zero tests, so a rename that breaks the naming convention —
      # or a mistyped build tag, which silently empties the group without a
      # single compile error — fails this step instead of quietly passing.
      #
      # All three steps below MUST stay wired. `just test` is the aggregate
      # that runs the first two groups, but it is for humans and agents; CI
      # invokes the targets individually so a red step names its group. If any
      # step is deleted or renamed here, that whole group silently stops
      # running in CI — the failure mode `test-conformance` used to exhibit in
      # this repo (red, and referenced by no workflow) before it was wired in
      # below.
      - name: Architectural invariants (class gates)
        run: just test-arch

      - name: Run tests (default suite)
        run: just test-default

      - name: Cross-agent conformance (test-conformance)
        run: just test-conformance

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [build-container]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      JUST_JUSTFILE: justfile.container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The generated-docs drift gate below runs `git diff` inside the
      # devcontainer image, so the checkout has to be marked safe first.
      - name: Mark workspace as safe for git
        run: just ci-git-safe-directory

      - name: Generate protobuf code
        run: just proto

      - name: Run golangci-lint
        run: just lint

      - name: Enforce cyclomatic complexity (CCN ≤ 10)
        run: just complexity-check

      - name: Generate JSON Schemas (verify the generator runs clean)
        run: just gen-schemas

      # Drift gate for every generated reference page — ctxloom, taskloom, and
      # ltk: regenerate from each cobra command tree (plus the MCP registrations
      # and the config schema) and fail if the checked-in website pages are
      # stale or a newly generated page was never committed.
      - name: Check generated reference docs are current (ctxloom, taskloom, ltk)
        run: just gen-docs-check

      # Drift gate for the proto-canonical MCP tool schemas: regenerate from
      # the buf-built descriptor set and fail if the checked-in goldens are
      # stale.
      - name: Check generated MCP tool schemas are current
        run: just gen-mcp-schemas-check

  build-and-integration:
    name: Build & Integration Tests
    runs-on: ubuntu-latest
    needs: [build-container, test]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      JUST_JUSTFILE: justfile.container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe
        run: just ci-git-safe-directory

      - name: Build
        run: just build

      # tests/integration and the godog suite exec the real ctxloom binary as a
      # subprocess and resolve it from PATH; `build` writes ./ctxloom into the
      # workspace.
      - name: Add binaries to PATH
        run: just ci-path

      - name: Run integration tests
        run: just test-integration

      # Docker-gated container proof: builds minimal images, spawns real
      # containers, and proves the gRPC transport + force-removal boundary
      # (internal/lm/isolation), the coordinator<->containerized-child bus,
      # top-level owner runs and progress/liveness (internal/agentcoord/coord),
      # the interactive docker-exec turn (internal/vpio/dockerexec) and the ACP
      # container transport (internal/acp) end to end. GitHub-hosted runners
      # bind-mount /var/run/docker.sock into job containers, so the
      # devcontainer's docker-ce-cli can reach it.
      #
      # CTXLOOM_REQUIRE_DOCKER=1 turns "docker unreachable" from a per-test
      # SKIP into a FAILURE (internal/testsupport/dockergate). Without it a
      # runner that lost its socket would pass this step having executed ZERO
      # container tests — a green report for a suite that ran nothing, the same
      # silent-no-op the suite exists to catch. Set here ONLY; a developer
      # without docker still gets the skip locally.
      - name: Run docker-gated container integration tests
        env:
          CTXLOOM_REQUIRE_DOCKER: "1"
        run: just test-docker-integration

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctxloom-linux-amd64
          path: |
            ctxloom
          retention-days: 7

  acceptance:
    name: Acceptance Tests (hermetic)
    runs-on: ubuntu-latest
    needs: [build-container, test]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      JUST_JUSTFILE: justfile.container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe
        run: just ci-git-safe-directory

      # The godog suite execs the real ctxloom binary as a subprocess; it
      # resolves it from PATH (or CTXLOOM_BINARY). `test-acceptance` depends on
      # `build`, which writes ./ctxloom into the workspace.
      - name: Add binaries to PATH
        run: just ci-path

      # Hermetic only (~@live && ~@network): real CLI subprocesses + a real MCP
      # server + the mock LLM backend. No network, no real agent, no secrets.
      - name: Run acceptance suite
        run: just test-acceptance-cover

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: [build-container, test]
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      JUST_JUSTFILE: justfile.container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe
        run: just ci-git-safe-directory

      - name: Generate protobuf code
        run: just proto

      # Diff-only mutation on both PR and push, so a green PR runs the same
      # check that gates the release on main. The whole-codebase run is too slow
      # for every PR; it runs weekly instead (mutation-weekly.yml).
      #
      # The base is the one thing here that is genuinely GitHub's to compute —
      # everything the recipe does with it (the no-base and no-mutable-Go skips,
      # the TMPDIR pinning gremlins needs) is in build/ci.justfile.
      - name: Run mutation tests (diff)
        env:
          MUTATION_BASE: >-
            ${{ github.event_name == 'pull_request'
                && format('origin/{0}', github.base_ref)
                || github.event.before }}
        run: just test-mutation-diff "$MUTATION_BASE"
