// region agents: ctxloom.dev/Agent

// An agent's block for one engine (ruling 57): what is in that engine's
// vocabulary. was: agents.<n>.engines.<e>.
message AgentEngine {
  string model = 1;
  string effort = 2;
  // The engine's own document, verbatim (rulings 133-139).
  google.protobuf.Value permissions = 3;
}

message RequirementSource {
  string kind = 1;
  string reference = 2;
}

message Requirement {
  string command = 1;
  repeated RequirementSource sources = 2;
}

// What an agent resolves to (its settings flattened, as today). was:
// ResolvedAgent.
message ResolvedAgent {
  repeated string profiles = 1;
  // The Engine's name.
  string engine = 2;
  SourcedText model = 3;
  SourcedText effort = 4;
  SourcedDocument permissions = 5;
  RuntimeSetting runtime = 6;
  EnvSetting env = 7;
  string context = 8;
  repeated string fragments = 9;
  string driving = 10;
  // Was the engine block's bare word; now the effective value with the
  // layer that said it (owner ruling of 2026-11-13).
  reserved 11;
  string command = 12;
  SourcedText session_home = 13;
}

message Agent {
  enum View {
    VIEW_UNSPECIFIED = 0;
    BASIC = 1;
    FULL = 2;
  }

  // IDENTIFIER: `projects/{project}/agents/{agent}`, `users/me/agents/{agent}`.
  string name = 1;
  // The Engine's name.
  string engine = 2;
  // Profile names.
  repeated string profiles = 3;
  string runtime = 4;
  string driving = 5;
  repeated string env = 6;
  // Keyed by engine ID, so `engines.<e>.model` keeps its path.
  map<string, AgentEngine> engines = 7;
  // OUTPUT_ONLY: the default agent, printed true or false (OQ-7).
  optional bool default = 8;
  // `session` | `host`, as the agent's binding says it; unset, its engine
  // block's (owner ruling of 2026-11-13).
  string session_home = 9;
  // OUTPUT_ONLY, FULL.
  ResolvedAgent resolved = 20;
  string resolution_error = 21;
  repeated Requirement requirements = 22;
  string requirements_error = 23;
  repeated NotCarried not_carried = 24;
  string etag = 70;
}

message GetAgentRequest {
  string name = 1;
  Agent.View view = 2;
}

message ListAgentsRequest {
  string parent = 1;
  Agent.View view = 2;
