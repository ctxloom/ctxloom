  // The model passed to the engine (`--model`); empty, the engine's own
  // default.
  string model = 1;
  // The effort level passed to the engine; claude takes
  // `low|medium|high|xhigh|max`; empty, the engine's own default.
  string effort = 2;
  // The engine's own document, verbatim (rulings 133-139).
  google.protobuf.Value permissions = 3;
}

// Who asks for a required command.
message RequirementSource {
