author: ben-abbitt-me
description: Unattended and overnight operation — work an admitted queue autonomously, getting as far as is safely feasible while stopping short of any decision that is hard to reverse or that endangers the environment, and leave behind a report the human can act on cold.
notes: |
    Authored 2026-07-28 after an autonomous multi-agent remediation campaign
    (session wordy-broad-stank). Every rule in the skill is there because
    something went wrong, or nearly did, during a run like the one it describes:

    - "unverifiable means stop" — agents correctly escalated container-only,
      Windows-only and credential-gated paths rather than guessing; unattended,
      that instinct has to be a written rule rather than good judgement.
    - "never put a slow command in an implementer brief" — a gate at 123s
      against a 120s tool timeout auto-backgrounds and promises a notification
      a leaf agent never receives. Forbidding it in prose was measured and made
      it WORSE (1/6 stalled without the prohibition, 4/7 with). See the
      agent-ensemble bundle's prompt-authoring fragment for the full account.
    - "commit after every unit" — five agents stalled in one campaign; every one
      of them kept its work because it had committed.
    - "name IDs in the commit BODY" — a bookkeeping pass that read only subject
      lines lost 38 of 141 IDs, leaving findings marked open that were fixed.
    - "green baseline before you start" — you cannot distinguish your breakage
      from pre-existing breakage at 3am.
    - "escalate and continue, never halt" — halting on item 3 of 40 wastes the
      night, which is the whole resource being spent.

    Pairs with agent-ensemble (coordinator conduct, delegation, prompt-authoring)
    and with taskloom for the queue itself.
commands:
    prompt-human:
        description: Find everything blocked on a human decision and put each one to the human as an interactive question that loads their context — they know the project, but are running several threads and do not know which one this is.
        tags:
            - default
            - decisions
            - human
            - coordinator
        content: |-
            Invoke the `prompt-human` skill and follow it.

            Sweep for everything blocked on a human decision — this session's deferrals and
            silent defaults, every agent report's DEFERRALS section, the task log, the
            plans and design docs' open-decisions sections, and any comment or feature row
            that poses a question it never answers.

            Then filter hard. Most of what you find is not theirs: anything a convention or
            an existing helper already answers, and anything you can settle by reading the
            code, you settle yourself and mention. Go and read BEFORE you ask — a fork whose
            answer is in the tree is your homework, not their decision. Be especially wary
            of any option that proposes a NEW declaration; it is usually a duplicate of
            state something already computes.

            Put what genuinely remains through the interactive question tool, never prose,
            one recommendation-first fork per decision, every option carrying its cost.

            Load their context INTO each question. They know this project. What they do not
            know is WHICH thread this is — name the task, say what it was doing, what state
            it is in, and what changed to produce the question. Quote the measured fact, and
            label VERIFIED against INFERRED.

            Then record each ruling and its accepted cost where the work lives, and act on
            it.

            $ARGUMENTS
