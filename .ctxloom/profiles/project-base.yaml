description: 'Project-wide base: context every role working in this repo needs, regardless of what it is doing. Inherited by every other local profile — add shared context HERE, once, rather than to each profile.'
# This profile exists to keep project-wide context DRY. Before it, adding one
# shared fragment meant editing all 18 profiles; the second such addition would
# have meant 18 more. A local profile may name a bare sibling as a parent
# (internal/profiles: "a parent is either a bare local-profile name (passes
# through) or a remote ref"), so every profile lists `project-base` first and
# inherits whatever accumulates here.
#
# Keep this SMALL. Everything added here is delivered to every role — the
# coordinator, every code-review lens, the finder. Context that only one role
# needs belongs in that role's own profile, not here.
bundles:
    # How ctxloom itself resolves configuration: home < project < ENV <
    # --config-set, the two override channels, and why a command's own flags
    # are deliberately NOT a config source.
    - ctxloom-project#fragments/config-hierarchy
    # A test passes when it is green AND a mutation to the code it names kills
    # it. Here because it binds every role: whoever writes the test, whoever
    # briefs the work, and whoever reviews it. An audit on 2026-08-04 found 25
    # assertions in this repo that were green and proved nothing.
    - ctxloom-project#fragments/green-is-not-passing
    # This project is a PROTOTYPE and is developed as one: delete and rebuild
    # rather than accommodate, own a red you did not cause, and reduce before
    # implementing. It belongs here rather than in one role's profile because
    # the disposition it governs is not the coordinator's alone — an
    # implementer that files a task instead of fixing what it can, or waves a
    # failure through as pre-existing, is the same defect one layer down.
    - ctxloom+git://github.com/benjaminabbitt/ctxloom-personal//bundles/prototyping
