[package]
name = "engine-claude"
version = "0.1.0"
description = "Claude Code's drive half (a turn, and a long-lived streaming child) and its surface half (S9): the files it reads at rest (CLAUDE.md, .mcp.json, .claude/settings.json, commands, skills) as claims, and its hook wire"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
ctxloom-ports.workspace = true
run-ports.workspace = true
run-within.workspace = true
surface-ports.workspace = true

[dev-dependencies]
fixture-program.workspace = true
file-system = { workspace = true, features = ["test-support"] }
mutants.workspace = true
os = { workspace = true, features = ["test-support"] }
run-within = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[features]
# `diagnostic_samples`, for the binary's catalog test.
test-support = []

[lints]
workspace = true
