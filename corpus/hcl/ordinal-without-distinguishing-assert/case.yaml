name: hcl/ordinal-without-distinguishing-assert
seams: [parse]
kind: error
format: hcl
error: HEW001
error_seam: parser
error_path: /provider/"aws"
patch_line: 6
message_contains: ["distinguishing", "ord"]
ops: [OP-37]
why: |
  An ordinal-addressed hunk MUST carry a distinguishing assert (§6.4.3 rule 2), so
  that a shifted target fails loudly instead of patching the wrong block. This hunk
  has none — every line it touches is identical between the two providers — and the
  PARSER refuses it, before any target is opened. The seam matters: this is a
  property of the patch text, not of the file it is aimed at.
spec: "§6.4.3, §7.2"
