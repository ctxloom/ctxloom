# cargo-deny: what may enter the dependency graph. `just lint-deps` runs it.

[advisories]
version = 2
# RustSec advisories. An ignore needs the advisory id and why it does not
# apply here.
ignore = []

[licenses]
version = 2
# ctxloom is AGPL-3.0-only; every license here may be combined with it.
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Not ignored: the git dependencies (angzarr-proto) are `publish = false`
# too, and their licenses are exactly what must be checked.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency has no version; allowed for unpublished crates only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # angzarr core's shared crates: angzarr-proto, angzarr-ports,
  # angzarr-diagnostic, angzarr-presentation.
  "https://github.com/angzarr-io/angzarr",
  # os, file-system and file-lock: the platform crates.
  "https://github.com/angzarr-io/angzarr-platform",
  # angzarr-cli's angzarr-build: the markup domain layer, a build dependency.
  "https://github.com/angzarr-io/angzarr-cli",
  # angzarr-embedded: the in-app runtime and its SQLite store.
  "https://github.com/angzarr-io/angzarr-embedded",
  # angzarr-router, which angzarr-embedded runs handlers through.
  "https://github.com/angzarr-io/angzarr-router",
  # taskloom, by commit: harp-names and its ports.
  "https://github.com/ctxloom/taskloom",
  # ctxloom-lib, by commit: the shared driving-edge shims (cli-support) and the
  # environment snapshot (process-env).
  "https://github.com/ctxloom/ctxloom-lib",
  # harp-core: the word lists ids are minted from.
  "https://github.com/benjaminabbitt/harp",
]
