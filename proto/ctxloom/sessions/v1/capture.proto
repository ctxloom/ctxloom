syntax = "proto3";

// PROPOSAL (design/hook-capture): what the engine's hooks observe of a
// session, as typed, engine-neutral facts and their events. Invariants:
//  - a field is a unified HookEvent field, never a native payload shape;
//  - each fact is something that ALREADY HAPPENED in the engine, so it is
//    never refused: a stream holding no live session records nothing, and a
//    redelivery (same Fact.origin.external_id) is DUPLICATE;
//  - a fact that could not be delivered is HELD by its hook, in order, for a
//    ctxloom process of an up-to-date version to deliver (s4-Q14); one the
//    hold could not keep is dropped, said on stderr, and recorded in its
//    place as a RecordCaptureGap (unit H3);
//  - the stream order of the events is the transcript's order: no field here
//    is a sequence, and the hook process assigns none.
package ctxloom.sessions.v1;

import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/options.proto";

// The user submitted a prompt. external_id
// `hook:prompt:<session>:<prompt_id>`.
message RecordPromptSubmitted {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.sessions.v1.SessionState"
    emits: ["ctxloom.sessions.v1.PromptSubmitted"]
  };

  string prompt_id = 1;
  string prompt = 2;
  // Data of the engine's own that the common fields do not hold, attached by
  // its adapter: keys are namespaced by engine (`<engine>.<name>`), values are
  // text (structured data as compact JSON). Optional and additive: a stream
  // recorded before it reads as none. Carried to the log entry's `extra`,
  // never into a common field.
  map<string, string> extra = 3;
}

// One piece (delta) of the assistant's text was shown. Every piece is
// recorded, the last flagged `is_final`; a turn's closing text (Stop's) is
// not a second record of it. external_id
// `hook:text:<session>:<message_id>:<index>`.
message RecordAssistantText {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.sessions.v1.SessionState"
    emits: ["ctxloom.sessions.v1.AssistantTextShown"]
  };

  string prompt_id = 1;
  string turn_id = 2;
  string message_id = 3;
  uint32 index = 4;
  bool is_final = 5;
  string text = 6;
  // Data of the engine's own that the common fields do not hold, attached by
  // its adapter: keys are namespaced by engine (`<engine>.<name>`), values are
  // text (structured data as compact JSON). Optional and additive: a stream
  // recorded before it reads as none. Carried to the log entry's `extra`,
  // never into a common field.
  map<string, string> extra = 7;
}

// How a tool call ended, when the engine says (opencode does; claude's hooks
// carry none, so its calls are UNSPECIFIED).
enum ToolCallStatus {
  TOOL_CALL_STATUS_UNSPECIFIED = 0;
  TOOL_CALL_STATUS_COMPLETED = 1;
  TOOL_CALL_STATUS_ERROR = 2;
}

// One tool call and what became of it. The result's body is never recorded:
// only its size and the SHA-256 (lowercase hex) of its bytes. The input is
// recorded whole. Thinking blocks are not observable and not recorded.
// external_id `hook:tool:<session>:<tool_use_id>`.
message RecordToolCall {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.sessions.v1.SessionState"
    emits: ["ctxloom.sessions.v1.ToolCalled"]
  };

  string prompt_id = 1;
  string tool_use_id = 2;
  string tool = 3;
  string input = 4;
  uint64 response_bytes = 5;
  string response_sha256 = 6;
  // How the call ended; absent when the engine does not say (claude), so a
  // fact recorded before the field existed reads the same.
  optional ToolCallStatus status = 7;
  // Data of the engine's own that the common fields do not hold, attached by
  // its adapter: keys are namespaced by engine (`<engine>.<name>`), values are
  // text (structured data as compact JSON). Optional and additive: a stream
  // recorded before it reads as none. Carried to the log entry's `extra`,
  // never into a common field.
  map<string, string> extra = 8;
}

// The assistant's turn ended (Stop). external_id
// `hook:turn-end:<session>:<prompt_id>`. It carries no text: the assistant's
// words are RecordAssistantText's.
message RecordTurnEnded {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.sessions.v1.SessionState"
    emits: ["ctxloom.sessions.v1.TurnEnded"]
  };

  string prompt_id = 1;
  // Data of the engine's own that the common fields do not hold, attached by
  // its adapter: keys are namespaced by engine (`<engine>.<name>`), values are
  // text (structured data as compact JSON). Optional and additive: a stream
  // recorded before it reads as none. Carried to the log entry's `extra`,
  // never into a common field.
  map<string, string> extra = 2;
}

enum CompactionPhase {
  COMPACTION_PHASE_UNSPECIFIED = 0;
  COMPACTION_PHASE_BEFORE = 1;
  COMPACTION_PHASE_AFTER = 2;
}

// The engine compacted its context. Of the summary the engine wrote only its
// size and SHA-256 (lowercase hex) are recorded, never its text (ruling B: it
// is conversation content). external_id
// `hook:compact:<session>:<prompt_id>:<trigger>:<before|after>`: the trigger
// (`manual` or `auto`; `unknown` when the engine named none) tells two
// compactions of one turn apart.
message RecordCompaction {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.sessions.v1.SessionState"
    emits: ["ctxloom.sessions.v1.Compacted"]
  };

  string prompt_id = 1;
  CompactionPhase phase = 2;
  string trigger = 3;
  uint64 summary_bytes = 4;
  string summary_sha256 = 5;
  // Data of the engine's own that the common fields do not hold, attached by
  // its adapter: keys are namespaced by engine (`<engine>.<name>`), values are
  // text (structured data as compact JSON). Optional and additive: a stream
  // recorded before it reads as none. Carried to the log entry's `extra`,
  // never into a common field.
  map<string, string> extra = 6;
}

// PROPOSAL (s4-Q14, unit H3; the owner's to approve): a fact a hook observed
// was DROPPED, never recorded: the session's hold could not keep it (past
// its bound, or the disk refused it). The hold kept a gap record in the
// dropped fact's place, and a flush delivers it here in the hold's order,
// so the session's record says, for good, that a fact is missing there,
// which, and when. One gap is one dropped fact. external_id
// `hook:gap:<the dropped fact's external_id>`.
message RecordCaptureGap {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.sessions.v1.SessionState"
    emits: ["ctxloom.sessions.v1.CaptureGapped"]
  };

  // The dropped fact's external_id (its kind and the engine's ids; never
  // its content).
  string dropped = 1;
  // Why it was dropped: `bound` (the hold was full) or `disk`.
  string why = 2;
  // The dropping hook's clock when it dropped the fact.
  google.protobuf.Timestamp dropped_at = 3;
  // The dropping hook's versionator stamp.
  string stamp = 4;
}

// The answer (s4-Q14, H3 follow-up; owner: a DISTINCT, typed answer, never
// "applied") to a capture fact addressed to a session the daemon has no
// record of: its stream holds no session (never minted, or destroyed), so
// the fact was recorded nowhere. Not a refusal (a fact is never refused,
// and the markup holds `(refusal_status)` to a command's refusals): the
// daemon's listener answers a capture fact that recorded nothing with this
// message's full name as the reason key, under NOT_FOUND; a client sets the
// fact aside, says so, and never retries it.
message FactSessionUnknown {
  // The session's stream root, as the fact's cover named it (UUID text).
  string session = 1;
}

message PromptSubmitted {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.SessionState"};

  string prompt_id = 1;
  string prompt = 2;
  // Data of the engine's own that the common fields do not hold, attached by
  // its adapter: keys are namespaced by engine (`<engine>.<name>`), values are
  // text (structured data as compact JSON). Optional and additive: a stream
  // recorded before it reads as none. Carried to the log entry's `extra`,
  // never into a common field.
  map<string, string> extra = 3;
}

message AssistantTextShown {
  option (io.angzarr.v1.event) = {component: "ctxloom.sessions.v1.SessionState"};

  string prompt_id = 1;
  string turn_id = 2;
  string message_id = 3;
  uint32 index = 4;
  bool is_final = 5;
  string text = 6;
  // Data of the engine's own that the common fields do not hold, attached by
