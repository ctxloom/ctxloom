# Git hooks, managed by lefthook (`just hooks-install`). A failing hook is a
# finding: fix the cause and commit again; never bypass with --no-verify.
#
# Every `run:` is one simple command, so it means the same under whatever
# /bin/sh the committing machine has; anything longer is a just recipe.
pre-commit:
  # One at a time in priority order, stopping at the first failure.
  piped: true
  commands:
    fmt:
      priority: 1
      run: just fmt-check
    secrets:
      priority: 2
      run: just secrets-scan-staged
    clippy:
      # Includes the core's purity rules (crates/core/clippy.toml).
      priority: 3
      run: just lint
    deps:
      priority: 4
      run: just lint-deps
    tests:
      # The tests of the crates the commit changes and of their workspace
      # dependents, over the STAGED tree (`just test-staged` says how).
      priority: 5
      run: just test-staged
    mutants:
      # cargo mutants over the staged diff, judged per tier by the justfile's
      # mutation_thresholds; last, because it is the slowest.
      priority: 6
      run: just mutants-staged
