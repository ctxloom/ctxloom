[package]
name = "deps-application"
version = "0.1.0"
description = "The Deps inbound port (S3): remotes, the dependency closure, pull, check, upgrade, hold, push and move, over the git, file and content ports"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
exit-code.workspace = true
angzarr-diagnostic.workspace = true
ctxloom-ports.workspace = true
deps.workspace = true
deps-ports.workspace = true
library.workspace = true
pin-changes.workspace = true
serde.workspace = true

[dev-dependencies]
angzarr-presentation = { workspace = true, features = ["test-support"] }
deps = { workspace = true, features = ["test-support"] }
ctxloom-ports = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
mutants.workspace = true

[features]
# In-memory ports, and `diagnostic_samples`, for other crates' tests.
test-support = ["deps/test-support", "ctxloom-ports/test-support"]

[lints]
workspace = true
