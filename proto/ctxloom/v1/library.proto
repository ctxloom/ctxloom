// (-- region the library's read refusals (step 10a U2, E5, owner 2026-11-17):
// one typed refusal per cause, each its `library-application-*` diagnostic,
// mapped back by its TYPE (daemon-api's `library_refusals`). A cause a
// refusal wraps (another crate's diagnostic) rides as its code and its
// flattened args (`Cause`, decision 14.37), so it is rendered from its own
