syntax = "proto3";

// The scheduler domain: its public time messages (ArmAlarm, CancelAlarm,
// AlarmReached: field for field the draft spec's, angzarr-project branch
// prep/spec-20261102-draft, io/angzarr/scheduler/v1/scheduler.proto) and its
// private stored events and clock fact. All in ONE package, the final one
// (angzarr.embedded.scheduler.v1) from the first commit: a type URL is stored
// in every event, so a rename at the lift would need an upcaster in every
// state.db (scheduler.plan.md OD-13).
//
// Why the spec's three are not in the spec's package (io.angzarr.scheduler.v1):
// angzarr-build's markup layer generates a component's domain types, command
// and event enums from the ONE package its anchor message is in, so a command
// in another package than its component's is wired to the wrong prost module
// and does not compile. Their type URLs therefore differ from the spec's;
// nothing stores a command or the delivered fact (only events are stored), so
// the lift can move them to the spec's package without an upcaster.
package angzarr.embedded.scheduler.v1;

import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/options.proto";

// The scheduler stream, folded from its events: one stream per target
// stream, rooted compute_root("scheduler", <the target stream's text>).
message SchedulerState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "scheduler"
    name: "Scheduler"
  };

  Stream target = 1;
}

// A stream's address: angzarr's `Cover` field for field (domain, root,
// edition), as the scheduler's own message. angzarr-build's domain layer
// cannot carry angzarr-proto's Cover: it generates a second `Cover`/`UUID`
// domain type that expects `Vec<u8>`, and angzarr-proto's UUID holds `Bytes`.
message Stream {
  string domain = 1;
  // The stream's 16-byte root.
  bytes root = 2;
  // Unset for the main timeline.
  optional string edition = 3;
}

// region commands

// A domain asks for an alarm on its own stream: tell `target` AlarmReached
// once `at` is reached. Addressed to the scheduler's stream for `target`.
// Re-arming an armed alarm_id moves it; the old instant is never reached.
message ArmAlarm {
  option (io.angzarr.v1.command) = {
    component: "angzarr.embedded.scheduler.v1.SchedulerState"
    emits: ["angzarr.embedded.scheduler.v1.AlarmArmed"]
  };

  // The stream to tell: the asking domain's own (domain, root, edition).
  Stream target = 1;
  // The asking domain's name for the alarm, unique within its stream. Required.
  string alarm_id = 2;
  // The instant asked for, UTC. Required.
  google.protobuf.Timestamp at = 3;
}

// A domain withdraws an alarm it armed: it is never reached. Cancelling an
// alarm that is not armed records nothing.
message CancelAlarm {
  option (io.angzarr.v1.command) = {
    component: "angzarr.embedded.scheduler.v1.SchedulerState"
    emits: ["angzarr.embedded.scheduler.v1.AlarmCancelled"]
  };

  string alarm_id = 1;
}

// endregion commands

// region facts

// The time fact: `at` is reached for the alarm the target armed as
// `alarm_id`. Delivered to the TARGET's stream as a fact by the per-domain
// delivery policy; the target re-checks it against its own arming. It has no
// scheduler component, so it carries no option: a target ingests it with
// `#[handles_fact(AlarmReached)]`.
message AlarmReached {
  string alarm_id = 1; // As armed
  google.protobuf.Timestamp at = 2; // The instant armed, not the clock's reading when it fired
}

// The clock's fact: this alarm's instant is reached. Sent by the loop with the
// deterministic external id `alarm:<stream>/<alarm_id>@<at>` (OD-1, OD-2),
// so a re-send is a duplicate. Never refused; recorded as AlarmFired only for
// an alarm armed at exactly this `at`.
message AlarmDue {
  option (io.angzarr.v1.command) = {
    component: "angzarr.embedded.scheduler.v1.SchedulerState"
    emits: ["angzarr.embedded.scheduler.v1.AlarmFired"]
    fact: true
  };

  string alarm_id = 1;
  google.protobuf.Timestamp at = 2;
}

// endregion facts

// region events

message AlarmArmed {
  option (io.angzarr.v1.event) = {component: "angzarr.embedded.scheduler.v1.SchedulerState"};

  Stream target = 1;
  string alarm_id = 2;
  google.protobuf.Timestamp at = 3;
}

message AlarmCancelled {
  option (io.angzarr.v1.event) = {component: "angzarr.embedded.scheduler.v1.SchedulerState"};

  string alarm_id = 1;
}

// The alarm's instant was reached while it was armed at it. The delivery
// policy turns this into AlarmReached on the target.
message AlarmFired {
  option (io.angzarr.v1.event) = {component: "angzarr.embedded.scheduler.v1.SchedulerState"};

  Stream target = 1;
  string alarm_id = 2;
  google.protobuf.Timestamp at = 3;
}

// endregion events
