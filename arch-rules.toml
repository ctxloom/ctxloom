# The architecture lint's rules (templates/arch-gates.just runs it): which
# role may depend on which. A crate's role is its directory,
# crates/<ring>/<role>/<crate> giving <ring>/<role>. Copy to the repository's
# top level as arch-rules.toml and edit; the table is data, so another
# repository supplies its own.
#
# Each role lists what its crates may depend on, over every normal and build
# edge between workspace members: a role (`core/wire`), a glob over roles
# (`core/*`; `*` is any run of characters, `/` included) or `@class` (a crate
# whose name matches a pattern under [classes]). A role not listed is
# refused: a new tier gets its rule before it gets code. Edges to crates
# outside the workspace are not examined.
layout = "crates"

# The roles whose dev-dependency edges are examined, more leniently: the same
# table, but a finding is a warning (it fails only under --deny-warnings).
dev_checked = ["adapters/driven", "adapters/driving"]

[classes]
# The driving adapters' shared presentation crates: domain-free, and what the
# CLI and the server both write through.
presentation = ["presentation", "*-presentation"]
# Shared infrastructure crates every driven adapter may use, listed by name.
support = []

[roles."core/wire"]
allow = ["core/wire"]
rule = "the core depends on the core only"

[roles."core/domain"]
allow = ["core/domain", "core/wire"]
rule = "the core depends on the core only, and a domain never depends on a read model"

[roles."core/read-model"]
allow = ["core/read-model", "core/domain", "core/wire"]
rule = "the core depends on the core only, and a read model never depends on the application layer"

[roles."core/ports"]
allow = ["core/ports", "core/domain", "core/wire"]
rule = "the core depends on the core only"

[roles."core/application"]
allow = ["core/*"]
rule = "the core depends on the core only"

[roles."adapters/driven"]
allow = ["core/ports", "core/wire", "@support"]
rule = "a driven adapter sees only ports and wire types, never another adapter"

[roles."adapters/driving"]
allow = ["core/application", "@presentation"]
rule = "a driving adapter sees only the application layer and the presentation crates, never another adapter"

# The composition root (the binaries and their wiring library) may depend on
# anything; nothing else lists either, so nothing but the root depends on the
# root.
[roles."root/bin"]
allow = ["*"]

[roles."root/lib"]
allow = ["*"]

# A known departure, kept as debt: from, to, optionally kind ("normal",
# "build" or "dev"), and why. One that matches no finding is stale and fails.
# [[exception]]
# from = "some-crate"
# to = "other-crate"
# kind = "dev"
# reason = "why this stands"

# Exceptions: the audit's finding that these rules were enforced in review only,
# and what running the lint first found (2026-11-05). Each is debt, not a
# decision: the departure stands until the fix named in its reason lands, and
# the entry goes with it (a stale one fails).

[[exception]]
from = "remote-git"
to = "deps"
reason = "debt: the git remote adapter uses the deps read model's pure cache_segments for the cache path; fix: as deps-files, move it to deps-ports"

# Dev-dependency findings (warnings), kept by the owner's ruling as test-only
# exceptions: the tests of a driving adapter build a type only the port defines.

[[exception]]
from = "deps-cli"
to = "deps-ports"
kind = "dev"
reason = "test-only: builds a type only the port defines; re-exporting it just for tests would add public API for nobody"

[[exception]]
from = "surface-cli"
to = "surface-ports"
kind = "dev"
reason = "test-only: builds a type only the port defines; re-exporting it just for tests would add public API for nobody"
