name: hcl/set-attribute
seams: [e2e]
kind: ok
format: hcl
ops: [OP-01]
why: |
  An attribute body line contains a top-level `=`; a block body line ends in `{`.
  That is the whole attribute-vs-block disambiguation rule (§8.5). hclwrite
  re-aligns `=` in a body it modified and leaves untouched bodies byte-identical.
spec: "§8.5, §11 OP-01"
