// (-- region search: `projects/{project}:searchLibrary` (AIP-136, stateless) --)

// What kind of library item a row is.
enum ItemKind {
  // Unset: in a search, any kind.
  ITEM_KIND_UNSPECIFIED = 0;
  // A bundle.
  BUNDLE = 1;
  // A fragment.
  FRAGMENT = 2;
  // A command.
  COMMAND = 3;
  // A skill.
  SKILL = 4;
  // An MCP server.
  MCP_SERVER = 5;
  // A profile.
  PROFILE = 6;
  // A pin change's hook (B4, OQ-B5); a search never returns it.
  HOOK = 7;
}

// A local hit. was: a hit's `name` (-> `resource`), `type` (-> `kind`).
message SearchHit {
  // The item's resource name.
  string resource = 1;
  // What kind of item it is.
  ItemKind kind = 2;
  // Its tags.
  repeated string tags = 3;
  // The bundle it is in.
  string source = 4;
  // What of it matched the query.
  string match = 5;
}

// A remote's item, not installed (so no resource name): `item` is its path
// in the remote.
message RemoteFound {
  // The Remote's name.
  string remote = 1;
  // Its path in the remote.
  string item = 2;
  // What kind of item it is.
  ItemKind kind = 3;
  // Its tags.
  repeated string tags = 4;
  // Its description.
  string description = 5;
  // Its author.
  string author = 6;
  // What `deps pull` (through a profile) would pin.
  string pull_reference = 7;
}

// `search [query] [--tag] [--type] [--local] [--remote]`.
message SearchLibraryRequest {
  // The project whose library to search.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
  // The words to search for; empty, every item.
  string query = 2 [(google.api.field_behavior) = OPTIONAL];
  // Only items carrying every one of these tags (`--tag`).
  repeated string tags = 3 [(google.api.field_behavior) = OPTIONAL];
  // Only items of this kind (`--type`); unspecified, any.
  ItemKind kind = 4 [(google.api.field_behavior) = OPTIONAL];
  // Search the local library (`--local`); neither this nor `remote` (or
  // both), both are searched.
  bool local = 5 [(google.api.field_behavior) = OPTIONAL];
  // Search the remotes (`--remote`); neither this nor `local` (or both), both
  // are searched.
  bool remote = 6 [(google.api.field_behavior) = OPTIONAL];
  // The most results to answer in one page (AIP-158); 0 is the server's
  // choice. Every page is the whole list today.
  int32 page_size = 80 [(google.api.field_behavior) = OPTIONAL];
  // A previous response's `next_page_token`, to answer the page after it;
  // empty, the first page.
  string page_token = 81 [(google.api.field_behavior) = OPTIONAL];
  // Moved into `caller` (owner, 2026-11-18).
  reserved 94, 96, 97;
  reserved "env", "globals", "cwd";
  // The client's working context (needs.proto), as every request made on a
  // user's behalf carries it (owner, 2026-11-18).
  Caller caller = 98 [(google.api.field_behavior) = REQUIRED];
}

// What a search found.
message SearchLibraryResponse {
  // The query searched for.
  string query = 1;
  // The local hits.
  repeated SearchHit local = 2;
  // The remotes' items found.
  repeated RemoteFound remote = 3;
  // How many hits are answered, local and remote.
  uint32 count = 4;
  // How many local hits the result cap left out (a notice says how to narrow
  // the search).
  uint32 hidden_local = 5;
  // The token of the next page (AIP-158); empty on the last. Every page is
  // the whole list today, so it is always empty.
  string next_page_token = 80;
}

