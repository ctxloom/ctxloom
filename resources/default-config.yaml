# Default config overlaid on every loaded user config. It defines the built-in
# primary + fast LLM roles so an empty user config still resolves a backend and
# a lightweight model for compression. User config always wins: these entries
# only fill gaps the user left empty. Model names live here, in data — never in
# Go code.
#
# This file doubles as the shipped registry init reads: each entry's `role`
# marks it as its backend type's default primary or fast pick, so selecting an
# engine resolves its pair (primary + fast) by scanning for matching type+role.
# init clears `role` on the entries it copies: llm.defaults names the pair.
#
# The claude-code models are the claude CLI's aliases (`opus`, `haiku`), not
# pinned ids: the CLI resolves each to its current model, so these defaults —
# and every config init writes from them — never go stale on a superseded one.
schema_version: 8

llm:
  configs:
    claude-code:
      type: claude-code
      model: opus
      role: primary
    claude-fast:
      type: claude-code
      model: haiku
      role: fast
  defaults:
    primary: claude-code
    fast: claude-fast
