[package]
name = "pending-launches"
version = "0.1.0"
description = "The runs still owed a runner: folded from the session and run streams, held in memory"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded.workspace = true
runs.workspace = true
sessions.workspace = true
uuid.workspace = true

[dev-dependencies]
# The Bus proof (`src/bus.test.rs`): angzarr-embedded's Bus over its in-memory
# and SQLite stores (`sqlite` re-exports angzarr-store-sqlite, the store
# ctxloom runs), a temporary directory for the SQLite file, and tokio's
# runtime for both; tests only.
angzarr-embedded = { workspace = true, features = ["test-support", "sqlite"] }
test-dir.workspace = true
mutants.workspace = true
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
