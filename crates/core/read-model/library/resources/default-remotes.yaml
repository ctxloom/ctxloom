# ctxloom Remote Sources
# The repositories this project draws bundles and profiles from, under
# `remotes:` (`ctxloom remote create <name> <url>` adds one).
#
# Registering a remote is the trust act: its content reaches the assistant
# because the project added it. ctxloom builds in no guidance for the
# assistant: until a remote is added, or the project writes bundles of its
# own, the assistant is given none.

schema_version: 1
