syntax = "proto3";

// DRAFT for the owner's review (ruling 132, design-by-test). No build.rs
// lists this file, so nothing is generated from it yet.
//
// The FRONTEND (T9): the `ctxloom run` that owns the user's terminal for an
// interactive session, once `Cli.Invoke` has handed it its `Terminal`. It
// starts the TUI and records nothing in a store (T1): it tells the daemon
// the TUI started and exited, and holds one stream open for the session's
// life.
//
// Every call presents the run's RUNNER bearer (never the user's, T12) and
// carries the run's `LaunchAt` (T8): the daemon routes by its project id to
// that project's store, and the gate refuses a session the bearer's run does
// not own (`SessionNotOwned`).
//
// The daemon may die at any instant (T3, T4). The frontend then rediscovers
// it (or starts one), re-opens `Hold` and redelivers every report it has not
// seen answered, from a bounded buffer in memory. A report is keyed by its
// `external_id`, so a redelivery is DUPLICATE; the new daemon re-adopts the
// run from its session lock (held: the frontend lives) and its stream.
package ctxloom.daemon.v1;

import "ctxloom/daemon/v1/launch.proto";

service Frontend {
  // Report one fact of the run (its start, its exit). Answered once
  // recorded, or DUPLICATE.
  rpc Report(RunReport) returns (Reported);

  // The open client stream (the idle rule counts it: the target's
  // coordinator defaults, ten minutes with no live run, no hosted child and
  // no open client stream): held from the TUI's
  // start until its exit is reported. The daemon sends what the frontend is
  // to act on; today nothing but `Stop` (a close of the session), later the
  // engine-native wake (D7, D8).
  rpc Hold(HoldRequest) returns (stream HoldSignal);
}

// The TUI started: the runner's `RunnerStarted{runtime: host, pid}`. Keyed
// `runner-started:<run>`.
message Started {
  uint32 pid = 1;
}

// The TUI exited: the run's `RunExited` and its session's incarnation ended
// (`runner-exit`). Keyed `run-exited:<run>`. A frontend asked to stop by a
// signal (ruling 114: SIGHUP or SIGTERM) reports the exit with the signal it
// heard, and itself exits 128 plus its number.
message Exited {
  int32 code = 1;
  uint32 signal = 2;
  // The signal the frontend heard and stopped the TUI for, if it did.
  uint32 stopped_by = 3;
  // claude's last `SessionEnded.native_session`, as its hooks recorded it,
  // is the daemon's to read from the stream; nothing is carried here.
}

// The TUI could not be started (the spawn failed): `LaunchFailed`. Keyed
// `launch-failed:<run>`.
message LaunchFailed {
  // The OS's text, verbatim.
  string ext_err_txt = 1;
}

message RunReport {
  LaunchAt at = 1;
  // `runner-started:<run>`, `run-exited:<run>`, `launch-failed:<run>`.
  string external_id = 2;
  oneof fact {
    Started started = 3;
    Exited exited = 4;
    LaunchFailed launch_failed = 5;
  }
}

message Reported {
  // The report was already recorded (a redelivery).
  bool duplicate = 1;
}

message HoldRequest {
  LaunchAt at = 1;
}

// Stop the TUI as the launch's `StopPolicy` says (the session was closed).
message Stop {
  string cause = 1;
}

message HoldSignal {
  oneof signal {
    Stop stop = 1;
  }
}
