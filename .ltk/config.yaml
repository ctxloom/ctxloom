# llm-tool-killer rules for ctxloom — build/test/install go through `just` so
# they match CI (devcontainer, build tags, ldflags, test isolation).
# Rule model: https://ctxloom.dev/ltk/rules/
version: 1

defaults:
  # Fault-tolerant: an unparseable command is allowed, never blocked.
  on_parse_error: allow

rules:
  - id: test-via-just
    match: { command: [go, test] }
    message: "Run tests through the task runner, not `go test` directly, so the suite matches CI (devcontainer, tags, isolation)."
    suggest: "just test   # or `just test-verbose` for an offline host run"
  - id: build-via-just
    match: { command: [go, build] }
    message: "Build through the task runner, not `go build` directly, so flags/ldflags match a real build."
    suggest: "just build   # or `just build-verbose` locally"
  # The exemption is a SHAPE, not a flag. `go install <module>@<version>`
  # installs a THIRD-PARTY tool, which by Go's own rules is a build of something
  # other than this module; a bare `go install` builds this one. Without the
  # carve-out the refusal named a remedy that installs the WRONG PROGRAM, and a
  # guard whose advice cannot be followed teaches people to route around guards
  # generally — the one thing a cooperative redirect cannot survive.
  #
  # ORDERING, learned the hard way: a config naming a field the RUNNING ltk
  # does not understand makes it fail closed on every guarded tool, including
  # the ones needed to undo the edit. The hook runs the ltk on PATH, so the
  # binary must be reinstalled before a rule uses a shape only the newer
  # binary parses.
  - id: install-via-just
    match:
      command: [go, install]
      unless: ['.+@.+']
    message: "Install through the task runner, not `go install` directly."
    suggest: "just install"
  # Migrated from .claude/hooks/no-direct-go.sh, which predated ltk and
  # duplicated its build/test/install rules. Two guards for one intent is the
  # drift this repo warns about, and it bit: the ltk rule gained a carve-out for
  # third-party installs while the shell hook kept blocking them, so the fix
  # looked applied and was not. One guard now, and these two rules are the
  # coverage the hook carried that ltk did not.
  - id: run-via-just
    match: { command: [go, run] }
    message: "Run through the task runner, not `go run` directly, so the binary matches a real build."
    suggest: "just run -- <args>"
  # A detached background job fires NO harness task notification, so the session
  # ends its turn waiting for a wake-up that structurally cannot arrive. Measured
  # 2026-09-13: an acceptance run finished green at 19:52 and the merge that
  # depended on it happened at 21:36 — 1h44m of dead time on work already passing.
  #
  # Scope, stated because it is PARTIAL: this matches the command head, so it
  # catches `nohup`/`setsid` and not a bare trailing `&` or `disown`, which
  # also detach a job. It guards the spelling an agent reaches for first, not
  # the whole class (match.backgrounded is the whole class).
  #
  # `nohup` remains right for fire-and-forget work nothing waits on; the test is
  # not "is this long" but "does the next step depend on knowing it finished".
  - id: background-via-harness
    match: { command: ['nohup|setsid'] }
    message: "A detached job sends no completion notification, so a turn that waits on it never wakes. Use the Bash tool's run_in_background instead, which registers the task and delivers the result."
    suggest: "run the same command with run_in_background: true"
  - id: complexity-via-just
    match: { command: [lizard] }
    message: "Complexity is reported through the task runner, which carries the project's thresholds and baseline."
    suggest: "just complexity   # or `just complexity-csv`"
  # The devcontainer carries the pinned goreleaser and Go toolchain
  # (.devcontainer/tool-versions.env); the host carries whatever it has. A
  # host-run goreleaser validates or builds with unpinned versions, so its
  # success says nothing about the pinned release build. Same shape as
  # buf-via-just: the host run doesn't fail, it lies.
  - id: goreleaser-via-just
    match: { command: [goreleaser] }
    message: "goreleaser must run in the devcontainer, never on the host: the devcontainer pins the goreleaser and Go versions (.devcontainer/tool-versions.env), and a host run uses whatever versions the host has, so its check or snapshot does not prove what the pinned release build does."
    suggest: "just release-snapshot   # or `just release-check` to validate .goreleaser.yml only"
  # gremlins copies the whole Go module into TMPDIR once per worker. Run by hand
  # it will happily copy anything sitting in the module dir (agent worktrees, a
  # stray build cache) and fill the disk — a bare run has already exhausted a 16G
  # tmpfs here. The just targets pin the scope and the timeout budget.
  - id: mutation-via-just
    match: { command: [gremlins] }
    message: "Run mutation testing through the task runner. A bare `gremlins unleash` copies the entire module per worker (it has filled /tmp here) and inherits a timeout budget that starves fast packages — a 3ms test suite gives each mutant ~15ms, so mutants score as TIMED OUT rather than killed or lived."
    suggest: "just test-mutation-pkg internal/shared/tasks/triggers   # or `just test-mutation` for the whole module"
  # buf.gen.yaml deliberately uses `local:` plugins, not BSR `remote:` ones, so
  # `buf generate` needs protoc-gen-go/protoc-gen-go-grpc on PATH — and the host
  # has its own copies, at different versions than the devcontainer's pinned
  # ones (seen: host protoc-gen-go v1.36.6 vs pinned v1.36.11, host
  # protoc-gen-go-grpc 1.6.0 vs pinned v1.6.2). A host `buf generate` therefore
  # *succeeds* — no error, no denial from anything else — while silently
  # emitting generated code from the wrong plugin versions. The .pb.go files
  # are gitignored, so `git diff` never shows the drift; it surfaces later as
  # unexplained proto churn or a subtly different build than CI's. Same shape
  # as goreleaser-via-just: the host run doesn't fail, it lies.
  - id: buf-via-just
    match: { command: [buf] }
    message: "buf must run in the devcontainer, never on the host: the host's protoc-gen-go/protoc-gen-go-grpc are unpinned and differ from the devcontainer's pinned versions, so a host `buf generate` succeeds but silently produces generated code that doesn't match CI (the .pb.go files are gitignored, so `git diff` won't surface it)."
    suggest: "just proto   # or `just gen-mcp-schemas` for the MCP tool-schema regen"

  # This box runs a PARALLEL multi-agent campaign: many agents' `go test`,
  # `go build`, and `just` invocations are live at once, sharing one process
  # table. A pattern-matched kill (by name/cmdline rather than exact PID) has
  # already killed every agent's run on this box, not just the one that typed
  # it. pkill/killall are inherently pattern kills; `kill` joins them once
  # it's paired with `-f`/a name-pattern lookup instead of a bare PID.
  - id: no-pattern-kill-pkill
    match:
      command: [pkill]
      args_any: ['.*\b(go|just|test|build)\b.*']
    message: "pkill matches processes by pattern across the WHOLE box — a parallel multi-agent campaign is running right now, so `pkill -f 'go test'`/`pkill just` kills every other agent's run, not just yours."
    suggest: "Find the exact PID first (e.g. `ps aux | grep <your-marker>`), then `kill <PID>` — never a name/pattern match."
  - id: no-pattern-kill-killall
    match:
      command: [killall]
      args_any: ['.*\b(go|just|test|build)\b.*']
    message: "killall matches processes by NAME across the WHOLE box — a parallel multi-agent campaign is running right now, so `killall go`/`killall just` kills every other agent's run, not just yours."
    suggest: "Find the exact PID first (e.g. `ps aux | grep <your-marker>`), then `kill <PID>` — never a name/pattern match."
  # `kill $(pgrep -f x)` is a pattern-matched kill in disguise. ltk lowers a
  # command substitution's body into a command of its own, so guarding the
  # pattern lookup catches it wherever it is nested, and catches a bare
  # `pgrep -f` too. A short-flag cluster carrying f (-fa, -af) is the same flag.
  - id: no-pattern-kill-pgrep
    match:
      command: [pgrep]
      args_any: ['-[[:alpha:]]*f[[:alpha:]]*', '--full']
    message: "`pgrep -f` matches the pattern against every process's FULL command line across the WHOLE box — feeding it to `kill` (e.g. `kill $(pgrep -f go)`) is a pattern-matched kill that can hit another agent's `go test`/`go build`/`just` process, not just yours."
    suggest: "Find the exact PID first (e.g. `ps aux | grep <your-marker>`), then `kill <PID>` — never a name/pattern match."

  # git's LOCAL config (.git/config) outranks HOME/XDG isolation entirely —
  # it's resolved from the discovered .git dir, not from $HOME — and for a
  # linked worktree that file is the repo's SHARED common config, so setting
  # it here changes every other agent's worktree too and misattributes their
  # commits. Cooperative agents on this box must scope identity per-command.
  #
  # Reading the key is fine: a write differs from the read only by the value
  # after the key, which the trailing '.*' operand requires (empty included).
  # Unsetting writes with no value, so it is keyed on the unset spelling in a
  # rule of its own. Keys are case-insensitive, hence (?i).
  - id: no-git-config-local-identity
    match:
      command: [git, config, '(?i)user\.(name|email)', '.*']
      unless: ['--global|--system|--get(-all|-regexp)?|--list|-l|--show-origin']
    message: "Local `git config user.*` (bare or --local) outranks HOME/XDG isolation and leaks across linked worktrees sharing this repo's common .git/config — it can misattribute another agent's commits."
    suggest: "git -c user.name='...' -c user.email='...' <command>   # scoped to this one command, never persisted"
  - id: no-git-config-local-identity-unset
    match:
      command: [git, config]
      args_all: ['(?i)user\.(name|email)', '--unset(-all)?|unset']
      unless: ['--global|--system']
    message: "Local `git config user.*` (bare or --local) outranks HOME/XDG isolation and leaks across linked worktrees sharing this repo's common .git/config — it can misattribute another agent's commits."
    suggest: "git -c user.name='...' -c user.email='...' <command>   # scoped to this one command, never persisted"

  # `go env -w` persists into the shared Go env config file, not just this
  # shell — it rewires GOTMPDIR/GOFLAGS/GOTOOLCHAIN/etc. for every process on
  # the box, including every other agent's `go` invocations.
  - id: no-go-env-write
    match: { command: [go, env], args_all: ['-w'] }
    message: "`go env -w` persistently rewires GOTMPDIR/GOFLAGS/GOTOOLCHAIN (and anything else you set) for every process on this box, not just this shell — every other agent's `go` inherits it too."
    suggest: "Set the var for this command/shell only (e.g. `GOFLAGS=... go build`, `export GOFLAGS=...` in your own shell) instead of persisting it with `go env -w`."

  # The Go build cache is shared across every agent on this box. A bare
  # `go clean -cache` has already exhausted it out from under everyone else's
  # in-flight build.
  - id: no-go-clean-cache
    match: { command: [go, clean], args_any: ['-cache'] }
    message: "`go clean -cache` nukes the shared Go build cache every other agent on this box depends on for their own builds."
    suggest: "just clean-caches   # reclaims regenerable caches deliberately, without nuking a build another agent is mid-flight on"

  # Same shared-state hazard as the Go build cache, one layer down: a broad
  # docker/buildkit prune reclaims space by deleting images/cache layers with
  # no notion that another agent's container run or image build is using them.
  - id: no-docker-system-prune
    match:
      command: [docker, system, prune]
      unless: ['--filter(=.*)?']
    message: "`docker system prune` destroys images/containers/cache every agent's containerized run on this box may depend on, not just yours."
    suggest: "Scope it: `docker system prune --filter until=1h` / `--filter label=...` — never a blanket prune on a shared box."
  - id: no-docker-builder-prune
    match:
      command: [docker, 'builder|buildx', prune]
      unless: ['--filter(=.*)?']
    message: "`docker builder prune` destroys the shared buildkit cache every agent's containerized build on this box depends on, not just yours."
    suggest: "Scope it: `docker builder prune --filter until=1h` — never a blanket prune on a shared box."

  # The stash stack lives in the repo's common dir, so it is SHARED across
  # every linked worktree of this checkout — `git stash`/`pop`/`drop` run from
  # one agent's worktree can capture or destroy another agent's uncommitted WIP.
  # The read-only forms are cleared by an allow anchored at the subcommand's
  # operand, not by an `unless` exception: `unless` is position-blind, so
  # `git stash push -m list` would carry the exception in its message.
  - id: allow-git-stash-read
    match: { command: [git, stash, 'list|show'] }
    action: allow
  - id: no-git-stash
    match:
      command: [git, stash]
    message: "The stash stack is shared across all linked worktrees (it lives in the repo's common .git dir) — `git stash`/`pop`/`drop` here can capture or destroy another agent's WIP."
    suggest: "Commit your WIP instead (even a throwaway commit you amend/reword later) rather than reaching for the shared stash."

  # A recursive grep does not respect git's exclusions, so it reads trees git
  # deliberately hides — above all an agent worktree at .claude/worktrees/,
  # which is excluded via .git/info/exclude and therefore invisible to
  # `git status` while being fully visible to `grep -r`. Every file such an
  # agent touches then appears TWICE: once real, once shadow, mid-edit by
  # another agent. That has already misled a review here, and the failure is
  # silent — duplicate hits look like duplicate code, not like a second tree.
  # `git grep` cannot see any of it: it searches tracked content, so vendored
  # caches and build output drop out for the same reason and at no extra cost.
  # This is a REDIRECT, not a prohibition: grepping a path outside the repo is
  # legitimate and this rule names the in-repo case it is wrong for.
  - id: search-via-git-grep
    match:
      command: ['grep|egrep|fgrep']
      args_any: ['-[A-Za-z0-9]*[rR][A-Za-z0-9]*', '--(dereference-)?recursive', '--directories=recurse']
    message: "A recursive grep also searches trees git excludes — including agent worktrees under .claude/worktrees/, which are hidden from `git status` but not from grep, so every file another agent is editing shows up twice."
    suggest: "git grep -n <pattern> -- '<pathspec>'   # respects .gitignore and .git/info/exclude; use grep -r only for paths outside this repo"
