[package]
name = "runs"
version = "0.1.0"
description = "The runs domain: one run per runner incarnation, decided and folded on angzarr-embedded"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded.workspace = true
coded-diagnostic.workspace = true
angzarr-embedded-macros.workspace = true
prost.workspace = true
runs-proto.workspace = true
uuid.workspace = true

[build-dependencies]
angzarr-build.workspace = true

[dev-dependencies]
# `purge`: the tests purge a stream, as a session's destroy does; only a test
# build has the Purge API.
angzarr-embedded = { workspace = true, features = ["test-support", "purge"] }
mutants.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
