[package]
name = "session-ports"
version = "0.1.0"
description = "The ports the sessions application needs from outside beyond taskloom's ports and angzarr-ports' stores: a project's store, a session's liveness lock, its files, and Go's session directories"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coded-diagnostic.workspace = true
angzarr-embedded.workspace = true
ports.workspace = true

[features]
# The purge a session's destroy runs: the store bound has angzarr's Purge. Off
# by default; a default build has no Purge API.
purge = ["angzarr-embedded/purge"]

[lints]
workspace = true
