syntax = "proto3";

// THE LIBRARY AS AIP RESOURCES (OD-40; the design is
// library-aip-resources.md, ruled by the owner 2026-11-13, OQ-1 to OQ-21).
// Every library verb's `--format json` is the proto3 JSON of its API
// message, generated (OQ-21), converted from library-application's views at
// the CLI's edge (design §6: views unchanged; at T13 the same mapping moves
// into the daemon). The `Ctxloom` service's methods over these messages are
// in daemon.proto; this file holds the messages alone (S1 amended: one
// service, one package, AIP-215).
//
// THE RESOURCE TREE (AIP-121, 122, 123; type domain `ctxloom.dev`). Each
// pattern's order is fixed once published (AIP-123):
//
//   ctxloom.dev/Project     projects/{project}                  (daemon.proto)
//   ctxloom.dev/User        users/me                            the home layer,
//                                                               outside a project (OQ-3)
//   ctxloom.dev/Bundle      1 projects/{project}/bundles/{bundle}
//                           2 projects/{project}/remotes/{remote}/bundles/{bundle}
//                           3 projects/{project}/companions/{companion}/bundles/{bundle}
//                           4 users/me/bundles/{bundle}
//   ctxloom.dev/Fragment    each Bundle pattern + /fragments/{fragment}
//   ctxloom.dev/Command     each Bundle pattern + /commands/{command}
//   ctxloom.dev/Skill       each Bundle pattern + /skills/{skill}
//   ctxloom.dev/McpServer   each Bundle pattern + /mcpServers/{mcp_server}
//   ctxloom.dev/Profile     each Bundle pattern + /profiles/{profile}
//   ctxloom.dev/Agent       projects/{project}/agents/{agent}, users/me/agents/{agent}
//   ctxloom.dev/Engine      projects/{project}/engines/{engine}, users/me/engines/{engine}
//   ctxloom.dev/Companion   projects/{project}/companions/{companion},
//                           users/me/companions/{companion}
//   ctxloom.dev/Remote      projects/{project}/remotes/{remote}
//   ctxloom.dev/Dependency  projects/{project}/dependencies/{dependency}
//   ctxloom.dev/Config      projects/{project}/config, users/me/config (singletons, AIP-156)
//   ctxloom.dev/PremiseIndex projects/{project}/premiseIndex (a singleton)
//
// ORIGIN IS IN THE NAME (OQ-4): a project's bundle and the built-in one are
// `projects/{p}/bundles/{b}` (a project bundle named `ctxloom` overrides the
// built-in whole: one name whose `origin` flips, ruling 128); an installed
// remote bundle is `projects/{p}/remotes/{r}/bundles/{b}`; a companion's
// loadout `projects/{p}/companions/{c}/bundles/loadout`. Outside a project
// the root is `users/me` (OQ-3), so the built-in bundle is
// `users/me/bundles/ctxloom`. Two bundles never share a name.
//
// IDS (AIP-122: an ID's format must be documented). The owner ruled a
// STRICTER grammar for items (OQ-6, a hard migrate of content names; one in
// another person's remote bundle that breaks it is refused, with a fix), and
// a nested local bundle name (`team/rules`) refused (OQ-5):
//
//   item-id = letter [ *61( letter / digit / "-" ) ( letter / digit ) ]
//   letter  = %x61-7A          ; a to z: lowercase ASCII only
//   digit   = %x30-39          ; 0 to 9
//
// that is, as a regular expression, `^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$`:
// one to 63 characters, lowercase ASCII letters, digits and hyphens, starting
// with a letter and not ending with a hyphen (RFC 1034's label, AIP-122's
// recommendation). No uppercase, underscore, dot, space, `/` or `\`. It is
// the ID of a Bundle, Fragment, Command, Skill, McpServer and Profile (the
// file or directory name on disk, which must therefore be one).
//
//   - An Engine's ID is the fixed engine name (`claude-code`, `opencode`;
//     `mock*` only under test-support), which the grammar holds.
//   - An Agent's, a Companion's and a Remote's ID is its config key,
//     verbatim: one name segment (no `/`), as the config's own decode
//     admits it.
//   - A Project's is its harp (S42), and so is a session's (daemon.proto).
//   - A Dependency's ID is the first 16 lowercase hexadecimal digits of the
//     SHA-256 of its lock identity (OQ-15; `reference` holds the identity):
//     `^[0-9a-f]{16}$`.
//   - `uid`, where a resource has one, is a field and never part of a name.
//
// CONVENTIONS (design §2):
//   - Field numbers: 1 `name` (or `parent`); 2..69 the resource's own; 70
//     `etag` on a resource; 80, 81 paging; 90+ the request and the response
//     fields (90 `needs`, 91 `etag`, 92 `notices`).
//   - Field behaviours (AIP-203) are COMMENTS until the vendored annotations
//     land (daemon.proto's TODO(S36)): IDENTIFIER on `name`; OUTPUT_ONLY on
//     everything derived.
//   - `name` is reserved for the resource's name (AIP-122): a sub-row that
//     said `name` says what it is (`agent`, `variable`, `resource`).
//   - A reference is a resource name; one that resolves to nothing keeps its
//     configured text and is said in a notice (OQ-16).
//   - A field readable from the name is not repeated (`bundle`, `remote`,
//     `bundle_label`, `is_remote`, `display_name` are gone).
//   - DEFAULTS ARE LEFT OUT (OQ-7, proto3 JSON): false, 0, "" and [] are not
//     printed. The yes/no facts a reader must see as `false` have presence
//     (`optional`): `applied`, `held`, `default`, `resolves`, `no_distill`.
//   - ENUMS follow AIP-216 and AIP-126 (owner ruling 2026-11-13, OQ-B1),
//     across the package: a state is `State`, nested in the message it
//     describes, `STATE_UNSPECIFIED` its zero; any other enum's zero is
//     `<NAME>_UNSPECIFIED` and its other values are unprefixed, nested in
//     the one message that owns it. An enum several messages share stays
//     top-level (`DistilledState`, `ItemView`, `ItemKind`), its values
//     unprefixed but its zero: proto3 scopes a top-level enum's values to
//     the package, so no two top-level enums may share a value name.
//     JSON prints the bare value (`"origin": "PROJECT"`).
//   - Counts and token estimates are `uint32` (JSON numbers), byte sizes
//     `uint64` (JSON strings) (OQ-12).
//   - A free-form document (an engine's permissions, the config) is a
//     `google.protobuf.Value` (OQ-11, owner ruling 2026-11-13, superseding
//     Struct): printed as the JSON value itself, an object, a list, a word,
//     a number, a yes/no or null, so whatever was written round-trips and an
//     object's paths keep their shape; schema-less, so nothing of claude's
//     or opencode's configuration is encoded here (the owner's condition); a
//     client switches on the value's kind (the accepted cost); its numbers
//     are doubles for display only, and the engine still receives the
//     document verbatim from the config, never from this message.
//   - Every write method answers a response of ITS OWN (OQ-9:
//     `CreateBundleResponse`, `UpdateBundleResponse`, ..., not a per-noun
//     wrapper), each carrying the resource, `path`, `applied`, `detail`,
//     `apply_command` (OQ-8: the exact command that applies a preview),
//     `needs` (90), `etag` (91) and `notices` (92). Nothing in process
//     computes needs or an etag before T13.
//   - A stale etag is ABORTED (OQ-10, AIP-154): daemon.proto's `PlanStale`.
//   - Every List is AIP-132's from the start: `page_size` 80, `page_token`
//     81, `next_page_token` 80; in process every page is the whole list.
//   - Views (AIP-157): BASIC is a list row, FULL is `show`, CONTENT (a
//     bundle) is `view`; UNSPECIFIED is BASIC for a List and FULL for a Get.
package ctxloom.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "ctxloom/v1/needs.proto";

// region shared

// A value and the config place that said it (ruling 72): `agent`, `engine`,
// `project` or `default`. was: SourcedValue.
message SourcedText {
  string value = 1;
  string source = 2;
}

message SourcedList {
  repeated string value = 1;
  string source = 2;
}

// An engine's own document (rulings 133-139), as written; none is unset.
message SourcedDocument {
  google.protobuf.Value value = 1;
  string source = 2;
}

// The runtime an agent runs in, and what its own replaced (never silent):
// `overrides` the value that would have stood, `overrides_source` its
// layer, `change` how they differ (`weakens`, `strengthens`,
// `ownership-swap`). was: RuntimeSetting.
message RuntimeSetting {
  string value = 1;
  string source = 2;
  string overrides = 3;
  string overrides_source = 4;
  string change = 5;
}

// One name of an agent's env and the layer that said it. was: EnvKey
// (`name` -> `variable`, AIP-122).
message EnvKey {
  string variable = 1;
  string source = 2;
}

// The names a launch passes through (ruling 66). was: EnvSetting.
message EnvSetting {
  repeated string value = 1;
  string source = 2;
  repeated EnvKey keys = 3;
}

// What an agent resolves to on an engine. was: AgentSettings.
message AgentSettings {
  SourcedText model = 1;
  SourcedText effort = 2;
  SourcedDocument permissions = 3;
  RuntimeSetting runtime = 4;
  EnvSetting env = 5;
  // Whose home the engine runs on (`session` | `host`): the agent's own,
  // else its engine block's, else `session` (owner ruling of 2026-11-13,
  // superseding 44(b) for this key).
  SourcedText session_home = 6;
}

// An engine surface an agent's selection cannot reach. was: NotCarried.
message NotCarried {
  string engine = 1;
  string surface = 2;
  string event = 3;
  string reason = 4;
}

// What a write answers (OQ-8, OQ-9): the fields every per-method response
// repeats, at the same numbers. This message is not used itself; it
// documents the shape.
//   2 path            the one atomic operation's target (T25)
//   3 applied         printed false on a preview (OQ-7)
//   4 detail          what the preview would change. was: Preview.detail
//   5 apply_command   the exact command that applies. was: apply
//   6 changes         an edit's changes; empty, nothing changed
//   90 needs, 91 etag, 92 notices

// endregion

// region bundles: ctxloom.dev/Bundle

message Bundle {
  enum View {
    VIEW_UNSPECIFIED = 0;
    // `bundle list`.
    BASIC = 1;
    // `bundle show`.
    FULL = 2;
    // `bundle view <bundle>`.
    CONTENT = 3;
  }

  // Where a bundle comes from.
  enum Origin {
    ORIGIN_UNSPECIFIED = 0;
    // The project's own (`.ctxloom/content/bundles/...`).
    PROJECT = 1;
    // ctxloom's built-in bundle (`ctxloom/builtin`, ruling 127).
    BUILTIN = 2;
    // An installed remote bundle.
    REMOTE = 3;
    // A companion's loadout.
    COMPANION = 4;
    // users/me's own bundles, if any exist (OQ-3).
    HOME = 5;
  }

  // IDENTIFIER: one of the four Bundle patterns.
  string name = 1;
  // OUTPUT_ONLY. was: origin.
  Origin origin = 2;
  // OUTPUT_ONLY. was: ref (`ctxloom+local:demo`, `<url>@bundles/x`).
  string reference = 3;
  // OUTPUT_ONLY, a remote bundle's commit. was: RemoteOrigin.sha.
  string commit = 4;
  // OUTPUT_ONLY: its bundle.yaml.
  string path = 5;
  string version = 6;
  // FULL.
  string author = 7;
  string description = 8;
  repeated string tags = 9;
  // FULL.
  string notes = 10;
  // FULL.
  string installation = 11;
  // OUTPUT_ONLY counts.
  uint32 fragment_count = 12;
  uint32 command_count = 13;
  // was: mcp_count.
  uint32 mcp_server_count = 14;
  uint32 profile_count = 15;
  uint32 skill_count = 16;
  // OUTPUT_ONLY, a remote bundle's: always printed when known.
  optional bool held = 17;
  // OUTPUT_ONLY, FULL: each child summarised by its name (OQ-14).
  repeated BundleItem fragments = 20;
  repeated BundleItem commands = 21;
  repeated BundleItem skills = 22;
  repeated BundleItem mcp_servers = 23;
  // OUTPUT_ONLY, FULL: Profile names.
  repeated string profiles = 24;
  // OUTPUT_ONLY, FULL: hook labels.
  repeated string hooks = 25;
  // OUTPUT_ONLY, CONTENT: each file of `bundle view`.
  repeated BundleFile files = 26;
  // OUTPUT_ONLY, CONTENT: the distilled forms were asked.
  optional bool distilled = 27;
  string etag = 70;
}

// One child as `bundle show` summarises it (AIP-122: the referenced
// resource is not embedded). was: ShownFragment, ShownCommand, ShownSkill,
// ShownMcp.
message BundleItem {
  // The child's resource name.
  string item = 1;
  repeated string tags = 2;
  // Commands.
  string description = 3;
  // Fragments, commands: the first line.
  string preview = 4;
  DistilledState distilled = 5;
  // Printed true or false (OQ-7).
  optional bool no_distill = 6;
  // Fragments.
  string premise = 7;
  // MCP servers.
  string command = 8;
  repeated string args = 9;
  // MCP servers: values included, as shown today (OQ-17).
  map<string, string> env = 10;
  string notes = 11;
  string installation = 12;
  // Skills.
  string path = 13;
}

// One file of `bundle view <bundle>`.
message BundleFile {
  string path = 1;
  string content = 2;
}

message GetBundleRequest {
  string name = 1;
  Bundle.View view = 2;
  // `--distilled`: a distilled form where one is fresh.
  bool prefer_distilled = 3;
}

message ListBundlesRequest {
  // `projects/{project}` answers the whole catalog, every origin (a lint
  // exception to AIP-132's "parent identifies the type", design §1.2);
  // `projects/{project}/remotes/-` every remote bundle alone (AIP-159).
  string parent = 1;
  Bundle.View view = 2;
  int32 page_size = 80;
  string page_token = 81;
}

message ListBundlesResponse {
  repeated Bundle bundles = 1;
  string next_page_token = 80;
}

message CreateBundleRequest {
  string parent = 1;
  string bundle_id = 2;
  Bundle bundle = 3;
  string request_id = 90;
  bool validate_only = 92;
  repeated Answer answers = 93;
  EnvVars env = 94;
  Presentable presentable = 95;
  Globals globals = 96;
}

message CreateBundleResponse {
  Bundle bundle = 1;
  string path = 2;
  optional bool applied = 3;
  repeated string detail = 4;
  string apply_command = 5;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

message UpdateBundleRequest {
  Bundle bundle = 1;
  // Exactly ONE path (T29); more is refused `OneChangePerCall`.
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 90;
  string etag = 91;
  bool validate_only = 92;
  repeated Answer answers = 93;
  Presentable presentable = 95;
  Globals globals = 96;
}

message UpdateBundleResponse {
  Bundle bundle = 1;
  string path = 2;
  optional bool applied = 3;
  repeated string detail = 4;
  string apply_command = 5;
  repeated string changes = 6;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

message DeleteBundleRequest {
  string name = 1;
  string request_id = 90;
  string etag = 91;
  // Without `--yes`: the preview.
  bool validate_only = 92;
  repeated Answer answers = 93;
  Presentable presentable = 95;
  Globals globals = 96;
}

// A delete answers the resource as it was.
message DeleteBundleResponse {
  Bundle bundle = 1;
  string path = 2;
  optional bool applied = 3;
  repeated string detail = 4;
  string apply_command = 5;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

// `bundle export <bundle> <dest>` (AIP-136).
message ExportBundleRequest {
  string name = 1;
  string destination = 2;
  string request_id = 90;
  bool validate_only = 92;
  Globals globals = 96;
}

// was: {status, name, source, dest}.
message ExportBundleResponse {
  string bundle = 1;
  string source = 2;
  string destination = 3;
  optional bool applied = 4;
  string apply_command = 5;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

// `bundle import <path> [--force]` (AIP-136, on the collection).
message ImportBundleRequest {
  string parent = 1;
  string source = 2;
  bool force = 3;
  string request_id = 90;
  string etag = 91;
  bool validate_only = 92;
  repeated Answer answers = 93;
  Presentable presentable = 95;
  Globals globals = 96;
}

// The bundle imported, with its counts. was: {status, source, dest,
// version, fragments, commands, mcp}.
message ImportBundleResponse {
  Bundle bundle = 1;
  string path = 2;
  optional bool applied = 3;
  repeated string detail = 4;
  string apply_command = 5;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

// `bundle move <bundle> --to` (AIP-136; Move is its exception for
// imperative verbs). The bundle under its new name. was: {status, dest}.
message MoveBundleRequest {
  string name = 1;
  // The new parent (a project or a remote).
  string destination = 2;
  string request_id = 90;
  bool validate_only = 92;
  Globals globals = 96;
}

message MoveBundleResponse {
  Bundle bundle = 1;
  string path = 2;
  optional bool applied = 3;
  repeated string detail = 4;
  string apply_command = 5;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

// `bundle push <bundle> <remote>` (AIP-136). Its response's fields are
// B4's to write (the design gives `Pushed`, "field for field"; see the
// open note at the end of this file).
message PushBundleRequest {
  string name = 1;
  string remote = 2;
  string request_id = 90;
  bool validate_only = 92;
  Globals globals = 96;
}

// endregion

// region fragments and commands: ctxloom.dev/Fragment, ctxloom.dev/Command

enum DistilledState {
  DISTILLED_STATE_UNSPECIFIED = 0;
  // No distilled form.
  NONE = 1;
  // Its recorded source digest matches the `.md` now.
  FRESH = 2;
  // It does not, or records none (T30).
  STALE = 3;
}

enum ItemView {
  ITEM_VIEW_UNSPECIFIED = 0;
  BASIC = 1;
  FULL = 2;
}

message Fragment {
  // IDENTIFIER: a Bundle pattern + `/fragments/{fragment}`.
  string name = 1;
  // OUTPUT_ONLY. was: ref (`demo#fragments/x`).
  string reference = 2;
  // OUTPUT_ONLY: the bundle's tags, then its own.
  repeated string tags = 3;
  // FULL. was: ItemShow.content.
  string body = 4;
  // OUTPUT_ONLY.
  DistilledState distilled = 5;
  optional bool no_distill = 6;
  string premise = 7;
  // OUTPUT_ONLY: the first line.
  string preview = 8;
  // OUTPUT_ONLY, FULL: the body served is the distilled form.
  bool body_is_distilled = 9;
  // OUTPUT_ONLY.
  string path = 10;
  string etag = 70;
}

message Command {
  // IDENTIFIER: a Bundle pattern + `/commands/{command}`.
  string name = 1;
  string reference = 2;
  repeated string tags = 3;
  string body = 4;
  DistilledState distilled = 5;
  optional bool no_distill = 6;
  string description = 7;
  string preview = 8;
  bool body_is_distilled = 9;
  string path = 10;
  string etag = 70;
}

message GetFragmentRequest {
  string name = 1;
  ItemView view = 2;
  bool prefer_distilled = 3;
}

message ListFragmentsRequest {
  // A bundle, or `projects/{project}/bundles/-` (AIP-159).
  string parent = 1;
  repeated string tags = 2;
  ItemView view = 3;
  int32 page_size = 80;
  string page_token = 81;
}

message ListFragmentsResponse {
  repeated Fragment fragments = 1;
  string next_page_token = 80;
}

message CreateFragmentRequest {
  string parent = 1;
  string fragment_id = 2;
  Fragment fragment = 3;
  string request_id = 90;
  bool validate_only = 92;
  repeated Answer answers = 93;
  EnvVars env = 94;
  Presentable presentable = 95;
  Globals globals = 96;
}

message CreateFragmentResponse {
  Fragment fragment = 1;
  string path = 2;
  optional bool applied = 3;
  repeated string detail = 4;
  string apply_command = 5;
  // The bundle was made for it. was: ItemCreated.bundle_created.
  bool bundle_created = 7;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

message UpdateFragmentRequest {
  Fragment fragment = 1;
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 90;
  string etag = 91;
  bool validate_only = 92;
  repeated Answer answers = 93;
  EnvVars env = 94;
  Presentable presentable = 95;
  Globals globals = 96;
}

message UpdateFragmentResponse {
  Fragment fragment = 1;
  string path = 2;
  optional bool applied = 3;
  repeated string detail = 4;
  string apply_command = 5;
  repeated string changes = 6;
  repeated Need needs = 90;
  string etag = 91;
  repeated Notice notices = 92;
}

message DeleteFragmentRequest {
  string name = 1;
  string request_id = 90;
  string etag = 91;
  bool validate_only = 92;
  repeated Answer answers = 93;
  Presentable presentable = 95;
  Globals globals = 96;
