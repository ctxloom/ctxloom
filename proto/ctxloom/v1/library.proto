}

// was: AuthSetting.
message EngineAuth {
  // Whether the credential the source names is there.
  enum State {
    // Unset (proto3's zero value).
    STATE_UNSPECIFIED = 0;
    // A variable it names is set (`via` names it).
    PRESENT = 1;
    // None of its variables is set.
    MISSING = 2;
    // The source asks for no variable (`none`, `login`).
    NOT_NEEDED = 3;
  }

  // The auth setting in effect.
  AuthValue value = 1;
  // The layer that said it: `engine`, `project` or `default`.
  string source = 2;
  // Whether its credential is there.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The variable's name or the file's path that authenticates.
  string via = 4;
}

// One agent of an engine (bound to it, or with a block for it, ruling 57)
// and what it resolves to there. Its settings are flat (design §3.8's
// recommendation, for path stability: `agents[...].model.value`). was:
// EngineAgent (`name` -> `agent`, AIP-122).
