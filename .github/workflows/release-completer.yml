name: Release Completer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.0.4)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    container:
      # goreleaser-cross includes cross-compilation toolchains for CGO.
      # Pinned to v1.25 to match go.mod's `go 1.25.0` (and the devcontainer's
      # 1.25.x) so the release builds on the same major.minor as CI without an
      # implicit GOTOOLCHAIN download at release time.
      image: ghcr.io/goreleaser/goreleaser-cross:v1.25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # On a tag push, github.ref is the tag. On manual dispatch, check out
          # the tag the user named (without this, dispatch built the default
          # branch and GoReleaser failed on a non-tagged commit).
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y git curl upx unzip

      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # .devcontainer/tool-versions.env is the single source of truth for
      # every pinned tool version below — this job runs in goreleaser-cross,
      # not the devcontainer image, so it can't just inherit them and must
      # install its own copies. Loading the file into $GITHUB_ENV (instead of
      # hand-copying version numbers into this workflow) is what makes that
      # impossible to silently drift: internal/buildpins' drift-gate test
      # fails if this step's referenced names ever stop matching the file, or
      # if the file and .devcontainer/Dockerfile disagree.
      - name: Load tool versions
        run: grep -v '^#' .devcontainer/tool-versions.env | grep -v '^$' >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          # Install just
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          # Install versionator (releases >= v0.1.1 ship as tarballs).
          curl -sSL "https://github.com/benjaminabbitt/versionator/releases/download/v${VERSIONATOR_VERSION}/versionator-linux-amd64.tar.gz" -o /tmp/versionator.tar.gz
          tar -xzf /tmp/versionator.tar.gz -C /tmp
          install /tmp/versionator-linux-amd64 /usr/local/bin/versionator
          # Install buf.
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        run: |
          # buf.gen.yaml uses `local:` plugins (not BSR `remote:` ones — see
          # buf.gen.yaml's comment), so protoc-gen-go/protoc-gen-go-grpc must be
          # on PATH. This job doesn't run in the devcontainer image, so it
          # can't inherit those from there; install the SAME pinned versions
          # (from .devcontainer/tool-versions.env, loaded above) that
          # .devcontainer/Dockerfile installs. Before the local-plugin switch
          # (buf.gen.yaml history, commit b334605) this step ran fine on
          # `remote:` BSR plugins requiring no local install; missing this
          # update after that switch would make a release's codegen silently
          # depend on whatever (if anything) happened to already be on PATH,
          # or fail outright.
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          buf generate

      - name: Validate schemas
        run: go run ./cmd/validate

      - name: Compute install script hashes
        id: script_hashes
        run: |
          HASH_SH=$(sha256sum scripts/install.sh | cut -d' ' -f1)
          HASH_PS1=$(sha256sum scripts/install.ps1 | cut -d' ' -f1)

          echo "install.sh SHA256: $HASH_SH"
          echo "install.ps1 SHA256: $HASH_PS1"

          # Export for goreleaser
          echo "HASH_INSTALL_SH=$HASH_SH" >> $GITHUB_ENV
          echo "HASH_INSTALL_PS1=$HASH_PS1" >> $GITHUB_ENV

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with push access to ctxloom/homebrew-tap (cask publish).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          HASH_INSTALL_SH: ${{ env.HASH_INSTALL_SH }}
          HASH_INSTALL_PS1: ${{ env.HASH_INSTALL_PS1 }}

      - name: Upload install scripts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scripts/install.sh
            scripts/install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
