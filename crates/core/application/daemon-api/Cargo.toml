[package]
name = "daemon-api"
version = "0.1.0"
description = "The daemon's API (slice 2 step 5): the Ctxloom service's use cases the daemon serves from its warm read models, the projects' register-or-recheck, the refusals they answer, and the client's version-skew rule (M3) over the daemon-ports API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
angzarr-embedded.workspace = true
daemon-ports.workspace = true
daemon-proto.workspace = true
exit-code.workspace = true
# The scratch worktrees a removal classifies and removes (slice 2 step 6).
isolation-application.workspace = true
pending-messages.workspace = true
prost.workspace = true
# `session remove`'s one safe order, and the sweep's table, run here.
reclaim-application.workspace = true
run-ports.workspace = true
# A destroy's run streams, UUIDv5(session, n).
runs.workspace = true
session-index.workspace = true
# The destroy's commands to the children and the owner (M3).
session-policies.workspace = true
session-ports.workspace = true
sessions.workspace = true
sessions-application.workspace = true
sessions-proto.workspace = true
uuid.workspace = true

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
mutants.workspace = true
run-ports = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
