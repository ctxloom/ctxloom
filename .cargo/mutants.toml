# cargo-mutants (https://mutants.rs): `just mutants-staged` runs it over the
# staged diff, driven at close-out by `just mutants-batch` (no git hook runs
# it). The kill-rate thresholds are not
# here but in the justfile's `mutation_thresholds`, which judges the run.

# core/wire is generated prost code by rule (CLAUDE.md: "Generated code is
# never committed"): its only hand-written line is the `include!` of OUT_DIR,
# which cargo-mutants does not follow. Excluding the tier says so, and keeps a
# hand-written conversion out of it: conversions belong in the domain, where
# they are held to its threshold.
exclude_globs = ["crates/core/wire/**"]

# Each mutant runs only its own crate's tests (cargo-mutants' default). The
# thresholds judge whether a crate tests itself; a dependent's tests killing
# a mutant would credit the crate with coverage it does not have.
test_workspace = false

# Mutants run under cargo-nextest (https://mutants.rs/nextest.html), the one
# test runner (owner ruling 144): each test in a process of its own, as `just
# test` runs them, so a mutant is judged by the runner, isolation,
# timeouts and leak rule (.config/nextest.toml) the gates hold the tests to,
# and a race that only shows when tests share a process cannot kill or spare
# one. nextest runs no doc tests, and that kills nothing here: the workspace
# has none runnable (its only fences are `text` blocks).
test_tool = "nextest"

# A crate with no tests must not "catch" every mutant: nextest exits 4
# (NO_TESTS_RUN) where `cargo test` passes, and cargo-mutants counts any
# failing exit as caught. With it the crate's mutants are missed, as they
# are. The gates' `_tests` passes the same flag.
additional_cargo_test_args = ["--no-tests=pass"]

# The copy keeps the checkout's `.git` (a worktree's is a FILE naming its git
# directory, which is how the gates' staged tree and mutants-batch's
# throwaway worktree have it): the binary's build script stamps the build
# with versionator, which reads git, and a build without a stamp fails.
copy_vcs = true
