# ctxloom's own loadout — what ctxloom delivers into an engine ON ITS OWN
# BEHALF, emitted by `ctxloom loadout --format json` (signature-envelope spec
# §4.3) as a loadout DOCUMENT: `run:` is the bundles.Bundle a session
# consumes every time; a typed `init:` section (setup_guidance, tooling,
# legacy_context, questions) is consumed once at setup — ctxloom declares
# none today.
#
# ctxloom is ITS OWN COMPANION. This loadout is probed through the running
# binary (companions.Prober's self-probe, resolved via selfexec — never a
# PATH lookup), read by the same companion reader and admitted through the
# same gate as every companion's, under the ctxloom:companion@ctxloom source
# ref — so a profile can exclude any of it and a human can reject it. It is
# signed uniformly with the release key; that signature is CIRCULAR (the trust
# root vouching for the key ships in the same binary) and the reader never
# presents it as trust. This file is the single source of truth for what
# ctxloom tells an engine about itself.
#
# The MCP entry is the companion's DYNAMIC declaration: ctxloom's own server
# is SERVED BY THE RUNNING SESSION'S ENDPOINT (`served_by: session-endpoint`,
# wire.ServedBySessionEndpoint) — there is no command to launch. The runner
# binds the session's endpoint and delivery renders this entry through the
# engine's dynamic approach as that endpoint's URL and bearer, into the
# session's own registry, at session start; at rest (`manage hooks install`,
# a profile materialize) there is no session to inject and the entry renders
# nothing. ctxloom injects its MCP only while it is running. A session that
# wants ctxloom's tools off excludes the item (`exclude_mcp: [ctxloom]`) or
# rejects it.
#
# The isolation-axes fragment is an always-on FRAGMENT, not a skill: the ask
# is that an agent creating, configuring, or delegating to a ctxloom agent
# SPECIFY its isolation axes rather than silently accept defaults — a standing
# habit to hold on every such turn, not a task the model opts into on demand.
# A skill is invoked when its description matches; that only helps if the
# model already suspects isolation is in play, and the failure this guards
# against is exactly the case where it does not. It is short by design: it
# reaches EVERY assembled session's context, so every session pays its token
# cost forever.

run:
  version: 1.0.0
  tags:
    - core
    - mcp
    - isolation
  author: ctxloom
  description: |
    ctxloom's own contribution to a session: its MCP server (context assembly,
    session history, content search, and agent delegation, exposed to whichever
    engine the session runs) and always-on guidance to specify both isolation
    axes (runtime, workspace) explicitly when creating, configuring, or
    delegating to a ctxloom agent.

  mcp:
    ctxloom:
      served_by: session-endpoint
      notes: |
        ctxloom's own MCP server, served by the running session's endpoint.
        Nothing here is launched: the session's runner serves the endpoint
        and delivery writes its URL and bearer into the session's own
        registry at start, so no tracked project file ever carries the
        entry.

  fragments:
    isolation-axes:
      tags:
        - isolation
        - core
      content: |
        ## Isolation: specify both axes

        Creating, configuring, or delegating to a ctxloom agent (`ctxloom agent
        set`, `run --agent`, `agent_run`)? Set both axes explicitly — never rely
        on the default:

        - **runtime** (`host` | `container-rootless` | `container-rootful`,
          the agent binding's `runtime:`) isolates the PROCESS. There is
          deliberately no "any container" value: rootless and rootful differ
          in UID mapping, so a workload can genuinely require one.
        - **workspace** (`none`|`worktree`, per-invocation `--workspace` /
          `agent_run`'s `workspace`) isolates the FILES.

        An ownership mismatch is FATAL, never a substitution. Asking for
        `container-rootful` where only rootless is reachable is a fatal
        ClassIsolation finding (exit 3), not a quiet downgrade to the other
        mode — and `--degraded` falls back to the HOST, never to the other
        ownership mode.

        They're independent: `container-rootless` can still mount the
        workspace at the SAME absolute path as the live project (process
        isolated, edits still land where the editor already looks); `worktree`
        still runs the engine on the host (the editor goes blind to that tree
        by design — results return via the delegated-agent merge flow, not
        live edits). Picking one says nothing about the other.

        Unspecified means `host`+`none` — isolated on NEITHER axis. That's a
        default, not a decision. Host runtime is not a security boundary
        between agents: the coordinator credential is readable in the process
        environment of any same-uid process, and that token IS identity, so a
        host-runtime agent can read another host-runtime agent's credential and
        speak as that agent. Containers are the actual boundary: they make
        isolation a property of the runtime, not a request to the engine —
        some vendor CLIs ignore env-var isolation hints and write
        credentials/state to a global path regardless.

        A bad or missing agent name silently degrades to `host`+`none` with only
        a stderr warning, discarding the runtime and permissions you asked for —
        confirm the name resolves before trusting the isolation you requested.
