[package]
name = "library-tree"
version = "0.1.0"
description = "The library domain: what ctxloom observed of a library tree in git, and what it intended to change there, decided and folded on angzarr-embedded"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-embedded.workspace = true
angzarr-diagnostic.workspace = true
angzarr-embedded-macros.workspace = true
prost.workspace = true
library-domain-proto.workspace = true
# A checkout's tree is named under its project's (`projects/{p}/checkouts/
# {c}/library`), its stream root the UUIDv5 of a name, as every ctxloom
# root is, and each harp checked by the one harp grammar.
sessions.workspace = true
# An observation's fact key (L4): ids hashed, never content.
sha2.workspace = true
hex.workspace = true
uuid.workspace = true

[build-dependencies]
angzarr-build.workspace = true

[dev-dependencies]
angzarr-embedded = { workspace = true, features = ["test-support"] }
mutants.workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
