  string kind = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The bundle's reference, or the MCP server's name.
  string reference = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A command an agent needs on its PATH, and who asks for it.
message Requirement {
  // The program's name.
  string command = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Each bundle or MCP server that asks for it.
  repeated RequirementSource sources = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// What an agent resolves to (its settings flattened, as today). was:
// ResolvedAgent.
message ResolvedAgent {
  // The profiles composed, in order.
  repeated string profiles = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The Engine's name.
  string engine = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The model, with the layer that said it.
  SourcedText model = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The effort level, with the layer that said it.
  SourcedText effort = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The engine's own permissions document, with the layer that said it;
  // passed verbatim, never checked.
  SourcedDocument permissions = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The runtime, and what it replaced.
  RuntimeSetting runtime = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The variable names passed through, each with its layer.
  EnvSetting env = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The context the agent's profiles assemble.
  string context = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The fragments that context composes, by canonical reference.
  repeated string fragments = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How the agent is driven: `conversational` or `oneshot`.
  string driving = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Was the engine block's bare word; now the effective value with the
