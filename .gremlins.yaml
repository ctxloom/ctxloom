# Gremlins mutation testing configuration
# https://gremlins.dev/0.5/usage/configuration/

silent: false

unleash:
  # Files to exclude from mutation testing.
  #
  # MUST be nested under `unleash:`. gremlins registers this setting at the
  # viper path "unleash.exclude-files"; a TOP-LEVEL exclude-files key is parsed
  # as valid YAML, silently ignored, and excludes nothing. It sat at the top
  # level here and generated protobuf was being mutated the whole time —
  # internal/adapters/coordgrpc/pb alone produced 1,261 .pb.go mutants. Generated code is
  # never tested, so those land NOT COVERED/LIVED and drag both efficacy and
  # mutant-coverage down, which means every published number was computed over
  # a file set nobody intended to measure.
  # SCOPE-BLIND DISCOVERY — why the list below is longer than you'd expect.
  # gremlins finds mutants by walking the raw filesystem (engine.go's fs.WalkDir
  # from the module root). It never calls `go list`, never notices a nested
  # go.mod, and never evaluates //go:build tags — while its COVERAGE step runs an
  # ordinary `go test ./...` that respects all three. So anything the walker sees
  # but the compiler never compiled is scored NOT COVERED by construction, and it
  # lands in the denominator.
  #
  # This wrecked the number: two leftover agent worktrees under .claude/ (each a
  # full nested checkout of this same module) contributed 24,000 phantom mutants
  # — 66% of the module total — and dragged reported mutant-coverage to 22.90%
  # when the real figure for buildable first-party code is ~75%.
  #
  # PRECONDITION FOR A TRUSTWORTHY RUN: no nested go.mod under the tree, other
  # than third_party/. Check with:  find . -name go.mod -not -path './go.mod'
  exclude-files:
    - ".*_test\\.go$"
    - ".*\\.pb\\.go$"
    - ".*/mock_.*\\.go$"
    - ".*/testdata/.*"
    - "tests/integration/.*"
    - ".*/tests/integration/.*"
    # Parity with tests/integration — the acceptance suite is //go:build
    # acceptance, so `go test` with no tags never compiles it, yet the walker
    # still mutates it. Was simply never added alongside its sibling.
    - "tests/acceptance/.*"
    - ".*/tests/acceptance/.*"
    # Agent worktrees: nested checkouts of this module. Harness-created, recur
    # as part of normal work here, invisible to `go list`.
    - "^\\.claude/.*"
    # Vendored fork with its own go.mod — never ours to measure.
    - "^third_party/.*"

  # Don't run integration tests (use unit tests only for speed)
  integration: false
  # Set to true to see what would be mutated without running tests
  dry-run: false
  # Build tags to use
  tags: ""
  # Output format (empty = terminal, or "json")
  output: ""
  # Number of workers. NOT a speed knob — it is a DISK knob, and 0 (= one per
  # CPU) does not work on a machine with many cores and a large tree.
  #
  # gremlins gives every worker its OWN FULL COPY of the module: workdir.go's
  # CachedDealer.Get walks the source tree and copies it per worker name. The
  # walk is the raw FILESYSTEM, so it copies everything gitignored too — this
  # tree is 4.0 GB, of which 2.7 GB is `.reprise`'s untracked cache plus
  # `website/` (411 MB), `dist/` (95 MB) and `bin/` (42 MB). None of that is
  # Go source and all of it gets copied.
  #
  # At workers: 0 on a 20-core box that is 20 x 4.0 GB = 80 GB against 57 GB
  # free. The disk fills, Get() returns an error, and executor.go:165 turns it
  # into `panic("error, this is temporary")` — in EVERY worker, for EVERY
  # package, which reads as "gremlins is broken on this toolchain" and is not.
  # Measured 2026-08-10: at workers: 2 the same run completes in 9 seconds.
  #
  # This is the same filesystem-scope-blindness documented above for
  # exclude-files, applied to the workdir copy rather than to mutant
  # discovery. Raise this number only against measured free space:
  # peak disk is workers x the FULL tree size, not the source size.
  workers: 4
  # CPUs per test process (0 = no limit)
  test-cpu: 0
  # Timeout multiplier applied to the BASELINE test-suite duration. It is a
  # multiplier, not an absolute budget, so a fast package starves: the pure
  # triggers package runs in ~3ms, and at 5x every mutant got a ~15ms budget —
  # 58 of 65 scored TIMED OUT, which is neither killed nor lived, so the run
  # measured nothing. At 30x the same package produced 0 timeouts and a real
  # verdict. Raise this, never lower it — a false timeout silently voids a
  # mutant. A slow package is bounded by the cap below instead.
  timeout-coefficient: 30
  # THE CAP on that budget. gremlins has no absolute timeout, so these two keys
  # are ours, not gremlins' (it ignores keys it does not know). They are read by
  # tests/mutation/mutation_tmp.sh, which every recipe and CI shard runs
  # gremlins under, and applied per mutant by tests/mutation/gremlins_exec.sh.
  # With B the coverage run's duration:
  #
  #   per-mutant test timeout = min(coefficient * B, max(CAP, FLOOR * B))
  #
  # Uncapped, a slow scope is enormous: a diff run's whole-module coverage pass
  # took 140.7s, so every mutant got 30 x 140.7s = 1h10m23s, and four termui
  # mutants that deadlock a test held their workers 32+ minutes each until
  # killed by hand (the run took 5.5h+). The cap changes only a scope whose
  # coefficient budget exceeds it, i.e. B > CAP / coefficient = 20s: every
  # fast package (triggers at 0.021s) keeps its 30x untouched.
  #
  # FLOOR keeps the cap from starving a slow package. B is never less than the
  # slowest in-scope package's own test time, since the coverage pass runs it
  # (instrumented, so slower). The slowest package is internal/core/coord, at
  # 126.3s uninstrumented against that 140.7s module pass, so in a module or
  # diff run coord's mutants get FLOOR * B, never the bare CAP. Measured
  # 2026-10-14 (a coord diff run, 4 workers beside another mutation run): B was
  # 141.9s, each coord mutant ran under -test.timeout=710s, and the longest
  # coord mutant test run was 134s, 0.94 x B. FLOOR = 5 leaves 5.3x over that.
  #
  # A capped mutant scores KILLED, not TIMED OUT: the test binary panics on its
  # -test.timeout, `go test` exits 1, and gremlins maps exit 1 to KILLED.
  # TIMED OUT comes only from gremlins' own deadline, and is excluded from
  # efficacy entirely. Do NOT lower either value without re-measuring coord.
  ctxloom-timeout-cap-seconds: 600
  ctxloom-timeout-floor-coefficient: 5

  # Quality gates. EFFICACY is the mutant KILL RATE (killed / killed+lived) and
  # is set to the project standard of 80%, decided 2026-08-06. It is expected to
  # FAIL until the tests earn it — that is the point. A gate set to the current
  # sorry state measures nothing and ratchets nothing; a gate set to the
  # standard names the gap every time it runs.
  #
  # Do NOT lower this to make a run green. Four separate times a threshold here
  # was chosen before a measurement and tuned until it passed, most memorably
  # efficacy:60 justified by an invented "~48% baseline" when the real figure
  # was 22.90%. Raising coverage is the way to green, not editing this number.
  #
  # MUTANT-COVERAGE stays 0 deliberately, and is NOT the same knob. It measures
  # how many mutants the coverage profile could even see, which is bounded by
  # instrumentation rather than by test quality — and for anything driven as a
  # subprocess it is structurally near-zero. Gating on it would fail for a
  # reason no test author can fix.
  threshold:
    efficacy: 80
    mutant-coverage: 0

# Mutation operators to enable
# Start with the most valuable ones, add more as test suite matures
mutants:
  # Replace +, -, *, / with each other
  arithmetic-base:
    enabled: true

  # BLIND SPOT, both conditional mutators below: gremlins cannot score a
  # condition on a `case` line, or one right after a function literal. It
  # judges a mutant only when the coverage profile puts a covered block over
  # it, and Go's profile puts none there, so such a mutant shows NOT COVERED
  # however well the tests exercise it. A test cannot change that verdict: kill
  # these by hand (mutate the condition, watch a test fail, restore).
  #
  # Change <, <=, >, >= boundary conditions
  conditionals-boundary:
    enabled: true

  # Negate conditionals (== to !=, etc)
  conditionals-negation:
    enabled: true

  # Change ++ to -- and vice versa
  increment-decrement:
    enabled: true

  # Swap assignment operators (+=, -=, etc)
  invert-assignments:
    enabled: true

  # Invert bitwise operators (&, |, ^)
  invert-bitwise:
    enabled: false

  # Invert bitwise assignment operators (&=, |=, ^=)
  invert-bwassign:
    enabled: false

  # Remove negative signs
  invert-negatives:
    enabled: true

  # Invert && to || and vice versa
  invert-logical:
    enabled: true

  # Change break to continue and vice versa
  invert-loopctrl:
    enabled: true

  # Remove self-assignments (x = x)
  remove-self-assignments:
    enabled: true
