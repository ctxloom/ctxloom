[package]
name = "mcp-server"
version = "0.1.0"
description = "ctxloom's own MCP server (`ctxloom mcp serve`, hidden): an engine's way to the daemon, over stdio, each tool a call of the daemon-api client use cases"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
clap.workspace = true
daemon-api.workspace = true
daemon-proto.workspace = true
# The official Rust MCP SDK (ruling 150, OD/s3-Q1), pinned exactly, its
# default features off: the server and the stdio transport alone (no macros,
# no HTTP, no TLS; elicitation is added when a tool carries needs, OD-5).
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
mutants.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "io-util"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
