version: "1.0.0"
description: >-
  Situations for MEASURING premise selection against the premise_spike corpus.

  This is DATA AND GROUND TRUTH, deliberately not a test. Selection is performed
  by a model, and wiring a model's reasoned output into the suite would make a
  gate that reddens on temperature rather than on a defect. Run it as a
  measurement, read the numbers, and decide; never assert them.

  Each situation is written as the agent's own statement of what it is about to
  do -- the form a premise is actually judged against. `expect` is the human
  label of which fragments SHOULD be offered; `forbid` names fragments that are
  tempting and must NOT be, which is what makes precision measurable rather
  than assumed.

metrics:
  precision: "selected AND expected, over selected"
  recall: "selected AND expected, over expected"
  silent_drop: "expected but NOT selected, over expected -- the expensive error: the agent never learns the fragment existed"
  over_selection: "mean count selected per situation; the number that dies if premises are widened without limit"

situations:
  # THE DISCRIMINATOR. A `go test` invocation is refused and must be rerun.
  # A mode-shaped premise ("you are writing Go code") does not fire here,
  # because at this instant nobody is writing code -- they are choosing how to
  # invoke a tool. An action-shaped one does. This single row is what separates
  # the two authoring styles; treat it as the rule's own test.
  - id: S1
    intent: "I ran `go test ./internal/mcp` and the tool refused it, telling me to use the project's task runner instead. I have to decide how to rerun it."
    expect: [ltk, just, golang]
    discriminator: true

  - id: S2
    intent: "I'm writing the pull request description that summarises what changed in this branch and why."
    expect: [banned-phrases]
    forbid: [no-provenance-comments]
    note: "A PR description recording what changed is legitimate; the provenance rule governs code comments and docs, not a PR body."

  - id: S3
    intent: "This change is ready to start. I'll cut a worktree for it off release/0.7, and remove the worktree and delete the branch once it merges."
    expect: [worktree-lifecycle]

  - id: S4
    intent: "My new test passes. Before I call it done I want to know whether it actually proves anything."
    expect: [mutation-as-test-validator]

  - id: S5
    intent: "I'm dispatching a sub-agent to do this refactor and need to write the brief it will work from."
    expect: [prompt-authoring]

  - id: S6
    intent: "We're shipping v0.8.0 — bump the version, tag it, and publish the release artifacts."
    expect: [github-release-master]

  - id: S7
    intent: "I'm adding a comment above this function noting that we replaced the old approach last month after it broke in production."
    expect: [no-provenance-comments]

  - id: S8
    intent: "Every call of the form `foo(ctx, nil)` needs to become `foo(ctx)` across about two hundred files, matched structurally rather than by text."
    expect: [ast-grep]

  - id: S9
    intent: "The duplicate-code gate fired on my change — it found three near-identical blocks and wants me to look at them."
    expect: [reprise]

  - id: S10
    intent: "Writing a small Python script to parse the log file and emit a CSV summary."
    expect: [python]
    forbid: [golang, rust, typescript]
    note: "Language cross-talk probe: sibling language fragments share a premise shape and are the likeliest false positives."

  - id: S11
    intent: "This repository has submodules and I need to bump one of them to a newer commit."
    expect: [git-submodule]

  - id: S12
    intent: "Refactoring a React component's prop types, tightening the TypeScript interfaces."
    expect: [typescript]
    forbid: [python, golang, rust]

  - id: S14
    intent: "Adding a new error variant to this crate and threading it through the Result types the callers match on."
    expect: [rust]
    forbid: [golang, python, typescript]

  # THE OVER-SELECTION CANARY. Nothing in the corpus applies. A premise set that
  # has been widened too far reveals itself here first, by offering anything at
  # all.
  - id: S13
    intent: "The user asked which time zone the server logs are stamped in. I'll read one log line and answer them."
    expect: []
    canary: true
