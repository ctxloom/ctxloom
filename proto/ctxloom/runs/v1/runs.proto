syntax = "proto3";

// A run is one runner incarnation of a session (plan 3.3, D5 Q4): the
// owner's, a child's, or an internal one-shot's. Its root is
// UUIDv5(session, incarnation). ONE run per incarnation, NOT per turn
// (owner, settled): two turns of one runner are one RunEnqueued and one
// RunEnded. It owns the turn gate, stop, and the exactly-once end (it mints
// and holds no credential: owner ruling s4-Q3). S5 carries the in-process subset: enqueue, the runner's
// start and attach, the turn gate, stop, and the two terminal facts. Pause,
// resume, summaries and artifacts arrive with S6 and S10.
package ctxloom.runs.v1;

import "io/angzarr/v1/options.proto";

// The run, folded from its events. The Rust state is the domain crate's; this
// message anchors the component.
message RunState {
  option (io.angzarr.v1.component) = {
    component_name: "run"
    aggregate: {domain: "runs"}
  };

  string session = 1;
  uint32 incarnation = 2;
}

enum RunMode {
  RUN_MODE_UNSPECIFIED = 0;
  RUN_MODE_INTERACTIVE = 1;
  RUN_MODE_STRUCTURED = 2;
  RUN_MODE_ONE_SHOT = 3;
}

// Why a run ended: Go's `Cause*` (internal/core/coord/facts.go).
enum EndCause {
  END_CAUSE_UNSPECIFIED = 0;
  END_CAUSE_STOPPED = 1;
  END_CAUSE_RUNNER_EXIT = 2;
  END_CAUSE_RUNNER_LOSS = 3;
  END_CAUSE_LAUNCH_FAILED = 4;
  END_CAUSE_IDLE_REAPED = 5;
  END_CAUSE_DRAINED = 6;
  END_CAUSE_DRAIN_INTERRUPTED = 7;
  // Value 8 was FINAL_REPORTED. Owner ruling 2026-11-04 (S5 review item 16): a
  // final report is a model's CLAIM, advisory, and never ends a run; the end is
  // the runner's observation (RecordRunExited and the like).
  reserved 8;
  // A run owed a runner whose launcher died before it started one (its run
  // lock free, ruling 100): no launch failed, nothing was launched.
  END_CAUSE_LAUNCH_ORPHANED = 9;
  reserved "END_CAUSE_FINAL_REPORTED";
}

// How soon a turn's messages are to be acted on: the session's message
// urgency (`ctxloom.sessions.v1.Urgency`, D12) as the run's turn gate judges
// it (S-b). Its own enum, so the runs protos import no sessions proto.
enum TurnUrgency {
  TURN_URGENCY_UNSPECIFIED = 0;
  TURN_URGENCY_INFORM = 1;
  TURN_URGENCY_WAKE = 2;
  TURN_URGENCY_STEER = 3;
}

enum TurnFailureClass {
  TURN_FAILURE_CLASS_UNSPECIFIED = 0;
  TURN_FAILURE_CLASS_RATE_LIMITED = 1;
  TURN_FAILURE_CLASS_CREDENTIAL_REFUSED = 2;
  TURN_FAILURE_CLASS_ENGINE_ERROR = 3;
  TURN_FAILURE_CLASS_INTERRUPTED = 4;
  // Its host was lost while the turn was in flight (a killed daemon), as
  // the next start's sweep ends it (S18).
  TURN_FAILURE_CLASS_RUNNER_LOST = 5;
}

// region commands

// Enqueue the run for `session`'s `incarnation`. A run carries no
// credential: the runner's and the model's tokens went with the separation
// model (slice 2: one principal, the user; fields 4 and 5 are reserved), and
// the hook bearer's with the per-run listener (slice 4 U7, owner ruling
// s4-Q3: a hook delivers to the user's daemon with the user bearer; field 6
// is reserved; M10b mints per-container bearers with a record of their own).
// The policy session to run sends it on `IncarnationOwed`.
message EnqueueRun {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.RunEnqueued"]
    refuses: "ctxloom.runs.v1.AlreadyEnqueued"
    refuses: "ctxloom.runs.v1.NotItsStream"
    refuses: "ctxloom.runs.v1.NoCredential"
    refuses: "ctxloom.runs.v1.FileOnlyCredential"
    refuses: "ctxloom.runs.v1.NoPrompt"
    refuses: "ctxloom.runs.v1.UnknownEngine"
    refuses: "ctxloom.runs.v1.UntrustedProjectSettings"
    refuses: "ctxloom.runs.v1.LaunchRefusals"
  };

  string session = 1;
  uint32 incarnation = 2;
  RunMode mode = 3;
  // The runner's and the model's credential hashes (the separation model:
  // theatre, deleted).
  reserved 4, 5;
  reserved "runner_credential_hash", "model_credential_hash";
  // SHA-256 of the hook bearer's token, which the CLI run's own listener
  // checked (deleted with that listener, s4-Q3).
  reserved 6;
  reserved "hook_credential_hash";

  // The EVIDENCE of the pre-launch checks (owner rulings 73e, 73f): what the
  // run application asked its ports (the plan, the engine registry, the
  // credential policy, the environment), for `decide` to judge. It is the
  // command's alone: `RunEnqueued` carries none of it, and nothing of it is a
  // credential's value (names and yes-or-no only).

  // Whether the plan gave a prompt that is not blank. Judged for a one-shot
  // alone: a session's prompt is optional.
  bool prompt_given = 7;
  // The engine the run is on, and every engine this build drives.
  string engine = 8;
  repeated string drivable_engines = 9;
  // What a child's run authenticates with; left at its default (nothing to
  // judge) for an interactive run, and for an engine that cannot be driven
  // (its policy is its launcher's, 73d).
  CredentialEvidence credential = 10;
  // How many fatal startup findings the plan refused the run for (ruling 73h:
  // a count). The findings themselves are `fatal`, below, for a caller that
  // has nobody to say them (a child's launch: owner 2026-11-21); a one-shot's
  // are the library's, said beside the refusal, 73c.
  uint32 fatal_findings = 11;
  // The run's own lock file, which the process that enqueues it holds from
  // before the enqueue until its runner is started (owner rulings 86, 92): a
  // later process finding the run still owed a runner and this lock free
  // knows its launcher is gone. Its absolute path; unlike the evidence above
  // it is journaled, in `RunEnqueued`. Empty: none was taken.
  string launcher_lock = 12;
  // Was the posture the run's agent claimed (`PostureEvidence`, owner rulings
  // 59, 109), deleted with the engine-neutral posture by owner ruling 134.
  reserved 13;
  reserved "posture";
  // The project-only settings (ruling 46's keys, D3) this run's project layer
  // says and the user has not trusted (trust-index, read by the daemon for a
  // one-shot, a terminal session and a child alike), of those THIS launch
  // reads (owner Q8: its engine's block and its agent's): their dotted
  // paths, sorted. Empty when there are none, or the project is trusted.
  // Evidence, like the fields above: `RunEnqueued` carries none of it.
  repeated string untrusted_settings = 14;
  // What the run was GIVEN (owner ruling 2026-11-17, step 9: the grant record
  // is journaled): unlike the evidence above it is journaled, in
  // `RunEnqueued`, so `session show` says what a child was launched with
  // after its agent is edited. Names and the permissions document only.
  optional Grant grant = 15;
  // The fatal findings themselves (owner ruling 2026-11-21, additive),
  // evidence like `fatal_findings`: carried into the refusal's `findings`,
  // never into `RunEnqueued`. May be empty where only the count is known.
  repeated FatalFinding fatal = 16;
  // What the plan DECIDED (owner ruling 2026-11-25, P3): the launch spec,
  // recorded on `RunEnqueued` as it is here, so the launcher acts on the
  // record alone (`run_launcher::Orders` is deleted) and a projection can say
  // what a run launched with. Numbered as in `RunEnqueued`. Unlike the
  // evidence above it is journaled.
  optional LaunchSpec spec = 17;
}

// region the launch spec (P3, owner rulings 2026-11-25)

// The OUTPUTS of the plan that decided a run, recorded once, on the event the
// decide emits (`RunEnqueued.spec`). "The events are what was actually
// decided by the aggregate": a launcher, a projection or a process on another
// machine reads what the run launched with from the stream, never from live
// config, files, git or another component's memory.
//
// NO DUPLICATION: what an earlier event already recorded is NOT restated
// here: the engine and the workspace axis (`SessionMinted`), the agent and
// the library positions covered (`LoadoutRecorded`), the harp, the native
// session id, the project root and output directory, the trust verdict.
// A resume or a re-host is a NEW enqueue, planned then, so its spec says what
// IT launched with (T21 holds: nothing is re-planned between an enqueue and
// its start).
message LaunchSpec {
  // The settings the plan resolved, each as the launch passes it on; empty:
  // none was said (the engine's own).
  string model = 1;
  string effort = 2;
  // `session` or `host`.
  string session_home = 3;
  // The engine block's `approval_timeout` as seconds, 0 meaning `now`: an
  // ask of this run's child takes it from here, not from the loop's memory.
  optional uint32 approval_timeout_seconds = 4;
  // The program the engine is run as (`engines.<e>.command`, else its name).
  string engine_command = 5;
  // The credential source the plan found, by NAMES alone: the variables any
  // one of which authenticates, and the file's path when the source names
  // one. Never a value.
  repeated string auth_variables = 6;
  string auth_file = 7;
  // The environment the engine is given, by NAME; each value is sealed to
  // the launcher's key (a credential may be among them).
  repeated EnvEntry env = 8;
  // The assembled context, INLINE (owner: not a content store, not a
  // re-assembly), as the plan composed it.
  string context = 9;
  // The one-shot's or the terminal's opening prompt. A hosted child's is its
  // `ChildLaunched` / `MessageSent`.
  string prompt = 10;
  LaunchSurfaces surfaces = 11;
  // The user's git identity as git resolved it in the project, the session
  // home's `.gitconfig`.
  GitIdentity git_user = 12;
  // What the run isolates by, as the plan settled it (`host`, a container).
  string runtime = 13;
  // The client's program (file name and directory), which leads the engine's
  // `PATH` and is the hooks' command: `HandedPrograms` and the hand-off's
  // program go.
  ClientProgram client_program = 14;
  // The user-settings positions the launch copied from: a launch reads the
  // user's claude/opencode settings from the user-settings stream, and says
  // which sequence it read.
  optional uint64 user_settings_sequence = 15;
  // The session's checkouts directory (`isolation_ports::session_worktrees`)
  // the plan placed the workspace axis in; empty where there is none.
  string workspace_dir = 16;
  // The names of the caller's variables the engine block passes on besides
  // the curated ones (`engines.<e>.env`); names alone.
  repeated string engine_env = 17;
  // What the run is FOR, when it is for more than its prompt: a distill's
  // item, so the run's answer is written as its distilled form by a policy
  // on the recorded answer (owner ruling 2026-11-27, option (a)).
  optional DistillPurpose distill = 18;
  // How the credential is found: `builtin` (the engine's own variables),
  // `none`, `login` (the human's login shared) or `source` (the variables and
  // file above).
  string auth = 19;
  // The names the run itself set in the environment for the engine, which no
  // permit replaces (ruling 78b): `HOME`, and `PATH` once it leads with the
  // client's program.
  repeated string owned = 20;
  // The user's own home as the composition root resolved it once (the
  // platform's home variable); empty when unset.
  string user_home = 21;
}

// A distill run's purpose: the item whose body the model was asked to
// compress, the digest of the source it was sent and the etag of the form's
// file at the ask (a form edited meanwhile is refused stale).
message DistillPurpose {
  // The item's reference as the write names it.
  string reference = 1;
  // `fragment` or `command`.
  string kind = 2;
  string digest = 3;
  string etag = 4;
  // The project's root the write is planned in (the directory its ask was
  // made from), so a daemon that restarts can still make it.
  string cwd = 5;
}

message EnvEntry {
  string name = 1;
  SealedValue value = 2;
}

// A secret as it rides a message (owner 2026-11-25: sealed, never refused or
// dropped). `sealed` is the encoding of angzarr-sealed's
// `io.angzarr.sealed.v1.Sealed` (key_id, algorithm, encapsulated key,
// ciphertext). The field is opaque bytes here, so no ctxloom wire crate
// imports angzarr's proto: only the daemon's sealing adapter decodes it.
message SealedValue {
  bytes sealed = 1;
}

message GitIdentity {
  string name = 1;
  string email = 2;
}

message ClientProgram {
  // The running binary's file name (`ctxloom`) and its directory.
  string name = 1;
  string directory = 2;
}

// Everything a launch lays at rest in the session's home or carries on its
// command line, as `surface_ports::Inputs` holds it (the run agent's
// selection, the registered companions' loadouts included).
message LaunchSurfaces {
  // The bundles' authored hooks and ctxloom's own callbacks, as the JSON
  // document the engine's surface reads (event to hooks).
  string hooks_json = 1;
  string statusline = 2;
  repeated string deny_tools = 3;
  repeated SurfaceCommand commands = 4;
  repeated SurfaceSkill skills = 5;
  repeated McpSpec mcp_servers = 6;
  // A launch with no context (`run --no-context`): the engine is handed no
  // MCP server at all, ctxloom's own included.
  bool no_context = 7;
}

// A slash command: `<bundle>/<name>`, its description and its template.
message SurfaceCommand {
  string name = 1;
  string description = 2;
  string body = 3;
}

// An Agent Skill package: its name, description and every file, each path
// below the skill's directory.
message SurfaceSkill {
  string name = 1;
  string description = 2;
  repeated SurfaceFile files = 3;
}

message SurfaceFile {
  string path = 1;
  bytes content = 2;
  bool executable = 3;
}

// One MCP server as the launch writes it. The environment and the headers
// may hold a secret: their values are sealed.
message McpSpec {
  string name = 1;
  string command = 2;
  repeated string args = 3;
  string url = 4;
  repeated EnvEntry env = 5;
  repeated EnvEntry headers = 6;
}

// endregion

// One fatal finding of a launch's plan, as the library said it: its text and
// what to do about it (empty: nothing said). DRAFT wording is the library's.
message FatalFinding {
  string text = 1;
  string remedy = 2;
}

// What a run was launched with (owner ruling 2026-11-17): the MCP servers'
// NAMES and the agent's permissions document as the launch passed it to its
// engine. Never a server's command, arguments or environment (a trust rule:
// they may hold a secret).
message Grant {
  // The MCP servers the launch carries, ctxloom's own among them, by name,
  // sorted.
  repeated string mcp_servers = 1;
  // The engine's permissions document, JSON text as the plan wrote it; empty
  // for none.
  string permissions = 2;
}

// A child's credential, as the run application found it (ruling 53 and owner
// ruling 2026-11-08, item 8): never a value.
message CredentialEvidence {
  // The engine's source names a credentials file and no variable.
  bool file_only = 1;
  // The variables the engine's built-in source accepts: what a file-only
  // source is told to name and export.
  repeated string builtin_variables = 2;
  // The variables the child would be given a credential by, any one of which
  // serves; none when the engine asks a child for none.
  repeated string accepted_variables = 3;
  // Whether one of `accepted_variables` is set, and not empty, in the
  // caller's environment.
  bool accepted_set = 4;
}

// Queue the next turn, for the session's messages `message_ids` (the turn's
// key, S-b): the delivery policy sends it, keyed `send:<message_id>`. Refused
// after the run's end (the end fence: there is no courier, D5 Q4). While a
// turn is in flight a STEER is queued and asks the turn in flight to be
// interrupted, once; a wake or an inform is refused `TurnInFlight` (they wait
// in the pending messages until the turn ends).
message QueueTurn {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.InterruptRequested", "ctxloom.runs.v1.TurnQueued"]
    refuses: "ctxloom.runs.v1.NoRun"
    refuses: "ctxloom.runs.v1.RunIsEnded"
    refuses: "ctxloom.runs.v1.TurnInFlight"
  };

  string prompt_ref = 1;
  bool resume = 2;
  repeated string message_ids = 3;
  TurnUrgency urgency = 4;
}

// Ask the run to stop: a hosted one-shot's signal (U4), and the session's
// stop verb when it is built (owner 2026-11-15: it ends the session's current
// run, and nothing more; no latch on the session).
message RequestStop {
  option (io.angzarr.v1.command) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.StopRequested"]
    refuses: "ctxloom.runs.v1.NoRun"
  };

  string reason = 1;
}

// endregion commands

// region facts (what already happened: recorded, never refused)

message RecordRunnerAttached {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.RunnerAttachedRecorded"]
  };

  string runner_id = 1;
  string protocol = 2;
}

// The launcher made the runner's process: where (`runtime`: the engine or
// container runtime it ran under; `workspace`: its working directory) and
// which (`pid`, 0 when the launcher could not learn it). The sign that a
// launch was made, so a run owed a runner stops being owed on it and not on
// the runner's first word. Keyed `started:<run>`.
message RecordRunnerStarted {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.RunnerStartedRecorded"]
  };

  string runtime = 1;
  string workspace = 2;
  uint32 pid = 3;
}

// `turn` is the sequence of the TurnQueued event it answers (plan 4.3).
// `message_ids` are the turn's messages (S-b): the turn is keyed by them,
// `turn:<run>:<first message id>:<phase>`; a turn queued by no message (the
// one-shot's) is keyed by its number, `turn:<run>:<turn>:<phase>`.
message RecordTurnStarted {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.TurnStartedRecorded"]
  };

  uint64 turn = 1;
  repeated string message_ids = 2;
}

message RecordTurnCompleted {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.TurnCompletedRecorded"]
  };

  // The turn's number; 0 with `message_ids` names it by them: the run
  // aggregate resolves the number from the turn its messages queued (a
  // runner keeps no message-to-turn map).
  uint64 turn = 1;
  string native_key = 2;
  string answer_ref = 3;
  int32 exit_code = 4;
  repeated string message_ids = 5;
  // The turn's ANSWER, the reply text (P3, additive): the run's stream is
  // where a caller reads it (`WatchRun`, `GetRun`) and where the distill
  // reaction, now a policy on this fact, finds it. `answer_ref` stays for
  // an answer kept elsewhere.
  string answer = 6;
}

message RecordTurnFailed {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.TurnFailedRecorded"]
  };

  uint64 turn = 1;
  TurnFailureClass class = 2;
  string detail = 3;
  repeated string message_ids = 4;
}

// The runner (or the launcher, on process exit) ended. The FIRST terminal
// input ends the run; a second records nothing.
message RecordRunExited {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.RunEnded"]
  };

  int32 code = 1;
  int32 signal = 2;
}

message RecordLaunchFailed {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.RunEnded"]
  };

  bool deterministic = 1;
  string detail = 2;
}

// A STARTED run whose owner is gone (its session's lock free, rulings 93,
// 95): a sweeping process records it, never the runner, and it ends the run
// for runner loss. Keyed `runner-lost:<run>`, so a second sweeper's is a
// DUPLICATE; on a run already ended it records nothing.
message RecordRunnerLost {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.RunEnded"]
  };
}

// A run still owed a runner whose launcher died before starting one (its run
// lock free, rulings 92, 100): no launch failed, so it is not a
// `RecordLaunchFailed`. A sweeping process records it; keyed
// `launch-orphaned:<run>`, so a second sweeper's is a DUPLICATE.
message RecordLaunchOrphaned {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.RunEnded"]
  };
}

// The model's CLAIMS (owner ruling 2026-11-04, item 16): what the model said or
// produced, recorded as facts. Advisory (a provenance, not a permission: one
// principal, the user, since slice 2): a claim changes no transition. `turn` and `ordinal` are stamped by
// the runner side, never chosen by the model, and the external id derives from
// them (`report:<run>:<turn>:<ordinal>`, `final:<run>:<turn>`). References
// (run, turn, text_ref), not embedded authority.
message RecordSummaryReported {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.SummaryReportedRecorded"]
  };

  uint64 turn = 1;
  uint32 ordinal = 2;
  string scope = 3;
  string text_ref = 4;
}

// The model says its work is done. A CLAIM: it notifies the parent and
// transitions nothing; acceptance is a separate refusable command by a decider
// role. It does not end the run or revoke a credential.
message RecordFinalReported {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.FinalReportedRecorded"]
  };

  uint64 turn = 1;
  string text_ref = 2;
}

// endregion facts

// region events

message RunEnqueued {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  string session = 1;
  uint32 incarnation = 2;
  RunMode mode = 3;
  // The runner's and the model's credential hashes (deleted, slice 2).
  reserved 4, 5;
  reserved "runner_credential_hash", "model_credential_hash";
  // SHA-256 of the hook bearer's token (deleted with the per-run listener,
  // s4-Q3): a run enqueued before then still holds it, and it is read by
  // nothing.
  reserved 6;
  reserved "hook_credential_hash";
  // The run's lock file, which its launcher holds until the runner is started
  // (rulings 86, 92); empty on a run enqueued before it existed: never judged
  // an orphan. Numbered as in `EnqueueRun`, whose first six fields this
  // event's are.
  string launcher_lock = 12;
  // What the run was given, as its `EnqueueRun` said (step 9); unset on a
  // run enqueued before the record existed. Numbered as in `EnqueueRun`.
  optional Grant grant = 15;
  // The plan's outputs (P3; `EnqueueRun.spec`, numbered alike). The grant is
  // recorded for a terminal session too, and the spec for every run.
  optional LaunchSpec spec = 17;
}

message RunnerAttachedRecorded {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  string runner_id = 1;
  string protocol = 2;
}

// A terminal session's launch, prepared by the daemon for its frontend (owner
// 2026-11-28: the launch is a record, not a hand-off in memory): the engine
// process the frontend starts on the user's terminal. `launch` is the
// encoding of `ctxloom.v1.Launch` with every environment value emptied; the
// values are in `env`, each SEALED to the project's key (never in the
// clear). Keyed `prepared:<run>`; recorded while the run is live, once.
message RecordLaunchPrepared {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.LaunchPrepared"]
  };

  PreparedLaunch launch = 1;
}

message LaunchPrepared {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  PreparedLaunch launch = 1;
}

message PreparedLaunch {
  bytes launch = 1;
  repeated EnvEntry env = 2;
}

// What a distill run's answer came to (owner 2026-11-28): the policy on the
// recorded answer wrote the item's distilled form, or was refused (the form
// edited meanwhile, the source moved, an answer implausibly short). `end` is
// the encoding of the `ctxloom.v1.RunEnd` the run's watchers are told (empty:
// it was written, the run ended as its engine did) and `notices` those of
// `ctxloom.v1.Notice` the write said. Keyed `distill:<run>`, once.
message RecordDistillWritten {
  option (io.angzarr.v1.fact) = {
    component: "ctxloom.runs.v1.RunState"
    emits: ["ctxloom.runs.v1.DistillWritten"]
  };

  bytes end = 1;
  repeated bytes notices = 2;
}

message DistillWritten {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  bytes end = 1;
  repeated bytes notices = 2;
}

message RunnerStartedRecorded {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  string runtime = 1;
  string workspace = 2;
  uint32 pid = 3;
}

message TurnQueued {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  string prompt_ref = 1;
  bool resume = 2;
  // The session's messages this turn carries, and their urgency (S-b): the
  // pending messages they were consume here.
  repeated string message_ids = 3;
  TurnUrgency urgency = 4;
}

// A steer asked the turn in flight to be interrupted (S-b): the driver sends
// the engine's interrupt; the interrupted turn ends as it ends (a
// RecordTurnFailed, class INTERRUPTED, or RecordTurnCompleted if it beat the interrupt).
message InterruptRequested {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  // The sequence of the TurnQueued of the turn to interrupt, and its messages.
  uint64 turn = 1;
  repeated string message_ids = 2;
}

message TurnStartedRecorded {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  uint64 turn = 1;
  repeated string message_ids = 2;
}

// A turn completed; the run is idle again.
message TurnCompletedRecorded {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  // The turn's number; 0 with `message_ids` names it by them: the run
  // aggregate resolves the number from the turn its messages queued (a
  // runner keeps no message-to-turn map).
  uint64 turn = 1;
  string native_key = 2;
  string answer_ref = 3;
  int32 exit_code = 4;
  repeated string message_ids = 5;
  // The turn's ANSWER, the reply text (P3, additive): the run's stream is
  // where a caller reads it (`WatchRun`, `GetRun`) and where the distill
  // reaction, now a policy on this fact, finds it. `answer_ref` stays for
  // an answer kept elsewhere.
  string answer = 6;
}

message TurnFailedRecorded {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  uint64 turn = 1;
  TurnFailureClass class = 2;
  string detail = 3;
  repeated string message_ids = 4;
}

message StopRequested {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  string reason = 1;
}

message SummaryReportedRecorded {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  uint64 turn = 1;
  uint32 ordinal = 2;
  string scope = 3;
  string text_ref = 4;
}

message FinalReportedRecorded {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  uint64 turn = 1;
  string text_ref = 2;
}

// The exactly-once end, whatever the cause.
message RunEnded {
  option (io.angzarr.v1.event) = {component: "ctxloom.runs.v1.RunState"};

  EndCause cause = 1;
  optional int32 exit_code = 2;
  string detail = 3;
}

// endregion events

// region refusals
//
// A command's refusals, one typed message each, listed in the `refuses` of
// the commands that raise them. The status is the gRPC meaning of what is
// refused, declared here and nowhere else; the code, args and text a person
// reads are the domain's `RunRejection` (`rejection.rs`), mapped from the
// refusal's TYPE, never its status.

// An enqueue on a stream that already holds a run.
message AlreadyEnqueued {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_ALREADY_EXISTS;
}

// A command to a stream holding no run.
message NoRun {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;
}

// A turn queued while one is in flight.
message TurnInFlight {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  uint64 turn = 1;
}

// A command to a run that has ended (the end fence).
message RunIsEnded {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;
}

// An enqueue on a stream whose root is not the run's derived root.
message NotItsStream {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;
}

// A child agent's run asked for with none of the environment credentials its
// engine authenticates with (owner ruling 2026-11-08, item 8: a child gets
// only an env credential, never a shared credentials file). EnqueueRun's
// `decide` refuses it from the command's credential evidence (ruling 73e),
// before any session is made or any engine started.
message NoCredential {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The engine that would have been run.
  string engine = 1;
  // The variables any one of which would have served, comma separated.
  string variables = 2;
}

// A child agent's run whose engine's credential source names a credentials
// FILE and no environment variable (owner ruling 53, 2026-11-09): a file is
// the human's primary interactive session's alone (ruling 8), so no child of
// that engine can authenticate. Refused, like NoCredential, by EnqueueRun's
// `decide` from the credential evidence, before a session is made or an
// engine started.
message FileOnlyCredential {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The engine that would have been run.
  string engine = 1;
  // The variables the engine's built-in source accepts, comma separated: the
  // ones to name in the source's `env` and export.
  string variables = 2;
}

// A launch whose project's own config says settings that reach past the
// project, and that the user has not trusted (ruling 142, S24, D3)
// (`runs-untrusted-project-settings`). Refused by EnqueueRun's `decide` from
// `untrusted_settings`, the LAST of its checks (owner Q9), before any name is
// claimed or session minted.
message UntrustedProjectSettings {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  // The dotted paths, comma separated, sorted.
  string paths = 1;
}

// A one-shot with no prompt from any door: it would ask nothing (ruling 73c).
message NoPrompt {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;
}

// A run on an engine this build cannot drive (ruling 73c).
message UnknownEngine {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;

  // The engine asked for.
  string name = 1;
  // The engines this build drives, comma separated.
  string known = 2;
}

// A launch refused for more than one reason, or for a reason beside the plan's
// fatal findings (owner rulings 73, 73b, 73c): every check that failed, in the
// order they are checked (the order of these fields). Each field holds at
// most one, and at most one of the two credential fields is set: they are
// `repeated` because the generated domain layer keeps no presence for a
// singular message field, and an empty refusal (NoPrompt) must still be seen.
// `fatal_findings` says how many fatal findings the plan had; `findings` (owner
// ruling 2026-11-21) holds them where the refusing side had them to give (a
// child's launch), empty where the library says them beside the refusal.
message LaunchRefusals {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;

  repeated NoPrompt no_prompt = 1;
  repeated UnknownEngine unknown_engine = 2;
  repeated NoCredential no_credential = 3;
  repeated FileOnlyCredential file_only_credential = 4;
  uint32 fatal_findings = 5;
  // Was the posture's refusals (`UnenforcedPosture`, owner rulings 59, 109),
  // deleted with the engine-neutral posture by owner ruling 134.
  reserved 6;
  reserved "unenforced_posture";
  repeated UntrustedProjectSettings untrusted_project_settings = 7;
  repeated FatalFinding findings = 8;
}

// endregion refusals
