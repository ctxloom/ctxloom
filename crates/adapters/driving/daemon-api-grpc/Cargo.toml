[package]
name = "daemon-api-grpc"
version = "0.1.0"
description = "The daemon's Ctxloom service over gRPC (slice 2 step 5): every request, served RPC or not, admitted by the user bearer first (UserGate, gate first), its use case run on the blocking pool (M10), a refusal answered under its status with the typed refusal in google.rpc.Status.details (S11); every other RPC UNIMPLEMENTED to the user bearer alone"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-coordinator.workspace = true
angzarr-coordinator-grpc = { workspace = true, default-features = false }
daemon-api.workspace = true
daemon-proto = { workspace = true, features = ["server"] }
prost.workspace = true
prost-types.workspace = true
runs-application.workspace = true
tokio = { workspace = true, features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }

[dev-dependencies]
# The crate's own tests hold the served destroy (M5), which only
# `session-destroy` compiles: it depends on itself with it, for its tests
# alone; a plain build builds no dev-dependency (plain-destroy-check.sh
# probes the plain daemon's API).
daemon-api-grpc = { path = ".", features = ["session-destroy"] }
daemon-proto = { workspace = true, features = ["server", "client"] }
mutants.workspace = true
run-ports.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "router", "server"] }

[features]
# `DeleteSession` and `SweepSessions` served (M5): the destroy, as the
# `session remove` and `session sweep` verbs are. Off in a plain build, where
# both answer UNIMPLEMENTED (behind the bearer gate).
session-destroy = []

[lints]
workspace = true
