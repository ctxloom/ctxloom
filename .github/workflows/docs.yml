name: Deploy Documentation

# Every step is a `just` target — see the header of ci.yml and build/ci.justfile.

on:
  push:
    branches:
      # The ACTIVE release line, pinned deliberately rather than wildcarded.
      #
      # This was `main`, which is dead: 0 ahead of and 4615 behind release/0.7
      # since 2026-06-20, so the site never published for the branch actually
      # being released. Work lands directly on the release line, so that is
      # what has to trigger here.
      #
      # NOT `release/*`, unlike ci.yml. origin carries every historical release
      # line (v0.3.11, v0.5.0..v0.5.4, ...); running CI on one of those is
      # harmless, but PUBLISHING THE SITE from one is not — a single push to a
      # two-year-old branch would overwrite the live docs with its content.
      #
      # Cutting a new release line means changing this entry. That is a
      # deliberate one-line edit, and publishing should be an explicit choice.
      - release/0.7
    paths:
      - 'website/**'
      - 'README.md'
      - 'VERSION'
      # The living-docs pipeline renders website/src/content/docs/journeys/
      # (gitignored, not checked in — see .gitignore) from these sources at
      # build time, so a change to any of them must redeploy the docs even
      # though 'website/**' above doesn't see it.
      - 'tests/acceptance/**'
      - 'scripts/gendocs/livingdocs/**'
      - '.github/workflows/docs.yml'
      # The site build and the version injection are recipes now, so a change
      # to them changes what gets deployed.
      - 'build/ci.justfile'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The living-docs step below needs a real `ctxloom` binary (the godog
    # suite execs it as a subprocess), which needs generated protobuf code
    # (buf/protoc-gen-go, gitignored — see internal/agentcoord) that only the
    # devcontainer image carries. Reuses the SAME image ci.yml's build-container
    # job publishes. That job tags ":latest" with
    # enable={{is_default_branch}}, and the default branch IS release/0.7 — the
    # branch this workflow triggers on — so ":latest" is refreshed by the same
    # pushes that run this. (It said "every push to main", which has been wrong
    # since the default branch moved; main is 4615 commits behind and would
    # have meant a permanently stale toolchain here.)
    #
    # A fresh checkout of THIS commit's source is what actually gets built, so
    # a same-day image lag is harmless — the image only supplies the toolchain,
    # never the source. Giving this workflow its own build-container dependency
    # remains open as manly-crib.
    container:
      image: ghcr.io/${{ github.repository }}-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      JUST_JUSTFILE: justfile.container
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe
        run: just ci-git-safe-directory

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Inject version into docs
        run: just docs-inject-version

      # The godog suite execs the real ctxloom binary as a subprocess, resolved
      # from PATH (see ci.yml's acceptance job, same requirement).
      - name: Add binaries to PATH
        run: just ci-path

      # Living docs: build ctxloom, run the acceptance suite with per-scenario
      # evidence capture on, then render website/src/content/docs/journeys/
      # from that run's REAL captured output — BEFORE the site build below, so
      # the pages exist for npm to pick up. Refuses (nonzero exit, writes
      # nothing) if any @doc scenario's capture has a non-passed step: a
      # feature that does not work cannot be documented.
      - name: Generate living-docs journey pages
        run: just gen-living-docs

      - name: Install dependencies
        run: just docs-deps

      - name: Build website
        run: just docs-build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
